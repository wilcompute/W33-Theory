name: Passes 2917-2923 Seven-Front Breakthrough

on:
  push:
    branches: [agent/pass2917-2923-seven-front-breakthrough]
    paths:
      - analysis/bt2917_2923_seven_front_breakthrough.py
      - analysis/bt2917_rank7_frame_engine_truth.py
      - analysis/bt2918_m36_first_order_census.py
      - analysis/bt2919_middle_class_antiunitary_chirality.py
      - analysis/bt2920_adaptive_observer_information_budget.py
      - analysis/bt2920_noise_aware_adaptive_observer.py
      - analysis/bt2922_classical_line_stabilizer_suborbits.py
      - analysis/bt2923_diameter19_element_classification.py
      - analysis/bt2917_rank7_synthesis_report.py
      - analysis/BT2917_BT2923_seven_front_breakthrough_insert.tex
      - rtl/w33_pass2917_rank7_frame_engine.sv
      - rtl/tb_w33_pass2917_rank7_frame_engine.sv
      - tests/test_bt2917_2923_seven_front_breakthrough.py
      - tools/integrate_bt2917_bt2923_blueprint.py
      - data/PART_BT2917_BT2923_SEVEN_FRONT_BREAKTHROUGH_summary.json
      - .github/workflows/w33_pass2917_2923_seven_front_breakthrough.yml
  pull_request:
    branches: [master]
    paths:
      - analysis/bt2917_2923_seven_front_breakthrough.py
      - analysis/bt2917_rank7_frame_engine_truth.py
      - analysis/bt2918_m36_first_order_census.py
      - analysis/bt2919_middle_class_antiunitary_chirality.py
      - analysis/bt2920_adaptive_observer_information_budget.py
      - analysis/bt2920_noise_aware_adaptive_observer.py
      - analysis/bt2922_classical_line_stabilizer_suborbits.py
      - analysis/bt2923_diameter19_element_classification.py
      - analysis/bt2917_rank7_synthesis_report.py
      - analysis/BT2917_BT2923_seven_front_breakthrough_insert.tex
      - rtl/w33_pass2917_rank7_frame_engine.sv
      - rtl/tb_w33_pass2917_rank7_frame_engine.sv
      - tests/test_bt2917_2923_seven_front_breakthrough.py
      - tools/integrate_bt2917_bt2923_blueprint.py
      - data/PART_BT2917_BT2923_SEVEN_FRONT_BREAKTHROUGH_summary.json
      - .github/workflows/w33_pass2917_2923_seven_front_breakthrough.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pass2917-2923-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-hardware-blueprint-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_DATE_EPOCH: "1785715200"
    steps:
      - name: Check out writable head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconcile the newest canonical master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact analysis dependencies
        run: python -m pip install --upgrade pip pytest numpy sympy networkx

      - name: Execute all seven finite fronts
        run: python analysis/bt2917_2923_seven_front_breakthrough.py

      - name: Integrate corrections and new evidence into live blueprint
        run: |
          python tools/integrate_bt2917_bt2923_blueprint.py
          python tools/integrate_bt2917_bt2923_blueprint.py
          git diff --check

      - name: Run focused regression suite
        run: pytest -q tests/test_bt2917_2923_seven_front_breakthrough.py

      - name: Install RTL and place-and-route tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys nextpnr-ice40

      - name: Exhaust all 324 RTL transitions
        run: |
          mkdir -p analysis/evidence/pass2917_2923
          iverilog -g2012 -s tb_w33_pass2917_rank7_frame_engine \
            -o /tmp/rank7_tb \
            rtl/w33_pass2917_rank7_frame_engine.sv \
            rtl/tb_w33_pass2917_rank7_frame_engine.sv
          vvp /tmp/rank7_tb | tee analysis/evidence/pass2917_2923/rank7_tb.log
          grep -F 'PASS 324/324 transitions' analysis/evidence/pass2917_2923/rank7_tb.log

      - name: Synthesize rank and arithmetic engines
        shell: bash
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/w33_pass2917_rank7_frame_engine.sv; synth_ice40 -top w33_pass2917_rank7_frame_engine -json /tmp/rank7.json; stat' 2>&1 | tee analysis/evidence/pass2917_2923/rank7_yosys.log
          yosys -p 'read_verilog -sv rtl/w33_pass2796_minimal_frame_engine.sv; synth_ice40 -top w33_minimal_frame_engine -json /tmp/base.json; stat' 2>&1 | tee analysis/evidence/pass2917_2923/base_yosys.log
          nextpnr-ice40 --up5k --package sg48 --pcf-allow-unconstrained --freq 40 --json /tmp/rank7.json --asc /tmp/rank7.asc 2>&1 | tee analysis/evidence/pass2917_2923/rank7_pnr.log
          nextpnr-ice40 --up5k --package sg48 --pcf-allow-unconstrained --freq 40 --json /tmp/base.json --asc /tmp/base.asc 2>&1 | tee analysis/evidence/pass2917_2923/base_pnr.log
          python analysis/bt2917_rank7_synthesis_report.py \
            --rank-yosys analysis/evidence/pass2917_2923/rank7_yosys.log --base-yosys analysis/evidence/pass2917_2923/base_yosys.log \
            --rank-pnr analysis/evidence/pass2917_2923/rank7_pnr.log --base-pnr analysis/evidence/pass2917_2923/base_pnr.log \
            --output data/PART_BT2917_RANK7_SYNTHESIS_COMPARISON_results.json

      - name: Install Tectonic
        uses: WtfJoke/setup-tectonic@v4
        with:
          tectonic-version: 0.16.9

      - name: Compile blueprint twice and require byte identity
        shell: bash
        run: |
          rm -f holonet_machine_blueprint.pdf holonet_machine_blueprint.log
          tectonic --keep-logs holonet_machine_blueprint.tex
          cp holonet_machine_blueprint.pdf /tmp/blueprint.first.pdf
          tectonic --keep-logs holonet_machine_blueprint.tex
          cmp /tmp/blueprint.first.pdf holonet_machine_blueprint.pdf
          test -s holonet_machine_blueprint.pdf
          if grep -E 'Overfull|Undefined control sequence|LaTeX Error|Emergency stop|Fatal error' holonet_machine_blueprint.log; then
            echo 'release-blocking TeX or layout error'
            exit 1
          fi

      - name: Verify migration and certificates are drift-free
        run: |
          python tools/integrate_bt2917_bt2923_blueprint.py
          python analysis/bt2917_2923_seven_front_breakthrough.py --front 2917 --front 2919 --front 2920a --front 2920b
          pytest -q tests/test_bt2917_2923_seven_front_breakthrough.py
          git diff --check

      - name: Freeze generated evidence on the PR head
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add holonet_machine_blueprint.tex
          git add -f holonet_machine_blueprint.pdf
          git add data/PART_BT2917_*.json data/PART_BT2918_*.json data/PART_BT2919_*.json
          git add data/PART_BT2920_*.json data/PART_BT2922_*.json data/PART_BT2923_*.json
          if git diff --cached --quiet; then
            echo 'all generated artifacts already frozen'
          else
            git commit -m 'Passes 2917-2923: freeze exact evidence and Holonet blueprint PDF'
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - uses: actions/upload-artifact@v4
        with:
          name: pass2917-2923-seven-front-breakthrough
          path: |
            holonet_machine_blueprint.pdf
            holonet_machine_blueprint.log
            data/PART_BT2917_*.json
            data/PART_BT2918_*.json
            data/PART_BT2919_*.json
            data/PART_BT2920_*.json
            data/PART_BT2922_*.json
            data/PART_BT2923_*.json
            analysis/evidence/pass2917_2923/
