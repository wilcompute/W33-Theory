name: Frontier Five Exact

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260829_circuit_dark_intertwiner.py'
      - 'analysis/w33_20260829_pg34_subgroup_zero_split.py'
      - 'analysis/w33_20260829_photonic_chirality_carrier.py'
      - '.github/workflows/frontier-five-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frontiers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-analysis dependencies
        run: python -m pip install sympy numpy
      - name: Circuit/dark-sector intertwiner
        run: python analysis/w33_20260829_circuit_dark_intertwiner.py
      - name: Symmetry-breaking zero-mode hierarchy
        if: ${{ hashFiles('analysis/w33_20260829_pg34_subgroup_zero_split.py') != '' }}
        run: python analysis/w33_20260829_pg34_subgroup_zero_split.py
      - name: Photonic chirality carrier audit
        if: ${{ hashFiles('analysis/w33_20260829_photonic_chirality_carrier.py') != '' }}
        run: python analysis/w33_20260829_photonic_chirality_carrier.py
