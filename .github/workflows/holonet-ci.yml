name: holonet

# Continuously verify the runnable Holonet VM: the architecture self-tests on every push.
# Runs `holonet verify`, the fast witnesses, and the VM test suite.

on:
  push:
    paths:
      - 'analysis/holonet_*.py'
      - 'analysis/w33_minimal_architecture.py'
      - 'analysis/w33_vm_speedup.py'
      - 'analysis/w33_tritcpu_emulator.py'
      - 'analysis/w33_ternary_energy.py'
      - 'analysis/w33_holonet_asm.py'
      - 'analysis/w33_holonet_retro_export.py'
      - 'analysis/w33_holonet_firmware_fabric_profile.py'
      - 'analysis/w33_packet_energy.py'
      - 'analysis/w33_hashimoto_sector_spectrum.py'
      - 'analysis/w33_hashimoto_packet_phase_bridge.py'
      - 'analysis/w33_frequency_bin_hashimoto_compiler.py'
      - 'analysis/w33_frequency_bin_lab_packet.py'
      - 'analysis/w33_master_audit.py'
      - 'analysis/w33_audit_qscan.py'
      - 'analysis/w33_ovoid_construct.py'
      - 'analysis/holonet_control_arm.py'
      - 'analysis/w33_doily_mermin.py'
      - 'analysis/w33_realization_dimension.py'
      - 'analysis/w33_contextuality_tax.py'
      - 'analysis/w33_spread_star_anatomy.py'
      - 'analysis/holonet_bench.py'
      - 'analysis/w33_contextual_fraction.py'
      - 'analysis/w33_ks_inequality.py'
      - 'tests/test_holonet_vm.py'
      - 'tests/test_pass48_holonet_asm_energy.py'
      - 'tests/test_pass50_master_audit.py'
      - 'tests/test_pass52_qscan_bench.py'
      - 'tests/test_pass53_parity_compare.py'
      - 'tests/test_pass54_ovoid_scale.py'
      - 'tests/test_pass55_control_arm.py'
      - 'tests/test_pass56_mermin_dimension.py'
      - 'tests/test_pass57_contextuality_tax.py'
      - 'tests/test_pass58_spread_anatomy.py'
      - 'tests/test_hashimoto_packet_phase_bridge.py'
      - 'tests/test_frequency_bin_hashimoto_compiler.py'
      - 'tests/test_frequency_bin_lab_packet.py'
      - 'analysis/holonet_cli.py'
      - 'holonet_cmd.py'
      - 'setup.py'
      - '.github/workflows/holonet-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy networkx matplotlib pytest
      - name: Install the holonet command
        run: pip install -e .
      - name: holonet verify (self-test the whole stack)
        run: holonet verify
      - name: holonet audit (re-derive every layer's headline constant from q=3)
        run: holonet audit
      - name: holonet bench (op counts + host-relative throughput)
        run: holonet bench
      - name: holonet bench --compare (table-free routing vs table-routed baseline)
        run: holonet bench --compare
      - name: holonet bench --compare --scale (routing-state win grows with q)
        run: holonet bench --compare --scale --plot
      - name: holonet info
        run: holonet info
      - name: Fast witnesses (architecture + contextuality)
        run: |
          python analysis/w33_minimal_architecture.py
          python analysis/w33_vm_speedup.py
          python analysis/w33_tritcpu_emulator.py
          python analysis/w33_ternary_energy.py
          python analysis/w33_holonet_asm.py
          python analysis/w33_holonet_retro_export.py
          python analysis/w33_packet_energy.py
          python analysis/w33_holonet_firmware_fabric_profile.py
          python analysis/w33_hashimoto_sector_spectrum.py
          python analysis/w33_hashimoto_packet_phase_bridge.py
          python analysis/w33_frequency_bin_hashimoto_compiler.py
          python analysis/w33_frequency_bin_lab_packet.py
          python analysis/w33_audit_qscan.py
          python analysis/w33_ovoid_construct.py
          python analysis/holonet_control_arm.py
          python analysis/w33_doily_mermin.py
          python analysis/w33_realization_dimension.py
          python analysis/w33_contextuality_tax.py
          python analysis/w33_spread_star_anatomy.py
          python analysis/w33_contextual_fraction.py
          python analysis/w33_ks_inequality.py
      - name: VM test suite
        run: python -m pytest tests/test_holonet_vm.py tests/test_pass48_holonet_asm_energy.py tests/test_pass50_master_audit.py tests/test_pass52_qscan_bench.py tests/test_pass53_parity_compare.py tests/test_pass54_ovoid_scale.py tests/test_pass55_control_arm.py tests/test_pass56_mermin_dimension.py tests/test_pass57_contextuality_tax.py tests/test_pass58_spread_anatomy.py tests/test_hashimoto_packet_phase_bridge.py tests/test_frequency_bin_hashimoto_compiler.py tests/test_frequency_bin_lab_packet.py -q
