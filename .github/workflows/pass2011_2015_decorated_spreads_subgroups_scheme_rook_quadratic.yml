name: Passes 2011-2015 decorated spreads subgroups scheme rook quadratic
on:
  push:
    paths:
      - 'analysis/w33_pass201[1-5]**'
      - 'analysis/BT2011_2015**'
      - 'analysis/BT2015**'
      - 'data/w33_pass201[1-5]**'
      - 'data/w33_pass_namespace_registry_v2.d/201[1-5].json'
      - 'tests/test_w33_pass2011_2015_five_frontiers.py'
      - 'PASS2011_2015_DECORATED_SPREADS_SUBGROUPS_SCHEME_ROOK_QUADRATIC_RELEASE.md'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - '.github/workflows/pass2011_2015_decorated_spreads_subgroups_scheme_rook_quadratic.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Verify frozen certificates and literal witness
        run: python analysis/w33_pass2011_2015_verify_frozen.py
      - name: Focused regression
        run: pytest -q tests/test_w33_pass2011_2015_five_frontiers.py
      - name: Check theorem and engineering boundaries
        run: |
          grep -q '33.*H.*conjugacy classes' analysis/w33_pass2011_2015_exact_methods.md
          grep -q 'A\^2 = 9 I + 6 J' analysis/w33_pass2011_2015_exact_methods.md
          grep -q 'no equivariant map' analysis/w33_pass2011_2015_exact_methods.md
          grep -q 'quadratic channels' analysis/w33_pass2015_physics_computer_engineering_architectures.md
          grep -q 'All hardware items are proposals' data/w33_pass2015_degree_safety_quadratic_physics_engineering.json
# Final merged-state trigger: 53/53 canonical checks, literal D8 exact-cover witness, finalized 2011-2015 namespaces, retired collision shards, and both manuscript wrappers include Pass 2015.
