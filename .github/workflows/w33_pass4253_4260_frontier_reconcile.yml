name: Pass 4260 protected frontier reconciliation
on:
  push:
    paths:
      - 'tools/integrate_pass4253_4260_frontier.py'
      - 'analysis/BT4253_BT4260_girth16_faultaware_su4_hysteresis_clock_channel_scrambling_modular_capacity_insert.tex'
      - 'analysis/BT4253_BT4260_girth16_faultaware_su4_hysteresis_clock_channel_scrambling_modular_capacity_index_insert.html'
      - 'docs/girth16-faultaware-holonomy-hysteresis-clock-channel-4253-4260.html'
      - '.github/workflows/w33_pass4253_4260_frontier_reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/integrate_pass4253_4260_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4253_4260_FRONTIER 1 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit reconciled manifests if needed
        run: |
          if ! git diff --quiet -- analysis/W33_CURRENT_FRONTIER_MANIFEST.tex data/w33_current_frontier_manifest_v1.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add analysis/W33_CURRENT_FRONTIER_MANIFEST.tex data/w33_current_frontier_manifest_v1.json
            git commit -m 'Pass 4260: reconcile protected frontier manifests'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
