name: Pass 11614 Hesse Coxeter discriminant
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11614_hesse_coxeter_discriminant.py'
      - 'analysis/PASS11614_HESSE_COXETER_DISCRIMINANT.md'
      - 'data/PART_W33_PASS11614_HESSE_COXETER_DISCRIMINANT.json'
      - 'tests/test_w33_pass11614_hesse_coxeter_discriminant.py'
      - '.github/workflows/pass11614-hesse-coxeter-discriminant.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip sympy pytest
      - run: python analysis/w33_pass11614_hesse_coxeter_discriminant.py
      - run: python -m pytest --noconftest -q tests/test_w33_pass11614_hesse_coxeter_discriminant.py
