name: Passes 498-502 Fitting Galois Release

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass498_fitting_minimum_mechanism.py'
      - 'analysis/w33_pass499_product_ring_discriminator.py'
      - 'analysis/w33_pass500_galois_phase_cycle_compiler.py'
      - 'analysis/w33_pass501_small_frobenius_census.py'
      - 'analysis/w33_pass502_formal_support.py'
      - 'analysis/PASS498_FITTING_MINIMUM_MECHANISM.md'
      - 'analysis/PASS499_PRODUCT_RING_DISCRIMINATOR.md'
      - 'analysis/PASS500_GALOIS_PHASE_CYCLE_COMPILER.md'
      - 'analysis/PASS501_SMALL_FROBENIUS_CENSUS.md'
      - 'analysis/PASS502_FORMAL_SUPPORT.md'
      - 'data/w33_pass498_fitting_minimum_mechanism.json'
      - 'data/w33_pass499_product_ring_discriminator.json'
      - 'data/w33_pass500_galois_phase_cycle_compiler.json'
      - 'data/w33_pass501_small_frobenius_census.json'
      - 'data/w33_pass502_formal_support.json'
      - 'hardware/w33_pass500_galois_phase_cycle_overlay.json'
      - 'formal/W33/Pass502HjelmslevGram.lean'
      - 'formal/W33/Pass502RelativeNormSquare.lean'
      - 'formal/W33.lean'
      - 'tests/test_w33_pass498_502_fitting_galois_release.py'
      - 'papers/fitting_galois_depth_note.tex'
      - 'PASS498_502_FITTING_GALOIS_RELEASE.md'
      - '.github/workflows/pass498-502-fitting-galois.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  python-certificates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact dependencies
        run: python -m pip install mpmath==1.3.0 pytest==9.0.2
      - name: Verify certificates
        run: |
          python analysis/w33_pass498_fitting_minimum_mechanism.py --check
          python analysis/w33_pass499_product_ring_discriminator.py --check
          python analysis/w33_pass500_galois_phase_cycle_compiler.py --check
          python analysis/w33_pass501_small_frobenius_census.py --check
          python analysis/w33_pass502_formal_support.py --check
      - name: Focused regressions
        run: python -m pytest -q tests/test_w33_pass498_502_fitting_galois_release.py

  lean-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
