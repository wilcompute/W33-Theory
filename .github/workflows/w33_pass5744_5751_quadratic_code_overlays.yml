name: W33 Pass5744-5751 quadratic code overlays

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5744_5751_quadratic_code_overlays.py'
      - 'data/PART_W33_PASS5744_5751_QUADRATIC_CODE_OVERLAYS.json'
      - 'tests/test_w33_pass5744_5751_quadratic_code_overlays.py'
      - '.github/workflows/w33_pass5744_5751_quadratic_code_overlays.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass5744_5751_quadratic_code_overlays.py'
      - 'data/PART_W33_PASS5744_5751_QUADRATIC_CODE_OVERLAYS.json'
      - 'tests/test_w33_pass5744_5751_quadratic_code_overlays.py'
      - '.github/workflows/w33_pass5744_5751_quadratic_code_overlays.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Replay exact certificate
        run: python analysis/w33_pass5744_5751_quadratic_code_overlays.py
      - name: Frozen certificate must reproduce byte-for-byte
        run: git diff --exit-code -- data/PART_W33_PASS5744_5751_QUADRATIC_CODE_OVERLAYS.json
      - name: Focused regression
        run: pytest -q tests/test_w33_pass5744_5751_quadratic_code_overlays.py
