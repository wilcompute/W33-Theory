name: Passes 4253-4260 manuscript compile check
on:
  push:
    paths:
      - 'analysis/BT4253_BT4260_girth16_faultaware_su4_hysteresis_clock_channel_scrambling_modular_capacity_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4253_4260_manuscript_check.yml'
  workflow_dispatch:
jobs:
  tectonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      - name: Compile manuscripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass4253-4260
          for f in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs --keep-intermediates "$f" |& tee "/tmp/pass4253-4260/${f%.tex}.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pass4253-4260-manuscript-evidence
          path: |
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
            /tmp/pass4253-4260/*.log
