name: W33 VM retention and logical output
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_lossless_counter_suspension*'
      - 'analysis/w33_shared_counter_archive*'
      - 'analysis/w33_snapshot_admission*'
      - 'analysis/w33_counter_zipper_microcode*'
      - 'analysis/w33_process_microstep_owner*'
      - 'analysis/w33_durable_microstep_owner*'
      - 'analysis/w33_carry_timing_information*'
      - 'analysis/w33_computation_resource_frontiers*'
      - 'analysis/w33_monotone_difference_counter*'
      - 'analysis/w33_redundant_guest_abi*'
      - 'analysis/w33_native_qutrit_seed_frontier*'
      - 'analysis/w33_reversible_observation*'
      - 'analysis/w33_observer_relative_randomness*'
      - 'analysis/w33_contextual_decryption_obstruction*'
      - 'analysis/w33_observer_information_lattice*'
      - 'analysis/w33_causal_accessibility_randomness*'
      - 'analysis/w33_seeded_vs_quantum_entropy_harness*'
      - 'analysis/w33_determinism_prediction_boundary*'
      - 'analysis/w33_holovm_process_kernel.py'
      - 'analysis/W33_HOLOVM_PROCESS_KERNEL*'
      - 'analysis/w33_three_copy_output_rank_audit*'
      - 'analysis/w33_authenticated_counter_machine.py'
      - 'analysis/w33_temporal_merkle_gc.py'
      - 'analysis/w33_merkle_capability_memory.py'
      - 'analysis/w33_finite_control_unbounded_guest_hypervisor.py'
      - 'analysis/w33_ladder_checkpoint_placement.py'
      - 'analysis/w33_pass20260906_three_copy_symmetric_exhaustion.py'
      - 'tests/test_w33_lossless_counter_suspension.py'
      - 'tests/test_w33_shared_counter_archive.py'
      - 'tests/test_w33_snapshot_admission_scheduler.py'
      - 'tests/test_w33_counter_zipper_microcode.py'
      - 'tests/test_w33_process_microstep_owner.py'
      - 'tests/test_w33_durable_microstep_owner.py'
      - 'tests/test_w33_holovm_process_kernel.py'
      - 'tests/test_w33_temporal_gc_replay.py'
      - 'tests/test_w33_three_copy_output_rank_audit.py'
      - '.github/workflows/w33_vm_retention_output_audit.yml'
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: HoloVM immutable process kernel certificate
        run: python analysis/w33_holovm_process_kernel.py
      - name: HoloVM process identity, fork, resume and GC tests
        run: python tests/test_w33_holovm_process_kernel.py
      - name: Recovery, GC, malformed archives and frozen result
        run: python tests/test_w33_lossless_counter_suspension.py
      - name: Shared admission, deep collection and frozen payload costs
        run: python tests/test_w33_shared_counter_archive.py
      - name: Joint snapshot selection, staging and independent cost oracle
        run: python tests/test_w33_snapshot_admission_scheduler.py
      - name: Bounded microsteps, macro refinement and continuation recovery
        run: python tests/test_w33_counter_zipper_microcode.py
      - name: Process microstep proof fanout certificate
        run: python analysis/w33_process_microstep_owner.py
      - name: Process receipt consumption, duplicate delivery and archive recovery
        run: python tests/test_w33_process_microstep_owner.py
      - name: SQLite microstep recovery, real process exits and writer race
        run: python tests/test_w33_durable_microstep_owner.py --certificate
      - name: Exact carry cost, timing information and reversible erasure
        run: python analysis/w33_carry_timing_information.py
      - name: Radix, timing noise, mixed arithmetic and reversible gate certificates
        run: python analysis/w33_computation_resource_frontiers.py
      - name: Authenticated redundant arithmetic and rejection controls
        run: python analysis/w33_monotone_difference_counter.py
      - name: Reversible seeds, coherent ternary gates and observer policies
        run: python analysis/w33_reversible_observation_experiments.py
      - name: Observer-relative randomness, perfect secrecy and seed-side-information checks
        run: python analysis/w33_observer_relative_randomness.py
      - name: Contextual decryption global-key obstruction
        run: python analysis/w33_contextual_decryption_obstruction.py
      - name: Observer information lattice and min-entropy profile
        run: python analysis/w33_observer_information_lattice.py
      - name: Causal accessibility of decrypting side information
        run: python analysis/w33_causal_accessibility_randomness.py
      - name: Seeded versus ideal-quantum HoloVM entropy harness
        run: python analysis/w33_seeded_vs_quantum_entropy_harness.py
      - name: Determinism versus universal prediction boundary
        run: python analysis/w33_determinism_prediction_boundary.py
      - name: Existing temporal collection and replay
        run: python tests/test_w33_temporal_gc_replay.py
      - name: Full symmetric-family output audit and frozen result
        run: python tests/test_w33_three_copy_output_rank_audit.py
      - name: Redundant guest refinement
        run: python analysis/w33_redundant_guest_abi.py
      - name: Native qutrit compilation and seed allocation
        run: python analysis/w33_native_qutrit_seed_frontier.py
