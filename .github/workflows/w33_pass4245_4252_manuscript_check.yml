name: W33 Passes 4245-4252 manuscript check
on:
  push:
    paths:
      - "analysis/BT4245_BT4252_residual_symmetry_ghz_hodge_route_lattice_outside_box_insert.tex"
      - "analysis/W33_CURRENT_FRONTIER_MANIFEST.tex"
      - "w33_paper.tex"
      - "photonic_holonet.tex"
      - "holonet_machine_blueprint.tex"
      - ".github/workflows/w33_pass4245_4252_manuscript_check.yml"
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/integrate_pass4245_4252_frontier.py --check
      - run: python scripts/check_tex_insert_pitfalls.py
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error holonet_machine_blueprint.tex
