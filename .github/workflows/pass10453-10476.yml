name: Pass10453-10476 explicit A4xG24 coordinates

on:
  push:
    branches: [ master ]
    paths:
      - 'analysis/w33_pass10453_10476_explicit_a4g24_v2_coordinates.py'
      - '.github/workflows/pass10453-10476.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Evaluate Wilson A4xG2(4) words on stored Co1 module
        run: python analysis/w33_pass10453_10476_explicit_a4g24_v2_coordinates.py

# Trigger marker: workflow installed and rerun on master.
