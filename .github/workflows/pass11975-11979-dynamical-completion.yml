name: Pass11975-11979 dynamical candidate completion
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1197[5-9]_*.py'
      - 'data/w33_pass1197[5-9]_*.json'
      - 'tests/test_w33_pass11975_11979_dynamical_completion.py'
      - '.github/workflows/pass11975-11979-dynamical-completion.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 mpmath==1.3.0 pytest==8.4.2
      - name: Frozen physical controls
        run: python -m pytest --noconftest --ignore-glob=tests/test_*.py -o addopts='' -q tests/test_w33_pass11975_11979_dynamical_completion.py tests/test_w33_pass11970_11974_native_dynamical_targets.py
      - name: Regenerate five candidates
        run: |
          python analysis/w33_pass11975_mediator_flavour_matching.py
          python analysis/w33_pass11976_metric_lapse_bracket.py
          python analysis/w33_pass11977_native_overlap.py
          python analysis/w33_pass11978_full_singlet_soft_vacuum.py
          python analysis/w33_pass11979_native_patch_decimation.py
      - name: Regenerated physical controls
        run: python -m pytest --noconftest --ignore-glob=tests/test_*.py -o addopts='' -q tests/test_w33_pass11975_11979_dynamical_completion.py
