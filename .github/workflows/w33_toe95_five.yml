name: TOE95 five Witting research fronts
on:
  push:
    branches:
      - toe95_witting_all_five_20261017
    paths:
      - 'analysis/w33_20261017_toe95_*.py'
      - 'tests/test_w33_20261017_toe95_all_five.py'
      - '.github/workflows/w33_toe95_five.yml'
  pull_request:
  workflow_dispatch:
jobs:
  five-track-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy pytest
      - run: python -m pytest -q tests/test_w33_20261017_toe95_all_five.py
      - run: python -m analysis.w33_20261017_toe95_allpairs
      - run: python -m analysis.w33_20261017_toe95_group32
      - run: python -m analysis.w33_20261017_toe95_finite_population
      - run: python -m analysis.w33_20261017_toe95_calibration
      - run: python -m analysis.w33_20261017_toe95_polar_instrument
      - uses: actions/upload-artifact@v4
        with:
          name: toe95-all-five-json-certificates
          path: data/w33_20261017_toe95_*.json
          if-no-files-found: error
