name: W33 Passes 4480-4484 protected H10 continuation

on:
  push:
    branches: [master]
    paths:
      - analysis/w33_pass4480_line_logical_apartment_twins.py
      - analysis/w33_pass4481_apartment_radical_module_filtration.py
      - analysis/w33_pass4482_ten_line_protected_readout.py
      - analysis/PASS4480_4483_apartment_h10_continuation_insert.tex
      - analysis/PASS4480_4483_apartment_h10_index_insert.html
      - analysis/PASS4483_apartment_h10_prior_art_boundary.md
      - data/PART_W33_PASS4480_LINE_LOGICAL_APARTMENT_TWINS.json
      - data/PART_W33_PASS4481_APARTMENT_RADICAL_MODULE_FILTRATION.json
      - data/PART_W33_PASS4482_TEN_LINE_PROTECTED_READOUT.json
      - tests/test_w33_pass4480_4484_apartment_h10_continuation.py
      - .github/workflows/w33_pass4480_4484_apartment_h10_continuation.yml
  pull_request:
    paths:
      - analysis/w33_pass4480_line_logical_apartment_twins.py
      - analysis/w33_pass4481_apartment_radical_module_filtration.py
      - analysis/w33_pass4482_ten_line_protected_readout.py
      - tests/test_w33_pass4480_4484_apartment_h10_continuation.py

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --upgrade numpy pytest
      - name: Execute canonical renumbered witnesses
        run: |
          python analysis/w33_pass4480_line_logical_apartment_twins.py
          python analysis/w33_pass4481_apartment_radical_module_filtration.py
          python analysis/w33_pass4482_ten_line_protected_readout.py
      - name: Run focused regression
        run: pytest -q tests/test_w33_pass4480_4484_apartment_h10_continuation.py
      - name: Enforce pass-ownership cleanup
        run: |
          test ! -e analysis/w33_pass4474_line_logical_apartment_twins.py
          test ! -e analysis/w33_pass4475_apartment_radical_module_filtration.py
          test ! -e analysis/w33_pass4476_ten_line_protected_readout.py
          grep -q 'd300fa184fa5665fd539f39b2d6ab4b23c08a39d' analysis/PASS4480_4484_RESERVATION.md
          grep -q 'PASS4480_4483_apartment_h10_continuation_insert' w33_paper.tex
          grep -q 'PASS4480_4483_apartment_h10_continuation_insert' photonic_holonet.tex
          grep -q 'PASS4480_4483_apartment_h10_continuation_insert' holonet_machine_blueprint.tex
