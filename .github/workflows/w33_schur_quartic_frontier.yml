name: W33 Schur-quartic frontier

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/w33_schur_quartic_frontier.yml'
      - 'analysis/w33_schur_quartic_d4_triality_bridge.py'
      - 'analysis/w33_schur_incidence_vs_projective_symmetry.py'
      - 'analysis/w33_schur_extraspecial_coset_geometry.py'
      - 'analysis/w33_schur_central_phase_reye_quotient.py'
      - 'analysis/w33_schur176_qplus_macro_skeleton.py'
      - 'analysis/w33_schur64_e7_threequbit_pauli_objectwise_bridge.py'
      - 'analysis/w33_e7_d4_presymplectic_reye_normal_form.py'
      - 'analysis/w33_reye_hidden_radical_v4_decoder.py'
      - 'analysis/w33_reye_v4_decoder_automorphism_576.py'
      - 'analysis/w33_schur176_reye_decoder_quotient_grid_bridge.py'
      - 'analysis/w33_schur176_sixteen_line_fibre_structure.py'
      - 'analysis/w33_schur64_two_sheet_phase_no_go.py'
      - 'analysis/w33_schur_reye_288_action_bridge.py'
      - 'analysis/w33_reye_observer_relative_min_entropy.py'
      - 'tests/test_w33_schur_quartic_frontier_20260911.py'
      - 'tests/test_w33_schur_extraspecial_coset_geometry_20260911.py'
      - 'tests/test_w33_schur_central_phase_reye_20260911.py'
      - 'tests/test_w33_schur176_qplus_macro_20260911.py'
      - 'tests/test_w33_schur64_e7_threequbit_pauli_objectwise_20260911.py'
      - 'tests/test_w33_e7_d4_presymplectic_reye_20260911.py'
      - 'tests/test_w33_reye_hidden_radical_v4_decoder_20260911.py'
      - 'tests/test_w33_reye_v4_decoder_automorphism_576_20260911.py'
      - 'tests/test_w33_schur176_reye_decoder_quotient_grid_20260911.py'
      - 'tests/test_w33_schur176_sixteen_line_fibre_structure_20260911.py'
      - 'tests/test_w33_schur64_two_sheet_phase_no_go_20260911.py'
      - 'tests/test_w33_schur_reye_288_action_bridge_20260911.py'
      - 'tests/test_w33_reye_observer_relative_min_entropy_20260911.py'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --upgrade networkx numpy sympy pytest
      - name: Regenerate Schur certificates
        run: |
          python analysis/w33_schur_quartic_d4_triality_bridge.py
          python analysis/w33_schur_incidence_vs_projective_symmetry.py
          python analysis/w33_schur_extraspecial_coset_geometry.py
          python analysis/w33_schur_central_phase_reye_quotient.py
          python analysis/w33_schur176_qplus_macro_skeleton.py
          python analysis/w33_schur64_e7_threequbit_pauli_objectwise_bridge.py
          python analysis/w33_e7_d4_presymplectic_reye_normal_form.py
          python analysis/w33_reye_hidden_radical_v4_decoder.py
          python analysis/w33_reye_v4_decoder_automorphism_576.py
          python analysis/w33_schur176_reye_decoder_quotient_grid_bridge.py
          python analysis/w33_schur176_sixteen_line_fibre_structure.py
          python analysis/w33_schur64_two_sheet_phase_no_go.py
          python analysis/w33_schur_reye_288_action_bridge.py
          python analysis/w33_reye_observer_relative_min_entropy.py
      - name: Focused regression
        run: |
          python -m pytest -q \
            tests/test_w33_schur_quartic_frontier_20260911.py \
            tests/test_w33_schur_extraspecial_coset_geometry_20260911.py \
            tests/test_w33_schur_central_phase_reye_20260911.py \
            tests/test_w33_schur176_qplus_macro_20260911.py \
            tests/test_w33_schur64_e7_threequbit_pauli_objectwise_20260911.py \
            tests/test_w33_e7_d4_presymplectic_reye_20260911.py \
            tests/test_w33_reye_hidden_radical_v4_decoder_20260911.py \
            tests/test_w33_reye_v4_decoder_automorphism_576_20260911.py \
            tests/test_w33_schur176_reye_decoder_quotient_grid_20260911.py \
            tests/test_w33_schur176_sixteen_line_fibre_structure_20260911.py \
            tests/test_w33_schur64_two_sheet_phase_no_go_20260911.py \
            tests/test_w33_schur_reye_288_action_bridge_20260911.py \
            tests/test_w33_reye_observer_relative_min_entropy_20260911.py
      - name: Freeze exact JSON certificates
        shell: bash
        run: |
          git add -f \
            data/w33_schur_quartic_d4_triality_bridge.json \
            data/w33_schur_incidence_vs_projective_symmetry.json \
            data/w33_schur_extraspecial_coset_geometry.json \
            data/w33_schur_central_phase_reye_quotient.json \
            data/w33_schur176_qplus_macro_skeleton.json \
            data/w33_schur64_e7_threequbit_pauli_objectwise_bridge.json \
            data/w33_e7_d4_presymplectic_reye_normal_form.json \
            data/w33_reye_hidden_radical_v4_decoder.json \
            data/w33_reye_v4_decoder_automorphism_576.json \
            data/w33_schur176_reye_decoder_quotient_grid_bridge.json \
            data/w33_schur176_sixteen_line_fibre_structure.json \
            data/w33_schur64_two_sheet_phase_no_go.json \
            data/w33_schur_reye_288_action_bridge.json \
            data/w33_reye_observer_relative_min_entropy.json
          if git diff --cached --quiet; then
            echo 'Schur certificates already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze W33 Schur-quartic frontier certificates'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
