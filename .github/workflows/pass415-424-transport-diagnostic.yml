name: Pass 415-424 Transport Diagnostic
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  issues: read
jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/pass415-424-ten-frontiers' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Recover transport diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          expected = {"0": {"length": 6000, "sha256": "94cef6632ade9719c6cda66988cd0083a1fc832778a44d8a3e58b50202f137e0"}, "1": {"length": 6000, "sha256": "691a6c386fff807e7ac22df20548fce510be50602999ab11c819c43abb805447"}, "2": {"length": 6000, "sha256": "c1e0104b7a7cc3b1cb4401894c530382270a4ea90e0b716cd73199a763d63525"}, "3": {"length": 6000, "sha256": "288705aca5cf1f3a0f590f8b7e800d5719d6673c7a96067dfa4ca995407c5e8c"}, "4": {"length": 6000, "sha256": "47972747f829b098db23456068da98275971e22649efc51671298478f0164cb3"}, "5": {"length": 6000, "sha256": "74961b01740b8dba727d72833271f0e53391977ab02240633390b870d67d9ee9"}, "6": {"length": 6000, "sha256": "115ebd0cb7eb43a1f1907c41a6197779baf2f51d74001a0f5b9d3bfad0bc80df"}, "7": {"length": 6000, "sha256": "5d1b683b9faba2d455031c45982ed953450ae293b00276ec7cba70bb7acbd70d"}, "8": {"length": 6000, "sha256": "220887b1feac12f98d6a8280290f9788af571bc0e7f30be2252626dac4b2ad63"}, "9": {"length": 6000, "sha256": "0399f87f581defc07a1e42ea88cb6a0a15aa5adace6bd8e999dd34a2a8f2864a"}, "10": {"length": 6000, "sha256": "fc2d47fa64ef031129eb040a950820aa003aca8cdc8a372aa2d1cd69321a7bb5"}, "11": {"length": 6000, "sha256": "5fe6c13948d0e8185e6e607712c890b202a644bcfce31fea2926175f3a9d10d2"}, "12": {"length": 6000, "sha256": "22b9b53adb91a97cfdbdd37951b62d08c617eaccdc4fc50cb3f701fcf2892f85"}, "13": {"length": 6000, "sha256": "6010d862dd18bbf4cb4e205b52340997a7941adb29bab9db3743f5ab88f96269"}, "14": {"length": 6000, "sha256": "7b81c87591ff58878c66eddcba17816f29aed312e3c1bca8ec8694d84ec2bb18"}, "15": {"length": 3360, "sha256": "b70e08f32b55b1f7b2b027ce8d72a69338c58a5a774852d7cbb10d6bd269c36f"}}
          def get(url):
              request=urllib.request.Request(url,headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/119"
          issue=get(base); comments=get(base+'/comments?per_page=100')
          text='\n'.join([issue.get('body','')]+[comment['body'] for comment in comments])
          observed={}; chunks={}
          for index in range(16):
              suffixes='AB' if index==8 else ('ABCDEFGHIJKL' if index==15 else None)
              try:
                  if suffixes:
                      parts=[]
                      for suffix in suffixes:
                          pattern=rf'PASS415424_CHUNK_{index:02d}{suffix}_BEGIN -->\n(.*?)\n<!-- PASS415424_CHUNK_{index:02d}{suffix}_END'
                          matches=re.findall(pattern,text,re.S)
                          if not matches: raise ValueError(f'missing {index:02d}{suffix}')
                          parts.append(''.join(matches[-1].split()))
                      chunk=''.join(parts)
                  else:
                      pattern=rf'PASS415424_CHUNK_{index:02d}_BEGIN -->\n(.*?)\n<!-- PASS415424_CHUNK_{index:02d}_END'
                      matches=re.findall(pattern,text,re.S)
                      if not matches: raise ValueError(f'missing {index:02d}')
                      chunk=''.join(matches[-1].split())
                  chunks[index]=chunk
                  observed[index]={'length':len(chunk),'sha256':hashlib.sha256(chunk.encode()).hexdigest(),
                    'expected':expected[str(index)]}
              except Exception as exc:
                  observed[index]={'error':str(exc),'expected':expected[str(index)]}
          report={'observed':observed}
          try:
              joined=''.join(chunks[i] for i in range(16))
              report['joined_base64_length']=len(joined)
              blob=base64.b64decode(joined,validate=True)
              report['decoded_bytes']=len(blob)
              report['archive_sha256']=hashlib.sha256(blob).hexdigest()
          except Exception as exc:
              report['decode_error']=repr(exc)
          open('/tmp/pass415424-transport.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass415-424-transport-diagnostic
          path: /tmp/pass415424-transport.json
