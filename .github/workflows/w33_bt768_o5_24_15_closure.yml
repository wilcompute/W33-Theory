name: W33 BT768 O5 24 plus 15 closure

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_bt768_o5_24_15_closure.py'
      - '.github/workflows/w33_bt768_o5_24_15_closure.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Close BT768 missing 15-sector independently from W33
        run: python analysis/w33_bt768_o5_24_15_closure.py --write
      - name: Recheck materialized closure certificate
        run: test -s data/w33_bt768_o5_24_15_closure.json && python -c "import json; d=json.load(open('data/w33_bt768_o5_24_15_closure.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - uses: actions/upload-artifact@v4
        with:
          name: w33-bt768-o5-24-15-closure
          path: data/w33_bt768_o5_24_15_closure.json
          if-no-files-found: error
