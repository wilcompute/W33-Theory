name: Passes 656-660 release verification

on:
  pull_request:
    paths:
      - 'analysis/w33_pass656_*.py'
      - 'analysis/w33_pass657_*.py'
      - 'analysis/w33_pass658_*.py'
      - 'analysis/w33_pass659_*.py'
      - 'analysis/w33_pass660_*.py'
      - 'analysis/BT656_660_five_frontier_release.md'
      - 'data/w33_pass656_*.json'
      - 'data/w33_pass657_*.json'
      - 'data/w33_pass658_*.json'
      - 'data/w33_pass659_*.json'
      - 'data/w33_pass660_*.json'
      - 'tests/test_w33_pass656_660.py'
      - '.github/workflows/pass656_660_release.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Generate deterministic certificates
        run: |
          python analysis/w33_pass656_two_character_ext_kuranishi.py
          python analysis/w33_pass657_d8_torsor_cocycle_minimal_marking.py
          python analysis/w33_pass658_fisher_optimal_flat_probe_tomography.py
          python analysis/w33_pass659_unknown_drifting_propensity_eprocess.py
          python analysis/w33_pass660_continuous_minimax_polyhedral_complex.py
      - name: Verify ledgers and focused regression
        run: |
          python analysis/w33_pass656_two_character_ext_kuranishi.py --check
          python analysis/w33_pass657_d8_torsor_cocycle_minimal_marking.py --check
          python analysis/w33_pass658_fisher_optimal_flat_probe_tomography.py --check
          python analysis/w33_pass659_unknown_drifting_propensity_eprocess.py --check
          python analysis/w33_pass660_continuous_minimax_polyhedral_complex.py --check
          python -m pytest -q tests/test_w33_pass656_660.py
      - name: Ensure generated ledgers are committed exactly
        run: git diff --exit-code -- data/w33_pass656_two_character_ext_kuranishi.json data/w33_pass657_d8_torsor_cocycle_minimal_marking.json data/w33_pass658_fisher_optimal_flat_probe_tomography.json data/w33_pass659_unknown_drifting_propensity_eprocess.json data/w33_pass660_continuous_minimax_polyhedral_complex.json
