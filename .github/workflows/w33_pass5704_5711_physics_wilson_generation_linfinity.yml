name: W33 Pass5704-5711 physics Wilson generation Linfinity frontier

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5685_*'
      - 'analysis/w33_pass5693_*'
      - 'analysis/w33_pass5704_*'
      - 'analysis/w33_pass5705_*'
      - 'analysis/w33_pass5706_*'
      - 'analysis/w33_pass5707_*'
      - 'analysis/w33_pass5708_*'
      - 'analysis/w33_pass5709_*'
      - 'analysis/w33_pass5710_*'
      - 'analysis/w33_pass5711_*'
      - 'analysis/PASS5704_5711_*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'tests/test_w33_pass5704_5711_physics_frontier.py'
      - 'data/w33_pass_namespace_registry_v2.d/5704-5711.json'
      - 'data/PART_W33_PASS5691_5698_PHYSICS_YM_DUALITY_RAMANUJAN_FRONTIER_SUMMARY.json'
      - 'data/w33_publication_frontier_contract_v2.json'
      - 'data/w33_public_frontier_extension_pass4461_4464.json'
      - '.github/workflows/w33_pass5704_5711_physics_wilson_generation_linfinity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip numpy scipy pytest

      - name: Replay corrected legacy gates
        run: |
          python analysis/w33_pass5685_deck16_local_flatbond_ratio2.py
          python analysis/w33_pass5693_explicit_ramanujan_levels23.py

      - name: Replay Pass5704-5711
        run: python analysis/w33_pass5704_5711_runner.py

      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5704_5711_physics_frontier.py

      - name: Materialize homepage and audit publication DAG
        run: |
          python tools/integrate_bt3376_bt3389.py --report /tmp/public-integration.json
          python analysis/w33_pass5364_publication_dag_audit.py --report /tmp/publication-dag.json
          test "$(grep -c 'id=\"pass-5704-5711-physics-wilson-generation-linfinity-frontier\"' docs/index.html)" -eq 1
          git diff --check

      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass5704_5711
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5704_5711/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5704_5711/pdf_sha256.txt

      - name: Freeze regenerated certificates and homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/PART_W33_PASS5685_DECK16_LOCAL_FLATBOND_RATIO2.json \
            data/PART_W33_PASS5693_EXPLICIT_RAMANUJAN_LEVELS23.json \
            data/PART_W33_PASS5704_AFFINE_SU3_WILSON_FACE_SELECTION.json \
            data/PART_W33_PASS5705_DECK96_192_GROUP_FINGERPRINT.json \
            data/PART_W33_PASS5706_RAMANUJAN_LEVELS45_COLOR_GAUGE.json \
            data/PART_W33_PASS5707_LINFINITY_L1_ZERO_NO_GO.json \
            data/PART_W33_PASS5708_E8_27x3_GENERATION_COMMUTANT.json \
            data/PART_W33_PASS5709_Z3_CENTER_FLUX_SU3_ADJOINT_NOGO.json \
            data/PART_W33_PASS5710_DECK_DK_PFAFFIAN_TOPOLOGY.json \
            data/PART_W33_PASS5711_GENERATION_HIERARCHY_SYMMETRY_BREAKING.json \
            docs/index.html
          if git diff --cached --quiet; then
            echo 'Certificates and homepage already materialized.'
          else
            git commit -m 'Freeze Pass5704-5711 certificates and homepage [skip ci]'
            # Parallel lanes may advance master while this long verification job is
            # running. Rebase the generated freeze commit onto the current remote
            # head before pushing so a valid closure job does not fail solely from
            # a non-fast-forward race.
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pass5704-5711-physics-wilson-generation-linfinity
          path: evidence/pass5704_5711/**
