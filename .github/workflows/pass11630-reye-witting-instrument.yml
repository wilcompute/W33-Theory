name: Pass11630 Reye Witting instrument
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11630_reye_witting_instrument.py'
      - 'analysis/PASS11630_REYE_WITTING_INSTRUMENT.md'
      - 'tests/test_w33_pass11630_reye_witting_instrument.py'
      - 'data/w33_pass11630_reye_witting_instrument.json'
      - 'data/w33_pass11630_perplexity_input.zip'
      - '.github/workflows/pass11630-reye-witting-instrument.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx pytest
      - name: Audit committed instrument and corrupt-witness controls
        run: python -m pytest --noconftest -q tests/test_w33_pass11630_reye_witting_instrument.py
      - name: Replay immutable intake and exact operation
        run: python analysis/w33_pass11630_reye_witting_instrument.py
