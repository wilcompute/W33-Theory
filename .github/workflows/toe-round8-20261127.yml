name: TOE round-eight E6 E8 Witting arithmetic and causal controls
on:
  push:
    paths:
      - 'analysis/toe_20261127_round8.py'
      - 'tests/test_toe_20261127_round8.py'
      - '.github/workflows/toe-round8-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy sympy pytest networkx
      - run: python analysis/toe_20261127_round8.py
      - run: python -m pytest -q tests/test_toe_20261127_round8.py
