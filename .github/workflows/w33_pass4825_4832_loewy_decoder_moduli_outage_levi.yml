name: Passes 4825-4832 Loewy decoder moduli outage Levi
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4825_brauer_loewy_closure.py'
      - 'analysis/w33_pass4826_4832_code399_decoder_dualshell.py'
      - 'analysis/w33_pass4827_pgsp_sign_burnside.py'
      - 'analysis/w33_pass4828_parametric_outage_flow.py'
      - 'analysis/w33_pass4829_4830_levi_code_sign_module.py'
      - 'analysis/w33_pass4831_deephole_residue_12x12_falsifier.py'
      - '.github/workflows/w33_pass4825_4832_loewy_decoder_moduli_outage_levi.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pass4825-4832-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact-analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy networkx sympy pytest
          sudo apt-get update -qq
          sudo apt-get install -y gap gap-character-tables || sudo apt-get install -y gap gap-ctbllib
      - name: Execute producers independently
        shell: bash
        run: |
          set +e
          LOG=analysis/PASS4825_4832_RUN.log
          STATUS=analysis/PASS4825_4832_RUN.status
          : > "$LOG"
          rc=0
          run_one() {
            echo "===== $* =====" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            here=${PIPESTATUS[0]}
            echo "rc=$here" | tee -a "$LOG"
            if [ "$here" -ne 0 ]; then rc=1; fi
          }
          run_gap() {
            echo '===== GAP U4(2) mod-2 Brauer extraction =====' | tee -a "$LOG"
            gap -q analysis/PASS4818_U42_MOD2_BRAUER.g > analysis/PASS4818_U42_MOD2_BRAUER.txt 2>> "$LOG"
            here=$?
            cat analysis/PASS4818_U42_MOD2_BRAUER.txt >> "$LOG" 2>/dev/null || true
            echo "rc=$here" | tee -a "$LOG"
            if [ "$here" -ne 0 ]; then rc=1; fi
          }
          run_gap
          run_one python analysis/w33_pass4818_modular_h1_brauer_loewy_boundary.py
          run_one python analysis/w33_pass4825_brauer_loewy_closure.py
          run_one python analysis/w33_pass4817_4823_pgsp_s3_moduli_certified.py
          run_one python analysis/w33_pass4827_pgsp_sign_burnside.py
          run_one python analysis/w33_pass4826_4832_code399_decoder_dualshell.py
          run_one python analysis/w33_pass4829_4830_levi_code_sign_module.py
          run_one python analysis/w33_pass4831_deephole_residue_12x12_falsifier.py
          run_one python analysis/w33_pass4828_parametric_outage_flow.py
          echo "$rc" > "$STATUS"
          exit 0
      - name: Preserve generated evidence and diagnostics
        shell: bash
        run: |
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add analysis/PASS4825_4832_RUN.log analysis/PASS4825_4832_RUN.status
          test -f analysis/PASS4818_U42_MOD2_BRAUER.txt && git add analysis/PASS4818_U42_MOD2_BRAUER.txt
          for f in \
            data/PART_W33_PASS4817_PGSP_S3_MODULI_MODULE.json \
            data/PART_W33_PASS4818_MODULAR_H1_BRAUER_LOEWY.json \
            data/PART_W33_PASS4823_SELECTED_CONNECTION_INVARIANT_LINE.json \
            data/PART_W33_PASS4825_BRAUER_LOEWY_CLOSURE.json \
            data/PART_W33_PASS4826_CODE399_DECODER.json \
            data/PART_W33_PASS4827_PGSP_SIGN_BURNSIDE.json \
            data/PART_W33_PASS4828_PARAMETRIC_OUTAGE_FLOW.json \
            data/PART_W33_PASS4829_LEVI_HOMOLOGY_CODE.json \
            data/PART_W33_PASS4830_SIGN_LEVI_MODULE_INTERTWINER.json \
            data/PART_W33_PASS4831_DEEPHOLE_RESIDUE_12X12_FALSIFIER.json \
            data/PART_W33_PASS4832_CODE399_DUAL_SHELL_GEOMETRY.json
          do
            test -f "$f" && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Passes 4825-4832 exact evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Enforce final aggregate status after preserving evidence
        run: test "$(cat analysis/PASS4825_4832_RUN.status)" -eq 0
