name: Passes 3356-3363 Front Door and Gauge Closure
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_bt3320_bt3331.py'
      - 'tools/integrate_bt3363_minimum_gauge_defect.py'
      - 'analysis/bt3363_minimum_gauge_defect_generation.py'
      - 'analysis/BT3363_minimum_gauge_defect_generation*'
      - 'tests/test_bt3356_3363_front_door_reachability.py'
      - 'tests/test_bt3363_minimum_gauge_defect_generation.py'
      - 'data/PART_BT3363_MINIMUM_GAUGE_DEFECT_GENERATION_results.json'
      - 'analysis/BT3356_BT3363_front_door_reachability_closure.md'
      - 'data/w33_pass_namespace_registry_v2.d/3356-3363.json'
      - '.github/workflows/w33_pass3356_3363_front_door_reachability.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pass3356-3363-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reachability-and-gauge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact gauge certificate
        run: |
          mkdir -p evidence/pass3356_3363
          python analysis/bt3363_minimum_gauge_defect_generation.py \
            --json /tmp/bt3363.json | tee evidence/pass3356_3363/gauge.log
          cmp /tmp/bt3363.json data/PART_BT3363_MINIMUM_GAUGE_DEFECT_GENERATION_results.json
      - name: Materialize all four front doors twice
        run: |
          python tools/integrate_bt3320_bt3331.py --report evidence/pass3356_3363/first.json
          python tools/integrate_bt3363_minimum_gauge_defect.py
          python tools/integrate_bt3320_bt3331.py --report evidence/pass3356_3363/second.json
          python tools/integrate_bt3363_minimum_gauge_defect.py
          grep -F '\input{analysis/BT3330_global_cover_quantum_hypercube_insert}%' w33_paper.tex
          grep -F '\input{analysis/BT3363_minimum_gauge_defect_generation_insert}%' w33_paper.tex
          grep -F '\input{analysis/BT3330_global_cover_quantum_hypercube_insert}%' photonic_holonet.tex
          grep -F '\input{analysis/BT3363_minimum_gauge_defect_generation_insert}%' photonic_holonet.tex
          grep -F '\input{analysis/BT3330_global_cover_quantum_hypercube_insert}%' holonet_machine_blueprint.tex
          grep -F '\input{analysis/BT3363_minimum_gauge_defect_generation_insert}%' holonet_machine_blueprint.tex
          grep -F 'id="bt3320-3331-global-cover-quantum-hypercube"' docs/index.html
          grep -F 'id="bt3363-minimum-gauge-defect-generation"' docs/index.html
      - name: Focused regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q \
            tests/test_bt3356_3363_front_door_reachability.py \
            tests/test_bt3363_minimum_gauge_defect_generation.py \
            | tee evidence/pass3356_3363/pytest.log
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee evidence/pass3356_3363/${source%.tex}.log
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf \
            > evidence/pass3356_3363/pdf_sha256.txt
      - name: Commit materialized front doors once
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Passes 3320-3331 and BT3363 across all front doors [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass3356-3363-front-door-gauge-evidence
          path: |
            evidence/pass3356_3363/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
