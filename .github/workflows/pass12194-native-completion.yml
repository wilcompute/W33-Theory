name: Passes12194-12198 native completion maps
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12194_12198_native_completion.py'
      - 'tests/test_w33_pass12194_12198_native_completion.py'
      - 'data/w33_pass12194_12198_native_completion.json'
      - '.github/workflows/pass12194-native-completion.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy sympy==1.14.0 networkx mpmath pytest
      - name: Frozen certificate and independent controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12194_12198_native_completion.py
      - name: Regenerate all five continuation maps
        run: python analysis/w33_pass12194_12198_native_completion.py
      - name: Regenerated certificate and independent controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12194_12198_native_completion.py
      - uses: actions/upload-artifact@v4
        with:
          name: passes12194-12198-native-completion
          path: data/w33_pass12194_12198_native_completion.json
