name: W33 Pass5792-5799 matrix ring transpose outer

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5792_5799_matrix_ring_transpose_outer.py'
      - 'tests/test_w33_pass5792_5799_matrix_ring_transpose_outer.py'
      - '.github/workflows/w33_pass5792_5799_matrix_ring_transpose_outer.yml'
      - 'data/PART_W33_PASS5776_5783_REYE_LATIN_COMMON_CORE.json'
      - 'data/PART_W33_PASS5667_5674_Q5_REYE_EQUIVARIANT_ORIENTATION.json'
  pull_request:
    paths:
      - 'analysis/w33_pass5792_5799_matrix_ring_transpose_outer.py'
      - 'tests/test_w33_pass5792_5799_matrix_ring_transpose_outer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run exact matrix-ring carrier verifier
        run: python -m pytest -q tests/test_w33_pass5792_5799_matrix_ring_transpose_outer.py
      - name: Upload generated theorem certificate
        uses: actions/upload-artifact@v4
        with:
          name: pass5792-5799-certificate
          path: data/PART_W33_PASS5792_5799_MATRIX_RING_TRANSPOSE_OUTER.json
