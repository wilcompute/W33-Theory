name: Materialize Pass 1188-1192 exact correction

on:
  pull_request:
    branches: [master]
    paths:
      - 'PASS1192_MATERIALIZE.trigger'
      - '.github/workflows/pass1192_materialize_pr.yml'
      - '.correction/pass1192_chunk_*.b64'

permissions:
  contents: write
  pull-requests: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover, decode, and extract reviewed payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, string

          root = Path('.correction')
          clean = lambda name: ''.join((root / name).read_text().split())
          prefix_names = [
              'pass1192_chunk_00.b64', 'pass1192_chunk_01.b64',
              'pass1192_chunk_02.b64', 'pass1192_chunk_03.b64',
              'pass1192_chunk_04a.b64',
          ]
          suffix_names = [
              'pass1192_chunk_05a.b64', 'pass1192_chunk_05b.b64',
              'pass1192_chunk_06.b64',
          ]
          prefix = ''.join(clean(name) for name in prefix_names)
          broken = clean('pass1192_chunk_04b.b64')
          suffix = ''.join(clean(name) for name in suffix_names)
          expected = 'c0b8ad3a4ee7d3b51175d1361d92a97db577354f3bdbbe4a6756a65491aea44a'
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'

          def decode_if_match(joined):
              try:
                  archive = base64.b64decode(joined, validate=True)
              except Exception:
                  return None
              return archive if hashlib.sha256(archive).hexdigest() == expected else None

          joined = prefix + broken + suffix
          archive = decode_if_match(joined)
          recovery = {'direct_match': archive is not None, 'broken_chars': len(broken)}
          if archive is None:
              found = None
              for index in range(len(broken) + 1):
                  left, right = broken[:index], broken[index:]
                  for character in alphabet:
                      candidate = prefix + left + character + right + suffix
                      archive = decode_if_match(candidate)
                      if archive is not None:
                          found = (index, character, archive)
                          break
                  if found is not None:
                      break
              assert found is not None, 'No single-character recovery matched the reviewed archive SHA256'
              index, character, archive = found
              recovery.update({
                  'recovered': True,
                  'missing_index_in_04b': index,
                  'missing_character': character,
                  'corrected_04b_chars': len(broken) + 1,
              })
          else:
              recovery['recovered'] = False

          recovery.update({
              'archive_bytes': len(archive),
              'archive_sha256': hashlib.sha256(archive).hexdigest(),
              'expected_archive_sha256': expected,
          })
          Path('/tmp/pass1192_recovery.json').write_text(json.dumps(recovery, indent=2) + '\n')
          Path('/tmp/pass1188_1192.tar.gz').write_bytes(archive)
          print(json.dumps(recovery, indent=2))
          PY
          tar -xzf /tmp/pass1188_1192.tar.gz
          rm -rf .correction PASS1192_MATERIALIZE.trigger .github/workflows/pass1192_materialize_pr.yml
      - uses: actions/upload-artifact@v4
        with:
          name: pass1192-recovered-payload
          path: |
            /tmp/pass1192_recovery.json
            /tmp/pass1188_1192.tar.gz
      - name: Compile corrected sources
        id: compile
        continue-on-error: true
        run: python -m compileall -q analysis tests 2>&1 | tee /tmp/pass1192_compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass1192-compile-log
          path: /tmp/pass1192_compile.log
      - name: Enforce compilation
        run: test '${{ steps.compile.outcome }}' = 'success'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused regression chain
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_w33_pass1158_1162.py \
            tests/test_w33_pass1163_1167.py \
            tests/test_w33_pass1168_1172.py \
            tests/test_w33_pass1173_1177.py \
            tests/test_w33_pass1178_1182.py \
            tests/test_w33_pass1183_1187.py \
            tests/test_w33_pass1188_1192.py
      - name: Run corpus-wide synthesis guard
        run: PYTHONPATH=. python analysis/w33_pass1192_parallel_synthesis_guard.py
      - name: Commit clean source release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Passes 1188-1192: exact parallel correction release'
          git push origin HEAD:${{ github.head_ref }}
