name: Force authoritative master docs Pages rebuild

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages-source-switch-issue.yml'
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  issues: write

env:
  EXPECTED_INDEX_BLOB: 41a8d733f42da18282fa276f5d2fa82bac7516f6
  RECEIPT_ISSUE: '287'

concurrency:
  group: force-master-docs-pages-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.title == 'RUN_W33_MASTER_DOCS_PAGES_REBUILD') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 287 && contains(github.event.comment.body, '/rebuild-pages'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Verify master docs index is canonical
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          actual="$(git hash-object docs/index.html)"
          bytes="$(wc -c < docs/index.html | tr -d ' ')"
          lines="$(wc -l < docs/index.html | tr -d ' ')"
          echo "actual_blob=$actual" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          test "$actual" = "$EXPECTED_INDEX_BLOB"
          test "$bytes" -gt 1000000
          test "$lines" -gt 28000

      - name: Read current Pages configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pages" > pages-before.json
          jq -r '.source.branch // "unknown"' pages-before.json | sed 's/^/branch=/' >> "$GITHUB_OUTPUT"
          jq -r '.source.path // "unknown"' pages-before.json | sed 's/^/path=/' >> "$GITHUB_OUTPUT"
          jq -r '.build_type // "unknown"' pages-before.json | sed 's/^/build_type=/' >> "$GITHUB_OUTPUT"

      - name: Fail closed unless source is master docs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.config.outputs.branch }}' = 'master'
          test '${{ steps.config.outputs.path }}' = '/docs'

      - name: Explicitly request legacy Pages build
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$GITHUB_REPOSITORY/pages/builds" > build-request.json
          jq -r '.url // "requested"' build-request.json | sed 's/^/build_url=/' >> "$GITHUB_OUTPUT"

      - name: Poll latest Pages build
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="queued"
          for attempt in $(seq 1 80); do
            gh api "/repos/$GITHUB_REPOSITORY/pages/builds/latest" > pages-latest.json
            status="$(jq -r '.status // "unknown"' pages-latest.json)"
            sha="$(jq -r '.commit // "unknown"' pages-latest.json)"
            echo "attempt=$attempt status=$status commit=$sha"
            case "$status" in
              built) break ;;
              errored) exit 1 ;;
            esac
            sleep 15
          done
          test "$status" = 'built'
          echo "status=$status" >> "$GITHUB_OUTPUT"
          jq -r '.commit // "unknown"' pages-latest.json | sed 's/^/commit=/' >> "$GITHUB_OUTPUT"

      - name: Verify deployed canonical and mirror URLs
        id: live
        shell: bash
        run: |
          set -euo pipefail
          root='https://wilcompute.github.io/W33-Theory/'
          mirror='https://wilcompute.github.io/W33-Theory/full-site-2026-08-06.html'
          for attempt in $(seq 1 40); do
            root_code="$(curl -sS -L -o root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$root?pages_receipt=${GITHUB_RUN_ID}-${attempt}")"
            mirror_code="$(curl -sS -L -o mirror.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$mirror?pages_receipt=${GITHUB_RUN_ID}-${attempt}")"
            root_blob="$(git hash-object --stdin < root.html)"
            mirror_blob="$(git hash-object --stdin < mirror.html)"
            echo "attempt=$attempt root=$root_code/$root_blob mirror=$mirror_code/$mirror_blob"
            if [ "$root_code" = 200 ] && [ "$mirror_code" = 200 ] && [ "$root_blob" = "$EXPECTED_INDEX_BLOB" ] && [ "$mirror_blob" = "$EXPECTED_INDEX_BLOB" ]; then
              echo "root_code=$root_code" >> "$GITHUB_OUTPUT"
              echo "root_blob=$root_blob" >> "$GITHUB_OUTPUT"
              echo "mirror_code=$mirror_code" >> "$GITHUB_OUTPUT"
              echo "mirror_blob=$mirror_blob" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Publish success receipt and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > receipt.md <<EOF
          Pages rebuild succeeded.

          - trigger: `${{ github.event_name }}`
          - configured source: `${{ steps.config.outputs.branch }}:${{ steps.config.outputs.path }}`
          - build type: `${{ steps.config.outputs.build_type }}`
          - source blob: `${{ steps.verify.outputs.actual_blob }}`
          - source size: `${{ steps.verify.outputs.bytes }}` bytes / `${{ steps.verify.outputs.lines }}` lines
          - latest build status: `${{ steps.poll.outputs.status }}`
          - latest build commit: `${{ steps.poll.outputs.commit }}`
          - public root: `${{ steps.live.outputs.root_code }}` / `${{ steps.live.outputs.root_blob }}`
          - public mirror: `${{ steps.live.outputs.mirror_code }}` / `${{ steps.live.outputs.mirror_blob }}`
          - workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh issue comment "$RECEIPT_ISSUE" --body-file receipt.md
          gh issue close "$RECEIPT_ISSUE" --reason completed

      - name: Publish failure receipt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > receipt.md <<EOF
          Pages rebuild did not verify successfully.

          - trigger: `${{ github.event_name }}`
          - configured source observed: `${{ steps.config.outputs.branch }}:${{ steps.config.outputs.path }}`
          - source blob observed: `${{ steps.verify.outputs.actual_blob }}`
          - workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The issue remains open because the live root and mirror were not both verified as the canonical long-form blob.
          EOF
          gh issue comment "$RECEIPT_ISSUE" --body-file receipt.md
