name: DISABLED legacy Pages source-switch recovery

# Historical tombstone. Pass 4241 intended to leave one publisher, but this recovery
# workflow still retained pages:write and POSTed /pages/builds. The supported artifact
# publisher is .github/workflows/pages-deploy.yml. Keep this inert file so old issue links
# retain an explanation without preserving a second deployment path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy Pages rebuild is disabled; use pages-deploy.yml."
