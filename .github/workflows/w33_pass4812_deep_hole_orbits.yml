name: W33 Pass 4812 deep-hole orbit exhaustion

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4812_h10_deep_hole_orbit_sat.py'
      - '.github/workflows/w33_pass4812_deep_hole_orbits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exhaust-deep-holes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx python-sat
      - name: Run quotient-SAT orbit sieve
        run: python analysis/w33_pass4812_h10_deep_hole_orbit_sat.py | tee pass4812.log
      - name: Commit frozen certificate
        run: |
          if git diff --quiet -- data/PART_W33_PASS4812_H10_DEEP_HOLE_ORBITS.json; then
            echo 'certificate unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/PART_W33_PASS4812_H10_DEEP_HOLE_ORBITS.json
          git commit -m 'Evidence bot: freeze Pass 4812 complete H10 deep-hole orbits'
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        with:
          name: pass4812-deep-hole-evidence
          path: |
            pass4812.log
            data/PART_W33_PASS4812_H10_DEEP_HOLE_ORBITS.json
