name: W33 Sept21 address versus operator H27 replay
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_address_operator_h27_roles.py'
      - 'tests/test_w33_address_operator_h27_roles.py'
      - '.github/workflows/w33_sept21_address_operator_h27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy networkx sympy pytest
      - run: PYTHONPATH=analysis:. python analysis/w33_address_operator_h27_roles.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_w33_address_operator_h27_roles.py
      - name: Freeze certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/w33_address_operator_h27_roles.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze address/operator H27 role certificate [skip ci]'
          git push origin HEAD:master
