name: W33 Pass 10950 clock Albert Lorentz spinor

on:
  push:
    paths:
      - "analysis/w33_pass10950_clock_albert_lorentz_spinor.py"
      - "analysis/w33_pass10949_freudenthal_quasiconformal_clock_cone.py"
      - "analysis/PASS10950_CLOCK_ALBERT_LORENTZ_SPINOR.md"
      - "analysis/PASS10950_CLOCK_ALBERT_LORENTZ_SPINOR_INSERT.tex"
      - "data/w33_pass10950_clock_albert_lorentz_spinor.json"
      - "tests/test_w33_pass10950_clock_albert_lorentz_spinor.py"
      - ".github/workflows/w33_pass10950_clock_albert_lorentz_spinor.yml"
  pull_request:
    paths:
      - "analysis/w33_pass10950_clock_albert_lorentz_spinor.py"
      - "data/w33_pass10950_clock_albert_lorentz_spinor.json"
      - "tests/test_w33_pass10950_clock_albert_lorentz_spinor.py"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest
      - run: python analysis/w33_pass10950_clock_albert_lorentz_spinor.py
      - run: python -m pytest -q tests/test_w33_pass10950_clock_albert_lorentz_spinor.py
