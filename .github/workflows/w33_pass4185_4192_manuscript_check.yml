name: Passes 4185-4192 manuscript compile check
on:
  push:
    paths:
      - 'analysis/BT4185_BT4192_adaptive_c2_hawking_hysteresis_3local_cover_holonomy_ihara_heat_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4185_4192_manuscript_check.yml'
  workflow_dispatch:
jobs:
  tectonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      - name: Compile manuscripts
        run: |
          mkdir -p /tmp/pass4185-4192
          for f in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs --keep-intermediates "$f" |& tee "/tmp/pass4185-4192/${f%.tex}.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pass4185-4192-manuscript-evidence
          path: |
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
            /tmp/pass4185-4192/*.log
