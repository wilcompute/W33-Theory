name: TOE84 H27 logical Clifford and modular clock
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe84_h27_logical_clifford.py'
      - 'data/w33_20261015_toe84_h27_logical_clifford.json'
      - 'data/w33_20261015_toe83_h27_square_css_surgery.json'
      - 'tests/test_w33_20261015_toe84_h27_logical_clifford.py'
      - '.github/workflows/w33_toe84_h27_logical_clifford.yml'
  pull_request:
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_w33_20261015_toe84_h27_logical_clifford.py
      - run: python analysis/w33_20261015_toe84_h27_logical_clifford.py
      - run: git diff --exit-code -- data/w33_20261015_toe84_h27_logical_clifford.json
