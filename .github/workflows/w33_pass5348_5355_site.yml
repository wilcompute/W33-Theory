name: W33 Pass5348-5355 homepage materializer
on:
  push:
    branches: [master]
    paths:
      - 'analysis/PASS5348_5355_index_insert.html'
      - 'tools/integrate_pass5348_5355_public.py'
      - '.github/workflows/w33_pass5348_5355_site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/integrate_pass5348_5355_public.py
      - name: Commit homepage insertion if needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Pass5348-5355 homepage card'
          git pull --rebase origin master
          git push origin HEAD:master
