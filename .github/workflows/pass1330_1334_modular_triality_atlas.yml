name: Passes 1330-1334 Modular Triality Atlas

on:
  push:
    branches:
      - agent/pass1330-1334-modular-triality-atlas
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - run: python analysis/w33_pass1330_1334_modular_triality_cycle_atlas.py
      - run: pytest -q tests/test_w33_pass1330_1334.py

  atlasrep-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y gap gap-atlasrep gap-character-tables gap-table-of-marks git
      - run: mkdir -p "$HOME/.gap/pkg" && git clone --depth 1 --branch v3.1.2 https://github.com/gap-packages/repsn.git "$HOME/.gap/pkg/repsn"
      - run: gap -q analysis/w33_pass1333_atlasrep_species20.g

  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science
      - run: python tools/integrate_pass1330_1334.py
      - run: python tools/integrate_pass1330_1334.py
      - run: test "$(grep -c '\\input{analysis/BT1330_BT1334_modular_triality_cycle_atlas}' w33_paper.tex)" -eq 1
      - run: test "$(grep -c '\\input{analysis/BT1330_BT1334_modular_triality_cycle_atlas}' photonic_holonet.tex)" -eq 1
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
