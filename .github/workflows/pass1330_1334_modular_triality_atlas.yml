name: Passes 1330-1334 Modular Triality Atlas

on:
  push:
    branches:
      - master
    # Scoped to its own inputs, matching the 294 other per-pass workflows.  Unscoped it
    # ran on every master push, and with two agents pushing reservation commits against
    # four concurrent runners that queue is what delayed the Pages deploy.
    paths:
      - 'analysis/w33_pass1330_1334_modular_triality_cycle_atlas.py'
      - 'analysis/w33_pass1333_atlasrep_species20.g'
      - 'data/w33_pass1330_1334_modular_triality_cycle_atlas.json'
      - 'data/w33_pass1333_atlasrep_species20.json'
      - 'tests/test_w33_pass1330_1334.py'
      - '.github/workflows/pass1330_1334_modular_triality_atlas.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Rebuild and compare the frozen combined certificate
        shell: bash
        run: |
          set -euo pipefail
          cp data/w33_pass1330_1334_modular_triality_cycle_atlas.json /tmp/pass1330_1334.expected.json
          python analysis/w33_pass1330_1334_modular_triality_cycle_atlas.py
          cmp /tmp/pass1330_1334.expected.json data/w33_pass1330_1334_modular_triality_cycle_atlas.json
      - run: pytest -q tests/test_w33_pass1330_1334.py

  atlasrep-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y gap gap-atlasrep gap-character-tables gap-table-of-marks
      - name: Install frozen Repsn 3.1.2 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gap/pkg/repsn"
          curl -LfsS https://github.com/gap-packages/repsn/archive/refs/tags/v3.1.2.tar.gz |
            tar -xz -C "$HOME/.gap/pkg/repsn" --strip-components=1
      - name: Run GAP/AtlasRep certificate and require completion marker
        shell: bash
        run: |
          set -euo pipefail
          cp data/w33_pass1333_atlasrep_species20.json /tmp/pass1333.expected.json
          gap -q analysis/w33_pass1333_atlasrep_species20.g | tee /tmp/pass1333-gap.log
          grep -qx 'PASS 1333 COMPLETE' /tmp/pass1333-gap.log
          python3 -m json.tool data/w33_pass1333_atlasrep_species20.json >/dev/null
          cmp /tmp/pass1333.expected.json data/w33_pass1333_atlasrep_species20.json

  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Require checked-in manuscript integration to be idempotent
        shell: bash
        run: |
          set -euo pipefail
          cp w33_paper.tex /tmp/w33_paper.expected.tex
          cp photonic_holonet.tex /tmp/photonic_holonet.expected.tex
          python tools/integrate_pass1330_1334.py
          python tools/integrate_pass1330_1334.py
          cmp /tmp/w33_paper.expected.tex w33_paper.tex
          cmp /tmp/photonic_holonet.expected.tex photonic_holonet.tex
      - run: test "$(grep -c '\\input{analysis/BT1330_BT1334_modular_triality_cycle_atlas}' w33_paper.tex)" -eq 1
      - run: test "$(grep -c '\\input{analysis/BT1330_BT1334_modular_triality_cycle_atlas}' photonic_holonet.tex)" -eq 1
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
