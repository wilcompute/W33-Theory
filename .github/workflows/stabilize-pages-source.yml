name: Stabilize W33 Pages source

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/stabilize-pages-source.yml'
      - 'docs/.pages-source-stabilize-*'
      - 'docs/.pages-source-switch-*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Move Pages to stable main/docs and request a build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headers = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10'
            };
            const before = (await github.request('GET /repos/{owner}/{repo}/pages', {
              owner, repo, headers
            })).data;
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner,
              repo,
              build_type: 'legacy',
              source: { branch: 'main', path: '/docs' },
              headers
            });
            let build;
            try {
              build = (await github.request('POST /repos/{owner}/{repo}/pages/builds', {
                owner, repo, headers
              })).data;
            } catch (error) {
              build = { request_error_status: error.status, request_error_message: error.message };
            }
            const after = (await github.request('GET /repos/{owner}/{repo}/pages', {
              owner, repo, headers
            })).data;
            const path = 'data/pages_source_switch.json';
            const payload = {
              schema: 'w33.pages_source_switch.v1',
              status: 'REQUESTED_STABLE_MAIN_DOCS_SOURCE',
              before: {
                build_type: before.build_type,
                source: before.source,
                status: before.status,
                html_url: before.html_url
              },
              after: {
                build_type: after.build_type,
                source: after.source,
                status: after.status,
                html_url: after.html_url
              },
              build,
              workflow_run_id: context.runId,
              trigger_sha: context.sha,
              switched_at: new Date().toISOString()
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: `Record stable Pages source switch ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
