name: Passes 11615-11619 parent pairs constraints

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11615_11619_parent_pairs_constraints.py'
      - 'analysis/PASS11615_11619_PARENT_PAIRS_CONSTRAINTS.md'
      - 'data/w33_pass11615_11619_parent_pairs_constraints.json'
      - 'tests/test_w33_pass11615_11619_parent_pairs_constraints.py'
      - '.github/workflows/pass11615-11619-parent-pairs-constraints.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy pytest
      - name: Regenerate ten source-bound investigations
        run: python analysis/w33_pass11615_11619_parent_pairs_constraints.py
      - name: Independent parent threshold constraint pair and gate audits
        run: python -m pytest --noconftest -q tests/test_w33_pass11615_11619_parent_pairs_constraints.py
