name: Passes 2430-2435 five frontiers
on:
  push:
    paths:
      - 'analysis/w33_pass2430*'
      - 'analysis/w33_pass2431*'
      - 'analysis/w33_pass2432*'
      - 'analysis/w33_pass2433*'
      - 'analysis/w33_pass2434*'
      - 'analysis/w33_pass2430_2435_verify_frozen.py'
      - 'analysis/cpp/w33_pass2432_signature_pair_obstruction.cpp'
      - 'data/w33_pass243*.json'
      - 'tests/test_w33_pass2430_2435.py'
      - '.github/workflows/pass2430_2435_five_frontiers.yml'
  pull_request:
permissions:
  contents: read
jobs:
  frozen-and-pair-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy networkx pytest
      - run: python analysis/w33_pass2430_2435_verify_frozen.py
      - run: pytest -q tests/test_w33_pass2430_2435.py
      - name: Reconstruct exact signature-pair obstruction
        run: |
          python analysis/w33_pass2432_signature_pair_input.py /tmp/pass2432.in
          g++ -O3 -std=c++17 analysis/cpp/w33_pass2432_signature_pair_obstruction.cpp -o /tmp/pass2432
          /tmp/pass2432 /tmp/pass2432.in | tee /tmp/pass2432.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pass2432.json'))
          assert d=={'fiber1_covers':11664,'fiber8_covers':288,'fiber1_nodes':90497,'fiber8_nodes':34014,'disjoint_pairs':0}
          PY
  c5-full-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy networkx
      - run: python analysis/w33_pass2434_c5_split_hom.py --full | tee /tmp/pass2434.json
      - run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pass2434.json'))
          assert d['Hom_dimension']==144
          assert d['coexact90_nonidentity_traces_mod101']==[0,0,0,0]
          assert d['E8_degree4_atlas_generator_characteristic_polynomial']==[1,1,1,1,1]
          PY
