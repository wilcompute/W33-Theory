name: Passes 11620-11624 covariant pair vacuum

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11620_11624_covariant_pair_vacuum.py'
      - 'analysis/PASS11620_11624_COVARIANT_PAIR_VACUUM.md'
      - 'data/w33_pass11620_11624_covariant_pair_vacuum.json'
      - 'tests/test_w33_pass11620_11624_covariant_pair_vacuum.py'
      - 'tests/test_w33_topical_full_file.py'
      - 'scripts/build_topical_aliases.py'
      - '.github/workflows/pass11620-11624-covariant-pair-vacuum.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy pytest
      - name: Audit committed integer certificates and twenty independent controls
        run: python -m pytest --noconftest -q tests/test_w33_pass11620_11624_covariant_pair_vacuum.py tests/test_w33_topical_full_file.py
      - name: Regenerate all five scoped investigations
        run: python analysis/w33_pass11620_11624_covariant_pair_vacuum.py
