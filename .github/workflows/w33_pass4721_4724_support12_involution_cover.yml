name: Passes 4721-4726 Support12 Involution Cover and H10 Dual
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4721_4724_support12_involution_square_root_cover.py'
      - 'analysis/w33_pass4725_4726_involution_residue_dual_code.py'
      - 'analysis/w33_pass4726_regulus_residue_falsifier.py'
      - 'analysis/PASS4721_4724_support12_involution_square_root_cover*'
      - 'analysis/PASS4725_4726_involution_residue_dual_code*'
      - 'analysis/PASS4725_4726_CODING_PRIOR_ART_BOUNDARY.md'
      - 'analysis/PASS1830_ERRATUM_PASS4722_LINE_ACTION.md'
      - 'data/PART_W33_PASS4721_4724_SUPPORT12_INVOLUTION_SQUARE_ROOT_COVER.json'
      - 'data/PART_W33_PASS4725_4726_INVOLUTION_RESIDUE_DUAL_CODE.json'
      - 'data/PART_W33_PASS4726_REGULUS_RESIDUE_FALSIFIER.json'
      - 'data/w33_public_frontier_extension_pass4461_4464.json'
      - 'docs/support12-involution-square-root-cover.html'
      - 'tests/test_w33_pass4721_4724_support12_involution_square_root_cover.py'
      - 'tests/test_w33_pass4725_4726_involution_residue_dual_code.py'
      - 'tests/test_w33_pass4726_regulus_residue_falsifier.py'
      - 'tools/integrate_pass4721_4724.py'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4721_4724_support12_involution_cover.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pass4721-4726-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-and-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Frozen regressions
        run: |
          pytest -q tests/test_w33_pass4721_4724_support12_involution_square_root_cover.py
          pytest -q tests/test_w33_pass4725_4726_involution_residue_dual_code.py
          pytest -q tests/test_w33_pass4726_regulus_residue_falsifier.py
      - name: Recompute exact certificates
        run: |
          python analysis/w33_pass4721_4724_support12_involution_square_root_cover.py | tee /tmp/pass4721_4724.log
          python analysis/w33_pass4725_4726_involution_residue_dual_code.py | tee /tmp/pass4725_4726.log
          python analysis/w33_pass4726_regulus_residue_falsifier.py | tee /tmp/pass4726_regulus.log
      - name: Re-run regressions after recomputation
        run: |
          pytest -q tests/test_w33_pass4721_4724_support12_involution_square_root_cover.py
          pytest -q tests/test_w33_pass4725_4726_involution_residue_dual_code.py
          pytest -q tests/test_w33_pass4726_regulus_residue_falsifier.py
      - name: Prior-art and erratum boundary checks
        run: |
          grep -q 'Haemers' analysis/PASS4725_4726_CODING_PRIOR_ART_BOUNDARY.md
          grep -q 'point positions' analysis/PASS1830_ERRATUM_PASS4722_LINE_ACTION.md
          grep -q 'not the BT794' analysis/w33_pass4726_regulus_residue_falsifier.py
      - name: Materialize theorem cards into index
        run: |
          python tools/integrate_pass4721_4724.py
          test "$(grep -c 'id=\"pass4721-4724-support12-involution-cover\"' docs/index.html)" -eq 1
          test "$(grep -c 'id=\"pass4725-4726-involution-residue-dual-code\"' docs/index.html)" -eq 1
          grep -q '540 K3' analysis/PASS4721_4724_support12_involution_square_root_cover_index_insert.html
          grep -q '\[40,30,4\]' analysis/PASS4725_4726_involution_residue_dual_code_index_insert.html
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "/tmp/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
      - name: Commit generated index if needed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo 'docs/index.html already materialized'
            exit 0
          fi
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Materialize Passes 4721-4726 theorem cards in index'
          git pull --rebase origin master
          git push origin HEAD:master
