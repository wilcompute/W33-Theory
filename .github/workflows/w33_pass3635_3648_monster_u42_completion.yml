name: Passes 3635-3648 Monster U42 Completion

on:
  push:
    branches: [master]
    paths:
      - 'analysis/*3635*'
      - 'analysis/*3648*'
      - 'data/PART_3635_3648*'
      - 'data/w33_pass_namespace_registry_v2.d/3635-3648.json'
      - 'tests/test_w33_pass3635_3648_monster_u42_completion.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/monster-u42-completion.html'
      - '.github/workflows/w33_pass3635_3648_monster_u42_completion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pass3635-3648-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-gap-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Recompute exact Python certificate
        run: |
          mkdir -p evidence/pass3635_3648
          cp data/PART_3635_3648_MONSTER_U42_COMPLETION_results.json evidence/pass3635_3648/frozen.json
          python analysis/w33_pass3635_3648_monster_u42_completion.py | tee evidence/pass3635_3648/exact.log
          grep -F 'PASS_3635_3648 cf276859798326def36c2bdc0e9fb75dbdadbbc44d69ba61cae24b5c82f40271' evidence/pass3635_3648/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('data/PART_3635_3648_MONSTER_U42_COMPLETION_results.json').read_text())
          frozen=json.loads(Path('evidence/pass3635_3648/frozen.json').read_text())
          assert generated == frozen
          assert generated['semantic_sha256'] == 'cf276859798326def36c2bdc0e9fb75dbdadbbc44d69ba61cae24b5c82f40271'
          print('PASS frozen exact certificate equality')
          PY
      - name: Focused regression
        run: |
          python -m pytest -q tests/test_w33_pass3635_3648_monster_u42_completion.py | tee evidence/pass3635_3648/pytest.log
          git diff --check
      - name: Enumerate Monster class fusions and degree-81 multiplicities
        run: |
          gap -q analysis/w33_pass3635_3648_monster_u42_restriction.g | tee evidence/pass3635_3648/gap.log
          grep -F 'PASS 3635-3648: Monster/U4(2) restriction census written' evidence/pass3635_3648/gap.log
          cp data/PART_3635_3648_MONSTER_U42_RESTRICTION_results.json evidence/pass3635_3648/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/PART_3635_3648_MONSTER_U42_RESTRICTION_results.json')
          data=json.loads(p.read_text())
          assert data['status']=='PASS_CHARACTER_TABLE_CENSUS'
          assert data['u42_order']==25920
          assert data['steinberg_degree']==81
          assert data['steinberg_regular_on_sylow3'] is True
          assert all(data['dimension_checks'])
          print('PASS GAP restriction JSON')
          PY
      - name: Verify frontier reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs == manifest['required_ordered_inputs']
          ours='analysis/BT3635_BT3648_monster_u42_completion_insert'
          assert inputs.count(ours)==1
          assert Path(ours+'.tex').is_file()
          assert Path('docs/monster-u42-completion.html').is_file()
          print('PASS manifest chronology and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3635_3648/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3635_3648/pdf_sha256.txt
      - name: Publish generated GAP certificate when permitted
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/PART_3635_3648_MONSTER_U42_RESTRICTION_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pass 3648: freeze Monster U4(2) restriction census'
            git push || echo 'Generated restriction certificate retained in workflow artifact; direct push was not permitted.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass3635-3648-monster-u42-completion-evidence
          path: |
            evidence/pass3635_3648/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
