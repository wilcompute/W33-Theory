name: double building Steinberg homology
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260901_double_building_steinberg_homology.py'
      - '.github/workflows/w33_20260901_double_building_steinberg_homology.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-double-building-steinberg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check networkx
      - name: Execute homology character audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260901_double_building_steinberg_homology.py 2>&1 | tee analysis/PASS_20260901_DOUBLE_BUILDING_STEINBERG_HOMOLOGY.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260901_DOUBLE_BUILDING_STEINBERG_HOMOLOGY.json').read_text())
          assert d.get('status')=='PASS'
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260901_DOUBLE_BUILDING_STEINBERG_HOMOLOGY.json analysis/PASS_20260901_DOUBLE_BUILDING_STEINBERG_HOMOLOGY.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze double-building Steinberg homology evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
