name: Passes 1500-1504 Manuscript Hook

on:
  pull_request:
    branches: [master]
    paths:
      - 'paper/sections/sec_complement_duality.tex'
      - 'paper/sections/sec_complement_duality_body.tex'
      - 'paper/sections/sec_bt1500_bt1504_five_frontiers.tex'
      - 'data/pass1500_1504_manuscript_hook_audit.json'
      - 'tests/test_pass1500_1504_manuscript_hook.py'

permissions:
  contents: read

jobs:
  verify-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_pass1500_1504_manuscript_hook.py
