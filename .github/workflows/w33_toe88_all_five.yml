name: TOE88 five H27 cohomology and adversarial quantum-circuit checks
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe88_*.py'
      - 'analysis/2026-10-15_toe88_five_followups.md'
      - 'data/w33_20261015_toe88_*.json'
      - 'tests/test_w33_20261015_toe88_all_five.py'
      - '.github/workflows/w33_toe88_all_five.yml'
  pull_request:
  workflow_dispatch:
jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy sympy scipy
      - run: python -m pytest -q tests/test_w33_20261015_toe88_all_five.py
      - run: python -m analysis.w33_20261015_toe88_tate_albert_bridge
      - run: python -m analysis.w33_20261015_toe88_parity_membranes
      - run: python -m analysis.w33_20261015_toe88_ancilla_syndrome
      - run: python -m analysis.w33_20261015_toe88_adaptive_mub
      - run: git diff --exit-code -- data/w33_20261015_toe88_tate_albert_bridge.json data/w33_20261015_toe88_parity_membranes.json data/w33_20261015_toe88_ancilla_syndrome.json
