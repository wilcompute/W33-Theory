name: W33 Pass5627-5634 physics stabilizer gauge RG

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5627_*'
      - 'analysis/w33_pass5628_*'
      - 'analysis/w33_pass5629_*'
      - 'analysis/w33_pass5630_*'
      - 'analysis/w33_pass5631_*'
      - 'analysis/w33_pass5632_*'
      - 'analysis/w33_pass5633_*'
      - 'analysis/w33_pass5634_*'
      - 'analysis/PASS5627_5634_*'
      - 'analysis/w33_pass5606_cover12_explicit_conjugator.g'
      - 'analysis/w33_pass5615_cover_f4_object_dictionary_gate.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'tests/test_w33_pass5627_5634_physics_stabilizer_gauge_rg.py'
      - 'data/w33_pass_namespace_registry_v2.d/5627-5634.json'
      - 'data/w33_publication_frontier_contract_v2.json'
      - '.github/workflows/w33_pass5627_5634_physics_stabilizer_gauge_rg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip numpy pytest
          sudo apt-get update -qq
          sudo apt-get install -y gap gap-grape

      - name: Rebuild F4 short-root-pair action
        run: python analysis/w33_pass5596_f4_rootpair_latin_action.py

      - name: Execute direct q5 moving12 action gate
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          rm -f data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json
          gap -q -b --nointeract analysis/w33_pass5606_cover12_explicit_conjugator.g
          test -s data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json
          python - <<'PY'
          import json
          p='data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json'
          x=json.load(open(p))
          assert x['cover12_order']==576
          assert x['latin12_order']==576
          assert len(x['moving_cover_vertices'])==12
          assert isinstance(x['fixed_cover_vertex'],int)
          if x['conjugate_in_S12']:
              assert sorted(x['cover12_to_latin'])==list(range(12))
              print('DIRECT_Q5_MOVING12_GATE=CONFIRMED')
          else:
              assert x['cover12_to_latin'] is None
              print('DIRECT_Q5_MOVING12_GATE=REFUTED')
          PY

      - name: Compose explicit cover to F4 dictionary when gate is positive
        run: |
          python - <<'PY'
          import json, subprocess, sys
          x=json.load(open('data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json'))
          if x['conjugate_in_S12']:
              subprocess.run([sys.executable,'analysis/w33_pass5615_cover_f4_object_dictionary_gate.py'],check=True)
              y=json.load(open('data/PART_W33_PASS5615_COVER_F4_OBJECT_DICTIONARY.json'))
              assert y['status']=='EXPLICIT_COVER_TO_F4_OBJECT_DICTIONARY'
              assert len(y['cover_vertex_to_F4_short_root_pair_index'])==12
          else:
              print('Skipping object dictionary: direct degree-12 action was refuted, not operationally broken.')
          PY

      - name: Replay Pass5627-5634
        run: python analysis/w33_pass5627_5634_runner.py

      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5627_5634_physics_stabilizer_gauge_rg.py

      - name: Materialize homepage and audit publication DAG
        run: |
          python tools/integrate_bt3376_bt3389.py --report /tmp/public-integration.json
          python analysis/w33_pass5364_publication_dag_audit.py --report /tmp/publication-dag.json
          test "$(grep -c 'id=\"pass-5627-5634-physics-stabilizer-gauge-rg\"' docs/index.html)" -eq 1
          git diff --check

      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass5627_5634
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5627_5634/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5627_5634/pdf_sha256.txt

      - name: Freeze regenerated certificates and homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/PART_W33_PASS5596_F4_ROOTPAIR_LATIN_ACTION.json \
            data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json \
            data/PART_W33_PASS5627_DECK_STABILIZER_SPINOR_NO_GO.json \
            data/PART_W33_PASS5628_E6_GAUGE_ACTION_TWO_COUPLING_NO_GO.json \
            data/PART_W33_PASS5629_CONNECTED_COVER_TOWER_OBSTRUCTION.json \
            data/PART_W33_PASS5630_DECK_BDG_COMMUTANT_MASS_RATIO.json \
            data/PART_W33_PASS5631_Q5_FIXED_LINE_CROSSQ_MODULE_GATE.json \
            data/PART_W33_PASS5632_PIN_BDG_SPIN_STATISTICS_NO_GO.json \
            data/PART_W33_PASS5633_BAD9_GAUGE_GENERATOR_NOT_BOSON.json \
            data/PART_W33_PASS5634_SHEET_DECIMATION_RESOLVENT_RG.json \
            docs/index.html
          if test -f data/PART_W33_PASS5615_COVER_F4_OBJECT_DICTIONARY.json; then
            git add data/PART_W33_PASS5615_COVER_F4_OBJECT_DICTIONARY.json
          fi
          if git diff --cached --quiet; then
            echo 'Certificates and homepage already materialized.'
          else
            git commit -m 'Freeze Pass5627-5634 certificates and homepage [skip ci]'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pass5627-5634-physics-stabilizer-gauge-rg
          path: evidence/pass5627_5634/**
