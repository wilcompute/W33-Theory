name: W33 Pass7138-7145 C2 normal form matrix quotient

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7138_7145_c2_normalform_matrix_quotient.py'
      - 'tests/test_w33_pass7138_7145_c2_normalform_matrix_quotient.py'
      - '.github/workflows/w33_pass7138_7145_c2_normalform_matrix_quotient.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: python -m pip install --upgrade pip pytest numpy networkx
      - name: Replay exact producer
        run: python analysis/w33_pass7138_7145_c2_normalform_matrix_quotient.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass7138_7145_c2_normalform_matrix_quotient.py
      - name: Freeze regenerated certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/PART_W33_PASS7138_7145_C2_NORMALFORM_MATRIX_QUOTIENT.json
          if git diff --cached --quiet; then
            echo 'Certificate already canonical.'
          else
            git commit -m 'Pass7138-7145: freeze regenerated exact certificate [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
