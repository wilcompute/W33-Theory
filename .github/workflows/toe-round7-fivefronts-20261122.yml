name: TOE Witting round7 H27 code mediator vacuum causal four layers
on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_round7_*.py'
      - 'data/toe_20261122_round7_*.json'
      - 'tests/test_toe_20261122_round7_fivefronts.py'
      - '.github/workflows/toe-round7-fivefronts-20261122.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy sympy networkx pytest
      - name: Run 16 new plus 13 prior regressions
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: analysis
        run: python -m pytest -q tests/test_toe_20261122_round7_fivefronts.py tests/test_toe_20261122_round6_five_and_more.py
      - name: Regenerate exact result certificates
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: analysis
        run: |
          python analysis/toe_20261122_round7_mic_orbits.py
          python analysis/toe_20261122_round7_mic_optics_symmetry.py
          python analysis/toe_20261122_round7_h27_subsystem_code.py
          python analysis/toe_20261122_round7_h27_mediator_vacuum.py
          python analysis/toe_20261122_round7_w33_three_layer_hasse.py
          python analysis/toe_20261122_round7_coordinate_compiler.py
      - name: Check certificate invariants
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('data')
          for file in sorted(d.glob('toe_20261122_round7_*.json')):
              x=json.loads(file.read_text())
              assert x.get('status','').startswith('PASS_'),file
          assert json.loads((d/'toe_20261122_round7_mic_orbits.json').read_text())['support_orbit_size']==648
          assert json.loads((d/'toe_20261122_round7_mic_optics_symmetry.json').read_text())['minimize_gate_count_then_maximize_survival']['gates']==51
          assert json.loads((d/'toe_20261122_round7_h27_subsystem_code.json').read_text())['logical_code_dimension']==9
          assert json.loads((d/'toe_20261122_round7_h27_mediator_vacuum.json').read_text())['full_15x15_Hessian_rank']==14
          assert json.loads((d/'toe_20261122_round7_w33_three_layer_hasse.json').read_text())['four_layer_Hasse_covers']==160
          print('PASS round-seven standalone certificates')
          PY
