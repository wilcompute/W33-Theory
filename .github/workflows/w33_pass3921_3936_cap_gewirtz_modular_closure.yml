name: Passes 3921-3936 Cap Gewirtz Modular Closure

on:
  pull_request:
    paths:
      - 'analysis/bt3921_3936_cap_gewirtz_modular_closure.py'
      - 'analysis/_bt3921_3936_payload_*.txt'
      - 'analysis/BT3921_BT3936_cap_gewirtz_modular_closure*'
      - 'data/PART_BT3921_BT3936_CAP_GEWIRTZ_MODULAR_CLOSURE_results.json'
      - 'data/BT3921_BT3936_CLAIMS_LEDGER.json'
      - 'data/w33_pass_namespace_registry_v2.d/3921-3936.json'
      - 'tests/test_bt3921_3936_cap_gewirtz_modular_closure.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/cap-gewirtz-modular-closure-3921-3936.html'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass3921_3936_cap_gewirtz_modular_closure.yml'
  workflow_dispatch:

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy networkx pytest
      - run: pytest -q tests/test_bt3921_3936_cap_gewirtz_modular_closure.py
      - name: Check theorem reachability and live boundaries
        run: |
          grep -F 'BT3921_BT3936_cap_gewirtz_modular_closure_insert' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          grep -F '5dafbb5aa12c8166e7fad1568b566cdca8bdb8800a147a023fe062cc0315c64b' docs/cap-gewirtz-modular-closure-3921-3936.html
          grep -F '"cubic_transversal":[106,172]' data/PART_BT3921_BT3936_CAP_GEWIRTZ_MODULAR_CLOSURE_results.json
          grep -F '"covering_radius":[389,435]' data/PART_BT3921_BT3936_CAP_GEWIRTZ_MODULAR_CLOSURE_results.json

  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - run: |
          tectonic w33_paper.tex
          tectonic photonic_holonet.tex
          tectonic holonet_machine_blueprint.tex
      - uses: actions/upload-artifact@v4
        with:
          name: pass3921-3936-canonical-pdfs
          path: |
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
