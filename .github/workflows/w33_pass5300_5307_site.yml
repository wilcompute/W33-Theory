name: W33 Pass5300-5307 homepage materializer
on:
  push:
    paths:
      - 'analysis/PASS5300_5307_index_insert.html'
      - 'tools/integrate_pass5300_5307_public.py'
      - '.github/workflows/w33_pass5300_5307_site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/integrate_pass5300_5307_public.py
      - name: Commit materialized homepage card
        run: |
          if git diff --quiet -- index.html docs/index.html; then
            echo 'Already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/index.html
          git commit -m 'Materialize Pass5300-5307 homepage card'
          git push
