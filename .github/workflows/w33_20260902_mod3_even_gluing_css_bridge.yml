name: mod3 even gluing CSS bridge
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260902_mod3_even_gluing_css_bridge.py'
      - '.github/workflows/w33_20260902_mod3_even_gluing_css_bridge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-mod3-even-gluing-css-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute bridge audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260902_mod3_even_gluing_css_bridge.py 2>&1 | tee analysis/PASS_20260902_MOD3_EVEN_GLUING_CSS_BRIDGE.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260902_MOD3_EVEN_GLUING_CSS_BRIDGE.json').read_text())
          assert d.get('status')=='PASS'
          assert d['mod3']['evenImagesEqual']
          assert d['mod3']['evenOddCombinedRank']==162
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260902_MOD3_EVEN_GLUING_CSS_BRIDGE.json analysis/PASS_20260902_MOD3_EVEN_GLUING_CSS_BRIDGE.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze mod3 outer-parity gluing and CSS bridge'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
