name: Passes 3813-3820 quadratic discriminant multiport holonomy

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass3813_3820_quadratic_discriminant_multiport_holonomy.py'
      - 'analysis/w33_pass3817_monster_seed_compression_harness.py'
      - 'analysis/BT3813_BT3820_quadratic_discriminant_multiport_holonomy*'
      - 'data/PART_3813_3820_QUADRATIC_DISCRIMINANT_MULTIPORT_HOLONOMY_results.json'
      - 'tests/test_w33_pass3813_3820_quadratic_discriminant_multiport_holonomy.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/index.html'
      - 'docs/quadratic-discriminant-multiport-holonomy.html'
      - '.github/workflows/w33_pass3813_3820_quadratic_discriminant_multiport_holonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - run: python analysis/w33_pass3813_3820_quadratic_discriminant_multiport_holonomy.py --check data/PART_3813_3820_QUADRATIC_DISCRIMINANT_MULTIPORT_HOLONOMY_results.json
      - run: pytest -q tests/test_w33_pass3813_3820_quadratic_discriminant_multiport_holonomy.py
      - run: python -m py_compile analysis/w33_pass3817_monster_seed_compression_harness.py
      - run: grep -Fq '\input{analysis/BT3813_BT3820_quadratic_discriminant_multiport_holonomy_insert}%' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
      - run: grep -Fq 'bt3813-3820-quadratic-discriminant-multiport-holonomy' docs/index.html

  canonical-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: exact-python
    strategy:
      matrix:
        paper: [w33_paper.tex, photonic_holonet.tex, holonet_machine_blueprint.tex]
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - run: tectonic --keep-logs --keep-intermediates "${{ matrix.paper }}"
