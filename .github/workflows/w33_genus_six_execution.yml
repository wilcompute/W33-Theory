name: Genus six execution certificate
on:
  push:
    paths:
      - 'analysis/w33_genus_six*'
      - 'analysis/w33_k12_genus_polarization*'
      - 'tests/test_genus_six_execution.py'
      - '.github/workflows/w33_genus_six_execution.yml'
  pull_request:
    paths:
      - 'analysis/w33_genus_six*'
      - 'analysis/w33_k12_genus_polarization*'
      - 'tests/test_genus_six_execution.py'
  workflow_dispatch:
jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy sympy mpmath pytest
      - name: Replay exact and numerical certificates
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest --noconftest --rootdir=. -o addopts='' tests/test_genus_six_execution.py -q
