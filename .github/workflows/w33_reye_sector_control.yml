name: Reye sector control completion
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_reye_sector_control.py'
      - 'data/w33_e7_d4_presymplectic_reye_normal_form.json'
      - '.github/workflows/w33_reye_sector_control.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Exhaustive control minimality and coherent pulse checks
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python analysis/w33_reye_sector_control.py
