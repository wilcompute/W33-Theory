name: W33 Sept21 E8 Pauli243 projective W33 replay
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_e8_pauli243_projective_w33_bridge.py'
      - 'tests/test_w33_e8_pauli243_projective_w33_bridge.py'
      - '.github/workflows/w33_sept21_e8_pauli243_w33.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy pytest
      - run: PYTHONPATH=. python analysis/w33_e8_pauli243_projective_w33_bridge.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_w33_e8_pauli243_projective_w33_bridge.py
      - name: Freeze certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/w33_e8_pauli243_projective_w33_bridge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze E8 Pauli243 W33 replay certificate [skip ci]'
          git push origin HEAD:master
