name: Pass11970-11974 native dynamical targets
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1197[0-4]_*.py'
      - 'data/w33_pass1197[0-4]_*.json'
      - 'tests/test_w33_pass11970_11974_native_dynamical_targets.py'
      - '.github/workflows/pass11970-11974-native-dynamical-targets.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 mpmath==1.3.0 pytest==8.4.2
      - name: Frozen certificate controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11970_11974_native_dynamical_targets.py
      - name: Regenerate every target
        run: |
          python analysis/w33_pass11970_native_wilson_dirac.py
          python analysis/w33_pass11971_frustrated_family_vacuum.py
          python analysis/w33_pass11972_native_tetrahedron_link_audit.py
          python analysis/w33_pass11973_mediation_transmission.py
          python analysis/w33_pass11974_coupled_patch_matter.py
      - name: Regenerated certificate controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11970_11974_native_dynamical_targets.py
