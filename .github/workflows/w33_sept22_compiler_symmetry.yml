      - 'analysis/PASS20260923_dark_strange_hybrid81_insert.tex'
      - 'analysis/W33_SHARED_FRONTIER_TAIL.tex'
      - 'tests/test_w33_address_operator_h27_intertwiner_obstruction.py'
      - 'tests/test_w33_scheduler_operator_k81_intertwiner_obstruction.py'
      - 'tests/test_w33_maximal_compiler_symmetry_pappus.py'
