      - 'tests/test_w33_shared_frontier_tail_integrity.py'
      - '.github/workflows/w33_sept22_compiler_symmetry.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip networkx sympy pytest
      - name: exact replay suite
        run: >-
          python -m pytest -q
          tests/test_w33_address_operator_h27_intertwiner_obstruction.py
          tests/test_w33_scheduler_operator_k81_intertwiner_obstruction.py
          tests/test_w33_maximal_compiler_symmetry_pappus.py
          tests/test_w33_hesse36_compiler36_sl23_obstruction.py
          tests/test_w33_hesse36_q8_equivariant_repair.py
          tests/test_w33_hesse36_fourier_twisted_compiler.py
          tests/test_w33_hesse36_full_clifford648_fourier_compiler.py
          tests/test_w33_hesse36_e8_matter81_root_lift_boundary.py
          tests/test_w33_hesse36_compiler_gauge_selector_audit.py
          tests/test_w33_hesse36_photonic_fourier_schedule.py
          tests/test_w33_hesse_pappus_45_270_instruction_compiler.py
          tests/test_w33_hesse36_e8_matter81_dark8_decomposition.py
          tests/test_w33_hesse36_physical_fi_orientation_selector.py
          tests/test_w33_hesse36_dark_schrodinger_strange_state.py
          tests/test_w33_e8_matter81_hybrid_cubic_dark_basis.py
          tests/test_w33_shared_frontier_tail_integrity.py
      - name: frozen certificates unchanged
        run: >-
          git diff --exit-code --
          data/w33_address_operator_h27_intertwiner_obstruction.json
          data/w33_scheduler_operator_k81_intertwiner_obstruction.json
          data/w33_maximal_compiler_symmetry_pappus.json
          data/w33_hesse36_compiler36_sl23_obstruction.json
          data/w33_hesse36_q8_equivariant_repair.json
          data/w33_hesse36_fourier_twisted_compiler.json
          data/w33_hesse36_full_clifford648_fourier_compiler.json
          data/w33_hesse36_e8_matter81_root_lift_boundary.json
          data/w33_hesse36_compiler_gauge_selector_audit.json
          data/w33_hesse36_photonic_fourier_schedule.json
          data/w33_hesse_pappus_45_270_instruction_compiler.json
          data/w33_hesse36_e8_matter81_dark8_decomposition.json
          data/w33_hesse36_physical_fi_orientation_selector.json
          data/w33_hesse36_dark_schrodinger_strange_state.json
          data/w33_e8_matter81_hybrid_cubic_dark_basis.json
