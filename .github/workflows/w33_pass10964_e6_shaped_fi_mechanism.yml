name: W33 Pass 10964 E6-shaped FI mechanism

on:
  push:
    paths:
      - "analysis/w33_pass10964_e6_shaped_fi_mechanism.py"
      - "analysis/PASS10964_E6_SHAPED_FI_MECHANISM.md"
      - "analysis/PASS10964_E6_SHAPED_FI_MECHANISM_INSERT.tex"
      - "data/w33_pass10964_e6_shaped_fi_mechanism.json"
      - "tests/test_w33_pass10964_e6_shaped_fi_mechanism.py"
      - ".github/workflows/w33_pass10964_e6_shaped_fi_mechanism.yml"
  pull_request:
    paths:
      - "analysis/w33_pass10964_e6_shaped_fi_mechanism.py"
      - "tests/test_w33_pass10964_e6_shaped_fi_mechanism.py"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy sympy pytest pycddlib
      - run: python analysis/w33_pass10964_e6_shaped_fi_mechanism.py
      - run: python -m pytest -q tests/test_w33_pass10964_e6_shaped_fi_mechanism.py
