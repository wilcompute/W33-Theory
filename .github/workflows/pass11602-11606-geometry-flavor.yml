name: Passes 11602-11606 geometry and flavor completion

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11602_11606_geometry_flavor_completion.py'
      - 'tests/test_w33_pass11602_11606_geometry_flavor_completion.py'
      - 'data/w33_pass11602_11606_geometry_flavor_completion.json'
      - '.github/workflows/pass11602-11606-geometry-flavor.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy pytest
      - name: Regenerate nine source-bound investigations
        run: python -u analysis/w33_pass11602_11606_geometry_flavor_completion.py
      - name: Independent operator geometry orbit inventory and seesaw regressions
        run: python -m pytest --noconftest -q tests/test_w33_pass11602_11606_geometry_flavor_completion.py
