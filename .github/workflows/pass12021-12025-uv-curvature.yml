name: Pass12021-12025 UV curvature thresholds holonomy
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12021_12025_uv_curvature_threshold_holonomy.py'
      - 'tests/test_w33_pass12021_12025_uv_curvature_threshold_holonomy.py'
      - '.github/workflows/pass12021-12025-uv-curvature.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen new and prior controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12021_12025_uv_curvature_threshold_holonomy.py tests/test_w33_pass12016_12020_neutrino_vacuum_native_measure.py
      - name: Regenerate five-front certificate
        run: python analysis/w33_pass12021_12025_uv_curvature_threshold_holonomy.py
      - name: Regenerated controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12021_12025_uv_curvature_threshold_holonomy.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass12021-12025-uv-curvature
          path: data/w33_pass12021_12025_uv_curvature_threshold_holonomy.json
