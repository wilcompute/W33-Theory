name: mod3 outer sign factorization
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260902_mod3_outer_sign_factorization.py'
      - '.github/workflows/w33_20260902_mod3_outer_sign_factorization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact factorization
        run: |
          set -o pipefail
          python analysis/w33_20260902_mod3_outer_sign_factorization.py 2>&1 | tee analysis/MOD3_OUTER_SIGN_FACTORIZATION.log
      - name: Freeze evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260902_MOD3_OUTER_SIGN_FACTORIZATION.json').read_text())
          assert d['status']=='PASS'
          assert d['factorization']['uniformRelativeInjectionFactor']==-1
          assert d['factorization']['verifiedForAllThreePrimitives'] is True
          PY
          git config user.name w33-evidence-bot
          git config user.email w33-evidence-bot@users.noreply.github.com
          git add -f data/PART_W33_20260902_MOD3_OUTER_SIGN_FACTORIZATION.json analysis/MOD3_OUTER_SIGN_FACTORIZATION.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze mod3 outer sign factorization evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
