name: W33 Sept21 trinification Pauli243 exact replay

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_e8_trinification_two_qutrit_pauli243.py'
      - 'tests/test_w33_e8_trinification_two_qutrit_pauli243.py'
      - '.github/workflows/w33_sept21_trinification_pauli243.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Replay trinification Pauli243 theorem
        run: PYTHONPATH=. python analysis/w33_e8_trinification_two_qutrit_pauli243.py
      - name: Focused regression
        run: PYTHONPATH=. python -m pytest -q tests/test_w33_e8_trinification_two_qutrit_pauli243.py
      - name: Freeze generated certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/w33_e8_trinification_two_qutrit_pauli243.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze trinification Pauli243 replay certificate [skip ci]'
          git push origin HEAD:master
