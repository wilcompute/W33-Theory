name: Frontier Continuation 20260829

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260829_pg34_subgroup_zero_split_v3.py'
      - 'analysis/w33_20260829_c3_cover_dark20_descent.py'
      - 'analysis/w33_20260829_qplate_radial_recenter_surrogate.py'
      - 'analysis/w33_20260830_a5_s4_exact_ceiling.py'
      - 'analysis/w33_20260830_s4_a4_rank_transition.py'
      - 'analysis/w33_20260830_c3_dark20_character_split.py'
      - 'analysis/w33_20260830_s4_six_circuit_conjugacy.py'
      - 'analysis/w33_20260830_clifford_c3_lift_charge.py'
      - 'analysis/w33_20260830_clifford_c3_order3_orbits.py'
      - 'analysis/w33_20260830_clifford_c3_fibre_stabilizer_geometry.py'
      - 'analysis/w33_20260830_c5_c6_coherent_incidence.py'
      - 'analysis/w33_20260830_c5_c6_bicolour_spectral_algebra.py'
      - 'analysis/w33_20260830_circuit24_clifford_line_module.py'
      - 'analysis/w33_20260830_code_ladder_duals_macwilliams.py'
      - 'analysis/w33_20260830_pg34_polarity_smith_filtration.py'
      - 'analysis/w33_20260831_all5_frontier_audit.py'
      - 'analysis/w33_20260831_a20_directed_orbital_refinement.py'
      - 'analysis/w33_20260831_all5_frontier_freeze.py'
      - 'analysis/w33_20260831_common_colour_60_sector_test.py'
      - 'analysis/w33_20260831_c5_wedderburn_kernel.py'
      - 'analysis/w33_20260831_incidence_2adic_snf.py'
      - 'analysis/w33_20260831_eisenstein_dark20_intertwiner.py'
      - 'analysis/w33_20260831_second5_frontier_freeze.py'
      - 'data/PART_W33_20260831_ALL5_FRONTIER_KEY_RESULTS.json'
      - 'data/PART_W33_20260831_SECOND_FIVE_FRONTIER_KEY_RESULTS.json'
      - '.github/workflows/frontier-continuation-20260829.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact-analysis dependencies
        run: python -m pip install sympy numpy
      - name: Repair subgroup rank witnesses
        run: python analysis/w33_20260829_pg34_subgroup_zero_split_v3.py
      - name: Close A5 and S4 exact ceilings
        run: python analysis/w33_20260830_a5_s4_exact_ceiling.py
      - name: Explain the S4 to A4 full-rank transition
        run: python analysis/w33_20260830_s4_a4_rank_transition.py
      - name: Split dark20 across the nonsplit central C3 cover
        run: python analysis/w33_20260829_c3_cover_dark20_descent.py
      - name: Refine dark20 into C3 characters
        run: python analysis/w33_20260830_c3_dark20_character_split.py
      - name: Test exact conjugacy of the two S4 carriers
        run: python analysis/w33_20260830_s4_six_circuit_conjugacy.py
      - name: Classify local C3 lift charges
        run: python analysis/w33_20260830_clifford_c3_lift_charge.py
      - name: Resolve affine order-three C3 obstruction orbits
        run: python analysis/w33_20260830_clifford_c3_order3_orbits.py
      - name: Resolve C3 species on the 72 Clifford circuit fibres
        run: python analysis/w33_20260830_clifford_c3_fibre_stabilizer_geometry.py
      - name: Build the 216 by 540 circuit coherent incidence geometry
        run: python analysis/w33_20260830_c5_c6_coherent_incidence.py
      - name: Resolve the bicolour circuit spectral algebra
        run: python analysis/w33_20260830_c5_c6_bicolour_spectral_algebra.py
      - name: Identify the 24-sector Clifford line module
        run: python analysis/w33_20260830_circuit24_clifford_line_module.py
      - name: Execute all five circuit frontier audits
        run: python analysis/w33_20260831_all5_frontier_audit.py
      - name: Resolve the common colour 60-space
        run: python analysis/w33_20260831_common_colour_60_sector_test.py
      - name: Resolve the C5 Wedderburn algebra and 324-kernel
        run: python analysis/w33_20260831_c5_wedderburn_kernel.py
      - name: Resolve complete incidence 2-adic Smith forms
        run: python analysis/w33_20260831_incidence_2adic_snf.py
      - name: Resolve the Eisenstein dark20 six-sector intertwiner
        run: python analysis/w33_20260831_eisenstein_dark20_intertwiner.py
      - name: Resolve the directed orbital hidden inside A20
        run: python analysis/w33_20260831_a20_directed_orbital_refinement.py
      - name: Freeze all-five frontier invariants
        run: python analysis/w33_20260831_all5_frontier_freeze.py
      - name: Freeze second-five frontier invariants
        run: python analysis/w33_20260831_second5_frontier_freeze.py
      - name: Close the adjacency-sentinel dual code ladder
        run: python analysis/w33_20260830_code_ladder_duals_macwilliams.py
      - name: Resolve the PG34 polarity Smith filtration
        run: python analysis/w33_20260830_pg34_polarity_smith_filtration.py
      - name: Quantify q-plate radial/recenter surrogate
        run: python analysis/w33_20260829_qplate_radial_recenter_surrogate.py
