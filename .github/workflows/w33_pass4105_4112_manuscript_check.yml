name: Passes 4105-4112 manuscript check
on:
  push:
    paths:
      - 'analysis/BT4105_BT4112_carrier_reference_netlist_decoder_turing_bonkers_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4105_4112_manuscript_check.yml'
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error holonet_machine_blueprint.tex
