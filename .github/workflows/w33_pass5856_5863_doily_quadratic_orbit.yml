name: W33 Pass5856-5863 doily quadratic orbit
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5856_5862_doily_quadratic_orbits.py'
      - 'data/PART_W33_PASS5856_5862_DOILY_QUADRATIC_ORBITS.json'
      - 'tests/test_w33_pass5856_5863_doily_quadratic_orbits.py'
      - 'analysis/PASS5856_5863_doily_quadratic_orbit_insert.tex'
      - 'analysis/PASS5856_5863_index_insert.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'tools/materialize_pass5856_5863_doily_quadratic_orbit.py'
      - '.github/workflows/w33_pass5856_5863_doily_quadratic_orbit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pytest
      - name: Exact replay
        run: python analysis/w33_pass5856_5862_doily_quadratic_orbits.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5856_5863_doily_quadratic_orbits.py
      - name: Materialize public card
        run: |
          python tools/materialize_pass5856_5863_doily_quadratic_orbit.py
          test "$(grep -c 'id=\"pass-5856-5863-doily-quadratic-orbit\"' docs/index.html)" -eq 1
          test "$(grep -c 'id=\"pass-5856-5863-doily-quadratic-orbit\"' index.html)" -eq 1
          grep -Fq '\input{analysis/PASS5856_5863_doily_quadratic_orbit_insert}' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass5856_5863
          for s in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$s" 2>&1 | tee "evidence/pass5856_5863/${s%.tex}.log"
            test -s "${s%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5856_5863/pdf_sha256.txt
      - name: Freeze homepage if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html index.html data/PART_W33_PASS5856_5862_DOILY_QUADRATIC_ORBITS.json
          if ! git diff --cached --quiet; then git commit -m 'Materialize Pass5856-5863 doily orbit [skip ci]'; git push origin master; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass5856-5863-doily-quadratic-orbit
          path: evidence/pass5856_5863/**
