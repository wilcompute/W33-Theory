name: Passes 971-975 clean bootstrap
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/pass971_975_bootstrap.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import audited sources and renumber collision-free
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/pass871-875-compute agent/pass871-875-release
          python - <<'PY'
          import subprocess
          from pathlib import Path
          pairs=[(871,971,'atlas_standard_conjugacy'),(872,972,'heisenberg_loewy_basis'),(873,973,'scalar_schur_factor_set'),(874,974,'adaptive_audit_regret_game'),(875,975,'hardware_phase_dispatcher')]
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def renumber(s):
              for old,new,_ in pairs: s=s.replace(f'pass{old}',f'pass{new}').replace(f'Pass {old}',f'Pass {new}')
              return s.replace('871-875','971-975').replace('871–875','971–975')
          for old,new,name in pairs:
              Path(f'analysis/w33_pass{new}_{name}.py').write_text(renumber(show('origin/agent/pass871-875-compute',f'analysis/w33_pass{old}_{name}.py')))
          Path('analysis/BT971_975_five_frontier_release.md').write_text(renumber(show('origin/agent/pass871-875-release','analysis/BT871_875_five_frontier_release.md')))
          Path('tests/test_w33_pass971_975.py').write_text(renumber(show('origin/agent/pass871-875-release','tests/test_w33_pass871_875.py')))
          PY
      - run: python -m pip install --disable-pip-version-check numpy scipy sympy pytest
      - name: Regenerate and verify every certificate
        run: |
          python analysis/w33_pass971_atlas_standard_conjugacy.py
          python analysis/w33_pass972_heisenberg_loewy_basis.py
          python analysis/w33_pass973_scalar_schur_factor_set.py
          python analysis/w33_pass974_adaptive_audit_regret_game.py
          python analysis/w33_pass975_hardware_phase_dispatcher.py
          python analysis/w33_pass971_atlas_standard_conjugacy.py --check
          python analysis/w33_pass972_heisenberg_loewy_basis.py --check
          python analysis/w33_pass973_scalar_schur_factor_set.py --check
          python analysis/w33_pass974_adaptive_audit_regret_game.py --check
          python analysis/w33_pass975_hardware_phase_dispatcher.py --check
          python -m compileall -q analysis/w33_pass97*.py
          python -m pytest -q tests/test_w33_pass971_975.py
      - name: Commit final release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'w33-release[bot]'
          git config user.email 'w33-release[bot]@users.noreply.github.com'
          git add analysis/w33_pass971_*.py analysis/w33_pass972_*.py analysis/w33_pass973_*.py analysis/w33_pass974_*.py analysis/w33_pass975_*.py analysis/BT971_975_five_frontier_release.md tests/test_w33_pass971_975.py data/w33_pass971_*.json data/w33_pass972_*.json data/w33_pass973_*.json data/w33_pass974_*.json data/w33_pass975_*.json hardware/w33_phase_dispatcher.h hardware/w33_phase_dispatcher.sv hardware/w33_phase_rom.mem
          git commit -m 'Passes 971-975: audited five-frontier release'
          git push origin HEAD:${{ github.head_ref }}
