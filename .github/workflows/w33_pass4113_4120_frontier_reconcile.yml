name: Passes 4113-4120 Protected Frontier Reconcile
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_pass4113_4120_frontier.py'
      - 'analysis/BT4113_BT4120_gauge_horizon_dimension_scar_curvature_insert.tex'
      - 'analysis/BT4113_BT4120_gauge_horizon_dimension_scar_curvature_index_insert.html'
      - 'docs/gauge-horizon-dimension-scar-curvature-4113-4120.html'
      - '.github/workflows/w33_pass4113_4120_frontier_reconcile.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pass4113-4120-frontier, cancel-in-progress: false}
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass4113_4120_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4113_4120_FRONTIER 1 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit manifest reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/w33_current_frontier_manifest_v1.json analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 4120: reconcile gauge horizon dimension scar curvature public frontier'
          git pull --rebase origin master
          git push
