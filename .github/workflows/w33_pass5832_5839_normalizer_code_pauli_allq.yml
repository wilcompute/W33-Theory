name: W33 Pass5832-5839 normalizer code Pauli all-field frontier

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5832_5839_normalizer_code_pauli_allq.py'
      - 'analysis/BT5832_BT5839_normalizer_code_pauli_allq.md'
      - 'analysis/PASS5832_5839_normalizer_code_pauli_allq_insert.tex'
      - 'analysis/PASS5832_5839_index_insert.html'
      - 'analysis/PASS5776_5783_index_insert.html'
      - 'analysis/PASS5792_5799_index_insert.html'
      - 'analysis/PASS5816_5823_index_insert.html'
      - 'analysis/PASS5824_5831_index_insert.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/PART_W33_PASS5832_5839_NORMALIZER_CODE_PAULI_ALLQ.json'
      - 'data/PART_W33_PASS5824_5831_INTEGRAL_W9_LATTICES.json'
      - 'data/w33_publication_frontier_contract_v2.json'
      - 'data/w33_pass_namespace_registry_v2.d/5832-5839.json'
      - 'tests/test_w33_pass5832_5839_normalizer_code_pauli_allq.py'
      - 'tools/materialize_pass5776_5839_matrix_frontier.py'
      - '.github/workflows/w33_pass5832_5839_normalizer_code_pauli_allq.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Replay Pass5832-5839 exact certificate
        run: python analysis/w33_pass5832_5839_normalizer_code_pauli_allq.py

      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5832_5839_normalizer_code_pauli_allq.py

      - name: Materialize five matrix-frontier homepage cards
        run: |
          python tools/materialize_pass5776_5839_matrix_frontier.py
          for token in \
            pass-5776-5783-reye-latin-common-core \
            pass-5792-5799-matrix-ring-transpose-outer \
            pass-5816-5823-matrix-fourier-rank \
            pass-5824-5831-integral-w9-lattices \
            pass-5832-5839-normalizer-code-pauli-allq; do
            test "$(grep -c "id=\"$token\"" docs/index.html)" -eq 1
            test "$(grep -c "id=\"$token\"" index.html)" -eq 1
          done
          git diff --check

      - name: Audit shared manuscript reachability
        run: |
          grep -Fq '\input{analysis/PASS5832_5839_normalizer_code_pauli_allq_insert}' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/w33_publication_frontier_contract_v2.json').read_text())
          expected={
            'pass-5776-5783-reye-latin-common-core',
            'pass-5792-5799-matrix-ring-transpose-outer',
            'pass-5816-5823-matrix-fourier-rank',
            'pass-5824-5831-integral-w9-lattices',
            'pass-5832-5839-normalizer-code-pauli-allq',
          }
          got={x['token'] for x in d['local_public_sections']}
          assert expected <= got
          assert d['public_index']=='docs/index.html'
          PY

      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Compile all three canonical manuscripts
        run: |
          mkdir -p evidence/pass5832_5839
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5832_5839/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5832_5839/pdf_sha256.txt

      - name: Freeze homepage materialization if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html index.html data/PART_W33_PASS5832_5839_NORMALIZER_CODE_PAULI_ALLQ.json
          if git diff --cached --quiet; then
            echo 'Certificate and homepage cards already frozen.'
          else
            git commit -m 'Materialize Pass5776-5839 matrix frontier [skip ci]'
            git push origin master
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pass5832-5839-normalizer-code-pauli-allq
          path: evidence/pass5832_5839/**
