name: Passes 583-587 exact certificates
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass583_*.py'
      - 'analysis/w33_pass584_*.py'
      - 'analysis/w33_pass585_*.py'
      - 'analysis/w33_pass586_*.py'
      - 'analysis/w33_pass587_*.py'
      - 'analysis/w33_pass583_587_release.py'
      - 'data/w33_pass583_*.json'
      - 'data/w33_pass584_*.json'
      - 'data/w33_pass585_*.json'
      - 'data/w33_pass586_*.json'
      - 'data/w33_pass587_*.json'
      - 'hardware/w33_pass587_*.json'
      - 'formal/W33/Pass586CyclotomicLocalizedDVR.lean'
      - 'formal/W33.lean'
      - 'tests/test_w33_pass583_587_*.py'
      - 'PASS583_587_GROUPOID_INTERTWINER_JOHNSON_LOCAL_BLACKWELL_RELEASE.md'
      - '.github/workflows/pass583_587_exact.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  NUMBA_NUM_THREADS: '4'
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 numba==0.65.1 scipy==1.17.0 sympy==1.14.0 networkx==3.5 pytest==9.0.2
      - run: python analysis/w33_pass569_z9_coupled_affine_radial_quadratic.py --check
      - run: python analysis/w33_pass583_collision_groupoid_polynomial.py --check
      - run: python analysis/w33_pass584_colored_intertwiner_a4.py --check
      - run: python analysis/w33_pass585_singer_pentagon_triples.py --check
      - run: python analysis/w33_pass586_cyclotomic_local_dvr.py --check
      - run: python analysis/w33_pass587_infinite_horizon_blackwell_lift.py --check
      - run: python analysis/w33_pass583_587_release.py --check
      - run: pytest -q tests/test_w33_pass583_587_groupoid_intertwiner_johnson_local_blackwell.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
