name: Passes 4137-4144 Exact Regression
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4137_4144_matrix_horizon_rg_scar_curvature.py'
      - 'data/PART_4137_4144_MATRIX_HORIZON_RG_SCAR_CURVATURE.json'
      - 'tests/test_w33_pass4137_4144_matrix_horizon_rg_scar_curvature.py'
      - '.github/workflows/w33_pass4137_4144_matrix_horizon_rg_scar_curvature.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy scipy networkx pytest
      - run: python analysis/w33_pass4137_4144_matrix_horizon_rg_scar_curvature.py > /tmp/pass4137.json
      - run: python -m pytest -q tests/test_w33_pass4137_4144_matrix_horizon_rg_scar_curvature.py
      - run: grep -F '"all_checks_hold": true' /tmp/pass4137.json
