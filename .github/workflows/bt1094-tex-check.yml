name: BT1100 TeX check

on:
  workflow_dispatch:
  push:
    paths:
      - 'paper/**/*.tex'
      - 'photonic_holonet.tex'
      - 'tools/bt1094_build_papers.py'
      - 'tools/bt1100_integrate_all_latest_sections.py'
      - 'tools/bt1100_tex_path_sanity.py'
      - '.github/workflows/bt1094-tex-check.yml'
  pull_request:
    paths:
      - 'paper/**/*.tex'
      - 'photonic_holonet.tex'
      - 'tools/bt1094_build_papers.py'
      - 'tools/bt1100_integrate_all_latest_sections.py'
      - 'tools/bt1100_tex_path_sanity.py'
      - '.github/workflows/bt1094-tex-check.yml'

jobs:
  tex-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended python3
      - name: Build papers
        run: python3 tools/bt1094_build_papers.py
