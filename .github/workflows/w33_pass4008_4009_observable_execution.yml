name: Passes 4008-4009 Observable Algebra Execution
on:
  pull_request:
    branches: [master]
    paths:
      - 'data/trigger_pass4008_4009.txt'
      - 'analysis/w33_pass3983_orbital_central_fourier.py'
      - 'analysis/w33_pass3999_orbital_relation_fusion.py'
      - 'analysis/w33_pass3993_monster_overgroup_acquisition.py'
      - 'analysis/w33_pass3993_monster_overgroup_sieve.g'
      - 'analysis/w33_pass4000_monster_execution_summary.py'
      - '.github/workflows/w33_pass4008_4009_observable_execution.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pass4008-4009-observable-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  orbital-relation-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Execute literal Fourier and fusion
        run: |
          set -o pipefail
          python analysis/w33_pass3983_orbital_central_fourier.py 2>&1 | tee /tmp/fourier.log
          python analysis/w33_pass3999_orbital_relation_fusion.py 2>&1 | tee /tmp/fusion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass4008-orbital-relation-fusion
          path: |
            /tmp/fourier.log
            /tmp/fusion.log
            data/PART_3983_ORBITAL_CENTRAL_FOURIER.json
            data/PART_3999_ORBITAL_RELATION_FUSION.json
          if-no-files-found: warn
  monster-overgroup:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install engines
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          python -m pip install --disable-pip-version-check mmgroup==1.0.0
      - run: git clone --depth 1 https://github.com/apsmath/MonsterSubgroups.git /tmp/MonsterSubgroups
      - name: Execute bounded Monster acquisition
        run: |
          set -o pipefail
          gap -q analysis/w33_pass3993_monster_overgroup_sieve.g 2>&1 | tee /tmp/gap.txt
          python analysis/w33_pass3993_monster_overgroup_acquisition.py --gap-output /tmp/gap.txt --database /tmp/MonsterSubgroups 2>&1 | tee /tmp/acquire.log
          python analysis/w33_pass4000_monster_execution_summary.py 2>&1 | tee /tmp/summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass4009-monster-overgroup
          path: |
            /tmp/gap.txt
            /tmp/acquire.log
            /tmp/summary.log
            data/PART_3993_MONSTER_OVERGROUP_ACQUISITION.json
            data/PART_4000_MONSTER_EXECUTION_SUMMARY.json
            data/PART_3751_MONSTER_U42_CLASS_FUSION_EXECUTION.json
          if-no-files-found: warn
