name: Pass11631-11635 physical interfaces
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11631_11635_physical_interfaces.py'
      - 'analysis/w33_pass11634_full_quantum_normals.py'
      - 'analysis/PASS11631_11635_PHYSICAL_INTERFACES.md'
      - 'tests/test_w33_pass11631_11635_physical_interfaces.py'
      - 'data/w33_pass11631_11635_physical_interfaces.json'
      - 'data/w33_pass11634_full_quantum_normals.json'
      - '.github/workflows/pass11631-11635-physical-interfaces.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 jax==0.11.2 sympy==1.14.0 networkx==3.6.1 pytest
      - name: Audit committed witnesses and corruption controls
        run: python -m pytest --noconftest -q tests/test_w33_pass11631_11635_physical_interfaces.py
      - name: Replay full297-coordinate quantum Hessian with independent quadratures
        run: python analysis/w33_pass11634_full_quantum_normals.py 64 32
      - name: Replay all five physical interfaces
        run: python analysis/w33_pass11631_11635_physical_interfaces.py
      - name: Validate regenerated witnesses
        run: python -m pytest --noconftest -q tests/test_w33_pass11631_11635_physical_interfaces.py
