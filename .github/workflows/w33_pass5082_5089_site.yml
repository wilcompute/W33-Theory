name: Pass5082-5089 homepage materializer
on:
  push:
    branches: [master]
    paths:
      - 'analysis/PASS5082_5089_index_insert.html'
      - 'tools/integrate_pass5082_5089_public.py'
      - '.github/workflows/w33_pass5082_5089_site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass5082_5089_public.py
      - name: Commit materialized homepages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Pass5082-5089 homepage card'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi
