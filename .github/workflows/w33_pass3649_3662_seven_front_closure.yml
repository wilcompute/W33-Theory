name: Passes 3649-3662 Seven Front Closure

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3649*'
      - 'analysis/*3662*'
      - 'analysis/BT3600_BT3613_chained_breakthrough*'
      - 'data/PART_BT3649_BT3662*'
      - 'tests/test_bt3649_3662_seven_front_closure.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - '.github/workflows/w33_pass3649_3662_seven_front_closure.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3649*'
      - 'analysis/*3662*'
      - 'analysis/BT3600_BT3613_chained_breakthrough*'
      - 'data/PART_BT3649_BT3662*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3649-3662-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Regenerate frozen certificate
        run: |
          mkdir -p evidence/pass3649_3662
          python analysis/bt3649_3662_seven_front_closure.py --json evidence/pass3649_3662/results.json | tee evidence/pass3649_3662/exact.log
          grep -F 'PASS_7_FRONTS_WITH_TOMOTOPE_CORRECTION 067047bbf3fe04301fcb26bf484a3d151bf6db4ab762fa6bf31f527889d09a89' evidence/pass3649_3662/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('evidence/pass3649_3662/results.json').read_text())
          frozen=json.loads(Path('data/PART_BT3649_BT3662_SEVEN_FRONT_CLOSURE_results.json').read_text())
          assert generated == frozen
          assert generated['fronts']['tomotope_cocycle_correction']['prior_zero_lift_claim'] == 'WITHDRAWN_INCOMPLETE_BACKTRACKER'
          print('PASS frozen equality and correction firewall')
          PY
      - name: Focused regression and correction audit
        run: |
          python -m pytest -q tests/test_bt3649_3662_seven_front_closure.py | tee evidence/pass3649_3662/pytest.log
          grep -F 'Correction from Passes 3649--3662' analysis/BT3600_BT3613_chained_breakthrough_insert.tex
          grep -F 'Correction from Passes 3649–3662' analysis/BT3600_BT3613_chained_breakthrough.md
          grep -F 'Correction from Passes 3649–3662' analysis/BT3600_BT3613_chained_breakthrough_index_insert.html
          git diff --check
      - name: Verify frontier chronology
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs == manifest['required_ordered_inputs']
          ours='analysis/BT3649_BT3662_seven_front_closure_insert'
          assert inputs.count(ours)==1
          assert inputs.index('analysis/BT3635_BT3648_monster_u42_completion_insert') < inputs.index(ours)
          if 'analysis/BT3663_BT3669_monster_chamber_spread_bridge_insert' in inputs:
              assert inputs.index(ours) < inputs.index('analysis/BT3663_BT3669_monster_chamber_spread_bridge_insert')
          assert [x['token'] for x in manifest['public_sections']].count('bt3649-3662-seven-front-closure')==1
          print('PASS manifest chronology')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee evidence/pass3649_3662/${source%.tex}.log
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3649_3662/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3649-3662-seven-front-evidence
          path: |
            evidence/pass3649_3662/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
