name: Passes 3286-3295 Readable Source Bootstrap

on:
  push:
    branches:
      - agent/pass3286-3295-signature-port-common-envelope
    paths:
      - 'bootstrap/pass3286_3295/**'
      - '.github/workflows/w33_pass3286_3295_bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass3286-3295-signature-port-common-envelope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and verify readable packet
        run: |
          python bootstrap/pass3286_3295/materialize.py
          python -m pip install --disable-pip-version-check pytest
          python analysis/bt3286_3295_signature_port_common_envelope.py \
            --json /tmp/PART_BT3286_BT3295_SIGNATURE_PORT_COMMON_ENVELOPE_results.json
          cmp /tmp/PART_BT3286_BT3295_SIGNATURE_PORT_COMMON_ENVELOPE_results.json \
            data/PART_BT3286_BT3295_SIGNATURE_PORT_COMMON_ENVELOPE_results.json
          python -m pytest -q tests/test_bt3286_3295_signature_port_common_envelope.py
          git diff --check
      - name: Publish readable files once
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/w33_pass_namespace_registry_v2.d/3286-3295.json \
            analysis/bt3286_3295_signature_port_common_envelope.py \
            analysis/BT3286_BT3295_signature_port_common_envelope.md \
            analysis/BT3286_BT3295_signature_port_common_envelope_insert.tex \
            analysis/BT3286_BT3295_signature_port_common_envelope_index_insert.html \
            data/PART_BT3286_BT3295_SIGNATURE_PORT_COMMON_ENVELOPE_results.json \
            tests/test_bt3286_3295_signature_port_common_envelope.py \
            rtl/w33_signature_s3_rom4.v \
            rtl/w33_port_s3_linear4.v \
            rtl/w33_signature_port_linear5.v \
            rtl/tb_w33_signature_port_controllers.v \
            .github/workflows/w33_pass3286_3295_signature_port_common_envelope.yml \
            w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Passes 3286-3295 readable source [skip ci]'
            git push
          fi
