name: Bootstrap W33 crypto-network-Marcelis certificates

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/w33_crypto_network_marcelis_freeze_bootstrap.yml'
      - 'tools/bt1408_witting_contextual_communication_bridge.py'
      - 'tools/bt1409_witting_duplex_admission_scheduler.py'
      - 'analysis/w33_contextuality_terminology_migration.py'
      - 'analysis/w33_support_min_entropy.py'
      - 'analysis/w33_witting_card_single_photon_protocol.py'
      - 'analysis/w33_marcelis_multichart_atlas.py'
      - 'analysis/w33_heawood_chart_fibre_quotient.py'
      - 'analysis/w33_heawood_spread_pair_270_bridge.py'
      - 'analysis/w33_marcelis_gf4_trace_gauge.py'
      - 'analysis/w33_marcelis_pg34_line_trace_census.py'
      - 'analysis/w33_heawood_spread_pair_psp_equivariance.py'
      - 'analysis/w33_heawood_spread_pair_pgsp_equivariance.py'
      - 'analysis/w33_heawood_spread_pair_stabilizer96_fingerprint.py'
      - 'analysis/w33_heawood_outer_involution_fixed_census.py'
      - 'analysis/w33_heawood_stabilizer96_presentation_lattice.py'
      - 'analysis/w33_marcelis_trace_flag_law.py'
      - 'analysis/w33_marcelis_trace_schubert_general.py'
      - 'analysis/w33_marcelis_observer_quotient_dynamics.py'
      - 'analysis/w33_outer_cube_observer_bridge_v2.py'
      - 'analysis/w33_stabilizer96_cube_central_cover.py'
      - 'analysis/w33_affine_fano_information_horizon.py'
      - 'analysis/w33_projective_horizon_lag_law.py'
      - 'analysis/w33_trace_observer_finite_observability.py'
      - 'analysis/w33_boundary_singer_toroidal_84_bridge.py'
      - 'analysis/w33_cocycle_rank1_576_parity_firewall.py'
      - 'analysis/w33_a4_untwisted_core_synthesis.py'
      - 'analysis/w33_publish_september_2026_frontier.py'
      - 'analysis/BT20260910_heawood_schubert_observer_insert.tex'
      - 'tests/test_bt1408_witting_contextual_communication_bridge.py'
      - 'tests/test_bt1409_witting_duplex_admission_scheduler.py'
      - 'tests/test_w33_crypto_network_marcelis_20260909.py'
      - 'tests/test_w33_heawood_psp_marcelis_flag_20260909.py'
      - 'tests/test_w33_heawood_pgsp_stabilizer96_20260910.py'
      - 'tests/test_w33_heawood_schubert_observer_20260910.py'
      - 'tests/test_w33_outer_cube_publication_20260910.py'
      - 'tests/test_w33_affine_fano_horizon_20260910.py'
      - 'tests/test_w33_projective_horizon_lag_law_20260910.py'
      - 'tests/test_w33_trace_observer_finite_observability_20260910.py'
      - 'tests/test_w33_boundary_singer_toroidal_84_bridge_20260910.py'
      - 'tests/test_w33_cocycle_rank1_576_parity_firewall_20260910.py'
      - 'tests/test_w33_a4_untwisted_core_synthesis_20260910.py'
      - 'photonic_holonet.tex'
      - 'photonic_holonet_body.tex'
      - 'single_photon_universal_computation.tex'
      - 'docs/index.html'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --upgrade numpy pytest
      - name: Regenerate exact certificates and publication section
        run: |
          python tools/bt1408_witting_contextual_communication_bridge.py
          python tools/bt1409_witting_duplex_admission_scheduler.py
          python analysis/w33_contextuality_terminology_migration.py
          python analysis/w33_support_min_entropy.py
          python analysis/w33_witting_card_single_photon_protocol.py
          python analysis/w33_marcelis_multichart_atlas.py
          python analysis/w33_heawood_chart_fibre_quotient.py
          python analysis/w33_heawood_spread_pair_270_bridge.py
          python analysis/w33_marcelis_gf4_trace_gauge.py
          python analysis/w33_marcelis_pg34_line_trace_census.py
          python analysis/w33_heawood_spread_pair_psp_equivariance.py
          python analysis/w33_heawood_spread_pair_pgsp_equivariance.py
          python analysis/w33_heawood_spread_pair_stabilizer96_fingerprint.py
          python analysis/w33_heawood_outer_involution_fixed_census.py
          python analysis/w33_heawood_stabilizer96_presentation_lattice.py
          python analysis/w33_marcelis_trace_flag_law.py
          python analysis/w33_marcelis_trace_schubert_general.py
          python analysis/w33_marcelis_observer_quotient_dynamics.py
          python analysis/w33_outer_cube_observer_bridge_v2.py
          python analysis/w33_stabilizer96_cube_central_cover.py
          python analysis/w33_affine_fano_information_horizon.py
          python analysis/w33_projective_horizon_lag_law.py
          python analysis/w33_trace_observer_finite_observability.py
          python analysis/w33_boundary_singer_toroidal_84_bridge.py
          python analysis/w33_cocycle_rank1_576_parity_firewall.py
          python analysis/w33_a4_untwisted_core_synthesis.py
          python analysis/w33_publish_september_2026_frontier.py
      - name: Focused regression gates
        run: |
          python -m pytest -q \
            tests/test_bt1408_witting_contextual_communication_bridge.py \
            tests/test_bt1409_witting_duplex_admission_scheduler.py \
            tests/test_w33_crypto_network_marcelis_20260909.py \
            tests/test_w33_heawood_psp_marcelis_flag_20260909.py \
            tests/test_w33_heawood_pgsp_stabilizer96_20260910.py \
            tests/test_w33_heawood_schubert_observer_20260910.py \
            tests/test_w33_outer_cube_publication_20260910.py \
            tests/test_w33_affine_fano_horizon_20260910.py \
            tests/test_w33_projective_horizon_lag_law_20260910.py \
            tests/test_w33_trace_observer_finite_observability_20260910.py \
            tests/test_w33_boundary_singer_toroidal_84_bridge_20260910.py \
            tests/test_w33_cocycle_rank1_576_parity_firewall_20260910.py \
            tests/test_w33_a4_untwisted_core_synthesis_20260910.py
      - name: Freeze generated outputs and public index on master
        shell: bash
        run: |
          git add -f \
            data/bt1408_witting_contextual_communication_bridge.json \
            data/bt1409_witting_duplex_admission_scheduler.json \
            data/w33_contextuality_terminology_migration.json \
            data/w33_support_min_entropy.json \
            data/w33_witting_card_single_photon_protocol.json \
            data/w33_marcelis_multichart_atlas.json \
            data/w33_heawood_chart_fibre_quotient.json \
            data/w33_heawood_spread_pair_270_bridge.json \
            data/w33_marcelis_gf4_trace_gauge.json \
            data/w33_marcelis_pg34_line_trace_census.json \
            data/w33_heawood_spread_pair_psp_equivariance.json \
            data/w33_heawood_spread_pair_pgsp_equivariance.json \
            data/w33_heawood_spread_pair_stabilizer96_fingerprint.json \
            data/w33_heawood_outer_involution_fixed_census.json \
            data/w33_heawood_stabilizer96_presentation_lattice.json \
            data/w33_marcelis_trace_flag_law.json \
            data/w33_marcelis_trace_schubert_general.json \
            data/w33_marcelis_observer_quotient_dynamics.json \
            data/w33_outer_cube_observer_bridge.json \
            data/w33_stabilizer96_cube_central_cover.json \
            data/w33_affine_fano_information_horizon.json \
            data/w33_projective_horizon_lag_law.json \
            data/w33_trace_observer_finite_observability.json \
            data/w33_boundary_singer_toroidal_84_bridge.json \
            data/w33_cocycle_rank1_576_parity_firewall.json \
            data/w33_a4_untwisted_core_synthesis.json \
            docs/index.html
          if git diff --cached --quiet; then
            echo 'All focused certificates and publication anchors already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze corrected observer synthesis frontier'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
