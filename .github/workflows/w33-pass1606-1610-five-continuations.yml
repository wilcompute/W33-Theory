name: W33 Passes 1606-1610 Five Continuations

on:
  push:
    paths:
      - 'analysis/w33_pass1606_1610_five_continuations.py'
      - 'analysis/pass1606_1610_parts/**'
      - 'analysis/BT1606_1610_five_continuations.md'
      - 'analysis/BT1610_five_continuations_insert.tex'
      - 'data/w33_pass1606_1610_five_continuations.json'
      - 'tools/export_w33_pass1607_resolution_cuts.py'
      - 'tests/test_w33_pass1606_1610_five_continuations.py'
      - '.github/workflows/w33-pass1606-1610-five-continuations.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass1606_1610_five_continuations.py'
      - 'analysis/pass1606_1610_parts/**'
      - 'data/w33_pass1606_1610_five_continuations.json'
      - 'tests/test_w33_pass1606_1610_five_continuations.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy sympy pytest
      - run: python analysis/w33_pass1606_1610_five_continuations.py --output /tmp/w33_pass1606_1610.json
      - run: diff -u data/w33_pass1606_1610_five_continuations.json /tmp/w33_pass1606_1610.json
      - run: python tools/export_w33_pass1607_resolution_cuts.py --xor /tmp/resolution.xor --exact8 /tmp/resolution.exact8
      - run: pytest -q tests/test_w33_pass1606_1610_five_continuations.py
