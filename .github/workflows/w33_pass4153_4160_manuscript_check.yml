name: Passes 4153-4160 Manuscript Check
on:
  push:
    branches: [master]
    paths:
      - 'analysis/BT4153_BT4160_second_chern_disorder_lindblad_clock_thermo_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - '.github/workflows/w33_pass4153_4160_manuscript_check.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - run: |
          mkdir -p evidence/pass4153_4160
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass4153_4160/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pass4153-4160-manuscripts
          path: evidence/pass4153_4160/**
