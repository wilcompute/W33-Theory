name: Passes 4073-4080 Protected Frontier Reconcile
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_pass4073_4080_frontier.py'
      - 'analysis/BT4073_BT4080_engineering_outside_box_insert.tex'
      - 'analysis/BT4073_BT4080_engineering_outside_box_index_insert.html'
      - 'docs/engineering-outside-box-4073-4080.html'
      - '.github/workflows/w33_pass4073_4080_frontier_reconcile.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pass4073-4080-frontier, cancel-in-progress: false}
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass4073_4080_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4073_4080_FRONTIER 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit manifest reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/w33_current_frontier_manifest_v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 4080: reconcile engineering outside-box frontier'
          git pull --rebase origin master
          git push
