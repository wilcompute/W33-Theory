name: PGSp outer double-building no-go
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260902_pgsp_outer_double_building_nogo.py'
      - '.github/workflows/w33_20260902_pgsp_outer_double_building_nogo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-pgsp-outer-double-building-nogo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute explicit outer audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260902_pgsp_outer_double_building_nogo.py 2>&1 | tee analysis/PASS_20260902_PGSP_OUTER_DOUBLE_BUILDING_NOGO.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260902_PGSP_OUTER_DOUBLE_BUILDING_NOGO.json').read_text())
          assert d.get('status')=='PASS'
          assert d['selectors']['outerTwistedCircuitEqualsHemisystem'] is False
          assert d['selectors']['outerTwistedHemisystemEqualsCircuit'] is False
          assert d['selectors']['twistedCircuitMultiplicities']==[0,1]
          assert d['selectors']['twistedHemisystemMultiplicities']==[1,0]
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260902_PGSP_OUTER_DOUBLE_BUILDING_NOGO.json analysis/PASS_20260902_PGSP_OUTER_DOUBLE_BUILDING_NOGO.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze PGSp outer double-building no-go'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
