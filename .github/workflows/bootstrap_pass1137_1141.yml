name: Bootstrap Pass 1137-1141 exact source release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'data/pass1137_1141_source_bundle.b64'
      - '.github/workflows/bootstrap_pass1137_1141.yml'

permissions:
  contents: write

jobs:
  install-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract transparent source package
        run: |
          base64 --decode data/pass1137_1141_source_bundle.b64 | tar -xz
          rm data/pass1137_1141_source_bundle.b64
      - name: Commit collision-free sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Passes 1137-1141: install exact source release'
          git pull --rebase origin master
          git push
