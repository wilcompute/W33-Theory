name: Quarantine legacy Pass 1142-1146 source transport

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'data/pass1142_1146_source_bundle.b64'
      - 'scripts/pass1142_1146_bundle_runtime.py'
      - '.github/workflows/bootstrap_pass1137_1141.yml'

permissions:
  contents: read

jobs:
  quarantine-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact known-corrupt fingerprint without extraction
        run: python scripts/pass1142_1146_bundle_runtime.py --assert-known-corrupt
