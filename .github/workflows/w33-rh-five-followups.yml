name: W33 RH five followups
on:
  push:
    branches: [master]
    paths:
      - "analysis/w33_20261021_rh_five_followups.py"
      - "tests/test_w33_20261021_rh_five_followups.py"
      - ".github/workflows/w33-rh-five-followups.yml"
  pull_request:
    paths:
      - "analysis/w33_20261021_rh_five_followups.py"
      - "tests/test_w33_20261021_rh_five_followups.py"
      - ".github/workflows/w33-rh-five-followups.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath pytest
      - name: Reproduce five targeted falsification checks
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTHONPATH: "."
        run: python -m pytest -q tests/test_w33_20261021_rh_five_followups.py
      - name: Export complete rational Levi matrix and certificates
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTHONPATH: "."
        run: python analysis/w33_20261021_rh_five_followups.py data
      - name: Fail closed on RH scope and incomplete modules
        run: |
          python - <<'PY'
          import json, base64, hashlib, zlib
          d=json.load(open("data/w33_20261021_rh_five_followups.json"))
          m=json.load(open("data/w33_20261021_rational_levi_160x156.json"))
          assert d["status"]=="PASS_SCOPED"
          assert d["classical_RH_proved"] is False
          assert len(d["frontiers"])==5
          raw=zlib.decompress(base64.b64decode(m["data"]))
          assert len(raw)==160*156*4
          assert hashlib.sha256(raw).hexdigest()==m["sha256_raw"]
          sq=zlib.decompress(base64.b64decode(m["coordinate_square_data"]))
          assert len(sq)==156*156*4
          assert hashlib.sha256(sq).hexdigest()==m["coordinate_square_sha256"]
          print("Five scoped research frontiers PASS; classical RH unproved.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-rh-five-followups-20261021
          path: |
            data/w33_20261021_rh_five_followups.json
            data/w33_20261021_rational_levi_160x156.json
