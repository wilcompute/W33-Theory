name: Pass 415-419 Bootstrap

on:
  push:
    branches: ['agent/pass415-419-five-frontiers']
    paths: ['.github/workflows/pass415-419-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: pass415-419-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_ARCHIVE_SHA256: e9af02e38ad10721a79902e758f5b3bec32d4ec9fef294ae8d25b6ad0eccd565
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass415-419-five-frontiers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct hash-locked archive from temporary issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_ARCHIVE_SHA256']
          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          base = f'https://api.github.com/repos/{repo}/issues/117'
          issue = get(base)
          comments = get(base + '/comments?per_page=100')
          joined = '\n'.join([issue['body']] + [item['body'] for item in comments])
          chunks = {}
          for i in range(12):
              if i == 8:
                  pieces = []
                  for suffix in ('A', 'B'):
                      matches = re.findall(
                          rf'PASS415_CHUNK_08{suffix}_BEGIN -->\n(.*?)\n<!-- PASS415_CHUNK_08{suffix}_END',
                          joined,
                          re.S,
                      )
                      if not matches:
                          raise SystemExit(f'missing corrected chunk 08{suffix}')
                      pieces.append(matches[-1].strip())
                  chunks[i] = ''.join(pieces)
              else:
                  matches = re.findall(
                      rf'PASS415_CHUNK_{i:02d}_BEGIN -->\n(.*?)\n<!-- PASS415_CHUNK_{i:02d}_END',
                      joined,
                      re.S,
                  )
                  if not matches:
                      raise SystemExit(f'missing chunk {i:02d}')
                  chunks[i] = matches[-1].strip()
          encoded = ''.join(chunks[i] for i in range(12))
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          print(json.dumps({'archive_bytes': len(archive), 'sha256': digest}, sort_keys=True))
          if digest != expected:
              raise SystemExit(f'archive SHA-256 mismatch: {digest}')
          open('/tmp/pass415_419_payload.tar.gz', 'wb').write(archive)
          PY
      - name: Verify archive manifest and extract
        run: |
          python - <<'PY'
          import tarfile
          expected = {
              '.github/workflows/pass415-419-five-frontiers.yml',
              'PASS415_419_FIVE_FRONTIERS_RELEASE.md',
              'analysis/w33_pass415_frobenius_smith_packets.py',
              'analysis/w33_pass416_qutrit_distillation_search.py',
              'analysis/w33_pass417_divisor_cycle_hybrid_decoder.py',
              'analysis/w33_pass418_twirl_breaking_spectroscopy.py',
              'analysis/w33_pass419_adversarial_replication.py',
              'data/w33_pass415_frobenius_smith_packets.json',
              'data/w33_pass416_qutrit_distillation_search.json',
              'data/w33_pass417_divisor_cycle_hybrid_decoder.json',
              'data/w33_pass418_twirl_breaking_spectroscopy.json',
              'data/w33_pass418_defect_atlas.json',
              'data/w33_pass419_adversarial_replication.json',
              'data/w33_pass419_hardened_custody_fixture.json',
              'data/w33_pass419_attack_matrix.json',
              'data/w33_pass419_nonclaim_raw_counts.jsonl',
              'schemas/w33_pass419_hardened_handoff_v2.schema.json',
              'docs/W33_PASS419_ADVERSARIAL_REPLICATION.md',
              'tests/test_pass415_419_five_frontiers.py',
          }
          with tarfile.open('/tmp/pass415_419_payload.tar.gz', 'r:gz') as tf:
              names = {member.name for member in tf.getmembers() if member.isfile()}
              if names != expected:
                  raise SystemExit(f'archive manifest mismatch: missing={sorted(expected-names)} extra={sorted(names-expected)}')
              for member in tf.getmembers():
                  if member.name.startswith('/') or '..' in member.name.split('/'):
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall('.', filter='data')
          PY
      - name: Install pinned dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            sympy==1.14.0 \
            networkx==3.6.1 \
            cryptography==46.0.4 \
            pytest==9.0.2 \
            jsonschema==4.26.0
      - name: Validate full release before publication
        run: |
          python analysis/w33_pass415_frobenius_smith_packets.py --check
          python analysis/w33_pass416_qutrit_distillation_search.py --check
          python analysis/w33_pass417_divisor_cycle_hybrid_decoder.py --check
          python analysis/w33_pass418_twirl_breaking_spectroscopy.py --check
          python analysis/w33_pass419_adversarial_replication.py --check
          python - <<'PY'
          import json, jsonschema
          schema=json.load(open('schemas/w33_pass419_hardened_handoff_v2.schema.json'))
          fixture=json.load(open('data/w33_pass419_hardened_custody_fixture.json'))
          jsonschema.validate(fixture,schema)
          PY
          python -m pytest -q tests/test_pass415_419_five_frontiers.py
          python scripts/check_claims_ledger.py
      - name: Publish readable release and remove bootstrap
        run: |
          rm .github/workflows/pass415-419-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/pass415-419-bootstrap.yml \
            .github/workflows/pass415-419-five-frontiers.yml \
            PASS415_419_FIVE_FRONTIERS_RELEASE.md \
            analysis/w33_pass415_frobenius_smith_packets.py \
            analysis/w33_pass416_qutrit_distillation_search.py \
            analysis/w33_pass417_divisor_cycle_hybrid_decoder.py \
            analysis/w33_pass418_twirl_breaking_spectroscopy.py \
            analysis/w33_pass419_adversarial_replication.py \
            data/w33_pass415_frobenius_smith_packets.json \
            data/w33_pass416_qutrit_distillation_search.json \
            data/w33_pass417_divisor_cycle_hybrid_decoder.json \
            data/w33_pass418_twirl_breaking_spectroscopy.json \
            data/w33_pass418_defect_atlas.json \
            data/w33_pass419_adversarial_replication.json \
            data/w33_pass419_hardened_custody_fixture.json \
            data/w33_pass419_attack_matrix.json \
            data/w33_pass419_nonclaim_raw_counts.jsonl \
            schemas/w33_pass419_hardened_handoff_v2.schema.json \
            docs/W33_PASS419_ADVERSARIAL_REPLICATION.md \
            tests/test_pass415_419_five_frontiers.py
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git commit -m 'Passes 415-419: execute five orthogonal frontiers'
          git push origin HEAD:agent/pass415-419-five-frontiers
