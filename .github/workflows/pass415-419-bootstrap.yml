name: Pass 415-419 Bootstrap
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: pass415-419-bootstrap
  cancel-in-progress: false
jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/pass415-419-five-frontiers'
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_SHA: e9af02e38ad10721a79902e758f5b3bec32d4ec9fef294ae8d25b6ad0eccd565
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass415-419-five-frontiers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and extract hash-locked release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,re,tarfile,urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/117"
          issue=get(base); comments=get(base+'/comments?per_page=100')
          text='\n'.join([issue['body']]+[c['body'] for c in comments]); chunks={}
          for i in range(12):
              if i in (5,7,8):
                  parts=[]
                  for s in 'AB':
                      m=re.findall(rf'PASS415_CHUNK_{i:02d}{s}_BEGIN -->\n(.*?)\n<!-- PASS415_CHUNK_{i:02d}{s}_END',text,re.S)
                      if not m:raise SystemExit(f'missing {i:02d}{s}')
                      parts.append(m[-1].strip())
                  chunks[i]=''.join(parts)
              else:
                  m=re.findall(rf'PASS415_CHUNK_{i:02d}_BEGIN -->\n(.*?)\n<!-- PASS415_CHUNK_{i:02d}_END',text,re.S)
                  if not m:raise SystemExit(f'missing {i:02d}')
                  chunks[i]=m[-1].strip()
          assert chunks[5][2213]=='l'
          chunks[5]=chunks[5][:2213]+'p'+chunks[5][2214:]
          blob=base64.b64decode(''.join(chunks[i] for i in range(12)),validate=True)
          digest=hashlib.sha256(blob).hexdigest(); print({'bytes':len(blob),'sha256':digest})
          if digest!=os.environ['EXPECTED_SHA']:raise SystemExit('archive SHA mismatch')
          expected={
          '.github/workflows/pass415-419-five-frontiers.yml','PASS415_419_FIVE_FRONTIERS_RELEASE.md',
          'analysis/w33_pass415_frobenius_smith_packets.py','analysis/w33_pass416_qutrit_distillation_search.py',
          'analysis/w33_pass417_divisor_cycle_hybrid_decoder.py','analysis/w33_pass418_twirl_breaking_spectroscopy.py',
          'analysis/w33_pass419_adversarial_replication.py','data/w33_pass415_frobenius_smith_packets.json',
          'data/w33_pass416_qutrit_distillation_search.json','data/w33_pass417_divisor_cycle_hybrid_decoder.json',
          'data/w33_pass418_twirl_breaking_spectroscopy.json','data/w33_pass418_defect_atlas.json',
          'data/w33_pass419_adversarial_replication.json','data/w33_pass419_hardened_custody_fixture.json',
          'data/w33_pass419_attack_matrix.json','data/w33_pass419_nonclaim_raw_counts.jsonl',
          'schemas/w33_pass419_hardened_handoff_v2.schema.json','docs/W33_PASS419_ADVERSARIAL_REPLICATION.md',
          'tests/test_pass415_419_five_frontiers.py'}
          open('/tmp/release.tgz','wb').write(blob)
          with tarfile.open('/tmp/release.tgz','r:gz') as tf:
              names={m.name for m in tf.getmembers() if m.isfile()}
              if names!=expected:raise SystemExit(f'manifest mismatch missing={expected-names} extra={names-expected}')
              if any(m.name.startswith('/') or '..' in m.name.split('/') for m in tf.getmembers()):raise SystemExit('unsafe archive path')
              tf.extractall('.',filter='data')
          PY
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 sympy==1.14.0 networkx==3.6.1 cryptography==46.0.4 pytest==9.0.2 jsonschema==4.26.0
      - name: Canonicalize Pass 416 reporting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis/w33_pass416_qutrit_distillation_search.py')
          s=p.read_text()
          replacements={
          'return [round(float(value), 14) for value in coefficients]':'return [round(float(value), 12) for value in coefficients]',
          '"pure_input_acceptance_probability": round(float(pure_acceptances[0]), 14),':'"pure_input_acceptance_probability": round(float(pure_acceptances[0]), 12),',
          '"pure_input_best_return_fidelity": round(float(pure_fidelities[0]), 14),':'"pure_input_best_return_fidelity": round(float(pure_fidelities[0]), 12),',
          '"pure_input_irreducible_orbit_infidelity": round(float(1 - pure_fidelities[0]), 14),':'"pure_input_irducible_orbit_infidelity": round(float(1 - pure_fidelities[0]), 12),',
          '"maximum_fit_residual": fit_residual,':'"maximum_fit_residual_less_than": 1e-10,',
          '"pure_fixed_point_fidelity": round(strange_fidelity, 14),':'"pure_fixed_point_fidelity": round(strange_fidelity, 12),',
          '"acceptance_probability": round(strange_acceptance, 14),':'"acceptance_probability": round(strange_acceptance, 12),',
          '"decoder_diagnostics": {key: round(value, 16) for key, value in decoder_diagnostics.items()},':'"decoder_diagnostics": {key: round(value, 12) for key, value in decoder_diagnostics.items()},'}
          # Correct one intentionally guarded spelling below before applying.
          replacements['"pure_input_irducible_orbit_infidelity": round(float(1 - pure_fidelities[0]), 12),']='"pure_input_irreducible_orbit_infidelity": round(float(1 - pure_fidelities[0]), 12),'
          for old,new in list(replacements.items())[:8]:
              if s.count(old)!=1:raise SystemExit(f'canonicalization anchor mismatch: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          python analysis/w33_pass416_qutrit_distillation_search.py
      - name: Pass 415 witness
        run: python analysis/w33_pass415_frobenius_smith_packets.py --check
      - name: Pass 416 witness
        run: python analysis/w33_pass416_qutrit_distillation_search.py --check
      - name: Pass 417 witness
        run: python analysis/w33_pass417_divisor_cycle_hybrid_decoder.py --check
      - name: Pass 418 witness
        run: python analysis/w33_pass418_twirl_breaking_spectroscopy.py --check
      - name: Pass 419 witness
        run: python analysis/w33_pass419_adversarial_replication.py --check
      - name: Validate hardened schema
        run: |
          python - <<'PY'
          import json,jsonschema
          jsonschema.validate(json.load(open('data/w33_pass419_hardened_custody_fixture.json')),json.load(open('schemas/w33_pass419_hardened_handoff_v2.schema.json')))
          PY
      - name: Run cross-pass regressions
        run: python -m pytest -q tests/test_pass415_419_five_frontiers.py
      - name: Verify claims ledger
        run: python scripts/check_claims_ledger.py
      - name: Publish validated non-workflow release files
        run: |
          rm -f .github/workflows/pass415-419-five-frontiers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PASS415_419_FIVE_FRONTIERS_RELEASE.md analysis/w33_pass41*.py data/w33_pass41* schemas/w33_pass419_hardened_handoff_v2.schema.json docs/W33_PASS419_ADVERSARIAL_REPLICATION.md tests/test_pass415_419_five_frontiers.py
          git diff --cached --name-status
          git commit -m 'Passes 415-419: publish validated scientific release'
          git push origin HEAD:agent/pass415-419-five-frontiers
