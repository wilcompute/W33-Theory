name: Passes 463-467 Chain-Ring Cover Hardware Release

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass463_q5_central_sheet_exchange.py'
      - 'analysis/w33_pass464_chain_ring_cyclotomic_conductors.py'
      - 'analysis/w33_pass465_formal_cover_l2_l4_audit.py'
      - 'analysis/w33_pass466_smith_bockstein_ramification.py'
      - 'analysis/w33_pass467_hardware_blind_runner.py'
      - 'analysis/PASS463_Q5_CENTRAL_SHEET_EXCHANGE.md'
      - 'analysis/PASS464_CHAIN_RING_CYCLOTOMIC_CONDUCTORS.md'
      - 'analysis/PASS465_LEAN_COVER_L2_L4_Q3.md'
      - 'analysis/PASS466_SMITH_BOCKSTEIN_RAMIFICATION.md'
      - 'analysis/PASS467_HARDWARE_BLIND_RUNNER.md'
      - 'analysis/PASS463_467_RESERVATIONS.md'
      - 'data/w33_pass463_q5_central_sheet_exchange.json'
      - 'data/w33_pass464_chain_ring_cyclotomic_conductors.json'
      - 'data/w33_pass465_formal_cover_l2_l4_audit.json'
      - 'data/w33_pass466_smith_bockstein_ramification.json'
      - 'data/w33_pass467_hardware_blind_runner.json'
      - 'formal/**'
      - 'hardware/pass467/**'
      - 'tests/test_pass463_467_chain_ring_cover_hardware_release.py'
      - 'PASS463_467_CHAIN_RING_COVER_HARDWARE_RELEASE.md'
      - '.github/workflows/pass463-467-chain-ring-cover-hardware.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  python-certificates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact dependencies
        run: python -m pip install numpy==2.3.5 sympy==1.14.0 pytest==9.0.2
      - name: Verify certificates
        run: |
          python analysis/w33_pass463_q5_central_sheet_exchange.py --check
          python analysis/w33_pass464_chain_ring_cyclotomic_conductors.py --check
          python analysis/w33_pass465_formal_cover_l2_l4_audit.py --check
          python analysis/w33_pass466_smith_bockstein_ramification.py --check
          python analysis/w33_pass467_hardware_blind_runner.py --check
      - name: Focused regressions
        run: python -m pytest -q tests/test_pass463_467_chain_ring_cover_hardware_release.py

  lean-cover-law-l1-l4-q3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
