name: TOE round-six exact minimal Witting MIC, W33 cut, and E6 falsifiers
on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_round6_*.py'
      - 'tests/test_toe_20261122_round6_five_and_more.py'
      - 'data/toe_20261122_round6_*.json'
      - '.github/workflows/toe-round6-five-and-more.yml'
  workflow_dispatch:
jobs:
  exact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and test dependencies
        run: python -m pip install --upgrade numpy scipy sympy networkx pytest
      - name: Verify thirteen new regression tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: analysis
        run: python -m pytest -q tests/test_toe_20261122_round6_five_and_more.py
      - name: Reproduce seven certificates
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: analysis
        run: python analysis/toe_20261122_round6_execute_all.py
      - name: Check exact minimality and W33 cut fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data')
          ic=json.loads((p/'toe_20261122_round6_exact_minimal16.json').read_text())['proof']
          assert ic['exact_projector_Gram_determinant']=='25/59049'
          assert len(ic['indices'])==16 and len(ic['finite_field_ranks'])==6
          c=json.loads((p/'toe_20261122_round6_exact_Hasse_cut.json').read_text())
          assert c['minimum_deleted_edges_for_Hasse_realization']==80
          assert c['crossing_edges']==160
          e=json.loads((p/'toe_20261122_round6_e6_FD_branch.json').read_text())
          assert e['remaining_complex_flat_moduli']==4
          print('PASS: exact minimal IC, sharp causal cut, E6 moduli')
          PY
