name: Passes 3577-3583 Petersen Matrix Octad Marked Walk

on:
  push:
    branches: [master]
    paths:
      - 'analysis/*3577*'
      - 'analysis/*3578*'
      - 'analysis/*3579*'
      - 'analysis/*3580*'
      - 'analysis/*3581*'
      - 'analysis/*3582*'
      - 'analysis/*3583*'
      - 'data/PART_BT3577*'
      - 'data/PART_BT3580*'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/petersen-matrix-octad-marked-walk.html'
      - 'docs/index.html'
      - 'tests/test_bt3577_bt3583_petersen_matrix_octad_marked_walk.py'
      - '.github/workflows/w33_pass3577_3583_petersen_matrix_octad_marked_walk.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3577-3583-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-packet-canary-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy sympy
      - name: Regenerate exact packet
        run: |
          mkdir -p evidence/pass3577_3583
          cp data/PART_BT3577_BT3583_PETERSEN_MATRIX_OCTAD_MARKED_WALK_results.json /tmp/frozen3583.json
          python analysis/bt3577_3583_petersen_matrix_octad_marked_walk.py | tee evidence/pass3577_3583/exact.log
          grep -F 'PASS_7_FRONTS 2a4a06836164c6eb92d971aa18ecd1369990c7bf501ae1aaf342e7b5e5bc23a4' evidence/pass3577_3583/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('data/PART_BT3577_BT3583_PETERSEN_MATRIX_OCTAD_MARKED_WALK_results.json').read_text())
          old=json.loads(Path('/tmp/frozen3583.json').read_text())
          assert got==old
          print('PASS semantic frozen-certificate equality')
          PY
      - name: Execute real proof canary
        run: |
          python analysis/bt3580_star_proof_canary.py --json evidence/pass3577_3583/star_canary.json | tee evidence/pass3577_3583/canary.log
          grep -F 'PASS_REAL_STAR_PROOF_CANARY 2a984b9a2f51646691657a8dfe5d01b9e33496f75500ba9b79abdd5a68385390' evidence/pass3577_3583/canary.log
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('evidence/pass3577_3583/star_canary.json').read_text())
          old=json.loads(Path('data/PART_BT3580_STAR_PROOF_CANARY.json').read_text())
          assert got==old
          print('PASS proof-canary frozen equality')
          PY
      - name: Focused regression
        run: |
          pytest -q tests/test_bt3577_bt3583_petersen_matrix_octad_marked_walk.py | tee evidence/pass3577_3583/pytest.log
          git diff --check
      - name: Verify manuscript and public reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          assert inputs[-1]=='analysis/BT3577_BT3583_petersen_matrix_octad_marked_walk_insert'
          assert 'bt3577-3583-petersen-matrix-octad-marked-walk' in Path('docs/index.html').read_text()
          assert Path('docs/petersen-matrix-octad-marked-walk.html').is_file()
          print('PASS current-frontier and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3577_3583/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3577_3583/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3577-3583-exact-canary-papers
          path: |
            evidence/pass3577_3583/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
