name: Passes 3715-3721 Carrier Tournament Process Budget Identification Scheduler Twirl

on:
  push:
    branches: [master]
    paths:
      - 'analysis/*3715*'
      - 'analysis/*3716*'
      - 'analysis/*3717*'
      - 'analysis/*3718*'
      - 'analysis/*3719*'
      - 'analysis/*3720*'
      - 'analysis/*3721*'
      - 'data/PART_BT3715*'
      - 'data/w33_pass_namespace_registry_v2.d/3715-3721.json'
      - 'tests/test_bt3715_bt3721_carrier_tournament_process_budget_identification_scheduler_twirl.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/carrier-tournament-process-budget-identification.html'
      - 'docs/index.html'
      - '.github/workflows/w33_pass3715_3721_carrier_tournament_process_budget_identification_scheduler_twirl.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3715-3721-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-architecture-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regenerate exact architecture certificate
        run: |
          mkdir -p evidence/pass3715_3721
          cp data/PART_BT3715_BT3721_CARRIER_TOURNAMENT_PROCESS_BUDGET_IDENTIFICATION_SCHEDULER_TWIRL_results.json /tmp/frozen3721.json
          python analysis/bt3715_3721_carrier_tournament_process_budget_identification_scheduler_twirl.py --json evidence/pass3715_3721/results.json | tee evidence/pass3715_3721/exact.log
          grep -F 'PASS_7_FRONTS 2f934b56ba757c94c7b1c46396691dbc417a37aa0b5a07cf762067449705d9b1' evidence/pass3715_3721/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('evidence/pass3715_3721/results.json').read_text())
          old=json.loads(Path('/tmp/frozen3721.json').read_text())
          assert got==old
          assert got['passes']['3720_bonkers_optimal_four_tick_syndrome_plane']['round_count']==4
          assert got['passes']['3721_bonkers_rank_three_symmetry_twirl']['ordered_pair_orbit_sizes']==[40,480,1080]
          print('PASS frozen semantic equality')
          PY
      - name: Focused regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q tests/test_bt3715_bt3721_carrier_tournament_process_budget_identification_scheduler_twirl.py | tee evidence/pass3715_3721/pytest.log
          git diff --check
      - name: Verify manuscript and public reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          ours='analysis/BT3715_BT3721_carrier_tournament_process_budget_identification_scheduler_twirl_insert'
          assert inputs.count(ours)==1
          assert Path(ours+'.tex').is_file()
          assert 'bt3715-3721-carrier-tournament-process-budget-identification-scheduler-twirl' in Path('docs/index.html').read_text()
          assert Path('docs/carrier-tournament-process-budget-identification.html').is_file()
          print('PASS current-frontier and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3715_3721/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3715_3721/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3715-3721-exact-architecture-papers
          path: |
            evidence/pass3715_3721/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
