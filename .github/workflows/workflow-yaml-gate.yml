name: Workflow YAML gate

# WHY THIS EXISTS
#
# Six workflow files in this repository could not be parsed by GitHub and failed on every
# single trigger. They were invisible as a class because a broken workflow still appears in
# the run list -- just listed by FILE PATH instead of by its `name:` field, which is easy to
# read as an ordinary failure.
#
# Two fault classes, both genuine YAML violations rather than GitHub quirks:
#
#   1. an unquoted scalar containing ": "
#        run: echo 'Disabled: GitHub Pages must remain on master:/docs.'
#      YAML reads `run: echo 'Disabled` and then chokes on the second colon.
#
#   2. GitHub expression syntax inside a YAML flow mapping
#        concurrency: {group: pass4065-4072-<github.ref expression>, cancel-in-progress: true}
#      Block style tolerates the expression braces; inside `{ }` the nested braces can make
#      the YAML scalar ambiguous unless the value is quoted.
#
# Both are one-line fixes (quote the value). This job blocks, because a workflow that
# cannot be parsed is not a failing test -- it is a test that never ran.
#
# IMPORTANT: do not place a literal GitHub expression opener followed by an empty body in
# this workflow's own `run:` text. GitHub expands expressions before the shell starts, so a
# diagnostic string can otherwise invalidate the checker itself before it creates a job.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "workflow-yaml-gate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  parse:
    name: every workflow file must parse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Parse all workflow YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          files = sorted(glob.glob('.github/workflows/*.yml') +
                         glob.glob('.github/workflows/*.yaml'))
          for f in files:
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append((f, str(e).splitlines()[0]))
          print(f"{len(files)} workflow files, {len(bad)} unparseable")
          for f, e in bad:
              print(f"  {f}: {e}")
          if bad:
              print()
              print("Fix: quote the offending scalar. Common failures are an")
              print("unquoted value containing ': ' and expression braces inside a flow mapping.")
          sys.exit(1 if bad else 0)
          PY
