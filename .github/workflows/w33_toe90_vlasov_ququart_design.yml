name: TOE90 Vlasov Witting ququart 2-design and EPR witness
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe90_*.py'
      - 'analysis/2026-10-15_toe90_vlasov_witting_research.md'
      - 'data/w33_20261015_toe90_*.json'
      - 'tests/test_w33_20261015_toe90_vlasov_ququart_design.py'
      - '.github/workflows/w33_toe90_vlasov_ququart_design.yml'
  pull_request:
  workflow_dispatch:
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest -q tests/test_w33_20261015_toe90_vlasov_ququart_design.py
      - run: python -m analysis.w33_20261015_toe90_vlasov_ququart_design
      - run: python -m analysis.w33_20261015_toe90_witting_shot_certification
      - run: git diff --exit-code -- data/w33_20261015_toe90_vlasov_ququart_design.json data/w33_20261015_toe90_witting_shot_certification.json
