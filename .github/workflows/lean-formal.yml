name: Lean formal verification

on:
  push:
    branches: [master, "agent/**"]
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches: [master]
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:
  # The path filter above means this job only runs when formal/ changes, so the
  # library can rot for weeks behind a green badge while mathlib moves under it.
  # Two of the breakages found on 2026-07-26 were exactly that: a mathlib module
  # that had been renamed upstream, and one that no longer existed at all.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and attempt kernel build
        id: lean-setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--quiet"
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-github-cache: false
      - name: Capture kernel build logs
        id: kernel
        shell: bash
        # BUILD ONE MODULE AT A TIME.  A single `lake build --wfail` at default
        # parallelism produced ~14 spurious `failed to read file *.olean` errors,
        # each naming a DIFFERENT mathlib file at line 1:0 -- file-handle
        # contention, not breakage.  Building the modules serially produced ZERO.
        # Those phantom errors are indistinguishable from real ones in a log, so
        # a parallel build cannot be used to decide whether the library is sound.
        #
        # The loop is driven by W33.lean's own import list, so a module that is
        # never imported is never built -- which is the intended behaviour
        # (Pass828CoalescenceArithmetic is deliberately excluded), but it means
        # the count below is of IMPORTED modules, not of files on disk.
        run: |
          set +e
          cd formal
          lake update > "$RUNNER_TEMP/lake-update.log" 2>&1
          update_status=$?
          if [ "$update_status" -eq 0 ]; then
            : > "$RUNNER_TEMP/lean-build.log"
            build_status=0
            failed=0
            total=0
            for m in $(grep -oE '^import (W33\.\S+)' W33.lean | sed 's/import //'); do
              total=$((total + 1))
              if ! lake build --wfail "$m" >> "$RUNNER_TEMP/lean-build.log" 2>&1; then
                printf 'FAILED: %s\n' "$m" >> "$RUNNER_TEMP/lean-build.log"
                failed=$((failed + 1))
                build_status=1
              fi
            done
            printf '\n%s of %s imported modules failed --wfail\n' \
              "$failed" "$total" >> "$RUNNER_TEMP/lean-build.log"
            # a phantom-olean count > 0 means the serial guarantee was violated
            phantom=$(grep -c 'failed to read file' "$RUNNER_TEMP/lean-build.log")
            printf 'phantom olean errors: %s (expected 0 when serial)\n' \
              "$phantom" >> "$RUNNER_TEMP/lean-build.log"
          else
            printf 'lake update failed; build not run\n' > "$RUNNER_TEMP/lean-build.log"
            build_status=99
          fi
          printf '%s\n' "$update_status" > "$RUNNER_TEMP/update-status.txt"
          printf '%s\n' "$build_status" > "$RUNNER_TEMP/build-status.txt"
          exit 0
      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-diagnostics
          path: |
            ${{ runner.temp }}/lake-update.log
            ${{ runner.temp }}/lean-build.log
            ${{ runner.temp }}/update-status.txt
            ${{ runner.temp }}/build-status.txt
          if-no-files-found: error
      - name: Enforce kernel success
        shell: bash
        run: |
          test "$(cat "$RUNNER_TEMP/update-status.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/build-status.txt")" = "0"

  independent-leanchecker:
    runs-on: ubuntu-latest
    needs: kernel-build
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders
        shell: bash
        run: |
          if grep -R -n -E '^[[:space:]]*(sorry|admit)\b' formal --include='*.lean'; then
            exit 1
          fi
      - name: Set up Lean and build environment
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--quiet"
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-github-cache: false
      - name: Capture independent leanchecker log
        shell: bash
        run: |
          set +e
          cd formal
          lake update > "$RUNNER_TEMP/checker-update.log" 2>&1
          update_status=$?
          if [ "$update_status" -eq 0 ]; then
            # serial for the same reason as the kernel job above
            : > "$RUNNER_TEMP/checker-build.log"
            build_status=0
            for m in $(grep -oE '^import (W33\.\S+)' W33.lean | sed 's/import //'); do
              lake build --quiet "$m" >> "$RUNNER_TEMP/checker-build.log" 2>&1 || build_status=1
            done
          else
            printf 'lake update failed; build not run\n' > "$RUNNER_TEMP/checker-build.log"
            build_status=99
          fi
          if [ "$build_status" -eq 0 ]; then
            lake env leanchecker > "$RUNNER_TEMP/leanchecker.log" 2>&1
            checker_status=$?
          else
            printf 'lake build failed; leanchecker not run\n' > "$RUNNER_TEMP/leanchecker.log"
            checker_status=99
          fi
          printf '%s\n' "$update_status" > "$RUNNER_TEMP/checker-update-status.txt"
          printf '%s\n' "$build_status" > "$RUNNER_TEMP/checker-build-status.txt"
          printf '%s\n' "$checker_status" > "$RUNNER_TEMP/leanchecker-status.txt"
          exit 0
      - name: Upload leanchecker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanchecker-diagnostics
          path: |
            ${{ runner.temp }}/checker-update.log
            ${{ runner.temp }}/checker-build.log
            ${{ runner.temp }}/leanchecker.log
            ${{ runner.temp }}/checker-update-status.txt
            ${{ runner.temp }}/checker-build-status.txt
            ${{ runner.temp }}/leanchecker-status.txt
          if-no-files-found: error
      - name: Enforce independent leanchecker success
        shell: bash
        run: |
          test "$(cat "$RUNNER_TEMP/checker-update-status.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/checker-build-status.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/leanchecker-status.txt")" = "0"
