name: Lean formal verification

on:
  push:
    branches: [master, "agent/**"]
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches: [master]
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lean kernel build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--wfail --quiet"
          test: false
          lint: false
          nanoda: false
          use-github-cache: false

  independent-nanoda:
    runs-on: ubuntu-latest
    needs: kernel-build
    steps:
      - uses: actions/checkout@v4
      - name: Independent nanoda verification
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--quiet"
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
          use-github-cache: false
