name: Passes12186-12188 native covers, logical action and lattice repair
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12186_context_cover_holonomy.py'
      - 'tests/test_w33_pass12186_context_cover_holonomy.py'
      - 'analysis/w33_pass12187_logical_jordan_affine_proof.py'
      - 'tests/test_w33_pass12187_logical_jordan_affine_proof.py'
      - 'data/w33_pass12186_context_cover_holonomy.json'
      - 'data/w33_pass12187_logical_jordan_affine_proof.json'
      - 'analysis/w33_pass12188_native_period_symplectic_repair.py'
      - 'tests/test_w33_pass12188_native_period_symplectic_repair.py'
      - 'data/w33_pass12188_native_period_symplectic_repair.json'
      - '.github/workflows/pass12186-context-cover.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy sympy==1.14.0 networkx mpmath pytest
      - name: Frozen certificate and independent controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12186_context_cover_holonomy.py tests/test_w33_pass12187_logical_jordan_affine_proof.py tests/test_w33_pass12188_native_period_symplectic_repair.py
      - name: Regenerate complete native classification
        run: python analysis/w33_pass12186_context_cover_holonomy.py
      - name: Regenerate affine proof controls
        run: python analysis/w33_pass12187_logical_jordan_affine_proof.py
      - name: Regenerate native period repair and logical compiler
        run: python analysis/w33_pass12188_native_period_symplectic_repair.py
      - name: Regenerated independent controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12186_context_cover_holonomy.py tests/test_w33_pass12187_logical_jordan_affine_proof.py tests/test_w33_pass12188_native_period_symplectic_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: passes12186-12188-certificates
          path: |
            data/w33_pass12186_context_cover_holonomy.json
            data/w33_pass12187_logical_jordan_affine_proof.json
            data/w33_pass12188_native_period_symplectic_repair.json
