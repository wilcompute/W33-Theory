name: Sage Frontier Exact External Checks

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sage-frontier-exact.yml'
      - 'analysis/w33_pass7581_7588_sporadic_character_restrictions.g'
      - 'analysis/w33_pass7597_7604_explicit_3360_conjugacy.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      W33_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GAP and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-atlasrep gap-character-tables
          python -m pip install --upgrade pip
          pip install numpy sympy networkx
          mkdir -p artifacts data

      - name: Restrict Baby Monster and Monster characters
        run: |
          gap -q analysis/w33_pass7581_7588_sporadic_character_restrictions.g \
            | tee artifacts/pass7581_character_restrictions.log \
            | tee data/PART_W33_PASS7581_7588_SPORADIC_CHARACTER_RESTRICTIONS.txt

      - name: Freeze character-restriction output on master
        run: |
          git config user.name 'w33-exact-frontier-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/PART_W33_PASS7581_7588_SPORADIC_CHARACTER_RESTRICTIONS.txt
          if git diff --cached --quiet; then
            echo 'Character output unchanged.'
          else
            git commit -m 'Pass7581-7588: freeze sporadic character restriction output'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi

      - name: Construct literal ATLAS-to-E8 3360 conjugacy
        run: |
          python analysis/w33_pass7597_7604_explicit_3360_conjugacy.py --seconds 900 \
            | tee artifacts/pass7597_3360_conjugacy.log

      - name: Freeze literal 3360 conjugacy on master
        run: |
          git config user.name 'w33-exact-frontier-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/PART_W33_PASS7597_7604_EXPLICIT_3360_CONJUGACY.json
          if git diff --cached --quiet; then
            echo '3360 conjugacy output unchanged.'
          else
            git commit -m 'Pass7597-7604: freeze literal ATLAS-to-E8 3360 conjugacy'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi

      - name: Upload exact frontier artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-frontier-exact-${{ github.sha }}
          path: |
            artifacts/pass7581_character_restrictions.log
            artifacts/pass7597_3360_conjugacy.log
            data/PART_W33_PASS7581_7588_SPORADIC_CHARACTER_RESTRICTIONS.txt
            data/PART_W33_PASS7597_7604_EXPLICIT_3360_CONJUGACY.json
          if-no-files-found: warn
