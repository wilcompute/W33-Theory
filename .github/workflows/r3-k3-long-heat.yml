name: R3 K3 Long Heat

on:
  workflow_dispatch:

jobs:
  k3-heat-long-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Record long heat manifest
        run: |
          python analysis/bt1010_k3_64probe_heat_driver.py --probes 64 --seed 1010

      - name: Run current K3 heat checkpoint
        run: |
          python analysis/bt1007_k3_heat_16probe_checkpoint.py

      - name: Upload heat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k3-heat-long-run-data
          path: |
            data/bt1010_k3_64probe_heat_driver.json
            data/bt1007_k3_heat_16probe_checkpoint.json
          if-no-files-found: error
