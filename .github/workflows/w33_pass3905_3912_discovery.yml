name: Pass 3905 exact API discovery
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass3905_3912_discover.py'
      - '.github/workflows/w33_pass3905_3912_discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy sympy networkx
      - run: python analysis/w33_pass3905_3912_discover.py > data/PART_3905_3912_DISCOVERY.json
      - name: publish discovery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/PART_3905_3912_DISCOVERY.json
          git diff --cached --quiet || git commit -m 'Pass 3905: publish exact verifier API discovery'
          git push
