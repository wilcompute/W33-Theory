name: Pass11664-11671 kernel dynamics
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11664_11671_kernel_dynamics.py'
      - 'analysis/PASS11664_11671_KERNEL_DYNAMICS.md'
      - 'tests/test_w33_pass11664_11671_kernel_dynamics.py'
      - 'data/w33_pass11664_11671_kernel_dynamics.json'
      - '.github/workflows/pass11664-11671-kernel-dynamics.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 sympy==1.14.0 networkx==3.6.1 pytest
      - name: Check frozen eight-interface certificate
        run: python -m pytest --noconftest -q tests/test_w33_pass11664_11671_kernel_dynamics.py
      - name: Replay exact kernels and physical dynamics
        run: python analysis/w33_pass11664_11671_kernel_dynamics.py
      - name: Audit regenerated certificate
        run: python -m pytest --noconftest -q tests/test_w33_pass11664_11671_kernel_dynamics.py
