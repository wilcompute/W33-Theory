name: Passes 1060-1064 exact certificates
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1060_*.py'
      - 'analysis/w33_pass1061_*.py'
      - 'analysis/w33_pass1062_*.py'
      - 'analysis/w33_pass1064_*.py'
      - 'data/w33_pass1060_*.json'
      - 'data/w33_pass1061_*.json'
      - 'data/w33_pass1062_*.json'
      - 'data/w33_pass1064_*.json'
      - 'tests/test_w33_pass1060_1064.py'
      - 'formal/W33/Pass1063SignedLiftObstruction.lean'
      - 'formal/W33/Pass575CyclotomicDVRKernel.lean'
      - 'formal/W33.lean'
      - 'PASS1060_1064_FIVE_STREAM_RELEASE.md'
      - '.github/workflows/pass1060_1064_exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 sympy==1.14.0 pytest==9.0.2
      - run: python analysis/w33_pass1060_minimal_signed_cover.py
      - run: python analysis/w33_pass1061_springer_embedding_decision.py
      - run: python analysis/w33_pass1062_inner48_540_geometry.py
      - run: python analysis/w33_pass1064_dual_falsifier_preregistration.py
      - run: pytest -q tests/test_w33_pass1060_1064.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
