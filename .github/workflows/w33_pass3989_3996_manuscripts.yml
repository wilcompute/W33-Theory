name: Passes 3989-3996 Manuscript Evidence
on:
  push:
    branches: [master]
    paths:
      - 'analysis/BT3989_BT3996_physical_photon_causal_memory_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/PART_3993_3996_WIGNER_SMITH_CAUSAL_MEMORY.json'
      - 'tests/test_w33_pass3989_3996_photon_breakthrough.py'
      - '.github/workflows/w33_pass3989_3996_manuscripts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pass3989-3996-manuscripts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: pytest -q tests/test_w33_pass3989_3996_photon_breakthrough.py
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile manuscript front doors
        run: |
          mkdir -p evidence/pass3989_3996
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3989_3996/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3989_3996/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3989-3996-papers
          path: |
            evidence/pass3989_3996/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
