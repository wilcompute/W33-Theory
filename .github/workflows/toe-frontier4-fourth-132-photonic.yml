name: TOE fourth-stage E6-132 mass lift and sparse photonic falsifiers
on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_fourth_hessian_census.py'
      - 'analysis/toe_20261122_e6_132_constructive_embedding.py'
      - 'analysis/toe_20261122_e6_higgs_cubic_mass_lift.py'
      - 'analysis/toe_20261122_photonic_sparse_isometry_loss.py'
      - 'analysis/toe_20261122_causal_aldous_null_control.py'
      - 'analysis/toe_20261122_20effect_Witting_context_POVM.py'
      - 'tests/test_toe_20261122_frontier4.py'
      - '.github/workflows/toe-frontier4-fourth-132-photonic.yml'
  workflow_dispatch:

jobs:
  executable-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major scientific packages
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx pytest
      - name: Run twelve focused frontier4 tests
        run: python -m pytest -q tests/test_toe_20261122_frontier4.py
      - name: Regenerate six result certificates
        run: |
          for producer in \
            toe_20261122_fourth_hessian_census \
            toe_20261122_e6_132_constructive_embedding \
            toe_20261122_e6_higgs_cubic_mass_lift \
            toe_20261122_photonic_sparse_isometry_loss \
            toe_20261122_causal_aldous_null_control \
            toe_20261122_20effect_Witting_context_POVM; do
            python analysis/${producer}.py
          done
      - name: Check strong invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=lambda x:json.loads((Path('data')/('toe_20261122_'+x+'.json')).read_text())
          assert d('fourth_hessian_census')['fourth_stage_exact_matrices']==153160632
          assert d('e6_132_constructive_embedding')['target_dimension']==132
          assert d('e6_higgs_cubic_mass_lift')['spinor_chiral_Higgs_components_not_lifted_after_gauge']==64
          assert d('photonic_sparse_isometry_loss')['rows'][0]['base']['gate_count']==138
          assert len(d('causal_aldous_null_control')['samples'])==4
          assert d('20effect_Witting_context_POVM')['number_of_outcomes']==20
          print('PASS all six frontier4 receipts')
          PY
