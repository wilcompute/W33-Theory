name: Pass 415-419 Chunk 05 Export
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  issues: read
jobs:
  export:
    if: github.head_ref == 'agent/pass415-419-five-frontiers'
    runs-on: ubuntu-24.04
    steps:
      - name: Recover observed split chunk 05
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,re,urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/117"
          issue=get(base); comments=get(base+'/comments?per_page=100'); text='\n'.join([issue['body']]+[c['body'] for c in comments])
          parts=[]
          for s in 'AB':
              m=re.findall(rf'PASS415_CHUNK_05{s}_BEGIN -->\n(.*?)\n<!-- PASS415_CHUNK_05{s}_END',text,re.S)
              if not m:raise SystemExit(f'missing 05{s}')
              parts.append(m[-1].strip())
          open('observed-chunk-05.txt','w').write(''.join(parts))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass415-419-observed-chunk-05
          path: observed-chunk-05.txt
