name: Recovery Packet

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  recovery-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Materialize recovery packet paper section
        run: |
          python tools/integrate_bt1282_recovery_packet_insert.py
      - name: Verify strict recovery certificate
        run: |
          python tools/bt1281_verify_recovery_certificate.py
      - name: Verify unified release packet
        run: |
          python tools/bt1291_verify_release_packet.py
      - name: Verify release readiness badge
        run: |
          python tools/bt1296_verify_release_readiness_badge.py
      - name: Verify paper build handshake
        run: |
          python tools/bt1300_verify_paper_build_handshake.py
      - name: Run v1 release gates
        run: |
          bash tools/bt1299_run_v1_release_gates.sh
      - name: Run v1 release lock
        run: |
          bash tools/bt1307_run_v1_release_lock.sh
      - name: Run recovery packet tests
        run: |
          python -m pytest -q tests/test_bt1274_bt1276_recovery_packet.py tests/test_bt1280_bt1282_recovery_docs.py tests/test_bt1288_readme_recovery_pointer.py tests/test_bt1295_bt1296_readiness_badge.py tests/test_bt1298_bt1300_release_gates.py tests/test_bt1302_bt1304_release_closure.py
