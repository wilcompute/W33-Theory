name: Passes 3829-3836 Adaptive Virtual Autonomous Thermo Substrate

on:
  push:
    branches: [master]
    paths:
      - 'analysis/*3829*'
      - 'analysis/*3830*'
      - 'analysis/*3831*'
      - 'analysis/*3832*'
      - 'analysis/*3833*'
      - 'analysis/*3834*'
      - 'analysis/*3835*'
      - 'analysis/*3836*'
      - 'data/PART_3829_3836*'
      - 'data/w33_pass_namespace_registry_v2.d/3829-3836.json'
      - 'tests/test_w33_pass3829_3836_adaptive_virtual_autonomous_thermo_substrate.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/adaptive-virtual-autonomous-thermo-substrate.html'
      - '.github/workflows/w33_pass3829_3836_adaptive_virtual_autonomous_thermo_substrate.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3829-3836-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-adaptive-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy==2.3.5
      - name: Regenerate frozen semantic certificate
        run: |
          mkdir -p evidence/pass3829_3836
          python analysis/w33_pass3829_3836_adaptive_virtual_autonomous_thermo_substrate.py --json evidence/pass3829_3836/results.json | tee evidence/pass3829_3836/exact.log
          grep -F 'PASS_8_FRONTS d924764ba5d64326fbdc8d7a6bbd8bcdff2fd08fb2a4c6560f29c53a71c29fe4' evidence/pass3829_3836/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('evidence/pass3829_3836/results.json').read_text())
          frozen=json.loads(Path('data/PART_3829_3836_ADAPTIVE_VIRTUAL_AUTONOMOUS_THERMO_SUBSTRATE_results.json').read_text())
          assert got==frozen
          assert got['passes']['3830_measurement_only_virtual_w33_topology']['minimum_rounds']==12
          assert got['passes']['3834_bonkers_srg_digital_twin_checksum']['single_edge_insertion']['count']==540
          print('PASS frozen semantic equality')
          PY
      - name: Focused exact regression
        run: |
          pytest -q tests/test_w33_pass3829_3836_adaptive_virtual_autonomous_thermo_substrate.py | tee evidence/pass3829_3836/pytest.log
          git diff --check
      - name: Verify manuscript, restored-site, and public reachability
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          ours='analysis/BT3829_BT3836_adaptive_virtual_autonomous_thermo_substrate_insert'
          assert inputs.count(ours)==1
          assert Path(ours+'.tex').is_file()
          assert Path('analysis/BT3829_BT3836_adaptive_virtual_autonomous_thermo_substrate_index_insert.html').is_file()
          assert Path('docs/adaptive-virtual-autonomous-thermo-substrate.html').is_file()
          sha=subprocess.check_output(['git','hash-object','docs/index.html'],text=True).strip()
          assert sha=='41a8d733f42da18282fa276f5d2fa82bac7516f6',sha
          print('PASS current-frontier, restored index, and public reachability')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass3829-3836-exact-adaptive-evidence
          path: evidence/pass3829_3836/**

  manuscripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass3829_3836
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3829_3836/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3829_3836/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3829-3836-papers
          path: |
            evidence/pass3829_3836/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
