name: Passes 4137-4144 Protected Frontier Reconcile
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_pass4137_4144_frontier.py'
      - 'analysis/BT4137_BT4144_matrix_horizon_rg_scar_curvature_insert.tex'
      - 'analysis/BT4137_BT4144_matrix_horizon_rg_scar_curvature_index_insert.html'
      - 'docs/matrix-horizon-rg-scar-curvature-4137-4144.html'
      - 'analysis/BT4129_BT4136_*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - '.github/workflows/w33_pass4137_4144_frontier_reconcile.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pass4137-4144-frontier, cancel-in-progress: false}
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass4137_4144_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4137_4144_FRONTIER 1 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit manifest reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/w33_current_frontier_manifest_v1.json analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 4144: reconcile matrix horizon RG scar curvature frontier'
          git pull --rebase origin master
          python tools/integrate_pass4137_4144_frontier.py
          git add data/w33_current_frontier_manifest_v1.json analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git commit --amend --no-edit
          git push
