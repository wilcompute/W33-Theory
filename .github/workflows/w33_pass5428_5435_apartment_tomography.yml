name: W33 Pass5428-5435 apartment tomography packet

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5428_allq_oriented_apartment_tomography.py'
      - 'analysis/w33_pass5429_allq_unsigned_apartment_inverse_conditioning.py'
      - 'analysis/w33_pass5430_q3_radius10_false_vote4_frontier.py'
      - 'analysis/w33_pass5431_allodd_modular_footprint_defect_exact_sequence.py'
      - 'analysis/w33_pass5432_q5_K0_postminimum_hamming_gap.py'
      - 'analysis/w33_pass5433_allq_orientation_spectral_purifier.py'
      - 'analysis/w33_pass5434_allq_unsigned_apartment_determinant.py'
      - 'analysis/w33_pass5435_allq_unsigned_apartment_characteristic_polynomial.py'
      - 'tests/test_w33_pass5428_5435_packet.py'
      - '.github/workflows/w33_pass5428_5435_apartment_tomography.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy networkx
      - name: Replay theorem producers
        run: |
          python analysis/w33_pass5428_allq_oriented_apartment_tomography.py
          python analysis/w33_pass5429_allq_unsigned_apartment_inverse_conditioning.py
          python analysis/w33_pass5430_q3_radius10_false_vote4_frontier.py
          python analysis/w33_pass5431_allodd_modular_footprint_defect_exact_sequence.py
          python analysis/w33_pass5432_q5_K0_postminimum_hamming_gap.py
          python analysis/w33_pass5433_allq_orientation_spectral_purifier.py
          python analysis/w33_pass5434_allq_unsigned_apartment_determinant.py
          python analysis/w33_pass5435_allq_unsigned_apartment_characteristic_polynomial.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5428_5435_packet.py
