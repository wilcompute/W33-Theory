name: packet-axis and circuit Steinberg breakthroughs
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260901_packet_axis_obstruction_double_cover.py'
      - 'analysis/w33_20260901_circuit216_steinberg_router.py'
      - '.github/workflows/w33_20260901_packet_axis_circuit_router.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-packet-axis-circuit-router-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute exact G-set and Steinberg scans
        shell: bash
        run: |
          set -o pipefail
          : > analysis/PASS_20260901_PACKET_AXIS_CIRCUIT_ROUTER.log
          python analysis/w33_20260901_packet_axis_obstruction_double_cover.py 2>&1 | tee -a analysis/PASS_20260901_PACKET_AXIS_CIRCUIT_ROUTER.log
          python analysis/w33_20260901_circuit216_steinberg_router.py 2>&1 | tee -a analysis/PASS_20260901_PACKET_AXIS_CIRCUIT_ROUTER.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in [
            'data/PART_W33_20260901_PACKET_AXIS_OBSTRUCTION_DOUBLE_COVER.json',
            'data/PART_W33_20260901_CIRCUIT216_STEINBERG_ROUTER.json']:
              d=json.loads(Path(f).read_text())
              assert d.get('status')=='PASS',(f,d.get('status'))
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add data/PART_W33_20260901_PACKET_AXIS_OBSTRUCTION_DOUBLE_COVER.json \
            data/PART_W33_20260901_CIRCUIT216_STEINBERG_ROUTER.json
          git add -f analysis/PASS_20260901_PACKET_AXIS_CIRCUIT_ROUTER.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze packet-axis cover and circuit Steinberg router'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
