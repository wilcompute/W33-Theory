name: Pass12034-12038 joint mechanism tests
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12034_12038_joint_mechanisms.py'
      - 'tests/test_w33_pass12034_12038_joint_mechanisms.py'
      - '.github/workflows/pass12034-12038-joint-mechanisms.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen certificate and prior controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12034_12038_joint_mechanisms.py tests/test_w33_pass12026_12033_physical_connections.py
      - name: Regenerate all five investigations
        run: python analysis/w33_pass12034_12038_joint_mechanisms.py
      - name: Regenerated independent controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12034_12038_joint_mechanisms.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass12034-12038-joint-mechanisms
          path: data/w33_pass12034_12038_joint_mechanisms.json
