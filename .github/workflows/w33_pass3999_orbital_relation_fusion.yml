name: Pass 3999 Orbital Fourier and Relation Fusion
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass3999_orbital_relation_fusion.py'
      - 'analysis/w33_pass3983_orbital_central_fourier.py'
      - 'data/.bootstrap/PART_3973_3980_RANK48_TENSOR.b64'
      - '.github/workflows/w33_pass3999_orbital_relation_fusion.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pass3999-orbital-relation-fusion, cancel-in-progress: false}
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - run: python analysis/w33_pass3983_orbital_central_fourier.py | tee /tmp/fourier.log
      - run: python analysis/w33_pass3999_orbital_relation_fusion.py | tee /tmp/fusion.log
      - run: grep -F 'PASS_ORBITAL_CENTRAL_FOURIER' /tmp/fourier.log && grep -F 'PASS_ORBITAL_RELATION_FUSION' /tmp/fusion.log
      - name: Commit exact outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/PART_3983_ORBITAL_CENTRAL_FOURIER.json data/PART_3999_ORBITAL_RELATION_FUSION.json
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 3999: freeze literal orbital Fourier and relation fusion evidence'
          git pull --rebase origin master
          git push
