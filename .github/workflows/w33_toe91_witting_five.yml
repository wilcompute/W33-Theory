name: TOE91 five Witting quantum communication checks
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe91_*.py'
      - 'analysis/2026-10-15_toe91_witting_five.md'
      - 'data/w33_20261015_toe91_*.json'
      - 'tests/test_w33_20261015_toe91_witting_five.py'
      - '.github/workflows/w33_toe91_witting_five.yml'
  pull_request:
  workflow_dispatch:
jobs:
  five-tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest -q tests/test_w33_20261015_toe91_witting_five.py
      - run: python -m analysis.w33_20261015_toe91_symplectic_phase_audit
      - run: python -m analysis.w33_20261015_toe91_symplectic_unitary_lift
      - run: python -m analysis.w33_20261015_toe91_finitekey_analyzer_carrier
      - run: git diff --exit-code -- data/w33_20261015_toe91_finitekey_analyzer_carrier.json data/w33_20261015_toe91_symplectic_phase_audit.json data/w33_20261015_toe91_symplectic_unitary_lift.json
