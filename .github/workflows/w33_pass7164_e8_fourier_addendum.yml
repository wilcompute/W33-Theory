name: W33 Pass7164 E8 Fourier addendum

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7164_e8_fourier_addendum.py'
      - 'analysis/w33_pass7163_7170_e8_hexagonal_lift.py'
      - 'tests/test_w33_pass7164_e8_fourier_addendum.py'
      - '.github/workflows/w33_pass7164_e8_fourier_addendum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact cyclotomic replay
        run: python analysis/w33_pass7164_e8_fourier_addendum.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass7164_e8_fourier_addendum.py
      - name: Freeze canonical certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/PART_W33_PASS7164_E8_FOURIER_ADDENDUM.json
          if git diff --cached --quiet; then exit 0; fi
          cp data/PART_W33_PASS7164_E8_FOURIER_ADDENDUM.json /tmp/pass7164_fourier.json
          git reset --hard HEAD
          git fetch origin master
          git rebase origin/master
          cp /tmp/pass7164_fourier.json data/PART_W33_PASS7164_E8_FOURIER_ADDENDUM.json
          git add data/PART_W33_PASS7164_E8_FOURIER_ADDENDUM.json
          git commit -m 'Pass7164: freeze replayed E8 Fourier addendum [skip ci]'
          git push origin HEAD:master
