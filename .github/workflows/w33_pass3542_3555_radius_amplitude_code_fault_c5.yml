name: Passes 3542-3555 Radius Amplitude Code Fault C5 Closure

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3542*'
      - 'data/PART_BT3542*'
      - 'data/w33_pass_namespace_registry_v2.d/3542-3555.json'
      - 'rtl/*3542*'
      - 'rtl/w33_clebsch_double_fault_locator5.v'
      - 'tests/*3542*'
      - '.github/workflows/w33_pass3542_3555_radius_amplitude_code_fault_c5.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3542*'
      - 'data/PART_BT3542*'
      - 'rtl/*3542*'
      - 'tests/*3542*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3542-3555-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-rtl-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install --disable-pip-version-check numpy sympy numba pytest
      - name: Regenerate exact certificate
        run: |
          mkdir -p evidence/pass3542_3555
          python analysis/bt3542_3555_radius_amplitude_code_fault_c5.py | tee evidence/pass3542_3555/exact.log
          grep -F 'PASS_7_FRONTS 7f81f6763278f1e1fad5fafb0ea63c9b1b7c9518cbb9b0fd24375eb5832812a3' evidence/pass3542_3555/exact.log
      - name: Focused regression
        run: |
          pytest -q tests/test_bt3542_3555_radius_amplitude_code_fault_c5.py | tee evidence/pass3542_3555/pytest.log
          git diff --check
      - name: Exhaust RTL distance-three locator
        run: |
          iverilog -g2012 -s tb_w33_pass3542_3555 -o evidence/pass3542_3555/tb \
            rtl/w33_clebsch_double_fault_locator5.v \
            rtl/tb_w33_pass3542_3555.v
          vvp evidence/pass3542_3555/tb | tee evidence/pass3542_3555/rtl.log
          grep -F 'PASS compound_fault_patterns=137 companion_bits=5 minimum_distance=3' evidence/pass3542_3555/rtl.log
      - name: Synthesize locator
        run: |
          yosys -p 'read_verilog rtl/w33_clebsch_double_fault_locator5.v; hierarchy -top w33_clebsch_double_fault_locator5; synth_ice40 -top w33_clebsch_double_fault_locator5; stat' \
            2>&1 | tee evidence/pass3542_3555/locator5.yosys.log
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee evidence/pass3542_3555/${source%.tex}.log
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3542_3555/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3542-3555-radius-amplitude-code-fault-c5-evidence
          path: |
            evidence/pass3542_3555/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
