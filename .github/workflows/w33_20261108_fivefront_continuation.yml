name: W33 five-front next independent checks
on:
  push:
    branches: [master]
    paths:
      - "analysis/w33_20261108_fivefront_continuation.py"
      - "tests/test_w33_20261108_fivefront_continuation.py"
      - "analysis/PASS20261108_FIVEFRONT_FOLLOWTHROUGH.md"
      - ".github/workflows/w33_20261108_fivefront_continuation.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  certified:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Run all thirteen targeted falsifier regressions
        run: python -m pytest -q tests/test_w33_20261108_fivefront_continuation.py
      - name: Generate finite result certificate from tracked sources
        run: python analysis/w33_20261108_fivefront_continuation.py --root . --out data/w33_20261108_fivefront_continuation.json
      - name: Verify certificate outcomes
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/w33_20261108_fivefront_continuation.json'))
          assert d['gauge']['H1']==46
          assert d['gauge']['translation_invariants']==0
          assert d['flavor']['E6_original']['mass_rank']==[78,79]
          assert [r['q'] for r in d['higher_q']['checked_primes'] if r['strictly_excluded']]==[5,7,11]
          assert d['optics']['full_matrix_residual'] < 1e-12
          assert d['provenance']['matching_line_count'] > 0
          print('Certified all five fronts:',d['provenance']['matching_line_count'],'formula source-line witnesses')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-20261108-fivefront-next-certificate
          path: data/w33_20261108_fivefront_continuation.json
          if-no-files-found: error
