name: Pass11957-11961 selection completion
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass11957_11959_color_threshold_and_cp_quality.py'
      - 'analysis/w33_pass11960_11961_clebsch_and_shared_cone.py'
      - 'analysis/w33_pass11950_11951_strong_cp_divisor_and_vectorlike.py'
      - 'analysis/w33_pass11952_11955_threshold_vacuum_loop_leptons.py'
      - 'analysis/w33_pass11956_local_electric_metric.py'
      - 'data/w33_pass11957_11959_color_threshold_and_cp_quality.json'
      - 'data/w33_pass11960_11961_clebsch_and_shared_cone.json'
      - 'data/w33_pass11956_local_electric_metric.json'
      - 'tests/test_w33_pass11957_11961_selection_completion.py'
      - '.github/workflows/pass11957-11961-selection-completion.yml'
  workflow_dispatch:
jobs:
  exact-science-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 pytest==8.4.2
      - name: Frozen completion and independent controls
        run: >-
          python -m pytest --noconftest --ignore-glob=tests/test_*.py -q
          tests/test_w33_pass11957_11961_selection_completion.py
          tests/test_w33_pass11952_11956_physical_completion.py
      - name: Regenerate enhancement and quality fronts
        run: python analysis/w33_pass11957_11959_color_threshold_and_cp_quality.py
      - name: Regenerate Clebsch and shared-cone fronts
        run: python analysis/w33_pass11960_11961_clebsch_and_shared_cone.py
      - name: Independently check regenerated science
        run: >-
          python -m pytest --noconftest --ignore-glob=tests/test_*.py -q
          tests/test_w33_pass11957_11961_selection_completion.py
