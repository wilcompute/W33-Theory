name: TOE87 five independent topology and quantum-memory checks
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe87_*.py'
      - 'analysis/2026-10-15_toe87_five_followups.md'
      - 'data/w33_20261015_toe87_*.json'
      - 'tests/test_w33_20261015_toe87_all_five.py'
      - '.github/workflows/w33_toe87_five_followups.yml'
  pull_request:
  workflow_dispatch:
jobs:
  reproducible-exact-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy sympy scipy
      - run: python -m pytest -q tests/test_w33_20261015_toe87_all_five.py
      - run: python -m analysis.w33_20261015_toe87_modular_bockstein_triples
      - run: python -m analysis.w33_20261015_toe87_euler_stable_module
      - run: python -m analysis.w33_20261015_toe87_fault_aware_routing
      - run: python -m analysis.w33_20261015_toe87_adversarial_temporal
      - run: git diff --exit-code -- data/w33_20261015_toe87_modular_bockstein_triples.json data/w33_20261015_toe87_euler_stable_module.json data/w33_20261015_toe87_fault_aware_routing.json
