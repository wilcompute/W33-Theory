name: Pass 2937-2945 Global Code Landauer OAM
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  exact-rtl-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Exact certificate
        run: |
          python analysis/bt2937_2945_global_code_landauer_oam.py
          python analysis/bt2937_2945_global_code_landauer_oam.py --verify-frozen
          pytest -q tests/test_bt2937_2945_global_code_landauer_oam.py
      - name: Install hardware tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys nextpnr-ice40 fpga-icestorm
      - name: Simulate and synthesize codec
        run: |
          iverilog -g2012 -s tb_w33_pass2938_isodual_support_codec -o /tmp/codec.vvp rtl/w33_pass2938_isodual_support_codec.sv rtl/tb_w33_pass2938_isodual_support_codec.sv
          vvp /tmp/codec.vvp
          yosys -p 'read_verilog -sv rtl/w33_pass2938_isodual_support_codec.sv; synth_ice40 -top w33_pass2938_isodual_support_decoder -json /tmp/decoder.json; stat' | tee data/PART_BT2938_DECODER_yosys.log
          nextpnr-ice40 --hx8k --package ct256 --json /tmp/decoder.json --asc /tmp/decoder.asc --freq 12 --pcf-allow-unconstrained |& tee data/PART_BT2938_DECODER_nextpnr.log
      - name: Integrate canonical artifacts
        run: python tools/integrate_bt2937_bt2945.py
      - uses: tectonic-typesetting/setup-tectonic@v1
      - name: Compile manuscripts
        run: |
          tectonic --keep-logs holonet_machine_blueprint.tex
          tectonic --keep-logs w33_paper.tex
          tectonic --keep-logs photonic_holonet.tex
          ! grep -E 'Overfull|Undefined control sequence|Emergency stop' *.log
      - name: Drift audit
        run: |
          python tools/integrate_bt2937_bt2945.py
          python analysis/bt2937_2945_global_code_landauer_oam.py --verify-frozen
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: pass2937-2945-evidence
          path: |
            data/PART_BT2937_BT2945_GLOBAL_CODE_LANDAUER_OAM_results.json
            data/PART_BT2938_DECODER_*.log
            holonet_machine_blueprint.pdf
            w33_paper.pdf
            photonic_holonet.pdf
            *.log
