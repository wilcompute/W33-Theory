name: W33 temporal GC replay
on:
  push:
    paths:
      - 'analysis/w33_temporal_merkle_gc.py'
      - 'analysis/w33_async_schedule_replay.py'
      - 'tests/test_w33_temporal_gc_replay.py'
      - '.github/workflows/w33_20260902_temporal_gc_replay.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run temporal storage and replay tests
        run: python -m unittest tests/test_w33_temporal_gc_replay.py -v
      - name: Run temporal storage and replay certificates
        run: |
          python analysis/w33_temporal_merkle_gc.py >/tmp/temporal-gc.json
          python analysis/w33_async_schedule_replay.py >/tmp/async-replay.json
