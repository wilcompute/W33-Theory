name: W33 Pass5588-5594 Reye PSL2 permutation frame

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5580_5585_reye_psl2_permutation_frame.py'
      - 'analysis/w33_pass5586_binary_psl2_permutation_span_rank.py'
      - 'analysis/PASS5580_5585_reye_psl2_permutation_frame.md'
      - 'analysis/PASS5580_5585_reye_psl2_permutation_frame_insert.tex'
      - 'analysis/PASS5586_binary_psl2_permutation_span_rank_insert.tex'
      - 'analysis/PASS5588_5594_reye_psl2_permutation_frame_insert.tex'
      - 'analysis/PASS5588_5594_index_insert.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'tests/test_w33_pass5580_5585_reye_psl2_permutation_frame.py'
      - 'tests/test_w33_pass5586_binary_psl2_permutation_span_rank.py'
      - 'data/PART_W33_PASS5586_BINARY_PSL2_PERMUTATION_SPAN_RANK_summary.json'
      - 'data/w33_pass_namespace_registry_v2.d/5588-5595.json'
      - 'data/w33_publication_frontier_contract_v2.json'
      - '.github/workflows/w33_pass5580_5585_reye_psl2_permutation_frame.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Replay canonical Pass5588-5594 producers
        run: |
          # Producer filenames retain provisional numbers for immutable audit history.
          python analysis/w33_pass5580_5585_reye_psl2_permutation_frame.py
          python analysis/w33_pass5586_binary_psl2_permutation_span_rank.py
      - name: Focused regression
        run: |
          python -m pytest -q tests/test_w33_pass5580_5585_reye_psl2_permutation_frame.py
          python -m pytest -q tests/test_w33_pass5586_binary_psl2_permutation_span_rank.py
      - name: Materialize homepage and audit publication DAG
        run: |
          python tools/integrate_bt3376_bt3389.py --report /tmp/public-integration.json
          python analysis/w33_pass5364_publication_dag_audit.py --report /tmp/publication-dag.json
          test "$(grep -c 'id=\"pass-5588-5594-reye-psl2-permutation-frame\"' docs/index.html)" -eq 1
          test "$(grep -c 'id=\"pass-5580-5585-reye-psl2-permutation-frame\"' docs/index.html || true)" -eq 0
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass5588_5594
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5588_5594/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5588_5594/pdf_sha256.txt
      - name: Freeze regenerated certificates and homepage materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/PART_W33_PASS5580_5585_REYE_PSL2_PERMUTATION_FRAME.json \
            data/PART_W33_PASS5586_BINARY_PSL2_PERMUTATION_SPAN_RANK.json \
            docs/index.html
          if git diff --cached --quiet; then
            echo 'Certificates and canonical homepage card already materialized.'
          else
            git commit -m 'Freeze Pass5588-5594 certificates and homepage card [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass5588-5594-reye-psl2-permutation-frame
          path: evidence/pass5588_5594/**
