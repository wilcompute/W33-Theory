name: W33 pytest failure probe
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  first-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run first failing test only
        run: pytest -q --tb=short --maxfail=1
