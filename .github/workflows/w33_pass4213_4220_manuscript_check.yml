name: Passes 4213-4220 manuscript compile check
on:
  push:
    paths:
      - 'analysis/BT4213_BT4220_small_cover_su4_quantum_hysteresis_clock_hawking_pell_vacuum_velocity_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4213_4220_manuscript_check.yml'
  workflow_dispatch:
jobs:
  tectonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      - name: Compile manuscripts
        run: |
          mkdir -p /tmp/pass4213-4220
          for f in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs --keep-intermediates "$f" |& tee "/tmp/pass4213-4220/${f%.tex}.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pass4213-4220-manuscript-evidence
          path: |
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
            /tmp/pass4213-4220/*.log
