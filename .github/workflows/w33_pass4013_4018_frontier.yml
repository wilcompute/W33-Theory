name: Passes 4013-4018 Protected Frontier
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_pass4013_4018_frontier.py'
      - 'analysis/BT4013_BT4018_incidence_link_h1_memory_insert.tex'
      - 'analysis/BT4013_BT4018_incidence_link_h1_memory_index_insert.html'
      - 'docs/photon-incidence-link-h1-memory.html'
      - '.github/workflows/w33_pass4013_4018_frontier.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: pass4013-4018-frontier
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass4013_4018_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4013_4018_FRONTIER 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/w33_current_frontier_manifest_v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 4018: reconcile incidence-link H1 memory frontier'
          git pull --rebase origin master
          git push
