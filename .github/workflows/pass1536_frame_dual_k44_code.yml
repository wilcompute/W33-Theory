name: Pass 1536 Frame-Dual K44 Code

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/w33_pass1536_frame_dual_k44_code.py'
      - 'analysis/BT1536_frame_dual_k44_code.md'
      - 'analysis/BT1536_frame_dual_k44_code_insert.tex'
      - 'data/w33_pass1536_frame_dual_k44_code.json'
      - 'tests/test_w33_pass1536_frame_dual_k44_code.py'
      - '.github/workflows/pass1536_frame_dual_k44_code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check numpy networkx scipy pytest
      - run: python -m py_compile analysis/w33_pass1536_frame_dual_k44_code.py
      - run: python analysis/w33_pass1536_frame_dual_k44_code.py --check
      - run: pytest -q tests/test_w33_pass1536_frame_dual_k44_code.py
