name: Passes 3542-3548 Borel Commutant Outer S6

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3542*'
      - 'analysis/*3543*'
      - 'analysis/*3544*'
      - 'analysis/*3545*'
      - 'analysis/*3546*'
      - 'analysis/*3547*'
      - 'analysis/*3548*'
      - 'data/PART_BT3542*'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'data/w33_pass_namespace_registry_v2.d/3542-3548.json'
      - 'docs/borel-commutant-outer-s6.html'
      - 'docs/index.html'
      - 'tests/test_bt3542_bt3548_borel_commutant_outer_s6_analytic.py'
      - '.github/workflows/w33_pass3542_3548_borel_commutant_outer_s6.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3542*'
      - 'analysis/*3543*'
      - 'analysis/*3544*'
      - 'analysis/*3545*'
      - 'analysis/*3546*'
      - 'analysis/*3547*'
      - 'analysis/*3548*'
      - 'data/PART_BT3542*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/borel-commutant-outer-s6.html'
      - 'docs/index.html'
      - 'tests/test_bt3542_bt3548_borel_commutant_outer_s6_analytic.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3542-3548-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-packet-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy sympy
      - name: Regenerate and compare exact certificate
        run: |
          mkdir -p evidence/pass3542_3548
          cp data/PART_BT3542_BT3548_BOREL_COMMUTANT_OUTER_S6_ANALYTIC_results.json /tmp/frozen3542.json
          python analysis/bt3542_3548_borel_commutant_outer_s6_analytic.py | tee evidence/pass3542_3548/exact.log
          grep -F 'PASS_7_FRONTS a98621cc2f2378eaed09b8f747022f419a16fbb33433336eeb8f2414f4273f1a' evidence/pass3542_3548/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('data/PART_BT3542_BT3548_BOREL_COMMUTANT_OUTER_S6_ANALYTIC_results.json').read_text())
          frozen=json.loads(Path('/tmp/frozen3542.json').read_text())
          assert generated==frozen
          print('PASS semantic frozen-certificate equality')
          PY
          cp /tmp/frozen3542.json data/PART_BT3542_BT3548_BOREL_COMMUTANT_OUTER_S6_ANALYTIC_results.json
      - name: Focused regression and proof-DAG controls
        run: |
          pytest -q tests/test_bt3542_bt3548_borel_commutant_outer_s6_analytic.py | tee evidence/pass3542_3548/pytest.log
          python analysis/bt3544_clique_proof_dag.py --self-test | tee evidence/pass3542_3548/proof_dag_selftest.log
          grep -F 'PASS_CLIQUE_PROOF_DAG_SELF_TESTS' evidence/pass3542_3548/proof_dag_selftest.log
          git diff --check
      - name: Verify manuscript and public reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          stem='analysis/BT3542_BT3548_borel_commutant_outer_s6_analytic_insert'
          assert inputs[-1]==stem
          assert Path(stem+'.tex').is_file()
          assert Path('docs/borel-commutant-outer-s6.html').is_file()
          assert 'bt3542-3548-borel-commutant-outer-s6-analytic' in Path('docs/index.html').read_text()
          print('PASS current-frontier and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3542_3548/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3542_3548/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3542-3548-exact-packet-papers
          path: |
            evidence/pass3542_3548/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf

  proof-carrying-star-clique-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Build all 3720 independently checkable proof DAGs
        run: |
          mkdir -p evidence/pass3542_3548
          python analysis/bt3544_clique_proof_dag.py \
            --json evidence/pass3542_3548/clique_proof_dags.json \
            | tee evidence/pass3542_3548/clique_proof_dags.log
          grep -F 'PASS_STAR_CLIQUE_PROOF_DAGS' evidence/pass3542_3548/clique_proof_dags.log
      - uses: actions/upload-artifact@v4
        with:
          name: pass3544-star-clique-proof-dags
          compression-level: 9
          path: evidence/pass3542_3548/**
