name: Passes 871-875 computation
on:
  pull_request:
    branches: [master]
    paths:
      - '.compute/**'
      - '.github/workflows/pass871_875_compute.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct exact sources
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            w33_pass871_atlas_standard_conjugacy \
            w33_pass872_heisenberg_loewy_basis \
            w33_pass873_scalar_schur_factor_set \
            w33_pass874_adaptive_audit_regret_game \
            w33_pass875_hardware_phase_dispatcher
          do
            cat .compute/${stem}.part* | base64 -d | gzip -d > analysis/${stem}.py
          done
          python -m compileall -q analysis/w33_pass87*.py
      - name: Commit reconstructed sources
        shell: bash
        run: |
          git config user.name 'w33-compute[bot]'
          git config user.email 'w33-compute[bot]@users.noreply.github.com'
          git add analysis/w33_pass871_*.py analysis/w33_pass872_*.py analysis/w33_pass873_*.py analysis/w33_pass874_*.py analysis/w33_pass875_*.py
          git diff --cached --quiet || git commit -m 'Passes 871-875: materialize exact sources'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
  compute:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: '871'
            script: analysis/w33_pass871_atlas_standard_conjugacy.py
          - pass: '872'
            script: analysis/w33_pass872_heisenberg_loewy_basis.py
          - pass: '873'
            script: analysis/w33_pass873_scalar_schur_factor_set.py
          - pass: '874'
            script: analysis/w33_pass874_adaptive_audit_regret_game.py
          - pass: '875'
            script: analysis/w33_pass875_hardware_phase_dispatcher.py
    name: Compute ${{ matrix.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy sympy pytest
      - name: Execute pass
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python "${{ matrix.script }}" 2>&1 | tee "pass-${{ matrix.pass }}.log"
          python "${{ matrix.script }}" --check 2>&1 | tee -a "pass-${{ matrix.pass }}.log"
      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-${{ matrix.pass }}-log
          path: pass-${{ matrix.pass }}.log
      - name: Upload deterministic outputs
        if: steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pass-${{ matrix.pass }}-outputs
          if-no-files-found: error
          path: |
            data/w33_pass${{ matrix.pass }}_*.json
            hardware/w33_phase_dispatcher.h
            hardware/w33_phase_dispatcher.sv
            hardware/w33_phase_rom.mem
      - name: Enforce pass result
        if: steps.execute.outcome != 'success'
        run: exit 1
  collect:
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pass-*-outputs
          merge-multiple: true
          path: .
      - name: Commit verified outputs
        shell: bash
        run: |
          git config user.name 'w33-compute[bot]'
          git config user.email 'w33-compute[bot]@users.noreply.github.com'
          git add data/w33_pass871_*.json data/w33_pass872_*.json data/w33_pass873_*.json data/w33_pass874_*.json data/w33_pass875_*.json hardware/w33_phase_dispatcher.h hardware/w33_phase_dispatcher.sv hardware/w33_phase_rom.mem
          git diff --cached --quiet || git commit -m 'Passes 871-875: commit verified outputs'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
