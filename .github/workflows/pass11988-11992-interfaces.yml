name: Pass11988-11992 physical interface constructions
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1198[89]_*.py'
      - 'analysis/w33_pass1199[0-2]_*.py'
      - 'tests/test_w33_pass11988_11992_physical_interfaces.py'
      - '.github/workflows/pass11988-11992-interfaces.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 pytest
      - name: Frozen certificates and parallel H2 regression
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11988_11992_physical_interfaces.py tests/test_w33_20261015_toe85_h2_relation_module.py
      - name: Regenerate all five producers
        run: |
          python analysis/w33_pass11988_spinor_weil_intertwiner.py
          python analysis/w33_pass11989_joint_source_barr.py
          python analysis/w33_pass11990_odd_even_holonomic_controls.py
          python analysis/w33_pass11991_native_four_period_cover.py
          python analysis/w33_pass11992_nonlinear_einstein_benchmark.py
      - name: Verify regenerated interfaces
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11988_11992_physical_interfaces.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass11988-11992-interfaces
          path: |
            data/w33_pass1198[89]_*.json
            data/w33_pass1199[0-2]_*.json
