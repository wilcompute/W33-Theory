name: W33 punctured Hesse packet group

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_punctured_hesse_packet_group.py'
      - 'data/w33_punctured_hesse_packet_group.json'
      - 'data/w33_cz_hashimoto_orbit_weld.json'
      - 'data/w33_frequency_bin_hashimoto_compiler.json'
      - 'tests/test_w33_punctured_hesse_packet_group.py'
      - 'analysis/w33_qutrit_hamming_cross_incidence.py'
      - 'data/w33_qutrit_hamming_cross_incidence.json'
      - 'tests/test_w33_qutrit_hamming_cross_incidence.py'
      - 'analysis/w33_packet_frame_symmetry_tomography.py'
      - 'data/w33_packet_frame_symmetry_tomography.json'
      - 'tests/test_w33_packet_frame_symmetry_tomography.py'
      - 'analysis/w33_e8_holonomy_packet18_homogeneous_bridge.py'
      - 'data/w33_e8_holonomy_packet18_homogeneous_bridge.json'
      - 'tests/test_w33_e8_holonomy_packet18_homogeneous_bridge.py'
      - 'analysis/PASS20260919_punctured_hesse_packet_group_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - '.github/workflows/w33_punctured_hesse_packet_group.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: python -m pip install --disable-pip-version-check sympy pytest
      - name: Replay exact certificate
        run: |
          cp data/w33_punctured_hesse_packet_group.json /tmp/punctured.json
          cp data/w33_qutrit_hamming_cross_incidence.json /tmp/cross.json
          cp data/w33_packet_frame_symmetry_tomography.json /tmp/tomography.json
          cp data/w33_e8_holonomy_packet18_homogeneous_bridge.json /tmp/packet18.json
          python analysis/w33_punctured_hesse_packet_group.py --write
          python analysis/w33_qutrit_hamming_cross_incidence.py
          python analysis/w33_packet_frame_symmetry_tomography.py
          python analysis/w33_e8_holonomy_packet18_homogeneous_bridge.py
          python - <<'PY'
          import json
          pairs=[
            ('/tmp/punctured.json','data/w33_punctured_hesse_packet_group.json'),
            ('/tmp/cross.json','data/w33_qutrit_hamming_cross_incidence.json'),
            ('/tmp/tomography.json','data/w33_packet_frame_symmetry_tomography.json'),
            ('/tmp/packet18.json','data/w33_e8_holonomy_packet18_homogeneous_bridge.json')]
          for frozen,replayed in pairs:
              a=json.load(open(frozen)); b=json.load(open(replayed))
              assert a==b, f'semantic certificate drift: {replayed}'
          print('all four frozen certificates reproduce semantically')
          PY
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_punctured_hesse_packet_group.py tests/test_w33_qutrit_hamming_cross_incidence.py tests/test_w33_packet_frame_symmetry_tomography.py tests/test_w33_e8_holonomy_packet18_homogeneous_bridge.py
      - name: Manuscript reachability and whitespace audit
        run: |
          grep -Fq '\input{analysis/PASS20260919_punctured_hesse_packet_group_insert}' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git diff --check
