name: dual Steinberg 64/81 selector audit
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260901_double_steinberg_64_81.py'
      - '.github/workflows/w33_20260901_double_steinberg.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-double-steinberg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute exact double-Steinberg audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260901_double_steinberg_64_81.py 2>&1 | tee analysis/PASS_20260901_DOUBLE_STEINBERG.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260901_DOUBLE_STEINBERG_64_81.json').read_text())
          assert d.get('status')=='PASS'
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260901_DOUBLE_STEINBERG_64_81.json \
            analysis/PASS_20260901_DOUBLE_STEINBERG.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze dual Steinberg 64/81 selector evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
