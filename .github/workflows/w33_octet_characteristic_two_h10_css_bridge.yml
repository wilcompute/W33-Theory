name: W33 octet characteristic-two H10 CSS bridge

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_octet_characteristic_two_h10_css_bridge.py'
      - 'data/w33_octet_characteristic_two_h10_css_bridge.json'
      - '.github/workflows/w33_octet_characteristic_two_h10_css_bridge.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install numpy sympy
      - name: Reconstruct both matrices and prove T equals M transpose
        run: PYTHONPATH=. python analysis/w33_octet_characteristic_two_h10_css_bridge.py --write
      - name: Recheck materialized certificate
        run: >-
          python -c "import json; d=json.load(open('data/w33_octet_characteristic_two_h10_css_bridge.json'));
          assert d['status']=='PASS' and all(d['checks'].values());
          assert d['objectwiseIdentity']['identity'].startswith('T = M^T');
          assert d['integerAndBinaryRanks']=={'rankF2':15,'rankQ':25,'smith':{'0':15,'1':15,'2':10},'uniqueRankDropPrime':2};
          assert d['characteristicTwoShadow']['newKernelDimensionsAtTwo']==10;
          assert d['CSS']['parameters']=='[[40,10,4]]'"
      - uses: actions/upload-artifact@v4
        with:
          name: w33-octet-characteristic-two-h10-css-bridge
          path: data/w33_octet_characteristic_two_h10_css_bridge.json
          if-no-files-found: error
