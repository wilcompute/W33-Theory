name: W33 Sept22 Steiner trinification Qpsi normalizer replay
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_steiner_trinification_qpsi_normalizer.py'
      - 'analysis/w33_pass4992_4999_common.py'
      - 'data/w33_steiner_trinification_qpsi_normalizer.json'
      - 'tests/test_w33_steiner_trinification_qpsi_normalizer.py'
      - 'tests/test_w33_h27_compiler_frontier_regression.py'
      - 'analysis/w33_minimal_symmetry_changing_81_compiler.py'
      - 'data/w33_minimal_symmetry_changing_81_compiler.json'
      - '.github/workflows/w33_sept22_steiner_trinification_qpsi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy networkx pytest
      - run: PYTHONPATH=analysis:. python analysis/w33_steiner_trinification_qpsi_normalizer.py
      - run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_w33_steiner_trinification_qpsi_normalizer.py
          tests/test_w33_h27_compiler_frontier_regression.py
      - run: git diff --exit-code -- data/w33_steiner_trinification_qpsi_normalizer.json
