name: Passes 1034-1037 Selector Controller Suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/w33_pass1034_selector_orbital_algebra.py'
      - 'analysis/w33_pass1035_selector_correction_refinement.py'
      - 'analysis/w33_pass1036_six_response_photonic_falsifier.py'
      - 'analysis/w33_pass1037_minimal_external_s3_controller.g'
      - 'analysis/w33_pass1037_controller_certificate.py'
      - 'data/w33_pass1034_selector_orbital_algebra.json'
      - 'data/w33_pass1035_selector_correction_refinement.json'
      - 'data/w33_pass1036_six_response_photonic_falsifier.json'
      - '.github/workflows/pass1037-controller.yml'
  push:
    branches: [ master ]
    paths:
      - 'analysis/w33_pass1034_selector_orbital_algebra.py'
      - 'analysis/w33_pass1035_selector_correction_refinement.py'
      - 'analysis/w33_pass1036_six_response_photonic_falsifier.py'
      - 'analysis/w33_pass1037_minimal_external_s3_controller.g'
      - 'analysis/w33_pass1037_controller_certificate.py'
      - 'data/w33_pass1034_selector_orbital_algebra.json'
      - 'data/w33_pass1035_selector_correction_refinement.json'
      - 'data/w33_pass1036_six_response_photonic_falsifier.json'
      - '.github/workflows/pass1037-controller.yml'

jobs:
  selector-controller-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Regenerate Passes 1034-1036 fail closed
        run: |
          set -euo pipefail
          cp data/w33_pass1034_selector_orbital_algebra.json /tmp/pass1034.json
          cp data/w33_pass1035_selector_correction_refinement.json /tmp/pass1035.json
          cp data/w33_pass1036_six_response_photonic_falsifier.json /tmp/pass1036.json
          rm -f \
            data/w33_pass1034_selector_orbital_algebra.json \
            data/w33_pass1035_selector_correction_refinement.json \
            data/w33_pass1036_six_response_photonic_falsifier.json
          python analysis/w33_pass1034_selector_orbital_algebra.py
          python analysis/w33_pass1035_selector_correction_refinement.py
          python analysis/w33_pass1036_six_response_photonic_falsifier.py
          python - <<'PY'
          import json
          from pathlib import Path

          exact_pairs = [
              (Path('/tmp/pass1034.json'), Path('data/w33_pass1034_selector_orbital_algebra.json')),
              (Path('/tmp/pass1035.json'), Path('data/w33_pass1035_selector_correction_refinement.json')),
          ]
          for expected_path, actual_path in exact_pairs:
              expected = json.loads(expected_path.read_text(encoding='utf-8'))
              actual = json.loads(actual_path.read_text(encoding='utf-8'))
              if actual != expected:
                  raise SystemExit(f'certificate mismatch: {actual_path}')
              if actual.get('status') != 'PASS' or not all(actual.get('checks', {}).values()):
                  raise SystemExit(f'certificate did not pass: {actual_path}')

          expected = json.loads(Path('/tmp/pass1036.json').read_text(encoding='utf-8'))
          actual_path = Path('data/w33_pass1036_six_response_photonic_falsifier.json')
          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          stable_fields = [
              'schema', 'status', 'compiler_labels', 'ideal_transfer_matrices',
              'phase_orientation_readout', 'chirality_readout', 'falsifier_sequence',
              'acceptance_rule', 'boundary', 'check_count', 'checks',
          ]
          if any(actual.get(field) != expected.get(field) for field in stable_fields):
              raise SystemExit(f'stable certificate mismatch: {actual_path}')
          if actual.get('status') != 'PASS' or not all(actual.get('checks', {}).values()):
              raise SystemExit(f'certificate did not pass: {actual_path}')
          if actual['minimum_pairwise_frobenius_separation'] <= 1.0:
              raise SystemExit('Pass 1036 response separation collapsed')
          if actual['false_c6_control']['inversion_echo_residual'] <= 1.0:
              raise SystemExit('Pass 1036 false-C6 falsifier collapsed')
          print('Passes1034-1036 regeneration=PASS')
          PY

      - name: Install GAP fail closed
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gap; then
              break
            fi
            sleep $((attempt * 5))
          done
          command -v gap
          gap --version

      - name: Run Pass 1037 from source
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -f data/w33_pass1037_minimal_external_s3_controller.json
          gap -q -b --nointeract analysis/w33_pass1037_minimal_external_s3_controller.g 2>&1 | tee /tmp/pass1037.log
          ! grep -q '^Error' /tmp/pass1037.log
          test -f data/w33_pass1037_minimal_external_s3_controller.json

      - name: Validate emitted Pass 1037 certificate
        run: python analysis/w33_pass1037_controller_certificate.py

      - name: Upload selector-controller certificates
        uses: actions/upload-artifact@v4
        with:
          name: pass1034-1037-selector-controller-certificates
          path: |
            data/w33_pass1034_selector_orbital_algebra.json
            data/w33_pass1035_selector_correction_refinement.json
            data/w33_pass1036_six_response_photonic_falsifier.json
            data/w33_pass1037_minimal_external_s3_controller.json
            data/w33_pass1037_diagnostic.txt
          if-no-files-found: error
