name: TOE83 H27 tritangent CSS surgery
on:
  push:
    paths:
      - 'analysis/w33_20261015_toe83_h27_square_css_surgery.py'
      - 'analysis/w33_20261015_toe82_native_H27_h1_character.py'
      - 'data/w33_20261015_toe83_h27_square_css_surgery.json'
      - 'tests/test_w33_20261015_toe83_h27_square_css_surgery.py'
      - '.github/workflows/w33_toe83_h27_square_css_surgery.yml'
  pull_request:
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_w33_20261015_toe83_h27_square_css_surgery.py
      - run: python analysis/w33_20261015_toe83_h27_square_css_surgery.py
      - run: git diff --exit-code -- data/w33_20261015_toe83_h27_square_css_surgery.json
