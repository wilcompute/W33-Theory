name: Pass6233-6240 scaffold claim-tier repair

on:
  push:
    paths:
      - 'analysis/w33_pass6233_6240_scaffold_claim_tier_repair.py'
      - 'analysis/PASS6233_6240_scaffold_claim_tier_repair.md'
      - 'analysis/PASS6233_6240_scaffold_claim_tier_repair_insert.tex'
      - 'data/PART_W33_PASS6233_6240_SCAFFOLD_CLAIM_TIER_REPAIR.json'
      - 'tests/test_w33_pass6233_6240_scaffold_claim_tier_repair.py'
      - 'scripts/w33_ce2_k3_evidence_repair_status.py'
      - 'scripts/w33_transport_cocycle_scaffold.py'
      - 'scripts/w33_k3_witness_search_scaffold.py'
      - 'docs/pass_6189_6232_summary.md'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - '.github/workflows/w33_pass6233_6240_scaffold_claim_tier_repair.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy pytest
      - run: python analysis/w33_pass6233_6240_scaffold_claim_tier_repair.py
      - run: git diff --exit-code -- data/PART_W33_PASS6233_6240_SCAFFOLD_CLAIM_TIER_REPAIR.json
      - run: python scripts/w33_ce2_k3_evidence_repair_status.py
      - run: python scripts/w33_transport_cocycle_scaffold.py
      - run: python scripts/w33_k3_witness_search_scaffold.py
      - run: pytest -q tests/test_w33_pass6233_6240_scaffold_claim_tier_repair.py
      - run: grep -F '\input{analysis/PASS6233_6240_scaffold_claim_tier_repair_insert}%' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
