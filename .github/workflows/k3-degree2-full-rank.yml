name: K3 Degree2 Full Rank

on:
  workflow_dispatch:

jobs:
  k3-degree2-full-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run K3 degree-2 full rank
        run: |
          python analysis/bt1025_k3_degree2_full_rank_runner.py --run-full --block-size 512

      - name: Upload full rank artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-degree2-full-rank-data
          path: data/bt1025_k3_degree2_full_rank_runner.json
          if-no-files-found: error
