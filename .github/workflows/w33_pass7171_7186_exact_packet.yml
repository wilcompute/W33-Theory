name: W33 Pass7171-7186 exact packet

on:
  push:
    branches:
      - research/pass7171-7186-e8-d4-q9
    paths:
      - 'analysis/w33_pass7171_7186_aggregate.py'
      - 'analysis/w33_pass7179_d4_scheme_krein.py'
      - 'analysis/w33_pass7180_q9_local_edit_radius.py'
      - 'analysis/w33_pass7181_e6_minuscule_fiber_voltage.py'
      - 'analysis/w33_pass7182_d4_glue_spread_code.py'
      - 'analysis/w33_pass7183_c3_affine_area_cocycle.py'
      - 'analysis/w33_pass7184_spread_code_v20_v24_module.py'
      - 'analysis/w33_pass7185_e8_d4_chart_atlas.py'
      - 'analysis/w33_pass7186_e8_matter_h27_cayley.py'
      - 'tests/test_w33_pass7171_7186_exact_packet.py'
      - '.github/workflows/w33_pass7171_7186_exact_packet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/pass7171-7186-e8-d4-q9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite dependencies
        run: python -m pip install --upgrade pip numpy networkx sympy pytest
      - name: Replay D4 scheme
        run: python analysis/w33_pass7179_d4_scheme_krein.py
      - name: Replay q9 local radius
        run: python analysis/w33_pass7180_q9_local_edit_radius.py
      - name: Replay E6 matter voltage
        run: python analysis/w33_pass7181_e6_minuscule_fiber_voltage.py
      - name: Replay D4 glue and spread code
        run: python analysis/w33_pass7182_d4_glue_spread_code.py
      - name: Replay affine area cocycle
        run: python analysis/w33_pass7183_c3_affine_area_cocycle.py
      - name: Replay 1+V20 / V24 code bridge
        run: python analysis/w33_pass7184_spread_code_v20_v24_module.py
      - name: Replay E8 D4 chart atlas
        run: python analysis/w33_pass7185_e8_d4_chart_atlas.py
      - name: Replay H27 Cayley bridge
        run: python analysis/w33_pass7186_e8_matter_h27_cayley.py
      - name: Build aggregate certificate
        run: python analysis/w33_pass7171_7186_aggregate.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass7171_7186_exact_packet.py
      - name: Freeze generated certificates to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/PART_W33_PASS7179_D4_SCHEME_KREIN.json \
            data/PART_W33_PASS7180_Q9_LOCAL_EDIT_RADIUS.json \
            data/PART_W33_PASS7181_E6_MINUSCULE_FIBER_VOLTAGE.json \
            data/PART_W33_PASS7182_D4_GLUE_SPREAD_CODE.json \
            data/PART_W33_PASS7183_C3_AFFINE_AREA_COCYCLE.json \
            data/PART_W33_PASS7184_SPREAD_CODE_V20_V24_MODULE.json \
            data/PART_W33_PASS7185_E8_D4_CHART_ATLAS.json \
            data/PART_W33_PASS7186_E8_MATTER_H27_CAYLEY.json \
            data/PART_W33_PASS7171_7186_AGGREGATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pass7171-7186: freeze replayed exact certificates [skip ci]'
          git push origin HEAD:research/pass7171-7186-e8-d4-q9
