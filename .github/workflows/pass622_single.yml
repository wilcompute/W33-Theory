name: Pass 622 sequential ramification proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp python3-sympy
      - name: Export the seventeen factors
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('p616','analysis/w33_pass616_arithmetic_core_factorization.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          polys=[]
          for c in m.FACTOR_COEFFS:
              polys.append('Polrev(['+','.join(map(str,reversed(c)))+'])')
          Path('fields.gp').write_text('P=['+','.join(polys)+'];\n')
          print('fields',len(polys),'degrees',[len(c)-1 for c in m.FACTOR_COEFFS])
          PY
      - name: Compute maximal orders, discriminants and local e-f data
        run: |
          mkdir -p data
          gp -q > data/w33_pass622_ramification_raw.txt <<'GP'
          default(parisizemax, 16000000000);
          read("fields.gp");
          Q=[2,3,5,7,13];
          print("field_count=",#P);
          for(i=1,#P,
            {
              f=P[i]; pd=poldisc(f); nf=nfinit(f); D=nf.disc; z=sqrtint(abs(pd/D));
              print("BEGIN_FIELD index=",i," degree=",poldegree(f)," signature=",nf.sign);
              print("poly_disc=",pd);
              print("field_disc=",D);
              print("power_basis_index=",z);
              print("field_disc_factor=",factor(abs(D)));
              for(k=1,#Q,
                p=Q[k]; dec=idealprimedec(nf,p);
                print("LOCAL p=",p," vfield=",valuation(D,p)," vpoly=",valuation(pd,p)," vindex=",valuation(z,p)," ef=",vector(#dec,j,[dec[j][3],dec[j][4]]));
              );
              print("END_FIELD");
            }
          );
          GP
          cat data/w33_pass622_ramification_raw.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass622-ramification-atlas
          path: data/w33_pass622_ramification_raw.txt
