name: Levi v4 regression

on:
  push:
    branches: [master, "agent/**"]
    paths:
      - "analysis/w33_levi_next5_v4*.py"
      - "data/PART_2026_07_10_LEVI_NEXT5_V4*.json"
      - "tests/test_w33_levi_next5_v4.py"
      - ".github/workflows/levi-v4-python.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 networkx==3.6.1 pytest
      - name: Fresh formal witness
        run: python analysis/w33_levi_next5_v4_formal.py > /tmp/formal-v4.json
      - name: Fresh cohomology witness
        run: python analysis/w33_levi_next5_v4_cohomology.py > /tmp/cohomology-v4.json
      - name: Fresh incidence-functor witness
        run: python analysis/w33_levi_next5_v4_functor.py > /tmp/functor-v4.json
      - name: Fresh foundry witness
        run: python analysis/w33_levi_next5_v4_foundry.py > /tmp/foundry-v4.json
      - name: Fresh bounded-memory HIL witness
        run: python analysis/w33_levi_next5_v4_hil.py > /tmp/hil-v4.json
      - name: Capture focused pytest report
        shell: bash
        run: |
          set +e
          pytest -q --tb=short tests/test_w33_levi_next5_v4.py > /tmp/pytest-v4.log 2>&1
          printf '%s\n' "$?" > /tmp/pytest-v4-status.txt
          exit 0
      - name: Upload v4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-v4-diagnostics
          path: |
            /tmp/formal-v4.json
            /tmp/cohomology-v4.json
            /tmp/functor-v4.json
            /tmp/foundry-v4.json
            /tmp/hil-v4.json
            /tmp/pytest-v4.log
            /tmp/pytest-v4-status.txt
          if-no-files-found: error
      - name: Enforce focused pytest success
        run: test "$(cat /tmp/pytest-v4-status.txt)" = "0"
