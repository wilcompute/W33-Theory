name: Forty Points five physical fronts and exact clock
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20261108_forty_points_fivefronts.py'
      - 'tests/test_w33_20261108_forty_points_fivefronts.py'
      - 'analysis/PASS20261108_FORTY_POINTS_FIVE_FRONTS.md'
      - '.github/workflows/w33_20261108_forty_points_fivefronts.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-and-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic science tools
        run: python -m pip install --disable-pip-version-check numpy sympy pytest pymupdf
      - name: Nine independent regression tests
        run: python -m pytest -q tests/test_w33_20261108_forty_points_fivefronts.py
      - name: Produce five-front certificate
        run: python analysis/w33_20261108_forty_points_fivefronts.py --root . --out data/w33_20261108_forty_points_fivefronts.json
      - name: Independently verify complete Forty Points PDF and recursive TeX source
        run: |
          python - <<'PY'
          import fitz,hashlib,json,re
          from pathlib import Path
          root=Path('papers/forty_points')
          visited=set();stack=['main.tex']
          while stack:
              name=stack.pop()
              if name in visited:continue
              f=root/name
              assert f.is_file(),f'Missing TeX input: {f}'
              text=f.read_text(encoding='utf-8')
              visited.add(name)
              stack += [x+'.tex' if not x.endswith('.tex') else x for x in re.findall(r'\\(?:input|include)\{([^}]+)\}',text)]
          assert len(visited)==20,(len(visited),sorted(visited))
          p=root/'main.pdf'
          assert p.is_file()
          doc=fitz.open(str(p))
          pages=[page.get_text(sort=True) for page in doc]
          assert len(pages)==215
          assert all(page.strip() for page in pages)
          receipt={'title':'Forty Points source and PDF coverage',
                   'pdf_pages':len(pages),'pdf_total_extracted_characters':sum(map(len,pages)),
                   'pdf_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                   'pdf_page_sha256':[hashlib.sha256(x.encode()).hexdigest() for x in pages],
                   'tex_includes_total':len(visited),
                   'tex_source_sha256':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in sorted(visited)},
                   'scope':'Automated full-PDF extractable-text and recursive TeX coverage; not independent proof verification.'}
          f=Path('data/w33_20261108_forty_points_pdf_source_manifest.json')
          f.write_text(json.dumps(receipt,indent=2)+'\n')
          print('PDF pages:',receipt['pdf_pages'],'TeX files:',receipt['tex_includes_total'],'extracted chars:',receipt['pdf_total_extracted_characters'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-forty-points-five-fronts
          path: |
            data/w33_20261108_forty_points_fivefronts.json
            data/w33_20261108_forty_points_pdf_source_manifest.json
          if-no-files-found: error
