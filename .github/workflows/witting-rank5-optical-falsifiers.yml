name: Witting rank-five optical falsifiers

on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261121_fivefront_rank5_optical_noise.py'
      - 'analysis/toe_20261121_rank5_loss_mesh_break_even.py'
      - 'analysis/toe_20261121_relational_reference_pareto.py'
      - 'tests/test_toe_20261121_fivefront_rank5_optical_noise.py'
      - 'tests/test_toe_20261121_rank5_loss_mesh_break_even.py'
      - '.github/workflows/witting-rank5-optical-falsifiers.yml'
  pull_request:
    paths:
      - 'analysis/toe_20261121_fivefront_rank5_optical_noise.py'
      - 'analysis/toe_20261121_relational_reference_pareto.py'
      - 'tests/test_toe_20261121_fivefront_rank5_optical_noise.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-reproduction:
    name: Rank-five SDP and optical-resource regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy networkx sympy
      - name: Run producer
        run: python analysis/toe_20261121_fivefront_rank5_optical_noise.py
      - name: Run 13 targeted tests
        run: python tests/test_toe_20261121_fivefront_rank5_optical_noise.py
      - name: Check 10-mode insertion-loss crossover
        run: |
          python analysis/toe_20261121_rank5_loss_mesh_break_even.py
          python tests/test_toe_20261121_rank5_loss_mesh_break_even.py
      - name: Upload deterministic certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witting-rank5-decoder-certificate
          path: |
            data/toe_20261121_fivefront_rank5_optical_noise.json
            data/toe_20261121_rank5_loss_mesh_break_even.json
          if-no-files-found: warn
          retention-days: 30
