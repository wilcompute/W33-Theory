name: Pass11636-11640 operators selectors and transitions
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11636_11640_operator_selector_transitions.py'
      - 'analysis/w33_pass11637_fermion_ir_normals.py'
      - 'analysis/PASS11636_11640_OPERATORS_SELECTORS_AND_TRANSITIONS.md'
      - 'tests/test_w33_pass11636_11640_operator_selector_transitions.py'
      - 'data/w33_pass11636*'
      - 'data/w33_pass11637*'
      - 'data/w33_pass11638_complex_selector.npz'
      - '.github/workflows/pass11636-11640-operators-selectors.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 jax==0.11.2 sympy==1.14.0 networkx==3.6.1 pytest
      - name: Audit frozen exact and numerical witnesses
        run: python -m pytest --noconftest -q tests/test_w33_pass11636_11640_operator_selector_transitions.py
      - name: Replay all297-normal fermion Hessians and independent quadratures
        run: python analysis/w33_pass11637_fermion_ir_normals.py 64 128
      - name: Replay incidence operators, quantum selector, nonlinear exchange and flux response
        run: python analysis/w33_pass11636_11640_operator_selector_transitions.py
      - name: Verify regenerated certificates and corruption controls
        run: python -m pytest --noconftest -q tests/test_w33_pass11636_11640_operator_selector_transitions.py
