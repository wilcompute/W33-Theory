name: Pass 2716-2721 incidence transceiver

on:
  push:
    paths:
      - 'analysis/w33_pass2716_integer_transceiver_reference.py'
      - 'rtl/w33_pass2717_incidence_transceiver.sv'
      - 'tests/rtl/w33_pass2718_incidence_transceiver_tb.sv'
      - 'data/w33_pass2716_2721_incidence_transceiver.json'
      - 'tests/test_w33_pass2716_2721_incidence_transceiver.py'
      - '.github/workflows/pass2716_2721_incidence_transceiver.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass2716_integer_transceiver_reference.py'
      - 'rtl/w33_pass2717_incidence_transceiver.sv'
      - 'tests/rtl/w33_pass2718_incidence_transceiver_tb.sv'
      - 'data/w33_pass2716_2721_incidence_transceiver.json'
      - 'tests/test_w33_pass2716_2721_incidence_transceiver.py'
      - '.github/workflows/pass2716_2721_incidence_transceiver.yml'
  workflow_dispatch:

jobs:
  exact-and-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Recompute exact integer certificate
        run: |
          python analysis/w33_pass2716_integer_transceiver_reference.py
          git diff --exit-code -- data/w33_pass2716_2721_incidence_transceiver.json
      - name: Run focused Python regression
        run: pytest -q tests/test_w33_pass2716_2721_incidence_transceiver.py
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and execute RTL basis/stream test
        run: |
          iverilog -g2012 \
            -s w33_pass2718_incidence_transceiver_tb \
            -o /tmp/w33_pass2718_tb \
            rtl/w33_pass2717_incidence_transceiver.sv \
            tests/rtl/w33_pass2718_incidence_transceiver_tb.sv
          vvp /tmp/w33_pass2718_tb
