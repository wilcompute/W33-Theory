name: Passes 3535-3541 Clique Borel Fourier Factorization

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3535*'
      - 'analysis/*3536*'
      - 'analysis/*3537*'
      - 'analysis/*3538*'
      - 'analysis/*3539*'
      - 'analysis/*3540*'
      - 'analysis/*3541*'
      - 'data/PART_BT3535*'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'data/w33_pass_namespace_registry_v2.d/3535-3541.json'
      - 'docs/clique-borel-fourier-factorization.html'
      - 'docs/index.html'
      - 'tests/test_bt3535_bt3541_clique_borel_fourier_factorization_ports.py'
      - '.github/workflows/w33_pass3535_3541_clique_borel_fourier_factorization.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3535*'
      - 'analysis/*3536*'
      - 'analysis/*3537*'
      - 'analysis/*3538*'
      - 'analysis/*3539*'
      - 'analysis/*3540*'
      - 'analysis/*3541*'
      - 'data/PART_BT3535*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/clique-borel-fourier-factorization.html'
      - 'docs/index.html'
      - 'tests/test_bt3535_bt3541_clique_borel_fourier_factorization_ports.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3535-3541-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-packet-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Regenerate and compare exact certificate
        run: |
          mkdir -p evidence/pass3535_3541
          cp data/PART_BT3535_BT3541_CLIQUE_BOREL_FOURIER_FACTORIZATION_PORTS_results.json /tmp/frozen3535.json
          python analysis/bt3535_3541_clique_borel_fourier_factorization_ports.py | tee evidence/pass3535_3541/exact.log
          grep -F 'PASS_7_FRONTS 34ea459ab6acea3a2b5624ba6523016cfb914ffb54220ed64230f74f78a1fb6b' evidence/pass3535_3541/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('data/PART_BT3535_BT3541_CLIQUE_BOREL_FOURIER_FACTORIZATION_PORTS_results.json').read_text())
          frozen=json.loads(Path('/tmp/frozen3535.json').read_text())
          assert generated==frozen
          print('PASS semantic frozen-certificate equality')
          PY
          cp /tmp/frozen3535.json data/PART_BT3535_BT3541_CLIQUE_BOREL_FOURIER_FACTORIZATION_PORTS_results.json
      - name: Focused regression and clique controls
        run: |
          pytest -q tests/test_bt3535_bt3541_clique_borel_fourier_factorization_ports.py | tee evidence/pass3535_3541/pytest.log
          python analysis/bt3535_star_clique_recertify.py --self-test | tee evidence/pass3535_3541/clique_selftest.log
          grep -F 'PASS_CLIQUE_ENGINE_SELF_TESTS' evidence/pass3535_3541/clique_selftest.log
          git diff --check
      - name: Verify manuscript and public reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          stem='analysis/BT3535_BT3541_clique_borel_fourier_factorization_ports_insert'
          assert inputs[-1]==stem
          assert Path(stem+'.tex').is_file()
          assert Path('docs/clique-borel-fourier-factorization.html').is_file()
          assert 'bt3535-3541-clique-borel-fourier-factorization-ports' in Path('docs/index.html').read_text()
          print('PASS current-frontier and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3535_3541/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3535_3541/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3535-3541-exact-packet-papers
          path: |
            evidence/pass3535_3541/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf

  independent-full-star-clique-recertification:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Recompute all 3720 compatibility graphs and maximum cliques
        run: |
          mkdir -p evidence/pass3535_3541
          python analysis/bt3535_star_clique_recertify.py \
            --json evidence/pass3535_3541/star_clique_full.json \
            | tee evidence/pass3535_3541/star_clique_full.log
          grep -F 'PASS_STAR_CLIQUE_RECERTIFICATION' evidence/pass3535_3541/star_clique_full.log
          grep -F '"published_histogram_match": true' evidence/pass3535_3541/star_clique_full.json
          grep -F '"compatibility_size_range": [' evidence/pass3535_3541/star_clique_full.json
      - uses: actions/upload-artifact@v4
        with:
          name: pass3535-independent-star-clique-recertification
          compression-level: 9
          path: evidence/pass3535_3541/**
