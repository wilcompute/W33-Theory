name: Witting two-photon, drift and covariant creation

on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261121_two_photon_pair_pump.py'
      - 'analysis/toe_20261121_detector_drift_calibration.py'
      - 'analysis/toe_20261121_kraus_gauge_lie_refinement.py'
      - 'analysis/toe_20261121_chart_operator_schmidt_lower_bound.py'
      - 'analysis/toe_20261121_kraus_gauge_loss_optimizer.py'
      - 'analysis/toe_20261121_fivefront_rank5_optical_noise.py'
      - 'analysis/toe_20261121_relational_reference_pareto.py'
      - 'tests/test_toe_20261121_two_photon_drift_pump_lie.py'
      - 'tests/test_toe_20261121_chart_operator_schmidt_lower_bound.py'
      - '.github/workflows/witting-two-photon-drift-covariant.yml'
  pull_request:
    paths:
      - 'analysis/toe_20261121_two_photon_pair_pump.py'
      - 'analysis/toe_20261121_detector_drift_calibration.py'
      - 'analysis/toe_20261121_kraus_gauge_lie_refinement.py'
      - 'tests/test_toe_20261121_two_photon_drift_pump_lie.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-finite-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit dependencies
        run: python -m pip install numpy scipy networkx sympy
      - name: Run two-photon and energy-conserving Witting pairs
        run: python analysis/toe_20261121_two_photon_pair_pump.py
      - name: Run heterogeneous time-drift calibration falsifier
        run: python analysis/toe_20261121_detector_drift_calibration.py
      - name: Optimize Kraus environment basis under lossy mesh model
        run: python analysis/toe_20261121_kraus_gauge_lie_refinement.py
      - name: Execute 15 dedicated independent regression tests
        run: python tests/test_toe_20261121_two_photon_drift_pump_lie.py
      - name: Verify operator-Schmidt rank and necessary entangling gate count
        run: |
          python analysis/toe_20261121_chart_operator_schmidt_lower_bound.py
          python tests/test_toe_20261121_chart_operator_schmidt_lower_bound.py
      - name: Save numerical certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witting-two-photon-drift-pump-gauge-checks
          path: |
            data/toe_20261121_two_photon_pair_pump.json
            data/toe_20261121_detector_drift_calibration.json
            data/toe_20261121_kraus_gauge_lie_refinement.json
            data/toe_20261121_chart_operator_schmidt_lower_bound.json
          if-no-files-found: warn
          retention-days: 30
