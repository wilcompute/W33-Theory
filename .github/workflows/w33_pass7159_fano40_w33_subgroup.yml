name: W33 Pass7159 Fano40 subgroup audit

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7159_fano40_w33_subgroup.g'
      - '.github/workflows/w33_pass7159_fano40_w33_subgroup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GAP
        run: sudo apt-get update && sudo apt-get install -y gap
      - name: Run exact 40-point subgroup audit
        env:
          W33_REPO: ${{ github.workspace }}
        run: gap -q analysis/w33_pass7159_fano40_w33_subgroup.g
      - name: Freeze certificate
        run: |
          cp data/PART_W33_PASS7159_FANO40_W33_SUBGROUP.json /tmp/fano40.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git rebase origin/master
          cp /tmp/fano40.json data/PART_W33_PASS7159_FANO40_W33_SUBGROUP.json
          git add data/PART_W33_PASS7159_FANO40_W33_SUBGROUP.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pass7159: freeze Fano40-to-W33 subgroup audit [skip ci]'
          git push origin HEAD:master
