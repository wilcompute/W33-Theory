name: Passes 1390-1394 Five Frontiers

on:
  push:
    branches:
      - agent/pass1390-1394-five-frontiers
    paths:
      - 'analysis/w33_pass1390_1394_five_frontiers.py'
      - 'analysis/w33_pass1390_1394_five_frontiers.src/**'
      - '.github/workflows/pass1390_1394_five_frontiers.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass1390_1394_five_frontiers.py'
      - 'analysis/w33_pass1390_1394_five_frontiers.src/**'
      - 'data/w33_pass1390_1394_five_frontiers.json'
      - 'tests/test_w33_pass1390_1394_five_frontiers.py'
      - '.github/workflows/pass1390_1394_five_frontiers.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  exact-workers:
    strategy:
      fail-fast: false
      matrix:
        worker: ['1390', '1391', '1392', '1393', '1394']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact dependencies
        run: python -m pip install --upgrade pip numpy sympy networkx pytest
      - name: Compile transparent verifier
        run: python -m py_compile analysis/w33_pass1390_1394_five_frontiers.py
      - name: Run exact frontier
        run: python analysis/w33_pass1390_1394_five_frontiers.py --worker '${{ matrix.worker }}' --output '/tmp/pass-${{ matrix.worker }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: pass-${{ matrix.worker }}
          path: /tmp/pass-${{ matrix.worker }}.json
          if-no-files-found: error
