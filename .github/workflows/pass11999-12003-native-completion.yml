name: Pass11999-12003 native conditional constructions and theta Barr matching
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass11999_*.py'
      - 'analysis/w33_pass1200[0-3]_*.py'
      - 'analysis/w33_pass12005_*.py'
      - 'tests/test_w33_pass12005_cp_real_theta_barr.py'
      - 'tests/test_w33_pass11999_12003_native_completion.py'
      - '.github/workflows/pass11999-12003-native-completion.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11999_12003_native_completion.py tests/test_w33_pass12005_cp_real_theta_barr.py
      - name: Regenerate five constructions
        run: |
          python analysis/w33_pass12000_native_unitary_clock.py
          python analysis/w33_pass11999_native_adm_weights.py
          python analysis/w33_pass12001_radial_portal_decoupling.py
          python analysis/w33_pass12002_native_path_overlap.py
          python analysis/w33_pass12003_h27_decuplet_mass27.py
          python analysis/w33_pass12005_cp_real_theta_barr.py
      - name: Regenerated controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11999_12003_native_completion.py tests/test_w33_pass12005_cp_real_theta_barr.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass11999-12003-native-completion
          path: |
            data/w33_pass11999_native_adm_weights.json
            data/w33_pass1200[0-3]_*.json
            data/w33_pass12005_cp_real_theta_barr.json
