name: Pass11993 native Majorana scalability repair
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass11993_majorana_scalability_repair.py'
      - 'tests/test_w33_pass11993_majorana_scalability_repair.py'
      - '.github/workflows/pass11993-majorana-repair.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 pytest
      - run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11993_majorana_scalability_repair.py
      - run: python analysis/w33_pass11993_majorana_scalability_repair.py
      - run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass11993_majorana_scalability_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass11993-majorana-repair
          path: data/w33_pass11993_majorana_scalability_repair.json
