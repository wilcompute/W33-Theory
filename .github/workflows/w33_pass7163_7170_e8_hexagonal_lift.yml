name: W33 Pass7163-7170 E8 hexagonal lift

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7163_7170_e8_hexagonal_lift.py'
      - 'tests/test_w33_pass7163_7170_e8_hexagonal_lift.py'
      - '.github/workflows/w33_pass7163_7170_e8_hexagonal_lift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact producer replay
        run: python analysis/w33_pass7163_7170_e8_hexagonal_lift.py
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass7163_7170_e8_hexagonal_lift.py
      - name: Freeze canonical certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/PART_W33_PASS7163_7170_E8_HEXAGONAL_LIFT.json
          if git diff --cached --quiet; then
            echo 'Certificate already canonical.'
          else
            cp data/PART_W33_PASS7163_7170_E8_HEXAGONAL_LIFT.json /tmp/pass7163_7170.json
            git reset --hard HEAD
            git fetch origin master
            git rebase origin/master
            cp /tmp/pass7163_7170.json data/PART_W33_PASS7163_7170_E8_HEXAGONAL_LIFT.json
            git add data/PART_W33_PASS7163_7170_E8_HEXAGONAL_LIFT.json
            git commit -m 'Pass7163-7170: freeze replayed E8 hexagonal lift [skip ci]'
            git push origin HEAD:master
          fi
