name: Pass11663 odd Weil normal map
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/w33_pass11663_odd_weil_normal_map.py'
      - 'analysis/PASS11663_ODD_WEIL_NORMAL_MAP.md'
      - 'tests/test_w33_pass11663_odd_weil_normal_map.py'
      - 'tests/test_w33_pass11649_radial_scope.py'
      - 'analysis/w33_pass11649_maximal_arrow_state.py'
      - 'analysis/PASS11649_MAXIMAL_ARROW_STATE.md'
      - 'data/w33_pass11663_odd_weil_normal_map.json'
      - '.github/workflows/pass11663-odd-weil-normal-map.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 sympy==1.14.0 pytest
      - name: Verify frozen normal map and independent Dirac measure
        run: python -m pytest --noconftest -q tests/test_w33_pass11663_odd_weil_normal_map.py tests/test_w33_pass11649_radial_scope.py
      - name: Regenerate exact maps and quantum phase certificate
        run: python analysis/w33_pass11663_odd_weil_normal_map.py
      - name: Audit regenerated certificate
        run: python -m pytest --noconftest -q tests/test_w33_pass11663_odd_weil_normal_map.py tests/test_w33_pass11649_radial_scope.py
