name: Pass11734-11741 gauging and chiral quotient
on:
  workflow_dispatch:
  push:
    paths:
      - analysis/w33_pass11734_11741_gauging_and_chiral_quotient.py
      - tests/test_w33_pass11734_11741_gauging_and_chiral_quotient.py
      - data/w33_pass11734_11741_gauging_and_chiral_quotient.json
      - .github/workflows/pass11734-11741-gauging-chiral-quotient.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scipy==1.18.1 sympy==1.14.0 networkx==3.6.1 pytest
      - name: Check frozen certificate
        run: OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_w33_pass11734_11741_gauging_and_chiral_quotient.py
      - name: Replay eight investigations
        run: OPENBLAS_NUM_THREADS=1 python analysis/w33_pass11734_11741_gauging_and_chiral_quotient.py
      - name: Check regenerated certificate
        run: OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_w33_pass11734_11741_gauging_and_chiral_quotient.py
