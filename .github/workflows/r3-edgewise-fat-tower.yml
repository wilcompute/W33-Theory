name: R3 Edgewise Fat Tower

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  r3-edgewise-fat-tower:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run R3 edgewise smoke scripts
        run: |
          python analysis/bt991_local_4simplex_edgewise_template.py
          python analysis/bt993_edgewise_density_recurrences.py
          python analysis/bt1000_k3_level2_feasibility_gate.py
          python analysis/bt1001_full_heat_supertrace_estimator_stack.py
          python analysis/bt1003_ci_status_probe.py
          python analysis/bt1006_k3_level2_endpoint_ranks.py
          python analysis/bt1007_k3_heat_16probe_checkpoint.py

      - name: Apply paper integrators and verify markers
        run: |
          bash tools/bt999_apply_integrators_and_verify.sh

      - name: Upload R3 data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r3-edgewise-fat-tower-data
          path: |
            data/bt991_local_4simplex_edgewise_template.json
            data/bt993_edgewise_density_recurrences.json
            data/bt999_integrator_marker_check.json
            data/bt1000_k3_level2_feasibility_gate.json
            data/bt1001_full_heat_supertrace_estimator_stack.json
            data/bt1003_ci_status_probe.json
            data/bt1006_k3_level2_endpoint_ranks.json
            data/bt1007_k3_heat_16probe_checkpoint.json
            *.pdf
          if-no-files-found: warn
