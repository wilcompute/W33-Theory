name: Passes 2550-2557 seven frontiers
on:
  push:
    paths:
      - 'analysis/w33_pass255*'
      - 'analysis/BT255*'
      - 'data/w33_pass255*'
      - 'tests/test_w33_pass2550_2557.py'
      - '.github/workflows/pass2550_2557_seven_frontiers.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass255*'
      - 'analysis/BT255*'
      - 'data/w33_pass255*'
      - 'tests/test_w33_pass2550_2557.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile analysis/w33_pass255*.py
      - run: |
          for f in analysis/w33_pass255*.cpp; do g++ -O2 -std=c++17 "$f" -o /tmp/$(basename "$f" .cpp); done
      - run: python analysis/w33_pass2550_2557_verify_frozen.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_w33_pass2550_2557.py
