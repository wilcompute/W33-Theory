name: Passes 3320-3331 Global Cover Quantum Hypercube
on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3320*'
      - 'analysis/*3330*'
      - 'data/PART_BT332*'
      - 'tests/test_bt3320_3331_global_cover_quantum_hypercube.py'
      - 'tools/integrate_bt3320_bt3331.py'
      - '.github/workflows/w33_pass3320_3331_global_cover_quantum_hypercube.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3320*'
      - 'analysis/*3330*'
      - 'data/PART_BT332*'
      - 'tools/integrate_bt3320_bt3331.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pass3320-3331-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-and-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize dependency packet
        run: python bootstrap/pass3296_3307/materialize.py
      - name: Regenerate exact eight-front packet
        run: |
          python -m pip install --disable-pip-version-check numpy sympy pytest
          python analysis/bt3320_3329_global_cover_quantum_hypercube.py
          python -m pytest -q tests/test_bt3320_3331_global_cover_quantum_hypercube.py
          git diff --check
      - name: Exhaustive decoder RTL simulation
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -g2012 -s tb_w33_pass3300_s3_fourier_decoder \
            -o /tmp/decoder_tb rtl/w33_pass3300_s3_fourier_decoder.sv tests/tb_w33_pass3300_s3_fourier_decoder.sv
          vvp /tmp/decoder_tb
      - name: Integrate canonical front doors
        run: |
          python tools/integrate_bt3320_bt3331.py
          python tools/integrate_bt3320_bt3331.py
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile all canonical manuscripts
        run: |
          mkdir -p evidence/pass3320_3331
          for f in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$f" 2>&1 | tee "evidence/pass3320_3331/${f%.tex}.log"
            test -s "${f%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3320_3331/pdf_sha256.txt
      - name: Publish readable materialization once
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis data tests tools rtl w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Passes 3320-3331 readable source and front doors [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass3320-3331-global-cover-quantum-hypercube-evidence
          path: |
            evidence/pass3320_3331/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
