name: Witting Schmidt witness and dynamic W33 gauge loop
on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_2design_entanglement_capacity.py'
      - 'analysis/toe_20261122_dynamic_W33_gauss_ring.py'
      - 'analysis/toe_20261122_witting_dual_frame_tomography.py'
      - 'tests/test_toe_20261122_schmidt_dynamic.py'
      - '.github/workflows/witting-schmidt-dynamic-gauge.yml'
  pull_request:
    paths:
      - 'analysis/toe_20261122_2design_entanglement_capacity.py'
      - 'analysis/toe_20261122_dynamic_W33_gauss_ring.py'
      - 'analysis/toe_20261122_witting_dual_frame_tomography.py'
      - 'tests/test_toe_20261122_schmidt_dynamic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-numerical-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install finite geometry and linear algebra dependencies
        run: python -m pip install numpy scipy networkx sympy
      - name: Generate Witting Schmidt-number fidelity witnesses
        run: python analysis/toe_20261122_2design_entanglement_capacity.py
      - name: Generate eight-dimensional Gauss-constrained W33 quantum dynamics
        run: python analysis/toe_20261122_dynamic_W33_gauss_ring.py
      - name: Generate full and compressed POVM tomography dual frames
        run: python analysis/toe_20261122_witting_dual_frame_tomography.py
      - name: Run 18 joint regression tests
        run: python tests/test_toe_20261122_schmidt_dynamic.py
      - name: Upload numerical certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Witting-Schmidt-and-W33-dynamic-Gauss
          path: |
            data/toe_20261122_2design_entanglement_capacity.json
            data/toe_20261122_dynamic_W33_gauss_ring.json
            data/toe_20261122_witting_dual_frame_tomography.json
          if-no-files-found: warn
          retention-days: 30
