name: Passes 3743-3750 Symmetry OS Space-Time Factory Tournament

on:
  push:
    branches: [master]
    paths:
      - 'analysis/*3743*'
      - 'analysis/*3744*'
      - 'analysis/*3745*'
      - 'analysis/*3746*'
      - 'analysis/*3747*'
      - 'analysis/*3748*'
      - 'analysis/*3749*'
      - 'analysis/*3750*'
      - 'data/PART_3743_3750*'
      - 'data/PART_3747*'
      - 'data/w33_pass_namespace_registry_v2.d/3743-3750.json'
      - 'tests/test_w33_pass3743_3750_symmetry_os_spacetime_factory_tournament.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - 'docs/symmetry-os-spacetime-factory-tournament.html'
      - 'docs/index.html'
      - '.github/workflows/w33_pass3743_3750_symmetry_os_spacetime_factory_tournament.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3743-3750-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-architecture-and-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy==2.3.5 networkx==3.6.1 sympy==1.14.0
      - name: Regenerate exact eight-front certificate
        run: |
          mkdir -p evidence/pass3743_3750
          cp data/PART_3743_3750_SYMMETRY_OS_SPACETIME_FACTORY_TOURNAMENT_results.json /tmp/frozen3750.json
          python analysis/w33_pass3743_3750_symmetry_os_spacetime_factory_tournament.py --json evidence/pass3743_3750/results.json | tee evidence/pass3743_3750/exact.log
          grep -F 'PASS_8_FRONTS 67ce2d0ab105d8809dd6ae1af60381e1181d9a08c9032ce1dad1130f7bb8ff62' evidence/pass3743_3750/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('evidence/pass3743_3750/results.json').read_text())
          old=json.loads(Path('/tmp/frozen3750.json').read_text())
          assert got==old
          prereg=json.loads(Path('data/PART_3747_W33_HARDWARE_CHALLENGE_PREREGISTRATION.json').read_text())
          assert prereg['schema']==got['passes']['3747_preregistered_hardware_challenge']['schema']
          assert prereg['shots_per_tomography_setting']==got['passes']['3747_preregistered_hardware_challenge']['shots_per_tomography_setting']
          assert got['passes']['3748_bonkers_floquet_incidence_holonomy']['generated_permutation_group']=='S40'
          print('PASS frozen semantic and preregistration equality')
          PY
      - name: Focused exact regression
        run: |
          pytest -q tests/test_w33_pass3743_3750_symmetry_os_spacetime_factory_tournament.py | tee evidence/pass3743_3750/pytest.log
          git diff --check
      - name: Verify manuscript and public reachability
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs==manifest['required_ordered_inputs']
          ours='analysis/BT3743_BT3750_symmetry_os_spacetime_factory_tournament_insert'
          assert inputs.count(ours)==1
          assert Path(ours+'.tex').is_file()
          assert 'bt3743-3750-symmetry-os-spacetime-factory-tournament' in Path('docs/index.html').read_text()
          assert Path('docs/symmetry-os-spacetime-factory-tournament.html').is_file()
          print('PASS current-frontier and public reachability')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass3743_3750/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3743_3750/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3743-3750-exact-architecture-papers
          path: |
            evidence/pass3743_3750/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
