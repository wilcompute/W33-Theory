name: ternary CSS building Steinberg
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260902_ternary_css_building_steinberg.py'
      - '.github/workflows/w33_20260902_ternary_css_building_steinberg.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-ternary-css-building-steinberg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute characteristic-three chain audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260902_ternary_css_building_steinberg.py 2>&1 | tee analysis/PASS_20260902_TERNARY_CSS_BUILDING_STEINBERG.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260902_TERNARY_CSS_BUILDING_STEINBERG.json').read_text())
          assert d.get('status')=='PASS'
          c=d['chainMap']
          assert c['imageOnBuildingH1Rank']==81
          assert c['triangleBoundaryRank']==120
          assert c['combinedBoundaryPlusImageRank']==201
          assert c['intersectionWithTriangleBoundaries']==0
          assert c['generatorEquivarianceVerified'] is True
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260902_TERNARY_CSS_BUILDING_STEINBERG.json analysis/PASS_20260902_TERNARY_CSS_BUILDING_STEINBERG.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze ternary CSS equals modular building Steinberg'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
