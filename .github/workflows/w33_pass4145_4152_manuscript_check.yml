name: W33 Passes 4145-4152 manuscript check
on:
  push:
    paths:
      - "analysis/BT4145_BT4152_exotic_local_conditioned_stack_mixed_bonkers_insert.tex"
      - "analysis/W33_CURRENT_FRONTIER_MANIFEST.tex"
      - "w33_paper.tex"
      - "photonic_holonet.tex"
      - "holonet_machine_blueprint.tex"
      - ".github/workflows/w33_pass4145_4152_manuscript_check.yml"
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science
      - run: python tools/integrate_pass4145_4152_frontier.py --check
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error holonet_machine_blueprint.tex
