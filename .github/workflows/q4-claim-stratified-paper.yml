name: q4-claim-stratified-paper

on:
  push:
    branches: [ master ]
    paths:
      - 'paper/w33_q4_claim_stratified_master.tex'
      - '.github/workflows/q4-claim-stratified-paper.yml'
  pull_request:
    paths:
      - 'paper/w33_q4_claim_stratified_master.tex'
  workflow_dispatch:

jobs:
  build-claim-stratified-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Compile claim-stratified master paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error w33_q4_claim_stratified_master.tex
          pdflatex -interaction=nonstopmode -halt-on-error w33_q4_claim_stratified_master.tex
        working-directory: ${{ github.workspace }}/paper
      - name: Verify PDF produced
        run: |
          ls -lh w33_q4_claim_stratified_master.pdf
        working-directory: ${{ github.workspace }}/paper
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: w33-q4-claim-stratified-master
          path: paper/w33_q4_claim_stratified_master.pdf
          retention-days: 90
