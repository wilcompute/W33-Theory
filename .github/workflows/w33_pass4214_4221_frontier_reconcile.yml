name: Pass 4221 protected frontier reconciliation
on:
  push:
    paths:
      - 'tools/integrate_pass4214_4221_frontier.py'
      - 'analysis/BT4214_BT4221_small_cover_su4_quantum_hysteresis_clock_hawking_pell_vacuum_velocity_insert.tex'
      - 'analysis/BT4214_BT4221_small_cover_su4_quantum_hysteresis_clock_hawking_pell_vacuum_velocity_index_insert.html'
      - 'docs/small-cover-su4-hysteresis-clock-hawking-pell-vacuum-velocity-4214-4221.html'
      - '.github/workflows/w33_pass4214_4221_frontier_reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/integrate_pass4214_4221_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4214_4221_FRONTIER 1 False 1 1 1 0' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit reconciled manifests if needed
        run: |
          if ! git diff --quiet -- analysis/W33_CURRENT_FRONTIER_MANIFEST.tex data/w33_current_frontier_manifest_v1.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add analysis/W33_CURRENT_FRONTIER_MANIFEST.tex data/w33_current_frontier_manifest_v1.json
            git commit -m 'Pass 4221: reconcile canonical protected frontier manifests'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
