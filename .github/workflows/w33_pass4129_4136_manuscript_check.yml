name: W33 Passes 4129-4136 manuscript check
on:
  push:
    paths:
      - 'analysis/BT4129_BT4136_anomaly_gates_decoder_hybrid_orbits_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4129_4136_manuscript_check.yml'
  workflow_dispatch:
jobs:
  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate ordered shared frontier
        run: |
          test "$(grep -c 'BT4129_BT4136_anomaly_gates_decoder_hybrid_orbits_insert' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex)" -eq 1
          grep -q 'BT4137_BT4144_matrix_horizon_rg_scar_curvature_insert' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          test -s analysis/BT4129_BT4136_anomaly_gates_decoder_hybrid_orbits_insert.tex
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-science
      - name: Compile manuscripts
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error w33_paper.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error photonic_holonet.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error holonet_machine_blueprint.tex
