name: Passes 4169-4176 Protected Frontier Reconcile
on:
  push:
    branches: [master]
    paths:
      - 'tools/integrate_pass4169_4176_frontier.py'
      - 'analysis/BT4169_BT4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion_insert.tex'
      - 'analysis/BT4169_BT4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion_index_insert.html'
      - 'docs/discrete-c2-hawking-backreaction-gray-levi-casimir-axion-4169-4176.html'
      - '.github/workflows/w33_pass4169_4176_frontier_reconcile.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pass4169-4176-frontier, cancel-in-progress: false}
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass4169_4176_frontier.py | tee /tmp/frontier.log
      - run: grep -F 'PASS_4169_4176_FRONTIER 1 1 1 1' /tmp/frontier.log
      - run: git diff --exit-code -- docs/index.html
      - name: Commit manifest reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/w33_current_frontier_manifest_v1.json analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 4176: reconcile discrete C2 Hawking backreaction Levi public frontier'
          git pull --rebase origin master
          git push
