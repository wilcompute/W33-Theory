name: Passes 4033-4040 Physics Continuation
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4033_4040_physics_continuation.py'
      - 'data/PART_4033_4040_PHYSICS_CONTINUATION.json'
      - 'tests/test_w33_pass4033_4040_physics_continuation.py'
      - '.github/workflows/w33_pass4033_4040_physics_continuation.yml'
  pull_request:
    branches: [master]
    paths:
      - 'analysis/w33_pass4033_4040_physics_continuation.py'
      - 'data/PART_4033_4040_PHYSICS_CONTINUATION.json'
      - 'tests/test_w33_pass4033_4040_physics_continuation.py'
      - '.github/workflows/w33_pass4033_4040_physics_continuation.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pass4033-4040-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  exact-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy networkx pytest
      - name: Recompute exact certificate
        run: python analysis/w33_pass4033_4040_physics_continuation.py
      - name: Focused regression
        run: pytest -q tests/test_w33_pass4033_4040_physics_continuation.py
      - name: Verify frozen semantic certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/PART_4033_4040_PHYSICS_CONTINUATION.json')
          x=json.loads(p.read_text())
          assert x['all_checks_hold']
          assert x['semantic_sha256']=='022ba7f16ba122b83f6696869cbbefc2068b2d301e2ec196d4c3eb3e90c7d6a0'
          assert x['pass4035_literal_algebra_gate']['status'] in {'COMPLETE','BLOCKED_ENGINE_OUTPUTS_MISSING'}
          PY
