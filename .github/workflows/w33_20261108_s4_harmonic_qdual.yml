name: Forty Points S4 harmonic and finite Gauss certificates
on:
  push:
    branches: [master]
    paths:
      - "analysis/w33_20261108_s4_harmonic_qdual.py"
      - "tests/test_w33_20261108_s4_harmonic_qdual.py"
      - "analysis/PASS20261108_S4_HARMONIC_QDUAL.md"
      - ".github/workflows/w33_20261108_s4_harmonic_qdual.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-characters-and-gauss:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run character, Hodge, translation orbit, and Gauss phase tests
        run: python -m pytest -q tests/test_w33_20261108_s4_harmonic_qdual.py
      - name: Independently create full new numerical/exact certificate
        run: python analysis/w33_20261108_s4_harmonic_qdual.py --out data/w33_20261108_s4_harmonic_qdual.json
      - name: Check exact result boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/w33_20261108_s4_harmonic_qdual.json'))
          h=x['S4_H1']
          assert h['harmonic_dimension']==46
          assert h['S4_invariant_dimension']==2
          assert h['translation_invariant_dimension']==0
          assert h['S4_seed_translation_span_dimension_numeric']==18
          assert h['unspanned_harmonic_dimensions']==28
          assert h['H1_character']==[46,4,-2,-2,0]
          assert [r['prime'] for r in x['q_duality']['cases']]==[3,5,7,11,13,17]
          assert all(r['flat_probability_max_residual']<1e-12 for r in x['q_duality']['cases'])
          print('PASS: S4 harmonic character with two fixed modes, 18-mode translated seed span, prime-field Gauss duality')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forty-points-s4-harmonic-qdual-json
          path: data/w33_20261108_s4_harmonic_qdual.json
          if-no-files-found: error
