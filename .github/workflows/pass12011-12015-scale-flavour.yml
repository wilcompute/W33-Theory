name: Pass12011-12015 scale flavour and internal chiral action
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12011_12015_scale_flavour_internal_index.py'
      - 'analysis/w33_pass12011_common_scale_search.py'
      - 'tests/test_w33_pass12011_12015_scale_flavour_internal_index.py'
      - '.github/workflows/pass12011-12015-scale-flavour.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen new and prior controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12011_12015_scale_flavour_internal_index.py tests/test_w33_pass12006_12010_shared_physics.py
      - name: Regenerate five-front certificate
        run: python analysis/w33_pass12011_12015_scale_flavour_internal_index.py
      - name: Regenerated controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12011_12015_scale_flavour_internal_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass12011-12015-scale-flavour
          path: data/w33_pass12011_12015_scale_flavour_internal_index.json
