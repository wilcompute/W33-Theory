name: W33 Pass7146 exact eight q9 cliques

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7146_exact_eight_cliques.py'
      - '.github/workflows/w33_pass7146_exact_eight_cliques.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-eight-cliques:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact SAT dependencies
        run: python -m pip install --upgrade pip numpy networkx 'python-sat[pblib,aiger]'
      - name: Run exact eight-case closure
        run: python analysis/w33_pass7146_exact_eight_cliques.py
      - name: Freeze exact certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/PART_W33_PASS7146_EXACT_EIGHT_CLIQUES.json /tmp/PART_W33_PASS7146_EXACT_EIGHT_CLIQUES.json
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/PART_W33_PASS7146_EXACT_EIGHT_CLIQUES.json data/PART_W33_PASS7146_EXACT_EIGHT_CLIQUES.json
          git add data/PART_W33_PASS7146_EXACT_EIGHT_CLIQUES.json
          git commit -m 'Pass7146: freeze exact eight-case clique certificate [skip ci]'
          git push origin HEAD:master
