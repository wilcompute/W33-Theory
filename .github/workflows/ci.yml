name: W33 Theory CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-passes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy

      - name: Run Pass 70 tracks
        run: python w33_pass70_run_all_tracks.py

      - name: Run Pass 71 tracks
        run: python w33_pass71_run_all_tracks.py

      - name: Run full pytest suite
        run: pytest tests/ -v --tb=short

      - name: Verify JSON witnesses exist
        run: |
          for f in \
            w33_pass70_trackA_ramanujan.json \
            w33_pass70_trackB_qec.json \
            w33_pass70_trackC_partition.json \
            w33_pass71_trackD_css_matrices.json \
            w33_pass71_trackE_ihara_zeta_poles.json \
            w33_pass71_trackF_pmns_angles.json; do
            test -f $f && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
