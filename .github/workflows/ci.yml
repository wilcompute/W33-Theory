name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . || true
          pip install pytest

      - name: Generate summary artifacts
        run: |
          python scripts/collect_results.py
          python scripts/make_numeric_comparisons_from_summary.py
          python scripts/prepare_legacy_test_fixtures.py

      - name: Materialize BT1236 paper inclusion
        run: |
          python tools/integrate_bt1236_insert.py
          python tools/integrate_bt1261_ladder_insert.py
          python tools/integrate_bt1267_score_vector_insert.py
          python tools/integrate_bt1276_external_protocol_insert.py
          python analysis/bt1239_bt1236_integration_sanity.py

      - name: Run latest BT Clifford/R3/recovery regressions
        run: |
          python tests/test_bt1231_bt1233.py

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run repo health scanner
        run: |
          python scripts/find_top_level_calls.py || true
