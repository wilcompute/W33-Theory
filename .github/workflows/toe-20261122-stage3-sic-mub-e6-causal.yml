name: TOE Witting third-stage SIC/MUB E6 causal and photonic exact fronts
on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_stage3_hessian_exact.py'
      - 'analysis/toe_20261122_witting_qutrit_sic_mub30.py'
      - 'analysis/toe_20261122_e6_higgs_tangent_and_center_gate.py'
      - 'analysis/toe_20261122_causal_growth_finite_spectrum.py'
      - 'analysis/toe_20261122_povm30_nai_mark_shot_cost.py'
      - 'analysis/toe_20261122_witting_KS_ovoid_firewall.py'
      - 'tests/test_toe_20261122_stage3_and_outside_box.py'
      - '.github/workflows/toe-20261122-stage3-sic-mub-e6-causal.yml'
  pull_request:
  workflow_dispatch:

jobs:
  exact-and-falsification-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent numerical and finite-geometry dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx pytest
      - name: Verify 16 focused exact and numerical tests
        run: python -m pytest -q tests/test_toe_20261122_stage3_and_outside_box.py
      - name: Regenerate exact and numerical receipts
        run: |
          python analysis/toe_20261122_stage3_hessian_exact.py
          python analysis/toe_20261122_witting_qutrit_sic_mub30.py
          python analysis/toe_20261122_e6_higgs_tangent_and_center_gate.py
          python analysis/toe_20261122_causal_growth_finite_spectrum.py
          python analysis/toe_20261122_povm30_nai_mark_shot_cost.py
          python analysis/toe_20261122_witting_KS_ovoid_firewall.py
      - name: Check replay manifest invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data')
          d=lambda x:json.loads((p/('toe_20261122_'+x+'.json')).read_text())
          assert d('stage3_hessian_exact')['exact_third_stage_distinct_complex_matrices']==7793496
          assert d('witting_qutrit_sic_mub30')['minimum_extra_blocked_orbit_sites_if_all27_positive']==3
          assert d('e6_higgs_tangent_and_center_gate')['unlifted_nonsinglet_Higgs_tangent_after_gauge_quotient']==124
          assert len(d('causal_growth_finite_spectrum')['nested_W33_induced_graphs'])==4
          assert d('povm30_nai_mark_shot_cost')['design_comparison'][1]['outcome_count']==30
          assert d('witting_KS_ovoid_firewall')['exact_cover_ovoid_exists'] is False
          print('PASS six source-specific replay receipts')
          PY
