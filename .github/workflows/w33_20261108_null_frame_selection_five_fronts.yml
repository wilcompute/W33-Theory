name: W33 null frame exact static mixer plus Maxwell and E6

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "analysis/w33_20261108_null_frame_selection_five_fronts.py"
      - "tests/test_w33_20261108_null_frame_selection_five_fronts.py"
      - "analysis/PASS20261108_NULL_FRAME_SELECTION_FIVE_FRONTS.md"
      - "data/w33_20261108_null_frame_selection_five_fronts.json"
      - ".github/workflows/w33_20261108_null_frame_selection_five_fronts.yml"
  push:
    paths:
      - "analysis/w33_20261108_null_frame_selection_five_fronts.py"
      - "tests/test_w33_20261108_null_frame_selection_five_fronts.py"
      - "analysis/PASS20261108_NULL_FRAME_SELECTION_FIVE_FRONTS.md"
      - "data/w33_20261108_null_frame_selection_five_fronts.json"
      - ".github/workflows/w33_20261108_null_frame_selection_five_fronts.yml"

permissions:
  contents: read

jobs:
  exact-null-frame-five-fronts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical algebra and regression harness
        run: python -m pip install --disable-pip-version-check numpy scipy sympy pytest
      - name: Independently verify the 22 focus regressions
        run: python -m pytest -q tests/test_w33_20261108_null_frame_selection_five_fronts.py
      - name: Independently regenerate all five-front results
        run: python analysis/w33_20261108_null_frame_selection_five_fronts.py --out data/w33_20261108_null_frame_selection_five_fronts_ci.json
      - name: Fail closed on impossible physical overclaims
        run: |
          python - <<'PY'
          import json
          f='data/w33_20261108_null_frame_selection_five_fronts_ci.json'
          j=json.load(open(f,encoding='utf-8'))
          assert j['clock']['first_pulse_count_is_one'] is True
          assert j['clock']['earlier_affine_no_go_not_contradicted'] is True
          for x in j['clock']['tested_cases']:
              assert x['max_flat_probability_error'] < 1e-12
              assert x['maximal_forbidden_nonnull_hopping_magnitude'] < 1e-12
              assert x['translation_shift_commutator_Frobenius'] > .1
          assert j['E6']['conditional_remaining_gauge_inequivalent_moduli_lower_bound'] == 397
          assert 'only if invariance' in j['E6']['conditional_invariant']
          assert j['Maxwell']['cases'][-1]['relative_dispersion_error'] < .004
          assert j['photonic']['max_two_mode_couplers_in_naive_DFT_triangular_synthesis'] == 81
          assert j['cosmology']['independent_corrected_heldout_DES_KiDS_likelihood_executed'] is False
          assert j['cosmology']['S7_S8_prepatch_shear_results_withdrawn'] is True
          print('PASS: finite exact results, explicit symmetry breaking, and empirical retraction guards')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-selected-null-frame-five-fronts
          path: data/w33_20261108_null_frame_selection_five_fronts_ci.json
          retention-days: 30
