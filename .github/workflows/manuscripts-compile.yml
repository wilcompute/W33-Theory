name: Manuscripts compile

# WHY THIS EXISTS
#
# Only the blueprint was ever recompiled by habit. In one session w33_paper and
# photonic_holonet both broke silently -- photonic on a missing tcolorbox package -- and
# both were caught by hand rather than by anything automatic. Twenty LaTeX errors had
# also accumulated in the blueprint earlier for the same reason: nobody compiled it.
#
# All three manuscripts build here on every change to a .tex file. The job uses
# `-Z continue-on-errors` so a single fault does not mask the rest, then FAILS on any
# error in the log -- harvesting every fault per run instead of one per run.

on:
  push:
    branches: [master]
    paths:
      - '**/*.tex'
      - '.github/workflows/manuscripts-compile.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.tex'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscripts-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: labels (no duplicates, no dangling refs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit every manuscript's labels
        run: python scripts/check_labels.py --strict

      - name: Every heading must have a way in for a non-specialist
        # Advisory. The blueprint reached zero at Pass 4348 and the point is to notice
        # when a new section arrives without a plain-language box, not to block on it.
        continue-on-error: true
        run: |
          python scripts/blueprint_outline.py | tail -20 >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "scripts/blueprint_outline.py"],
                               capture_output=True, text=True).stdout
          m = re.search(r"NO plain-language box: (\d+)", out)
          n = int(m.group(1)) if m else 0
          print(f"headings with no plain-language box: {n}")
          PY

      - name: Ratio claims must name a baseline
        # Advisory for the same reason: it is a triage list, and one known false positive
        # (a comparison whose baseline is the table above it) is expected.
        continue-on-error: true
        run: python scripts/check_ratio_claims.py | tee -a "$GITHUB_STEP_SUMMARY"

  compile:
    name: ${{ matrix.doc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false          # one broken manuscript must not hide the others
      matrix:
        doc: [holonet_machine_blueprint, w33_paper, photonic_holonet]
    steps:
      - uses: actions/checkout@v4
      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: Compile ${{ matrix.doc }}
        run: |
          set -o pipefail
          tectonic -X compile "${{ matrix.doc }}.tex" \
            --keep-logs --outdir . -Z continue-on-errors 2>&1 | tail -40
      - name: Fail on errors OR undefined references
        # An undefined reference is only a WARNING, so a document can carry one through
        # hundreds of clean builds. Three of them shipped this way before Pass 4315.
        run: |
          log="${{ matrix.doc }}.log"
          n=$(grep -cE '^! ' "$log" || true)
          u=$(grep -c 'Reference .* undefined' "$log" || true)
          m=$(grep -c 'multiply.defined' "$log" || true)
          pages=$(grep -oE '\([0-9]+ pages' "$log" | tail -1 || true)
          echo "${{ matrix.doc }}: $n error(s), $u undefined ref(s), $m multiply-defined, $pages"
          {
            echo "### ${{ matrix.doc }}"
            echo "- errors: $n"
            echo "- undefined references: $u"
            echo "- multiply-defined labels: $m"
            echo "- $pages"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then grep -E '^! ' "$log" | head -20; fi
          if [ "$u" -gt 0 ]; then grep 'Reference .* undefined' "$log" | head -10; fi
          if [ "$m" -gt 0 ]; then grep 'multiply.defined' "$log" | head -10; fi
          if [ "$n" -gt 0 ] || [ "$u" -gt 0 ] || [ "$m" -gt 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.doc }}-pdf
          path: |
            ${{ matrix.doc }}.pdf
            ${{ matrix.doc }}.log
          if-no-files-found: warn
