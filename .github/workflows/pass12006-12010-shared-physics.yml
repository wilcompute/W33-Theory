name: Pass12006-12010 shared flavour density and non-Abelian index
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1200[6-9]_*.py'
      - 'analysis/w33_pass12010_*.py'
      - 'tests/test_w33_pass12006_12010_shared_physics.py'
      - '.github/workflows/pass12006-12010-shared-physics.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12006_12010_shared_physics.py
      - name: Regenerate five producers
        run: |
          python analysis/w33_pass12007_shared_theta_leptons.py
          python analysis/w33_pass12006_vacuum_source_identifiability.py
          python analysis/w33_pass12008_colored_soft_thresholds.py
          python analysis/w33_pass12009_native_metric_density.py
          python analysis/w33_pass12010_nonabelian_native_index.py
      - name: Regenerated controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12006_12010_shared_physics.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass12006-12010-shared-physics
          path: |
            data/w33_pass12006_vacuum_source_identifiability.json
            data/w33_pass12007_shared_theta_leptons.json
            data/w33_pass12008_colored_soft_thresholds.json
            data/w33_pass12009_native_metric_density.json
            data/w33_pass12010_nonabelian_native_index.json
