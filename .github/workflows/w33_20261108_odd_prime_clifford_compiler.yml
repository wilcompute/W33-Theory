name: Odd-prime Gaussian clocks are constant-depth Clifford circuits
on:
  push:
    branches: [master]
    paths:
      - "analysis/w33_20261108_odd_prime_clifford_compiler.py"
      - "tests/test_w33_20261108_odd_prime_clifford_compiler.py"
      - "analysis/PASS20261108_ODD_PRIME_CLIFFORD_COMPILER.md"
      - ".github/workflows/w33_20261108_odd_prime_clifford_compiler.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gaussian-qupit-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic numerical test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Verify six-prime Clifford normalizer and resource gates
        run: python -m pytest -q tests/test_w33_20261108_odd_prime_clifford_compiler.py
      - name: Reproduce six-prime compiler certificate
        run: python analysis/w33_20261108_odd_prime_clifford_compiler.py --out data/w33_20261108_odd_prime_clifford_compiler.json
      - name: Verify prime-general logic and physical boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/w33_20261108_odd_prime_clifford_compiler.json'))
          assert [y['prime'] for y in x['cases']]==[3,5,7,11,13,17]
          assert [y['nontrivial_local_multipliers'] for y in x['cases']]==[0,2,2,2,2,2]
          assert x['cases'][1]['independent_rail_p_port_Gauss_units']==75
          assert x['cases'][1]['internal_generic_two_mode_upper_bound_without_routing']==750
          assert all(y['full_kernel_from_factorization_max_residual']<1e-12 for y in x['cases'])
          assert 'not universal quantum computation' in x['physics_limit']
          print('PASS six odd-prime generalized Clifford compilers and physical resource caveats')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-odd-prime-clifford-compilers
          path: data/w33_20261108_odd_prime_clifford_compiler.json
          if-no-files-found: error
