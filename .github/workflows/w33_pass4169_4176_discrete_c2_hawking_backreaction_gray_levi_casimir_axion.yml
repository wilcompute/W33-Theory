name: Passes 4169-4176 Exact Regression
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4169_4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion.py'
      - 'data/PART_4169_4176_DISCRETE_C2_HAWKING_BACKREACTION_GRAY_LEVI_CASIMIR_AXION.json'
      - 'tests/test_w33_pass4169_4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion.py'
      - '.github/workflows/w33_pass4169_4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy scipy pytest
      - run: python analysis/w33_pass4169_4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion.py | tee /tmp/pass4169_4176.log
      - run: grep -F 'PASS_4169_4176 053198379caf1080b369299e9e13234e580446782e128306bc5ac317618d8348' /tmp/pass4169_4176.log
      - run: pytest -q tests/test_w33_pass4169_4176_discrete_c2_hawking_backreaction_gray_levi_casimir_axion.py
