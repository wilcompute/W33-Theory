name: Passes 568-572 exact certificates
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass568_singer_intersection_design.py'
      - 'analysis/w33_pass569_z9_coupled_affine_radial_quadratic.py'
      - 'analysis/w33_pass569_fast_cyc9.py'
      - 'analysis/w33_pass568_572_z9_common.py'
      - 'analysis/w33_pass568_572_q5_common.py'
      - 'analysis/w33_pass570_cyclotomic_residue_formal.py'
      - 'analysis/w33_pass571_twisted_walsh_representation.py'
      - 'analysis/w33_pass572_analytic_sequential_bound.py'
      - 'analysis/w33_pass568_572_release.py'
      - 'data/w33_pass568_*.json'
      - 'data/w33_pass569_*.json'
      - 'data/w33_pass570_*.json'
      - 'data/w33_pass571_*.json'
      - 'data/w33_pass572_*.json'
      - 'hardware/w33_pass572_analytic_sequential_bound.json'
      - 'formal/W33/Pass570CyclotomicResidue.lean'
      - 'formal/W33.lean'
      - 'tests/test_w33_pass568_572_singer_hjelmslev_residue_walsh_chernoff.py'
      - 'PASS568_572_SINGER_HJELMSLEV_RESIDUE_WALSH_CHERNOFF_RELEASE.md'
      - '.github/workflows/pass568_572_exact.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  NUMBA_NUM_THREADS: '4'
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 numba==0.65.1 scipy==1.17.0 sympy==1.14.0 pytest==9.0.2
      - run: python analysis/w33_pass568_singer_intersection_design.py --check
      - run: python analysis/w33_pass569_z9_coupled_affine_radial_quadratic.py --check
      - run: python analysis/w33_pass570_cyclotomic_residue_formal.py --check
      - run: python analysis/w33_pass571_twisted_walsh_representation.py --check
      - run: python analysis/w33_pass572_analytic_sequential_bound.py --check
      - run: python analysis/w33_pass568_572_release.py --check
      - run: pytest -q tests/test_w33_pass568_572_singer_hjelmslev_residue_walsh_chernoff.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
