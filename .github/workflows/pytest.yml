name: pytest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e . || true

      - name: Generate local fixtures
        run: |
          python scripts/collect_results.py || true
          python scripts/make_numeric_comparisons_from_summary.py || true
          python scripts/prepare_legacy_test_fixtures.py

      - name: Run pytest
        env:
          PYTHONWARNINGS: default
        run: |
          python -m pytest -q

      - name: Upload SUMMARY_RESULTS.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-results
          path: SUMMARY_RESULTS.json
          if-no-files-found: ignore

      - name: Upload NUMERIC_COMPARISONS.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-comparisons
          path: NUMERIC_COMPARISONS.json
          if-no-files-found: ignore
