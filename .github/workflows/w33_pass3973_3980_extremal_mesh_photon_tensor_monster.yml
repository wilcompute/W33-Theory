name: Passes 3973-3980 Extremal Mesh Photon Tensor Supplement

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass3973_3980_*'
      - 'analysis/.bootstrap/pass3973_source_*.b64'
      - 'analysis/BT3973_BT3980_*'
      - 'data/.bootstrap/PART_3973_3980_*'
      - 'data/PART_3973_3980_*'
      - 'tests/test_w33_pass3973_3980_*'
      - 'docs/extremal-code-mesh-photon-tensor.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - '.github/workflows/w33_pass3973_3980_extremal_mesh_photon_tensor_monster.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python analysis/w33_pass3973_3980_check.py
      - run: pytest -q tests/test_w33_pass3973_3980_extremal_mesh_photon_tensor_monster.py
      - run: python analysis/w33_mmgroup_u42_candidate_harness.py data/PART_3973_3980_MONSTER_U42_CANDIDATE.json --allow-empty --output /tmp/pass3973_monster_gate.json
      - run: grep -q 'PENDING_EXPLICIT_MONSTER_WORDS' /tmp/pass3973_monster_gate.json

  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-science texlive-pictures
      - run: grep -q '\\input{analysis/BT3973_BT3980_combined_extremal_mesh_photon_tensor_insert}' analysis/W33_CURRENT_FRONTIER_MANIFEST.tex
      - run: grep -q 'BT3973_BT3980_extremal_mesh_photon_tensor_monster_insert' analysis/BT3973_BT3980_combined_extremal_mesh_photon_tensor_insert.tex
      - run: grep -q 'bt3973-3980-extremal-mesh-photon-tensor' data/w33_current_frontier_manifest_v1.json
      - run: test -s docs/extremal-code-mesh-photon-tensor.html
      - run: pdflatex -interaction=nonstopmode -halt-on-error w33_paper.tex
      - run: pdflatex -interaction=nonstopmode -halt-on-error photonic_holonet.tex
      - run: pdflatex -interaction=nonstopmode -halt-on-error holonet_machine_blueprint.tex
