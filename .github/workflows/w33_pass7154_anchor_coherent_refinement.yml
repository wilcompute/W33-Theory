name: W33 Pass7154 anchor coherent refinement

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass7154_anchor_coherent_refinement.py'
      - '.github/workflows/w33_pass7154_anchor_coherent_refinement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy networkx
      - name: Replay coherent refinement
        run: |
          export PYTHONPATH="$PWD/analysis:${PYTHONPATH:-}"
          python analysis/w33_pass7154_anchor_coherent_refinement.py
      - name: Freeze certificate
        run: |
          cp data/PART_W33_PASS7154_ANCHOR_COHERENT_REFINEMENT.json /tmp/coherent.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git rebase origin/master
          cp /tmp/coherent.json data/PART_W33_PASS7154_ANCHOR_COHERENT_REFINEMENT.json
          git add data/PART_W33_PASS7154_ANCHOR_COHERENT_REFINEMENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pass7154: freeze anchor coherent refinement [skip ci]'
          git push origin HEAD:master
