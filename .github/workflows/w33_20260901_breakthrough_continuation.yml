name: 2026-09-01 breakthrough continuation
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260901_packet48_bt796_crossid.py'
      - 'analysis/w33_20260901_bt796_steinberg_hom_scan.py'
      - 'analysis/w33_20260901_binary48_ext_export.py'
      - 'analysis/w33_20260901_binary48_radical_socle.g'
      - '.github/workflows/w33_20260901_breakthrough_continuation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-20260901-breakthrough-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: GAP MeatAxe
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gap gap-character-tables
          gap -q -c 'Print("gap live\n"); QUIT;'
      - name: Execute exact continuation
        shell: bash
        run: |
          set -o pipefail
          : > analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
          python analysis/w33_20260901_packet48_bt796_crossid.py 2>&1 | tee -a analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
          python analysis/w33_20260901_bt796_steinberg_hom_scan.py 2>&1 | tee -a analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
          python analysis/w33_20260901_binary48_ext_export.py 2>&1 | tee -a analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
          test -s analysis/PART_W33_20260901_BINARY48_MATRICES.g
          gap -q analysis/w33_20260901_binary48_radical_socle.g 2>&1 | tee -a analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
      - name: Freeze exact evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in [
            'data/PART_W33_20260901_PACKET48_BT796_CROSSID.json',
            'data/PART_W33_20260901_BT796_STEINBERG_HOM_SCAN.json',
            'data/PART_W33_20260901_BINARY48_EXPORT.json',
            'data/PART_W33_20260901_BINARY48_RADICAL_SOCLE.json']:
              d=json.loads(Path(f).read_text())
              assert d.get('status')=='PASS',(f,d.get('status'))
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add data/PART_W33_20260901_PACKET48_BT796_CROSSID.json \
            data/PART_W33_20260901_BT796_STEINBERG_HOM_SCAN.json \
            data/PART_W33_20260901_BINARY48_EXPORT.json \
            data/PART_W33_20260901_BINARY48_RADICAL_SOCLE.json
          git add -f analysis/PASS_20260901_BREAKTHROUGH_CONTINUATION.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze packet2160 dark-S and binary48 continuation evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
