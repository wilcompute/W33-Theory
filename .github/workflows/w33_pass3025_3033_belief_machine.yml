name: Passes 3025-3033 Belief Machine Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/bt3025_3031_common.py'
      - 'analysis/bt3025_noisy_d4_bayes.py'
      - 'analysis/bt3026_27_triangle_sat.py'
      - 'analysis/bt3027_edit_sync_pilot_order.py'
      - 'analysis/bt3029_predictive_causal_states.py'
      - 'analysis/bt3030_d4_fourier_belief_engine.py'
      - 'analysis/bt3031_measurement_basis_portfolio.py'
      - 'analysis/BT3025_BT3033_*'
      - 'rtl/*3028*'
      - 'tests/test_bt3025_bt3033_belief_machine.py'
      - 'tools/integrate_bt3025_bt3033.py'
      - '.github/workflows/w33_pass3025_3033_belief_machine.yml'

permissions:
  contents: write

concurrency:
  group: pass3025-3033-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-rtl-manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact and RTL toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install --upgrade pip
          python -m pip install numpy pytest python-sat[pblib,aiger]

      - uses: wtfjoke/setup-tectonic@v3

      - name: Regenerate exact and modeled certificates
        run: |
          python analysis/bt3025_noisy_d4_bayes.py
          python analysis/bt3026_27_triangle_sat.py --cnf data/bt3026_no27.cnf
          python analysis/bt3027_edit_sync_pilot_order.py
          python analysis/bt3029_predictive_causal_states.py
          python analysis/bt3030_d4_fourier_belief_engine.py
          python analysis/bt3031_measurement_basis_portfolio.py

      - name: Focused finite regressions
        run: pytest -q tests/test_bt3025_bt3033_belief_machine.py

      - name: Simulate adaptive belief controller
        run: |
          iverilog -g2012 -s tb_w33_pass3028_adaptive_belief_controller \
            -o /tmp/pass3028.vvp \
            rtl/w33_pass3028_adaptive_belief_controller.sv \
            rtl/tb_w33_pass3028_adaptive_belief_controller.sv
          vvp /tmp/pass3028.vvp | tee evidence_pass3028_iverilog.log
          grep -q 'PASS adaptive belief controller' evidence_pass3028_iverilog.log

      - name: Synthesize adaptive belief controller
        run: |
          yosys -p 'read_verilog -sv rtl/w33_pass3028_adaptive_belief_controller.sv; hierarchy -top w33_pass3028_adaptive_belief_controller; proc; opt; check; stat' \
            | tee evidence_pass3028_yosys.log
          grep -q 'Number of cells' evidence_pass3028_yosys.log

      - name: Integrate four front doors idempotently
        run: |
          python tools/integrate_bt3025_bt3033.py
          sha256sum w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html > /tmp/first.sha
          python tools/integrate_bt3025_bt3033.py
          sha256sum w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha

      - name: Compile all three manuscripts
        run: |
          tectonic w33_paper.tex
          tectonic photonic_holonet.tex
          tectonic holonet_machine_blueprint.tex
          test -s w33_paper.pdf
          test -s photonic_holonet.pdf
          test -s holonet_machine_blueprint.pdf

      - name: Freeze stable observed evidence
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          mkdir -p evidence/pass3025_3033
          sha256sum \
            data/PART_BT3025_NOISY_D4_BAYES_results.json \
            data/PART_BT3026_D4_FIXED_OPTIMUM_results.json \
            data/PART_BT3027_EDIT_SYNC_PILOT_ORDER_results.json \
            data/PART_BT3029_PREDICTIVE_CAUSAL_STATES_results.json \
            data/PART_BT3030_D4_FOURIER_BELIEF_results.json \
            data/PART_BT3031_MEASUREMENT_BASIS_PORTFOLIO_results.json \
            w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf \
            > evidence/pass3025_3033/SHA256SUMS
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('evidence/pass3025_3033/COMPLETE.json')
          p.write_text(json.dumps({
            'schema':'w33.pass3025_3033.observed_evidence.v1',
            'status':'COMPLETE_FOCUSED_EXACT_RTL_AND_THREE_PDF_BUILDS',
            'commit':os.environ['GITHUB_SHA'],
            'sat_27_optimality':'separate workflow; not implied',
            'laboratory_claims':'none'
          },indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html
          git add data/PART_BT3025_NOISY_D4_BAYES_results.json \
                  data/PART_BT3026_D4_FIXED_OPTIMUM_results.json \
                  data/PART_BT3027_EDIT_SYNC_PILOT_ORDER_results.json \
                  data/PART_BT3029_PREDICTIVE_CAUSAL_STATES_results.json \
                  data/PART_BT3030_D4_FOURIER_BELIEF_results.json \
                  data/PART_BT3031_MEASUREMENT_BASIS_PORTFOLIO_results.json \
                  evidence/pass3025_3033
          git add -f w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Passes 3025-3033: record observed RTL and manuscript evidence'
            git push origin HEAD:"$HEAD_BRANCH"
          fi

      - name: Upload volatile logs and builds
        uses: actions/upload-artifact@v4
        with:
          name: pass3025-3033-belief-machine-evidence
          path: |
            evidence_pass3028_iverilog.log
            evidence_pass3028_yosys.log
            evidence/pass3025_3033/
            data/PART_BT3025_NOISY_D4_BAYES_results.json
            data/PART_BT3026_D4_FIXED_OPTIMUM_results.json
            data/PART_BT3027_EDIT_SYNC_PILOT_ORDER_results.json
            data/PART_BT3029_PREDICTIVE_CAUSAL_STATES_results.json
            data/PART_BT3030_D4_FOURIER_BELIEF_results.json
            data/PART_BT3031_MEASUREMENT_BASIS_PORTFOLIO_results.json
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
