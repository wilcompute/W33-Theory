name: Passes 1420-1424 Five Exact Frontiers

on:
  push:
    branches:
      - 'agent/pass1410-1414-*'
    paths:
      - 'analysis/pass1410_1414/**'
      - 'analysis/w33_pass1420_1424_five_frontiers.py'
      - '.github/workflows/pass1420_1424_five_frontiers.yml'
  pull_request:
    branches: [master]
    paths:
      - 'analysis/pass1410_1414/**'
      - 'analysis/w33_pass1420_1424_five_frontiers.py'
      - '.github/workflows/pass1420_1424_five_frontiers.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  exact-worker:
    strategy:
      fail-fast: false
      matrix:
        worker: ['1420', '1421', '1422', '1423', '1424']
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check numpy sympy networkx pytest
      - run: python -m py_compile analysis/pass1410_1414/*.py analysis/w33_pass1420_1424_five_frontiers.py
      - run: python analysis/w33_pass1420_1424_five_frontiers.py --worker '${{ matrix.worker }}' --output '/tmp/pass-${{ matrix.worker }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: pass-${{ matrix.worker }}
          path: /tmp/pass-${{ matrix.worker }}.json
          if-no-files-found: error
