name: W33 Pass5816-5823 matrix Fourier rank stratification

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5816_5823_matrix_fourier_rank_stratification.py'
      - 'analysis/PASS5816_5823_matrix_fourier_rank_stratification_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/PART_W33_PASS5816_5823_MATRIX_FOURIER_RANK_STRATIFICATION.json'
      - 'tests/test_w33_pass5816_5823_matrix_fourier_rank_stratification.py'
      - '.github/workflows/w33_pass5816_5823_matrix_fourier_rank_stratification.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass5816_5823_matrix_fourier_rank_stratification.py'
      - 'tests/test_w33_pass5816_5823_matrix_fourier_rank_stratification.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Replay matrix Fourier theorem exactly
        run: python -m pytest -q tests/test_w33_pass5816_5823_matrix_fourier_rank_stratification.py
      - name: Upload theorem certificate
        uses: actions/upload-artifact@v4
        with:
          name: pass5816-5823-certificate
          path: data/PART_W33_PASS5816_5823_MATRIX_FOURIER_RANK_STRATIFICATION.json
