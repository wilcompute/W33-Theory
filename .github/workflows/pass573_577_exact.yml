name: Passes 573-577 exact certificates
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass573_*.py'
      - 'analysis/w33_pass574_*.py'
      - 'analysis/w33_pass575_*.py'
      - 'analysis/w33_pass576_*.py'
      - 'analysis/w33_pass577_*.py'
      - 'data/w33_pass573_*.json'
      - 'data/w33_pass574_*.json'
      - 'data/w33_pass575_*.json'
      - 'data/w33_pass576_*.json'
      - 'data/w33_pass577_*.json'
      - 'hardware/w33_pass577_*.json'
      - 'formal/W33/Pass575CyclotomicDVRKernel.lean'
      - 'formal/W33.lean'
      - 'tests/test_w33_pass573_577_*.py'
      - 'PASS573_577_C3_600CELL_SCHEME_DVR_IDEMPOTENT_DP_RELEASE.md'
      - '.github/workflows/pass573_577_exact.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  NUMBA_NUM_THREADS: '4'
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 numba==0.65.1 scipy==1.17.0 sympy==1.14.0 pytest==9.0.2
      - run: python analysis/w33_pass573_hjelmslev_c3_600cell_apex.py --check
      - run: python analysis/w33_pass574_singer_coherent_configuration.py --check
      - run: python analysis/w33_pass575_cyclotomic_dvr_kernel_formal.py --check
      - run: python analysis/w33_pass576_exact_walsh_central_idempotents.py --check
      - run: python analysis/w33_pass577_bayesian_posterior_dynamic_program.py --check
      - run: python analysis/w33_pass573_577_release.py --check
      - run: pytest -q tests/test_w33_pass573_577_c3_600cell_scheme_dvr_idempotent_dp.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
