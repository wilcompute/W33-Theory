name: Diagnose W33 Pages settings

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/diagnose-pages-settings.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration and record it
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });
            const page = response.data;
            const path = 'data/pages_settings_diagnostic.json';
            const branch = 'pages-diagnostics';
            const payload = {
              schema: 'w33.pages_settings_diagnostic.v1',
              build_type: page.build_type,
              source: page.source,
              html_url: page.html_url,
              status: page.status,
              cname: page.cname,
              https_enforced: page.https_enforced,
              workflow_run_id: context.runId,
              trigger_sha: context.sha,
              observed_at: new Date().toISOString()
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Record Pages settings diagnostic ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
