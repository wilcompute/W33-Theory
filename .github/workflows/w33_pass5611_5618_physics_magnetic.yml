name: W33 Pass5611-5618 physics magnetic frontier

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5611_*'
      - 'analysis/w33_pass5612_*'
      - 'analysis/w33_pass5613_*'
      - 'analysis/w33_pass5614_*'
      - 'analysis/w33_pass5615_*'
      - 'analysis/w33_pass5616_*'
      - 'analysis/w33_pass5617_*'
      - 'analysis/w33_pass5618_*'
      - 'analysis/PASS5611_5618_*'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'tests/test_w33_pass5611_5618_physics_magnetic_frontier.py'
      - 'data/w33_pass_namespace_registry_v2.d/5611-5618.json'
      - 'data/w33_publication_frontier_contract_v2.json'
      - '.github/workflows/w33_pass5611_5618_physics_magnetic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip numpy pytest
          sudo apt-get update -qq
          sudo apt-get install -y gap gap-grape
      - name: Rebuild F4 short-root-pair certificate
        run: python analysis/w33_pass5596_f4_rootpair_latin_action.py
      - name: Execute direct 13-cover to Latin S12 conjugator
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          rm -f data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json
          gap -q -b --nointeract analysis/w33_pass5606_cover12_explicit_conjugator.g
          test -s data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json
          grep -q '"conjugate_in_S12": true' data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json
      - name: Replay Pass5611-5618 producers
        run: python analysis/w33_pass5611_5618_runner.py
      - name: Require closed cover-to-F4 object dictionary
        run: grep -q '"status": "EXPLICIT_COVER_TO_F4_OBJECT_DICTIONARY"' data/PART_W33_PASS5615_COVER_F4_OBJECT_DICTIONARY.json
      - name: Focused regression
        run: python -m pytest -q tests/test_w33_pass5611_5618_physics_magnetic_frontier.py
      - name: Materialize homepage and audit publication DAG
        run: |
          python tools/integrate_bt3376_bt3389.py --report /tmp/public-integration.json
          python analysis/w33_pass5364_publication_dag_audit.py --report /tmp/publication-dag.json
          test "$(grep -c 'id=\"pass-5611-5618-physics-magnetic-frontier\"' docs/index.html)" -eq 1
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Compile canonical manuscripts
        run: |
          mkdir -p evidence/pass5611_5618
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5611_5618/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass5611_5618/pdf_sha256.txt
      - name: Freeze regenerated certificates and homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/PART_W33_PASS5606_COVER12_EXPLICIT_CONJUGATOR.json \
            data/PART_W33_PASS5596_F4_ROOTPAIR_LATIN_ACTION.json \
            data/PART_W33_PASS5611_GENERAL_Q_MAGNETIC_BULK.json \
            data/PART_W33_PASS5612_PROJECTIVITY_MINWORDS_SEMILINEAR.json \
            data/PART_W33_PASS5613_INTRINSIC_HEISENBERG_VECTOR_LIFT.json \
            data/PART_W33_PASS5614_Q3_PHYSICS_SELECTOR.json \
            data/PART_W33_PASS5615_COVER_F4_OBJECT_DICTIONARY.json \
            data/PART_W33_PASS5616_DIRAC_MAGNETIC_DISPERSION.json \
            data/PART_W33_PASS5617_Z3_GAUGE_HARPER.json \
            data/PART_W33_PASS5618_GAUGE_MATTER_PHASE_SELECTION.json \
            docs/index.html
          if git diff --cached --quiet; then
            echo 'Certificates and homepage already materialized.'
          else
            git commit -m 'Freeze Pass5611-5618 certificates and homepage [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass5611-5618-physics-magnetic-frontier
          path: evidence/pass5611_5618/**
