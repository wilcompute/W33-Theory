name: Pass 1132-1136 exact release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_we6_exact_core.py'
      - 'analysis/w33_pass1133_true_spectral_functional_calculus.py'
      - 'analysis/w33_pass1134_we6_432_stabilizers.py'
      - 'analysis/w33_pass1135_cubic_kernel_decomposition.py'
      - 'scripts/check_shifted_adjacency_descendants.py'
      - 'scripts/tag_540_disambiguation.py'
      - 'data/w33_shifted_adjacency_retraction_ledger.json'
      - 'tests/test_w33_pass1132_1136.py'
      - '.github/workflows/pass1132_1136_exact_release.yml'

permissions:
  contents: write

jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - name: Recompute exact certificates
        run: |
          python analysis/w33_pass1133_true_spectral_functional_calculus.py
          python analysis/w33_pass1134_we6_432_stabilizers.py
          python analysis/w33_pass1135_cubic_kernel_decomposition.py
      - name: Full descendant and 540 corpus reports
        run: |
          python scripts/check_shifted_adjacency_descendants.py --root . --write-report data/w33_shifted_adjacency_descendant_audit.json
          python scripts/tag_540_disambiguation.py --root . --json-out data/BT1634_540_audit_results.json
      - name: Focused tests
        run: pytest -q tests/test_w33_pass1132_1136.py
      - name: Commit generated corpus reports
        run: |
          if [ -z "$(git status --porcelain -- data/w33_shifted_adjacency_descendant_audit.json data/BT1634_540_audit_results.json)" ]; then
            echo 'Generated reports unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/w33_shifted_adjacency_descendant_audit.json data/BT1634_540_audit_results.json
          git commit -m 'Pass 1136: refresh full corpus identity reports'
          git push
