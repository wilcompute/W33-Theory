name: W33 five followthrough gates and hidden-frame coherence
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "analysis/w33_20261108_five_followthrough_plus_coherence.py"
      - "tests/test_w33_20261108_five_followthrough_plus_coherence.py"
      - "data/w33_20261108_five_followthrough_plus_coherence.json"
      - "analysis/PASS20261108_FIVE_FOLLOWTHROUGH_PLUS_COHERENCE.md"
      - ".github/workflows/w33_20261108_five_followthrough_plus_coherence.yml"
  push:
    paths:
      - "analysis/w33_20261108_five_followthrough_plus_coherence.py"
      - "tests/test_w33_20261108_five_followthrough_plus_coherence.py"
      - "data/w33_20261108_five_followthrough_plus_coherence.json"
      - "analysis/PASS20261108_FIVE_FOLLOWTHROUGH_PLUS_COHERENCE.md"
      - ".github/workflows/w33_20261108_five_followthrough_plus_coherence.yml"
permissions:
  contents: read
jobs:
  five-gates-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install algebra and test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy pytest
      - name: Verify 26 regressions
        run: python -m pytest -q tests/test_w33_20261108_five_followthrough_plus_coherence.py
      - name: Independently reproduce machine certificate
        run: python analysis/w33_20261108_five_followthrough_plus_coherence.py --out data/w33_20261108_five_followthrough_plus_coherence_ci.json
      - name: Evidence firewall
        run: |
          python - <<'PY'
          import json
          j=json.load(open("data/w33_20261108_five_followthrough_plus_coherence_ci.json",encoding="utf-8"))
          assert j["frame"]["cases"][0]["degenerate_minima"]==4
          assert j["Maxwell"]["nonlinear_gauge_action_difference"]<1e-10
          assert j["Maxwell"]["discrete_charge_continuity_residual"]<1e-10
          assert j["clock"]["total_trials"]==48
          assert j["E6"]["e6_torus_nullspace_dimension"]==6
          assert j["E6"]["full_E6_covariance_certified"] is False
          assert j["cosmology"]["future_independent_shear_likelihood_executed"] is False
          assert j["cosmology"]["S9_preregistration_not_future_data"] is True
          assert j["sixth"]["exact_purity_class_census"] == {"0":{"0.25":8,"1.0":1},"1":{"0.25":6},"2":{"0.375":12}}
          assert j["sixth"]["frame_matched_inverse_echo_probabilities"]["q2_duplicated_reference"]==0.5
          print("PASS: native math, exact hidden-frame witness, missing E6/lab/cosmology evidence explicitly flagged")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-five-followthrough-coherence
          path: data/w33_20261108_five_followthrough_plus_coherence_ci.json
          retention-days: 30
