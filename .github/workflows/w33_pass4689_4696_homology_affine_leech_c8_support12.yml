name: W33 Passes 4689-4696 evidence

on:
  push:
    paths:
      - 'analysis/w33_pass4689_three_39d_module_comparison.py'
      - 'analysis/w33_pass4690_full_sextet_affine_group.py'
      - 'analysis/w33_pass4691_explicit_leech_two_neighbor.py'
      - 'analysis/w33_pass4692_c8_closed_local_mass_formulas.py'
      - 'analysis/w33_pass4693_support12_transitivity_exact.py'
      - 'analysis/w33_pass4694_golay_affine_u6_form_nogo.py'
      - 'analysis/w33_pass4695_support12_minima_are_apartment_thickenings.py'
      - 'analysis/w33_pass4696_thickening_span_even_apartment_subcode.py'
      - 'data/PART_W33_PASS4689_*'
      - 'data/PART_W33_PASS4690_*'
      - 'data/PART_W33_PASS4691_*'
      - 'data/PART_W33_PASS4692_*'
      - 'data/PART_W33_PASS4693_*'
      - 'data/PART_W33_PASS4694_*'
      - 'data/PART_W33_PASS4695_*'
      - 'data/PART_W33_PASS4696_*'
      - 'tests/test_w33_pass4689_4696_homology_affine_leech_c8_support12.py'
      - '.github/workflows/w33_pass4689_4696_homology_affine_leech_c8_support12.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass4689_three_39d_module_comparison.py'
      - 'analysis/w33_pass4690_full_sextet_affine_group.py'
      - 'analysis/w33_pass4691_explicit_leech_two_neighbor.py'
      - 'analysis/w33_pass4692_c8_closed_local_mass_formulas.py'
      - 'analysis/w33_pass4693_support12_transitivity_exact.py'
      - 'analysis/w33_pass4694_golay_affine_u6_form_nogo.py'
      - 'analysis/w33_pass4695_support12_minima_are_apartment_thickenings.py'
      - 'analysis/w33_pass4696_thickening_span_even_apartment_subcode.py'
      - 'tests/test_w33_pass4689_4696_homology_affine_leech_c8_support12.py'

jobs:
  focused-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy sympy pytest
      - name: Frozen certificate regression
        run: python -m pytest -q tests/test_w33_pass4689_4696_homology_affine_leech_c8_support12.py
      - name: Regenerate moderate-cost witnesses
        run: |
          python analysis/w33_pass4689_three_39d_module_comparison.py
          python analysis/w33_pass4690_full_sextet_affine_group.py
          python analysis/w33_pass4691_explicit_leech_two_neighbor.py
          python analysis/w33_pass4692_c8_closed_local_mass_formulas.py
          python analysis/w33_pass4694_golay_affine_u6_form_nogo.py
          python analysis/w33_pass4695_support12_minima_are_apartment_thickenings.py
          python analysis/w33_pass4696_thickening_span_even_apartment_subcode.py
          python -m pytest -q tests/test_w33_pass4689_4696_homology_affine_leech_c8_support12.py
      - name: Support-12 execution boundary
        run: |
          echo 'Pass4693 is a completed native exhaustive sweep over C(39,11)=1,676,056,044 fixed-point subsets.'
          echo 'Its frozen spectrum is regression-checked above; the multi-billion-subset sweep is intentionally not repeated on every CI run.'
