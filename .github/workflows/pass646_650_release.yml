name: Passes 646-650 release verification

on:
  pull_request:
    paths:
      - 'analysis/w33_pass646_*.py'
      - 'analysis/w33_pass647_*.py'
      - 'analysis/w33_pass648_*.py'
      - 'analysis/w33_pass649_*.py'
      - 'analysis/w33_pass650_*.py'
      - 'analysis/BT646_650_five_frontier_release.md'
      - 'data/w33_pass646_*.json'
      - 'data/w33_pass647_*.json'
      - 'data/w33_pass648_*.json'
      - 'data/w33_pass649_*.json'
      - 'data/w33_pass650_*.json'
      - 'tests/test_w33_pass646_650.py'
      - '.github/workflows/pass646_650_release.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Generate deterministic certificates
        run: |
          python analysis/w33_pass646_2adic_deformation_functor.py
          python analysis/w33_pass647_conductor_gauge_descent.py
          python analysis/w33_pass648_dual_label_optical_prototype.py
          python analysis/w33_pass649_partial_channel_matrix_eprocess.py
          python analysis/w33_pass650_joint_science_diagnosis_game.py
      - name: Verify ledgers and focused regression
        run: |
          python analysis/w33_pass646_2adic_deformation_functor.py --check
          python analysis/w33_pass647_conductor_gauge_descent.py --check
          python analysis/w33_pass648_dual_label_optical_prototype.py --check
          python analysis/w33_pass649_partial_channel_matrix_eprocess.py --check
          python analysis/w33_pass650_joint_science_diagnosis_game.py --check
          python -m pytest -q tests/test_w33_pass646_650.py
      - name: Ensure generated ledgers are committed exactly
        run: git diff --exit-code -- data/w33_pass646_2adic_deformation_functor.json data/w33_pass647_conductor_gauge_descent.json data/w33_pass648_dual_label_optical_prototype.json data/w33_pass649_partial_channel_matrix_eprocess.json data/w33_pass650_joint_science_diagnosis_game.json
