name: Pass 3751-3758 publish exact source bundle

on:
  push:
    branches: [master]
    paths:
      - '.bootstrap/pass3751_bundle_*.b64'
      - '.github/workflows/w33_pass3751_bootstrap_bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w33-pass3751-bootstrap
  cancel-in-progress: true

jobs:
  reconstruct-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Require complete payload
        run: |
          for n in 00 01 02 03 04; do
            test -s ".bootstrap/pass3751_bundle_${n}.b64"
          done
      - name: Reconstruct content-addressed archive
        run: |
          cat .bootstrap/pass3751_bundle_*.b64 | base64 -d > /tmp/pass3751_bundle.tgz
          echo '649f8fd872b2fdd4da02d8a37fdc5fc23eb9aa53ed8a0678d3e707df5daac512  /tmp/pass3751_bundle.tgz' | sha256sum -c -
          tar -xzf /tmp/pass3751_bundle.tgz
          sed -i 's/numpy sympy pytest/numpy sympy networkx pytest/' .github/workflows/w33_pass3751_3758_monster_lattice_multiport_cover.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reconstructed exact source
        run: |
          python -m pip install --disable-pip-version-check numpy sympy networkx pytest
          python analysis/w33_pass3751_3758_monster_lattice_multiport_cover.py --check data/PART_3751_3758_MONSTER_LATTICE_MULTIPORT_COVER_results.json
          pytest -q tests/test_w33_pass3751_3758_monster_lattice_multiport_cover.py
          git diff --check
      - name: Publish bundle and remove bootstrap payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .bootstrap/pass3751_bundle_*.b64
          rm -f .github/workflows/w33_pass3751_bootstrap_bundle.yml
          rmdir .bootstrap 2>/dev/null || true
          git add -A
          git commit -m 'Passes 3751-3758: publish exact Monster lattice multiport cover packet'
          git pull --rebase origin master
          git push origin HEAD:master
