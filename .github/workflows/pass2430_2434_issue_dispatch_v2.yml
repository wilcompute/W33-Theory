name: Passes 2430-2434 isolated execution v2
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  execute:
    if: github.event.issue.title == '[pass2430-2434-isolated-execution-v2]'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and GAP dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy sympy networkx ortools
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
      - name: Execute tomotope role probe
        run: |
          mkdir -p execution_artifacts logs
          python analysis/w33_pass2430_tomotope_label_probe.py | tee execution_artifacts/pass2430_probe.json | tee logs/pass2430.log
      - name: Execute exact commutative fusion search
        run: python analysis/w33_pass2433_commutative_fusion_search.py | tee execution_artifacts/pass2433.json | tee logs/pass2433.log
      - name: Execute C5 split-subgroup character restriction
        run: gap -q analysis/gap/w33_pass2434_c5_split_hom_probe.g | tee execution_artifacts/pass2434_gap.json | tee logs/pass2434.log
      - name: Lift the selected nine signatures to literal frame covers
        run: python analysis/w33_pass2432_signature_lift_cpsat.py --time-limit 2700 --workers 8 --write-json execution_artifacts/pass2432.json | tee logs/pass2432.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass2430-2434-isolated-execution-v2
          path: |
            execution_artifacts
            logs
      - name: Report compact results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let body=`Passes 2430-2434 run **${context.runId}** finished with status **${{ job.status }}**.`;
            for (const f of ['pass2430_probe.json','pass2433.json','pass2434_gap.json','pass2432.json']) {
              try { let s=fs.readFileSync(`execution_artifacts/${f}`,'utf8'); body += `\n\n### ${f}\n\`\`\`json\n${s.slice(0,14000)}\n\`\`\``; } catch(e) { body += `\n\n${f}: unavailable (${e})`; }
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
