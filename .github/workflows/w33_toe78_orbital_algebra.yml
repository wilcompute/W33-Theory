name: TOE78 native 27 octagon 6-sector association scheme
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20261014_toe78_octagon_bose_mesner.py'
      - 'tests/test_w33_20261014_toe78_octagon_bose_mesner.py'
      - '.github/workflows/w33_toe78_orbital_algebra.yml'
  workflow_dispatch:
jobs:
  native-orbital-scheme:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest
      - name: Test exact native 6-dimensional orbital algebra and E6 six-sector spectrum
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python -m pytest -q tests/test_w33_20261014_toe78_octagon_bose_mesner.py
      - name: Regenerate integer Bose Mesner multiplication coefficients
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python analysis/w33_20261014_toe78_octagon_bose_mesner.py
      - uses: actions/upload-artifact@v4
        with:
          name: toe78-native-27-octagon-six-sector-scheme
          path: data/w33_20261014_toe78_octagon_bose_mesner.json
          retention-days: 60
