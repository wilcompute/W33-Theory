name: paper-build

on:
  push:
    branches: [master]
    paths:
      - '**.tex'
      - '**.bib'
      - '.github/workflows/paper-build.yml'
  pull_request:
    paths:
      - '**.tex'
      - '**.bib'
  workflow_dispatch:

jobs:
  build-pdf:
    name: Compile w33_preprint.tex → PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (full)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-full latexmk

      - name: First pdflatex pass
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}

      - name: Run BibTeX
        run: bibtex w33_preprint || true
        working-directory: ${{ github.workspace }}

      - name: Second pdflatex pass
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}

      - name: Third pdflatex pass (resolve all refs)
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}

      - name: Check for undefined references / citations
        run: |
          if grep -q 'undefined' w33_preprint.log; then
            echo "WARNING: Undefined references or citations found:"
            grep 'undefined' w33_preprint.log
          fi
          if grep -q 'Error' w33_preprint.log; then
            echo "FATAL: LaTeX errors found:"
            grep 'Error' w33_preprint.log
            exit 1
          fi
          echo "Clean build: no errors."
        working-directory: ${{ github.workspace }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: w33-preprint-pdf
          path: w33_preprint.pdf
          retention-days: 90

      - name: Check PDF was produced
        run: |
          if [ ! -f w33_preprint.pdf ]; then
            echo "FATAL: w33_preprint.pdf was not produced!"
            exit 1
          fi
          echo "PDF produced: $(du -h w33_preprint.pdf | cut -f1)"
        working-directory: ${{ github.workspace }}
