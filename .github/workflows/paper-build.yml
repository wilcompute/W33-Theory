name: paper-build

on:
  push:
    branches: [master]
    paths:
      - 'paper/**'
      - '.github/workflows/paper-build.yml'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build-pdf:
    name: Compile w33_preprint.tex → PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (full)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-full latexmk

      - name: First pdflatex pass
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}/paper

      - name: Run BibTeX
        run: bibtex w33_preprint || true
        working-directory: ${{ github.workspace }}/paper

      - name: Second pdflatex pass
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}/paper

      - name: Third pdflatex pass (resolve all refs)
        run: pdflatex -interaction=nonstopmode -halt-on-error w33_preprint.tex
        working-directory: ${{ github.workspace }}/paper

      - name: Check for LaTeX errors
        run: |
          if grep -qE '^!' w33_preprint.log; then
            echo "FATAL: LaTeX errors found:"
            grep -E '^!' w33_preprint.log
            exit 1
          fi
          if grep -q 'undefined' w33_preprint.log; then
            echo "WARNING: Undefined references or citations:"
            grep 'undefined' w33_preprint.log || true
          fi
          echo "Clean build confirmed."
        working-directory: ${{ github.workspace }}/paper

      - name: Verify PDF produced
        run: |
          ls -lh w33_preprint.pdf
          echo "PDF produced: $(du -h w33_preprint.pdf | cut -f1)"
        working-directory: ${{ github.workspace }}/paper

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: w33-preprint-pdf
          path: paper/w33_preprint.pdf
          retention-days: 90
