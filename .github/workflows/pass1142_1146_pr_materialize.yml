name: Validate Pass 1142-1147 on PR

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/w33_pass1142_1146_exact.py'
      - 'analysis/w33_pass1142_1146_intertwiner.py'
      - 'analysis/w33_pass1142_1146_release_compiler.py'
      - 'analysis/w33_pass1147_schlaefli_steinberg_fourier_bridge.g'
      - 'scripts/pass1142_1146_bundle_runtime.py'
      - 'scripts/pass1147_transparent_runtime.py'
      - 'scripts/migrate_shifted_adjacency_descendants.py'
      - 'scripts/build_540_occurrence_registry.py'
      - 'scripts/tag_540_disambiguation.py'
      - 'data/pass1142_1146_source_bundle.b64'
      - 'data/w33_pass1147_schlaefli_steinberg_fourier_bridge.json'
      - 'tests/test_pass1142_1147_transparent_runtime.py'
      - '.github/workflows/pass1142_1146_pr_materialize.yml'

permissions:
  contents: read

jobs:
  exact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GAP and test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables gap-table-of-marks
          python -m pip install pytest
      - name: Assert the legacy transport remains quarantined
        run: python scripts/pass1142_1146_bundle_runtime.py --assert-known-corrupt
      - name: Execute transparent GAP producer and compatibility validators
        run: |
          python analysis/w33_pass1142_1146_exact.py
          python analysis/w33_pass1142_1146_intertwiner.py --certificate data/w33_pass1147_schlaefli_steinberg_fourier_bridge.json
          python analysis/w33_pass1142_1146_release_compiler.py --certificate data/w33_pass1147_schlaefli_steinberg_fourier_bridge.json
      - name: Run focused regressions
        run: |
          pytest -q tests/test_w33_pass1142_1146.py tests/test_pass1142_1147_transparent_runtime.py
      - name: Run read-only corpus guards
        run: |
          python scripts/migrate_shifted_adjacency_descendants.py --check-only
          python scripts/build_540_occurrence_registry.py PASS1142_1146_EXACT_RELEASE.md > /dev/null
