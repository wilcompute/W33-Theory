name: Passes 641-645 release verification

on:
  pull_request:
    paths:
      - 'analysis/w33_pass641_*.py'
      - 'analysis/w33_pass642_*.py'
      - 'analysis/w33_pass643_*.py'
      - 'analysis/w33_pass644_*.py'
      - 'analysis/w33_pass645_*.py'
      - 'analysis/BT641_645_five_frontier_release.md'
      - 'data/w33_pass641_*.json'
      - 'data/w33_pass642_*.json'
      - 'data/w33_pass643_*.json'
      - 'data/w33_pass644_*.json'
      - 'data/w33_pass645_*.json'
      - 'tests/test_w33_pass641_645.py'
      - '.github/workflows/pass641_645_release.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Generate Pass 641 certificate
        run: python analysis/w33_pass641_higher_2adic_commutant.py
      - name: Generate Pass 642 certificate
        run: python analysis/w33_pass642_conductor_torsion_map.py
      - name: Generate Pass 643 certificate
        run: python analysis/w33_pass643_multiplexed_guard_fibre.py
      - name: Generate Pass 644 certificate
        run: python analysis/w33_pass644_unbounded_matrix_eprocess.py
      - name: Generate Pass 645 certificate
        run: python analysis/w33_pass645_minimax_controller.py
      - name: Verify deterministic ledgers and focused regression
        run: |
          python analysis/w33_pass641_higher_2adic_commutant.py --check
          python analysis/w33_pass642_conductor_torsion_map.py --check
          python analysis/w33_pass643_multiplexed_guard_fibre.py --check
          python analysis/w33_pass644_unbounded_matrix_eprocess.py --check
          python analysis/w33_pass645_minimax_controller.py --check
          python -m pytest -q tests/test_w33_pass641_645.py
      - name: Ensure generated ledgers are committed exactly
        run: git diff --exit-code -- data/w33_pass641_higher_2adic_commutant.json data/w33_pass642_conductor_torsion_map.json data/w33_pass643_multiplexed_guard_fibre.json data/w33_pass644_unbounded_matrix_eprocess.json data/w33_pass645_minimax_controller.json
