name: W33 Pass5824-5831 integral W9 lattices

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5824_5831_integral_w9_lattices.py'
      - 'analysis/PASS5824_5831_integral_w9_lattices_insert.tex'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/PART_W33_PASS5824_5831_INTEGRAL_W9_LATTICES.json'
      - 'tests/test_w33_pass5824_5831_integral_w9_lattices.py'
      - '.github/workflows/w33_pass5824_5831_integral_w9_lattices.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass5824_5831_integral_w9_lattices.py'
      - 'tests/test_w33_pass5824_5831_integral_w9_lattices.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic dependencies
        run: python -m pip install --upgrade pip pytest sympy
      - name: Replay integral lattice theorem exactly
        run: python -m pytest -q tests/test_w33_pass5824_5831_integral_w9_lattices.py
      - name: Upload theorem certificate
        uses: actions/upload-artifact@v4
        with:
          name: pass5824-5831-certificate
          path: data/PART_W33_PASS5824_5831_INTEGRAL_W9_LATTICES.json
