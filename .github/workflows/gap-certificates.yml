name: GAP Certificates

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'analysis/**.g'
      - 'scripts/run_gap.sh'
      - '.github/workflows/gap-certificates.yml'
  pull_request:
    paths:
      - 'analysis/**.g'
      - 'scripts/run_gap.sh'
      - '.github/workflows/gap-certificates.yml'

jobs:
  gap-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Try to install GAP
        id: gap
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends gap || true
          sudo apt-get install -y --no-install-recommends gap-character-tables || true
          if command -v gap >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            gap --version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Pass 1020
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p data
          gap -q -b --nointeract analysis/w33_pass1020_e8_transitive_51840.g

      - name: Run Pass 1021
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gap -q -b --nointeract analysis/w33_pass1021_e8_fibration_over_forty.g

      - name: Run Pass 1022 diagnostic
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -o pipefail
          rm -f data/w33_pass1022_equivariant_section_obstruction.json
          gap -q -b --nointeract analysis/w33_pass1022_equivariant_section_obstruction.g \
            2>&1 | tee data/w33_pass1022_stdout.txt
          echo "certificate_exists=$(test -f data/w33_pass1022_equivariant_section_obstruction.json && echo yes || echo no)"

      - name: Display Pass 1022 diagnostic
        if: always() && steps.gap.outputs.available == 'true'
        run: |
          echo '--- GAP STDOUT ---'
          cat data/w33_pass1022_stdout.txt || true
          echo '--- CERTIFICATE ---'
          cat data/w33_pass1022_equivariant_section_obstruction.json || true

      - name: Upload GAP diagnostic
        if: always() && steps.gap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gap-pass1022-diagnostic
          path: |
            data/w33_pass1022_equivariant_section_obstruction.json
            data/w33_pass1022_stdout.txt
          if-no-files-found: warn
