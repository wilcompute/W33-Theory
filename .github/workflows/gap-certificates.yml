name: Pass 1022 GAP Certificate

# Pass 1022 rebuilds its E8/W33 substrate independently. Delete the tracked JSON
# first and require a newly emitted certificate, so GAP batch-mode errors cannot
# be hidden by stale repository data.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'analysis/w33_pass1022_equivariant_section_obstruction.g'
      - 'analysis/w33_pass1022_section_obstruction_certificate.py'
      - '.github/workflows/gap-certificates.yml'
  pull_request:
    paths:
      - 'analysis/w33_pass1022_equivariant_section_obstruction.g'
      - 'analysis/w33_pass1022_section_obstruction_certificate.py'
      - 'analysis/pass1022_final_ci_trigger.g'
      - '.github/workflows/gap-certificates.yml'

jobs:
  pass1022-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Try to install GAP
        id: gap
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends gap || true
          if command -v gap >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            gap --version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (GAP unavailable)
        if: steps.gap.outputs.available != 'true'
        run: |
          echo "::notice title=Pass 1022 skipped::GAP is unavailable; no theorem verification occurred."

      - name: Run Pass 1022 fail closed
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -f data/w33_pass1022_equivariant_section_obstruction.json
          gap -q -b --nointeract analysis/w33_pass1022_equivariant_section_obstruction.g
          test -f data/w33_pass1022_equivariant_section_obstruction.json

      - name: Validate emitted certificate
        if: steps.gap.outputs.available == 'true'
        run: python analysis/w33_pass1022_section_obstruction_certificate.py

      - name: Upload Pass 1022 certificate
        if: always() && steps.gap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pass1022-gap-certificate
          path: data/w33_pass1022_equivariant_section_obstruction.json
          if-no-files-found: error
