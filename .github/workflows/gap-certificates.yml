name: GAP Certificates

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'analysis/**.g'
      - 'scripts/run_gap.sh'
      - '.github/workflows/gap-certificates.yml'
  pull_request:
    paths:
      - 'analysis/**.g'
      - 'scripts/run_gap.sh'
      - '.github/workflows/gap-certificates.yml'

jobs:
  gap-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Try to install GAP
        id: gap
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends gap || true
          sudo apt-get install -y --no-install-recommends gap-character-tables || true
          if command -v gap >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            gap --version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (GAP unavailable)
        if: steps.gap.outputs.available != 'true'
        run: |
          echo "::notice title=GAP certificates skipped::GAP is not available on this runner."

      - name: Run Pass 1020
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p data
          gap -q -b --nointeract analysis/w33_pass1020_e8_transitive_51840.g

      - name: Run Pass 1021
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gap -q -b --nointeract analysis/w33_pass1021_e8_fibration_over_forty.g

      - name: Run Pass 1022 with captured diagnostics
        if: steps.gap.outputs.available == 'true'
        env:
          W33_REPO: ${{ github.workspace }}
        run: |
          set -o pipefail
          gap -q -b --nointeract analysis/w33_pass1022_equivariant_section_obstruction.g \
            > data/w33_pass1022_stdout.txt 2>&1 || true
          cat data/w33_pass1022_stdout.txt
          echo "certificate_exists=$(test -f data/w33_pass1022_equivariant_section_obstruction.json && echo yes || echo no)"
          echo "diagnostic_exists=$(test -f data/w33_pass1022_diagnostic.txt && echo yes || echo no)"

      - name: Validate available certificates
        if: steps.gap.outputs.available == 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("data/w33_pass1020_e8_transitive_51840.json"),
              Path("data/w33_pass1021_e8_fibration_over_forty.json"),
              Path("data/w33_pass1022_equivariant_section_obstruction.json"),
          ]:
              print(path, "exists=", path.exists())
              if path.exists():
                  data = json.load(open(path))
                  print(json.dumps(data, sort_keys=True))
          PY

      - name: Upload GAP certificates and diagnostics
        if: always() && steps.gap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gap-certificates-debug
          path: |
            data/w33_pass*.json
            data/w33_pass1022*.txt
          if-no-files-found: warn
