name: Materialize Pass 1150 corpus migration on PR

on:
  pull_request:
    branches: [master]
    paths:
      - 'PASS1150_MATERIALIZE.trigger'
      - '.github/workflows/pass1150_materialize_pr.yml'
      - 'analysis/w33_pass1150_finalize_shifted_adjacency_migration.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Apply every pending disposition
        run: python analysis/w33_pass1150_finalize_shifted_adjacency_migration.py --apply
      - name: Assert zero pending ledger states
        run: |
          python - <<'PY'
          import json
          p='data/w33_shifted_adjacency_retraction_ledger.json'
          d=json.load(open(p,encoding='utf-8'))
          pending={k:v for k,v in d['known_descendants'].items() if 'pending' in v.lower()}
          assert not pending, pending
          assert d['schema'].endswith('v4')
          PY
      - name: Re-run strict descendant audit
        run: |
          set +e
          python scripts/check_shifted_adjacency_descendants.py --root . --write-report data/w33_shifted_adjacency_descendant_audit.json
          rc=$?
          python - <<'PY'
          import json
          p='data/w33_shifted_adjacency_descendant_audit.json'
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps({
            'summary': d.get('summary'),
            'violations': d.get('violations', []),
          }, indent=2))
          PY
          exit $rc
      - name: Run focused regressions
        run: pytest -q tests/test_w33_pass1150_migration.py tests/test_pass1140_shifted_adjacency_publication_repair.py tests/test_w33_pass1148_1152.py
      - name: Commit generated migration delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration delta.'
            exit 0
          fi
          git commit -m 'Pass 1150: complete shifted-adjacency corpus migration'
          git push origin HEAD:${{ github.head_ref }}
