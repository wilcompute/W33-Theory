name: Passes 3729-3742 Five Front and Website Restore

on:
  pull_request:
    branches: [master]
    paths:
      - 'analysis/*3729*'
      - 'analysis/*3742*'
      - 'data/PART_BT3729_BT3742_FIVE_FRONT_WEBSITE_RESTORE_results.json'
      - 'data/w33_pass_namespace_registry_v2.d/3729-3742.json'
      - 'tests/test_bt3729_3742_five_front_website_restore.py'
      - 'docs/index.html'
      - 'docs/source-derived-architecture-landing-2026-08-05.html'
      - 'docs/cubic-tomotope-module-website-restore.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
      - '.github/workflows/w33_pass3729_3742_five_front_website_restore.yml'
  push:
    branches: [master]
    paths:
      - 'analysis/*3729*'
      - 'analysis/*3742*'
      - 'data/PART_BT3729_BT3742_FIVE_FRONT_WEBSITE_RESTORE_results.json'
      - 'tests/test_bt3729_3742_five_front_website_restore.py'
      - 'docs/index.html'
      - 'docs/source-derived-architecture-landing-2026-08-05.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_current_frontier_manifest_v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass3729-3742-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-website-papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx pytest
      - name: Verify website blobs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          assert blob('docs/index.html') == '41a8d733f42da18282fa276f5d2fa82bac7516f6'
          assert blob('docs/source-derived-architecture-landing-2026-08-05.html') == '94e90827ec73fc20e632fba5519fed2d109846d6'
          assert len(Path('docs/index.html').read_bytes().splitlines()) == 28865
          print('PASS byte-exact website restore and archive')
          PY
      - name: Regenerate exact certificate
        run: |
          mkdir -p evidence/pass3729_3742
          python analysis/bt3729_3742_five_front_website_restore.py --json evidence/pass3729_3742/results.json | tee evidence/pass3729_3742/exact.log
          grep -F 'PASS_5_FRONTS_PLUS_2_BONKERS_AND_WEBSITE_RESTORE c6e5e73fb5a18d9add4c1643d52df31413280b0e5cd157294ca686f8df32a299' evidence/pass3729_3742/exact.log
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('evidence/pass3729_3742/results.json').read_text())
          frozen=json.loads(Path('data/PART_BT3729_BT3742_FIVE_FRONT_WEBSITE_RESTORE_results.json').read_text())
          assert generated == frozen
          print('PASS frozen certificate equality')
          PY
      - name: Focused regression
        run: |
          python -m pytest -q tests/test_bt3729_3742_five_front_website_restore.py | tee evidence/pass3729_3742/pytest.log
          git diff --check
      - name: Verify manifests
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          tex=Path('analysis/W33_CURRENT_FRONTIER_MANIFEST.tex').read_text()
          inputs=re.findall(r'\\input\{([^}]+)\}',tex)
          manifest=json.loads(Path('data/w33_current_frontier_manifest_v1.json').read_text())
          assert inputs == manifest['required_ordered_inputs']
          ours='analysis/BT3729_BT3742_five_front_website_restore_insert'
          assert inputs.count(ours)==1
          assert Path(ours+'.tex').is_file()
          pages=[x['token'] for x in manifest['standalone_public_pages']]
          assert pages.count('passes-3729-3742-five-front-website-restore')==1
          print('PASS manifest chronology and standalone publication')
          PY
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee evidence/pass3729_3742/${source%.tex}.log
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf > evidence/pass3729_3742/pdf_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass3729-3742-five-front-website-restore-evidence
          path: |
            evidence/pass3729_3742/**
            w33_paper.pdf
            photonic_holonet.pdf
            holonet_machine_blueprint.pdf
