name: Pass5056-5057 homepage materializer
on:
  push:
    branches: [master]
    paths:
      - 'analysis/PASS5056_5057_index_insert.html'
      - 'tools/integrate_pass5056_5057_public.py'
      - '.github/workflows/w33_pass5056_5057_site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/integrate_pass5056_5057_public.py
      - name: Commit generated homepage only if changed
        run: |
          if git diff --quiet -- docs/index.html index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/index.html index.html
          git commit -m 'Materialize Pass5056-5057 homepage card'
          git push origin HEAD:master
