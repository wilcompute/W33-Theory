name: W33 Sept21 E8 matter81 frame-qutrit exact replay

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_e8_matter81_frame_qutrit_tensor_carrier.py'
      - 'tests/test_w33_e8_matter81_frame_qutrit_tensor_carrier.py'
      - '.github/workflows/w33_sept21_matter81_frame_qutrit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite dependencies
        run: python -m pip install --upgrade pip networkx sympy numpy pytest
      - name: Replay matter81 frame-qutrit theorem
        run: PYTHONPATH=. python analysis/w33_e8_matter81_frame_qutrit_tensor_carrier.py
      - name: Focused regression
        run: PYTHONPATH=. python -m pytest -q tests/test_w33_e8_matter81_frame_qutrit_tensor_carrier.py
      - name: Freeze generated certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/w33_e8_matter81_frame_qutrit_tensor_carrier.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze E8 matter81 frame-qutrit replay certificate [skip ci]'
          git push origin HEAD:master
