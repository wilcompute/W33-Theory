name: Passes 631-635 release verification

on:
  pull_request:
    paths:
      - 'analysis/w33_pass63*.py'
      - 'analysis/BT631_635_five_frontier_release.md'
      - 'tests/test_w33_pass631_635.py'
      - '.github/workflows/pass631_635_release.yml'

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy pytest
      - name: Generate deterministic certificates
        run: |
          python analysis/w33_pass631_mod2_ext_fingerprint.py
          python analysis/w33_pass632_montes_okutsu_stage0.py
          python analysis/w33_pass633_minimal_wilson_fibre.py
          python analysis/w33_pass634_correlated_optical_decoder.py
          python analysis/w33_pass635_joint_optical_eprocess_design.py
      - name: Verify certificate reproduction
        run: |
          python analysis/w33_pass631_mod2_ext_fingerprint.py --check
          python analysis/w33_pass632_montes_okutsu_stage0.py --check
          python analysis/w33_pass633_minimal_wilson_fibre.py --check
          python analysis/w33_pass634_correlated_optical_decoder.py --check
          python analysis/w33_pass635_joint_optical_eprocess_design.py --check
          python -m pytest -q tests/test_w33_pass631_635.py
      - name: Commit generated ledgers to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/w33_pass631_mod2_ext_fingerprint.json \
                  data/w33_pass632_montes_okutsu_stage0.json \
                  data/w33_pass633_minimal_wilson_fibre.json \
                  data/w33_pass634_correlated_optical_decoder.json \
                  data/w33_pass635_joint_optical_eprocess_design.json
          if git diff --cached --quiet; then
            echo 'Certificates already current.'
          else
            git commit -m 'Passes 631-635: lock deterministic certificates'
            git push origin HEAD:${{ github.head_ref }}
          fi
