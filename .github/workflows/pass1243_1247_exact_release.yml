name: Passes 1243-1247 Exact Triality Matrix Cycle Release

on:
  pull_request:
    paths:
      - 'analysis/w33_pass1243_81_sign_twist_intertwiner.py'
      - 'analysis/w33_pass1244_m3_m21_matrix_units.py'
      - 'analysis/w33_pass1245_a5_s5_hecke_equality.py'
      - 'analysis/w33_pass1246_literal_cycle_orbits_7_8.py'
      - 'analysis/w33_pass1247_a2_normalizer_triality.py'
      - 'scripts/pass1243_1247_bundle_runtime.py'
      - 'data/pass1243_1247_exact_bundle.part*'
      - 'data/w33_pass1243_81_sign_twist_intertwiner.json'
      - 'data/w33_pass1244_m3_m21_matrix_units.json'
      - 'data/w33_pass1245_a5_s5_hecke_equality.json'
      - 'data/w33_pass1246_literal_cycle_orbits_7_8.json'
      - 'data/w33_pass1247_a2_normalizer_triality.json'
      - 'tests/test_w33_pass1243_1247.py'
      - 'data/w33_pass_namespace_registry_v2.json'
      - '.github/workflows/pass1243_1247_exact_release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Verify transparent source archive
        run: python scripts/pass1243_1247_bundle_runtime.py
      - name: Recompute Pass 1243 sign-twist bridge
        run: python analysis/w33_pass1243_81_sign_twist_intertwiner.py
      - name: Recompute Pass 1244 matrix units
        run: python analysis/w33_pass1244_m3_m21_matrix_units.py
      - name: Recompute Pass 1245 Hecke equality
        run: python analysis/w33_pass1245_a5_s5_hecke_equality.py
      - name: Recompute Pass 1246 literal cycle frontier
        run: python analysis/w33_pass1246_literal_cycle_orbits_7_8.py
      - name: Recompute Pass 1247 normalizer triality
        run: python analysis/w33_pass1247_a2_normalizer_triality.py
      - name: Focused tests
        run: pytest -q tests/test_w33_pass1243_1247.py
      - name: Prior synthesis guard
        run: PYTHONPATH=analysis python analysis/w33_pass1192_parallel_synthesis_guard.py
      - name: Namespace collision guard
        run: PYTHONPATH=analysis python analysis/w33_pass1197_parallel_collision_guard.py --check-only
