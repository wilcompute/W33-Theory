name: Pass12016-12020 neutrino vacuum native measure
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass12016_12020_neutrino_vacuum_native_measure.py'
      - 'analysis/w33_pass12016_neutrino_search.py'
      - 'tests/test_w33_pass12016_12020_neutrino_vacuum_native_measure.py'
      - '.github/workflows/pass12016-12020-neutrino-native.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy==1.14.0 mpmath==1.3.0 pytest
      - name: Frozen new and prior controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12016_12020_neutrino_vacuum_native_measure.py tests/test_w33_pass12011_12015_scale_flavour_internal_index.py
      - name: Regenerate five-front certificate
        run: python analysis/w33_pass12016_12020_neutrino_vacuum_native_measure.py
      - name: Regenerated controls
        run: python -m pytest --noconftest -o addopts='' -q tests/test_w33_pass12016_12020_neutrino_vacuum_native_measure.py
      - uses: actions/upload-artifact@v4
        with:
          name: pass12016-12020-neutrino-native
          path: data/w33_pass12016_12020_neutrino_vacuum_native_measure.json
