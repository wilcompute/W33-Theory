name: Pass 1142-1146 exact release and corpus migration

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass1142_1146_exact.py'
      - 'analysis/w33_pass1142_1146_intertwiner.py'
      - 'analysis/w33_pass1142_1146_release_compiler.py'
      - 'scripts/pass1142_1146_bundle_runtime.py'
      - 'scripts/migrate_shifted_adjacency_descendants.py'
      - 'scripts/build_540_occurrence_registry.py'
      - 'scripts/tag_540_disambiguation.py'
      - 'scripts/build_pass1142_1146_pdf.py'
      - 'data/pass1142_1146_source_bundle.b64'
      - '.github/workflows/pass1142_1146_exact_release.yml'

permissions:
  contents: write

jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install numpy pytest reportlab
      - name: Recompute Hecke algebra and bridge
        run: |
          python analysis/w33_pass1142_1146_exact.py
          python analysis/w33_pass1142_1146_intertwiner.py
          python analysis/w33_pass1142_1146_release_compiler.py
          pytest -q tests/test_w33_pass1142_1146.py
      - name: Apply shifted-adjacency migration
        run: python scripts/migrate_shifted_adjacency_descendants.py --apply
      - name: Build complete 540 occurrence registry
        run: |
          python scripts/build_540_occurrence_registry.py --root .
          python scripts/tag_540_disambiguation.py --root . --json-out data/BT1634_540_audit_results.json --strict
      - name: Re-run descendant gate
        run: python scripts/check_shifted_adjacency_descendants.py --root . --write-report data/w33_shifted_adjacency_descendant_audit.json
      - name: Generate verified release PDF
        run: python scripts/build_pass1142_1146_pdf.py
      - name: Commit generated release and migrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Passes 1142-1146: materialize exact release and corpus migrations'
          git pull --rebase origin master
          git push
