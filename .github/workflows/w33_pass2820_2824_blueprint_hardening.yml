name: Pass 2820-2824 Blueprint Hardening

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: w33-pass2820-2824-blueprint-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  integrate-audit-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Integrate canonical documents
        run: python tools/integrate_bt2820_bt2824_blueprint.py

      - name: Generate and audit exact certificate
        run: python analysis/bt2820_2824_blueprint_hardening.py --audit-docs

      - name: Run focused regression tests
        run: pytest -q tests/test_bt2820_2824_blueprint_hardening.py

      - name: Install Tectonic
        uses: tectonic-typesetting/setup-tectonic@v1

      - name: Compile the three canonical manuscripts
        run: |
          tectonic --keep-logs holonet_machine_blueprint.tex
          tectonic --keep-logs w33_paper.tex
          tectonic --keep-logs photonic_holonet.tex

      - name: Verify idempotence and frozen certificate
        run: |
          python tools/integrate_bt2820_bt2824_blueprint.py
          python analysis/bt2820_2824_blueprint_hardening.py --audit-docs --verify-frozen
          git diff --check

      - name: Commit generated canonical artifacts to PR head
        run: |
          git config user.name "w33-blueprint-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex \
            docs/index.html \
            data/w33_pass_namespace_registry_v2.d/2820-2824.json \
            data/PART_BT2820_BT2824_BLUEPRINT_HARDENING_results.json \
            holonet_machine_blueprint.pdf w33_paper.pdf photonic_holonet.pdf
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
          else
            git commit -m "Passes 2820-2824: integrate and compile canonical artifacts [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload audit and PDFs
        uses: actions/upload-artifact@v4
        with:
          name: w33-pass2820-2824-blueprint-hardening
          path: |
            data/PART_BT2820_BT2824_BLUEPRINT_HARDENING_results.json
            holonet_machine_blueprint.pdf
            w33_paper.pdf
            photonic_holonet.pdf
            *.log
