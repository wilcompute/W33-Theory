name: BT796 dual building router
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_20260901_bt796_dual_building_router.py'
      - '.github/workflows/w33_20260901_bt796_dual_building_router.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: w33-bt796-dual-building-router-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy networkx
      - name: Execute simultaneous router audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/w33_20260901_bt796_dual_building_router.py 2>&1 | tee analysis/PASS_20260901_BT796_DUAL_BUILDING_ROUTER.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/PART_W33_20260901_BT796_DUAL_BUILDING_ROUTER.json').read_text())
          assert d.get('status')=='PASS'
          PY
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add -f data/PART_W33_20260901_BT796_DUAL_BUILDING_ROUTER.json analysis/PASS_20260901_BT796_DUAL_BUILDING_ROUTER.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze simultaneous BT796 dual-building router evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
