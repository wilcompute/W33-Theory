name: W33 Pass5388-5395 all-q Levi flag Hodge

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass5388_5392_allq_levi_flag_hodge.py'
      - 'data/PART_W33_PASS5388_5392_ALLQ_LEVI_FLAG_HODGE.json'
      - 'analysis/PASS5388_5392_allq_levi_flag_hodge_insert.tex'
      - 'analysis/PASS5388_5395_allq_levi_flag_hodge_index_insert.html'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'data/w33_publication_frontier_contract_v2.json'
      - 'tests/test_w33_pass5388_5392_allq_levi_flag_hodge.py'
      - '.github/workflows/w33_pass5388_5395_allq_levi_flag_hodge.yml'

permissions:
  contents: write

jobs:
  replay-publish-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact all-q certificate
        run: |
          cp data/PART_W33_PASS5388_5392_ALLQ_LEVI_FLAG_HODGE.json /tmp/frozen.json
          python analysis/w33_pass5388_5392_allq_levi_flag_hodge.py > /tmp/pass5388.json
          cmp /tmp/frozen.json data/PART_W33_PASS5388_5392_ALLQ_LEVI_FLAG_HODGE.json
      - name: Focused regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q tests/test_w33_pass5388_5392_allq_levi_flag_hodge.py tests/test_w33_pass5364_5371_publication_dag.py
      - name: Materialize configured public cards and audit publication DAG
        run: |
          python tools/integrate_bt3376_bt3389.py --report /tmp/public-integration.json
          python analysis/w33_pass5364_publication_dag_audit.py --report /tmp/publication-dag.json
          test "$(grep -c 'id=\"pass-5388-5395-allq-levi-flag-hodge\"' docs/index.html)" -eq 1
          git diff --check
      - uses: WtfJoke/setup-tectonic@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Compile all three canonical manuscripts
        run: |
          mkdir -p evidence/pass5388_5395
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "evidence/pass5388_5395/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
          sha256sum w33_paper.pdf photonic_holonet.pdf holonet_machine_blueprint.pdf \
            > evidence/pass5388_5395/pdf_sha256.txt
      - name: Commit deterministic homepage materialization if changed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo 'Homepage cards already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Materialize Pass5388-5395 all-q Levi Hodge card [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: pass5388-5395-allq-levi-flag-hodge
          path: evidence/pass5388_5395/**
