name: Exact Witting H27 minimal one-phase controllability

on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_witting_minimal_lie_control.py'
      - 'analysis/toe_20261122_witting_one_phase_three_fixed.py'
      - 'analysis/toe_20261122_witting_h27_phase_control.py'
      - 'tests/test_toe_20261122_witting_minimal_lie_control.py'
      - 'tests/test_toe_20261122_witting_one_phase_three_fixed.py'
      - 'tests/test_toe_20261122_witting_h27_phase_control.py'
      - 'data/toe_20261122_witting_four_ray_lie_controllability.json'
      - 'data/toe_20261122_witting_one_phase_three_fixed.json'
      - 'data/toe_20261122_witting_h27_phase_control.json'
      - '.github/workflows/witting-h27-controllability.yml'
  pull_request:
  workflow_dispatch:

jobs:
  exact-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact group / test dependencies
        run: python -m pip install sympy pytest
      - name: Run independent minimal U4, Hessian and H27 tests
        run: |
          python -m pytest -q tests/test_toe_20261122_witting_minimal_lie_control.py tests/test_toe_20261122_witting_one_phase_three_fixed.py tests/test_toe_20261122_witting_h27_phase_control.py
      - name: Check frozen certificates without modifying main checkout
        run: |
          mkdir -p /tmp/witting_cert_baseline
          cp data/toe_20261122_witting_four_ray_lie_controllability.json data/toe_20261122_witting_one_phase_three_fixed.json data/toe_20261122_witting_h27_phase_control.json /tmp/witting_cert_baseline/
          python analysis/toe_20261122_witting_minimal_lie_control.py
          python analysis/toe_20261122_witting_one_phase_three_fixed.py
          python analysis/toe_20261122_witting_h27_phase_control.py
          diff -u /tmp/witting_cert_baseline/toe_20261122_witting_four_ray_lie_controllability.json data/toe_20261122_witting_four_ray_lie_controllability.json
          diff -u /tmp/witting_cert_baseline/toe_20261122_witting_one_phase_three_fixed.json data/toe_20261122_witting_one_phase_three_fixed.json
          diff -u /tmp/witting_cert_baseline/toe_20261122_witting_h27_phase_control.json data/toe_20261122_witting_h27_phase_control.json
