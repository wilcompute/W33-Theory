name: Pass 2847-2853 Protected Observer and Noisy M36

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: pass2847-2853-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-rtl-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy pytest
      - name: Recompute and verify certificate
        run: |
          python analysis/bt2847_2853_protected_observer_noisy_m36.py
          python analysis/bt2847_2853_protected_observer_noisy_m36.py --verify-frozen
      - name: Focused regressions
        run: pytest -q tests/test_bt2847_2853_protected_observer_noisy_m36.py
      - name: Install open FPGA tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys nextpnr-ice40 fpga-icestorm
      - name: Parse simulate synthesize and place RTL
        run: |
          iverilog -g2012 -s w33_pass2848_affine_square_feature_encoder -o /tmp/encoder.vvp \
            rtl/w33_pass2848_affine_square_feature_encoder.sv
          iverilog -g2012 -s tb_w33_pass2853_affine_square_nn_decoder -o /tmp/decoder.vvp \
            rtl/w33_pass2848_affine_square_feature_encoder.sv \
            rtl/w33_pass2853_affine_square_nn_decoder.sv \
            rtl/tb_w33_pass2853_affine_square_nn_decoder.sv
          vvp /tmp/decoder.vvp
          yosys -p 'read_verilog -sv rtl/w33_pass2848_affine_square_feature_encoder.sv; synth_ice40 -top w33_pass2848_affine_square_feature_encoder -json /tmp/encoder.json; stat' | tee data/PART_BT2853_ENCODER_yosys.log
          yosys -p 'read_verilog -sv rtl/w33_pass2848_affine_square_feature_encoder.sv rtl/w33_pass2853_affine_square_nn_decoder.sv; synth_ice40 -top w33_pass2853_affine_square_nn_decoder -json /tmp/decoder.json; stat' | tee data/PART_BT2853_DECODER_yosys.log
          nextpnr-ice40 --hx8k --package ct256 --json /tmp/encoder.json --asc /tmp/encoder.asc --pcf-allow-unconstrained |& tee data/PART_BT2853_ENCODER_nextpnr.log
          nextpnr-ice40 --hx8k --package ct256 --json /tmp/decoder.json --asc /tmp/decoder.asc --freq 12 --pcf-allow-unconstrained |& tee data/PART_BT2853_DECODER_nextpnr.log
          icepack /tmp/encoder.asc /tmp/encoder.bin
          icepack /tmp/decoder.asc /tmp/decoder.bin
      - name: Integrate canonical documents
        run: python tools/integrate_bt2847_bt2853.py
      - uses: tectonic-typesetting/setup-tectonic@v1
      - name: Compile canonical TeX
        run: |
          tectonic --keep-logs holonet_machine_blueprint.tex
          tectonic --keep-logs w33_paper.tex
          tectonic --keep-logs photonic_holonet.tex
          ! grep -E 'Undefined control sequence|Emergency stop' *.log
      - name: Idempotence and drift audit
        run: |
          python tools/integrate_bt2847_bt2853.py
          python analysis/bt2847_2853_protected_observer_noisy_m36.py --verify-frozen
          git diff --check
      - name: Commit generated canonical sources and evidence to PR head
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "w33-pass2853-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/PART_BT2847_BT2853_PROTECTED_OBSERVER_NOISY_M36_results.json \
            data/PART_BT2853_ENCODER_yosys.log data/PART_BT2853_DECODER_yosys.log \
            data/PART_BT2853_ENCODER_nextpnr.log data/PART_BT2853_DECODER_nextpnr.log \
            data/w33_pass_namespace_registry_v2.d/2847-2853.json \
            w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex docs/index.html \
            holonet_machine_blueprint.pdf w33_paper.pdf photonic_holonet.pdf
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Pass 2853: integrate compile and freeze remote evidence [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass2847-2853-evidence
          path: |
            data/PART_BT2847_BT2853_PROTECTED_OBSERVER_NOISY_M36_results.json
            data/PART_BT2853_*_yosys.log
            data/PART_BT2853_*_nextpnr.log
            holonet_machine_blueprint.pdf
            w33_paper.pdf
            photonic_holonet.pdf
            *.log
