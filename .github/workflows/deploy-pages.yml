name: Manual fallback W33 Pages deployment

# The repository's automatic GitHub Pages source is master:/docs.
# This workflow is deliberately manual-only so it cannot race the managed
# branch publisher or overwrite it with an older queued artifact.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual-fallback-w33-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Verify canonical docs payload
        shell: bash
        run: |
          set -euo pipefail
          expected='41a8d733f42da18282fa276f5d2fa82bac7516f6'
          for path in \
            docs/index.html \
            docs/404.html \
            docs/full-site-2026-08-06.html \
            docs/exceptional-geometry-41a8d733.html
          do
            test -f "$path"
            actual="$(git hash-object "$path")"
            echo "$path $actual"
            test "$actual" = "$expected"
          done
          test -f docs/.nojekyll
          python tools/check_website_migration_authorization.py --repository-root .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
