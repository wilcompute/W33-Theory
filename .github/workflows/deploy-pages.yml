name: Deploy authoritative W33 site to Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/index.html'
      - 'docs/index-redirect-archive-2026-08-06.html'
      - 'docs/exceptional-geometry-41a8d733.html'
      - 'tools/check_website_migration_authorization.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-authoritative-w33-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Verify large authoritative index
        shell: bash
        run: |
          set -euo pipefail
          expected='41a8d733f42da18282fa276f5d2fa82bac7516f6'
          index_blob="$(git hash-object docs/index.html)"
          immutable_blob="$(git hash-object docs/exceptional-geometry-41a8d733.html)"
          test "$index_blob" = "$expected"
          test "$immutable_blob" = "$expected"
          python tools/check_website_migration_authorization.py --repository-root .
          echo "Deploying large authoritative docs/index.html blob $index_blob"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
