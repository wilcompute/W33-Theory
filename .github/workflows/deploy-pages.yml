name: Deploy restored W33 site to Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/index.html'
      - 'docs/.pages-deploy-restored-index-*'
      - 'tools/check_website_migration_authorization.py'
      - 'data/website_migration_authorization.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-restored-authoritative-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.verify.outputs.checkout_sha }}
      index_blob: ${{ steps.verify.outputs.index_blob }}
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Verify restored authoritative index
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected='41a8d733f42da18282fa276f5d2fa82bac7516f6'
          actual="$(git hash-object docs/index.html)"
          checkout_sha="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          python tools/check_website_migration_authorization.py --repository-root .
          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"
          echo "index_blob=$actual" >> "$GITHUB_OUTPUT"
          echo "Deploying checkout $checkout_sha with docs/index.html blob $actual"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  record:
    name: Record successful Pages deployment
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Write deployment receipt to master
        uses: actions/github-script@v7
        env:
          CHECKOUT_SHA: ${{ needs.build.outputs.checkout_sha }}
          INDEX_BLOB: ${{ needs.build.outputs.index_blob }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = 'data/pages_deployment_status.json';
            const payload = {
              schema: 'w33.pages_deployment_status.v1',
              status: 'SUCCESS',
              workflow: context.workflow,
              run_id: context.runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              trigger_sha: context.sha,
              deployed_checkout_sha: process.env.CHECKOUT_SHA,
              verified_index_blob: process.env.INDEX_BLOB,
              page_url: process.env.PAGE_URL,
              deployed_at: new Date().toISOString()
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'master'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'master',
              message: `Record successful Pages deployment ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
