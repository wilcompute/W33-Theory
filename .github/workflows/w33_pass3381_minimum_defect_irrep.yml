name: Pass 3381 Minimum Defect Edge Character
on:
  push:
    branches: [master]
    paths:
      - 'analysis/bt3381_minimum_defect_edge_character.py'
      - '.github/workflows/w33_pass3381_minimum_defect_irrep.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gap-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables
          python -m pip install --disable-pip-version-check numpy networkx
      - name: Decompose literal 720-edge action
        run: |
          python analysis/bt3381_minimum_defect_edge_character.py \
            | tee /tmp/bt3381_edge_character.log
          test -s data/PART_BT3381_MINIMUM_DEFECT_EDGE_CHARACTER_results.json
          grep -F '"group_order": 25920' \
            data/PART_BT3381_MINIMUM_DEFECT_EDGE_CHARACTER_results.json
          grep -F '"status": "PASS"' \
            data/PART_BT3381_MINIMUM_DEFECT_EDGE_CHARACTER_results.json
      - name: Commit exact character certificate once
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/PART_BT3381_MINIMUM_DEFECT_EDGE_CHARACTER_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Pass 3381 minimum-defect edge character [skip ci]'
            git push
          fi
