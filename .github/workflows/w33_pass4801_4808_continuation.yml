name: Passes 4801-4808 radius qutrit Golay homology
on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_pass4801_*'
      - 'analysis/w33_pass4802_*'
      - 'analysis/w33_pass4803_*'
      - 'analysis/w33_pass4804_*'
      - 'analysis/w33_pass4805_*'
      - 'analysis/w33_pass4806_*'
      - 'analysis/w33_pass4807_*'
      - 'analysis/w33_pass4808_*'
      - 'analysis/PASS4801_4808_*'
      - 'data/PART_W33_PASS4801_*'
      - 'data/PART_W33_PASS4802_*'
      - 'data/PART_W33_PASS4803_*'
      - 'data/PART_W33_PASS4804_*'
      - 'data/PART_W33_PASS4805_*'
      - 'data/PART_W33_PASS4806_*'
      - 'data/PART_W33_PASS4807_*'
      - 'data/PART_W33_PASS4808_*'
      - 'data/w33_public_frontier_pass4801_4808.json'
      - 'docs/radius14-ternary-golay-levi-homology.html'
      - 'tools/integrate_pass4801_4808.py'
      - 'analysis/W33_CURRENT_FRONTIER_MANIFEST.tex'
      - 'w33_paper.tex'
      - 'photonic_holonet.tex'
      - 'holonet_machine_blueprint.tex'
      - '.github/workflows/w33_pass4801_4808_continuation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pass4801-4808-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install finite-model dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy networkx sympy python-sat
      - name: Decide H10 covering radius first
        run: python analysis/w33_pass4801_h10_covering_radius_sat.py | tee analysis/PASS4801_RADIUS_SAT.log
      - name: Execute Passes 4802-4808
        shell: bash
        run: |
          set -euo pipefail
          : > analysis/PASS4801_4808_RUN.log
          for script in \
            analysis/w33_pass4802_weight4_logical_shell.py \
            analysis/w33_pass4803_triangle_css_decoder_schedule.py \
            analysis/w33_pass4804_equivariant_f4_e6_intertwiner.py \
            analysis/w33_pass4805_q9_blt_minimum_shell.py \
            analysis/w33_pass4806_bonkers_local_ternary_golay.py \
            analysis/w33_pass4807_bonkers_golay_levi_homology.py \
            analysis/w33_pass4808_bonkers_homology_distance_k33.py
          do
            echo "===== $script =====" | tee -a analysis/PASS4801_4808_RUN.log
            python "$script" 2>&1 | tee -a analysis/PASS4801_4808_RUN.log
          done
      - name: Materialize public theorem card
        run: |
          python tools/integrate_pass4801_4808.py
          test "$(grep -c 'id=\"pass4801-4808-radius-golay-homology\"' docs/index.html)" -eq 1
          test -s docs/radius14-ternary-golay-levi-homology.html
      - uses: WtfJoke/setup-tectonic@v3
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Compile canonical manuscripts
        run: |
          for source in w33_paper.tex photonic_holonet.tex holonet_machine_blueprint.tex; do
            tectonic --keep-logs "$source" 2>&1 | tee "/tmp/${source%.tex}.log"
            test -s "${source%.tex}.pdf"
          done
      - name: Commit regenerated evidence and index card
        shell: bash
        run: |
          git config user.name 'w33-evidence-bot'
          git config user.email 'w33-evidence-bot@users.noreply.github.com'
          git add analysis/PASS4801_RADIUS_SAT.log analysis/PASS4801_4808_RUN.log docs/index.html
          for f in data/PART_W33_PASS4801_*.json data/PART_W33_PASS4802_*.json data/PART_W33_PASS4803_*.json data/PART_W33_PASS4804_*.json data/PART_W33_PASS4805_*.json data/PART_W33_PASS4806_*.json data/PART_W33_PASS4807_*.json data/PART_W33_PASS4808_*.json; do
            test -f "$f" && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Passes 4801-4808 exact evidence and theorem card'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
