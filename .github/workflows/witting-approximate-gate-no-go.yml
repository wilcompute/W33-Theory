name: Witting approximate gate no-go and phase spectrum

on:
  push:
    branches: [master]
    paths:
      - 'analysis/toe_20261122_witting_approximate_gate_no_go.py'
      - 'analysis/toe_20261122_witting_phase_schmidt_law.py'
      - 'tests/test_toe_20261122_witting_approximate_gate_no_go.py'
      - 'tests/test_toe_20261122_witting_phase_schmidt_law.py'
      - '.github/workflows/witting-approximate-gate-no-go.yml'
  pull_request:
    paths:
      - 'analysis/toe_20261122_witting_approximate_gate_no_go.py'
      - 'analysis/toe_20261122_witting_phase_schmidt_law.py'
      - 'tests/test_toe_20261122_witting_approximate_gate_no_go.py'
      - 'tests/test_toe_20261122_witting_phase_schmidt_law.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-verification dependencies
        run: python -m pip install sympy pytest
      - name: Replay fixed-phase exact spectrum and fidelity ceilings
        run: python analysis/toe_20261122_witting_approximate_gate_no_go.py
      - name: Replay full-phase symbolic factorization
        run: python analysis/toe_20261122_witting_phase_schmidt_law.py
      - name: Regression tests
        run: python -m pytest -q tests/test_toe_20261122_witting_approximate_gate_no_go.py tests/test_toe_20261122_witting_phase_schmidt_law.py
      - name: Upload certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witting-exact-schmidt-fidelity-certificates
          path: |
            data/toe_20261122_witting_approximate_gate_no_go.json
            data/toe_20261122_witting_phase_schmidt_law.json
          if-no-files-found: warn
          retention-days: 30
