<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="520" fill="#fafaf8"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">W(3,3) Eigenvalue Spectrum — SRG(40,12,2,4)</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">Three eigenvalues encode gravity, matter, and gauge sectors</text>

  <!-- Top box: E = 480 -->
  <rect x="220" y="72" width="360" height="34" rx="6" fill="#e8f4f3" stroke="#01696f" stroke-width="1.5"/>
  <text x="400" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#01696f">E = n&#x2ᵥ × k = 40 × 12 = 480 = |Φ(E₈)|</text>

  <!-- Level λ=12 (gravity) -->
  <line x1="160" y1="160" x2="640" y2="160" stroke="#01696f" stroke-width="5"/>
  <text x="152" y="165" text-anchor="end" font-size="14" font-weight="bold" fill="#01696f">λ = 12  (×1)</text>
  <text x="648" y="165" text-anchor="start" font-size="13" fill="#555">Singlet / Gravity</text>

  <!-- Spectral gap Δ=10 -->
  <line x1="310" y1="162" x2="310" y2="278" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="306,278 314,278 310,290" fill="#aaa"/>
  <text x="293" y="225" text-anchor="end" font-size="12" fill="#888">Δ = 10</text>

  <!-- Level λ=+2 (matter) -->
  <line x1="160" y1="290" x2="640" y2="290" stroke="#437a22" stroke-width="5"/>
  <text x="152" y="295" text-anchor="end" font-size="14" font-weight="bold" fill="#437a22">λ = +2  (×27)</text>
  <text x="648" y="295" text-anchor="start" font-size="13" fill="#555">Quark–Lepton  dim(27) of E₆</text>

  <!-- Spectral gap Δ=6 -->
  <line x1="310" y1="292" x2="310" y2="398" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="306,398 314,398 310,410" fill="#aaa"/>
  <text x="293" y="350" text-anchor="end" font-size="12" fill="#888">Δ = 6</text>

  <!-- Level λ=−4 (gauge) -->
  <line x1="160" y1="410" x2="640" y2="410" stroke="#a13544" stroke-width="5"/>
  <text x="152" y="415" text-anchor="end" font-size="14" font-weight="bold" fill="#a13544">λ = −4  (×12)</text>
  <text x="648" y="415" text-anchor="start" font-size="13" fill="#555">SM Gauge Bosons  8g + 3W + γ</text>

  <!-- Multiplicity annotations -->
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#01696f">multiplicity 1</text>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#437a22">multiplicity 27</text>
  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#a13544">multiplicity 12</text>

  <!-- Bottom box: α⁻¹ = 137 -->
  <rect x="195" y="438" width="410" height="34" rx="6" fill="#f9edf0" stroke="#a13544" stroke-width="1.5"/>
  <text x="400" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#a13544">α⁻¹ = k² − (|r| + |s| + 1) = 144 − 7 = 137</text>

  <!-- Footer -->
  <text x="400" y="510" text-anchor="middle" font-size="11" fill="#aaa">W(3,3) Theory — Dahn (2026)</text>
</svg>