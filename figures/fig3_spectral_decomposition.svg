<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Georgia, serif">
  <rect width="700" height="480" fill="#fafaf8"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">W(3,3) Spectral Decomposition — SM Sector Weights</text>
  <text x="350" y="56" text-anchor="middle" font-size="13" fill="#555">Eigenvalue multiplicities map to physical sectors  (n_v = 40 total)</text>

  <!-- Donut chart centered at (300, 270), r_outer=155, r_inner=70 -->
  <!-- Gravity: 1/40 = 2.5% → 9° arc -->
  <!-- Matter:  27/40 = 67.5% → 243° arc -->
  <!-- Gauge:   12/40 = 30% → 108° arc -->
  <!-- Sector colors: gravity #01696f, matter #437a22, gauge #a13544 -->

  <!-- Gravity slice: 0° to 9° (tiny) -->
  <path d="M300,270 L455,270 A155,155 0 0,1 454.0,246.2 Z" fill="#01696f" stroke="white" stroke-width="3"/>

  <!-- Matter slice: 9° to 252° -->
  <path d="M300,270 L454.0,246.2 A155,155 0 1,1 347.8,116.9 Z" fill="#437a22" stroke="white" stroke-width="3"/>

  <!-- Gauge slice: 252° to 360° -->
  <path d="M300,270 L347.8,116.9 A155,155 0 0,1 455,270 Z" fill="#a13544" stroke="white" stroke-width="3"/>

  <!-- Inner hole -->
  <circle cx="300" cy="270" r="70" fill="#fafaf8"/>

  <!-- Center label -->
  <text x="300" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">n_v = 40</text>
  <text x="300" y="283" text-anchor="middle" font-size="11" fill="#777">total modes</text>

  <!-- Legend -->
  <rect x="490" y="160" width="16" height="16" fill="#01696f" rx="3"/>
  <text x="512" y="173" font-size="13" fill="#333">λ = 12  (×1)</text>
  <text x="512" y="188" font-size="11" fill="#777">Gravity singlet  2.5%</text>

  <rect x="490" y="215" width="16" height="16" fill="#437a22" rx="3"/>
  <text x="512" y="228" font-size="13" fill="#333">λ = +2  (×27)</text>
  <text x="512" y="243" font-size="11" fill="#777">Quark–lepton 67.5%</text>
  <text x="512" y="257" font-size="11" fill="#777">dim(27) of E₆</text>

  <rect x="490" y="275" width="16" height="16" fill="#a13544" rx="3"/>
  <text x="512" y="288" font-size="13" fill="#333">λ = −4  (×12)</text>
  <text x="512" y="303" font-size="11" fill="#777">Gauge bosons 30%</text>
  <text x="512" y="317" font-size="11" fill="#777">8g + 3W + γ</text>

  <!-- Sum check -->
  <rect x="460" y="345" width="210" height="44" rx="5" fill="#f5f5f0" stroke="#ccc"/>
  <text x="565" y="362" text-anchor="middle" font-size="12" fill="#555">1 + 27 + 12 = 40 ✓</text>
  <text x="565" y="380" text-anchor="middle" font-size="11" fill="#888">Spectral completeness</text>

  <text x="350" y="460" text-anchor="middle" font-size="10" fill="#aaa">W(3,3) Theory — Dahn (2026)</text>
</svg>