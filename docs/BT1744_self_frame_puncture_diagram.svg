<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360">
  <style>
    text{font-family:Arial, sans-serif; fill:#111}
    .box{fill:#f8f8f8;stroke:#333;stroke-width:2;rx:14}
    .accent{fill:#eef5ff;stroke:#1f5a99;stroke-width:2;rx:14}
    .warn{fill:#fff7e6;stroke:#a66a00;stroke-width:2;rx:14}
    .arrow{stroke:#333;stroke-width:3;marker-end:url(#arrow)}
    .small{font-size:16px}.med{font-size:20px;font-weight:bold}.big{font-size:26px;font-weight:bold}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <text x="30" y="42" class="big">BT1744: 16-cell atlas → 64-bit frame → 192 flags → self-frame puncture</text>
  <rect x="35" y="80" width="190" height="150" class="box"/>
  <text x="65" y="120" class="med">16-cell atlas</text>
  <text x="65" y="155" class="small">Cl4 grades: 1,4,6,4,1</text>
  <text x="65" y="180" class="small">Hesse + exceptional: 9+7</text>
  <text x="65" y="205" class="small">local axes: R,C,S</text>
  <line x1="230" y1="155" x2="310" y2="155" class="arrow"/>
  <rect x="315" y="80" width="190" height="150" class="accent"/>
  <text x="345" y="120" class="med">64 bit slots</text>
  <text x="345" y="155" class="small">16 cells × 4 Q4 directions</text>
  <text x="345" y="180" class="small">oriented half-edge frame</text>
  <text x="345" y="205" class="small">64-bit carrier</text>
  <line x1="510" y1="155" x2="590" y2="155" class="arrow"/>
  <rect x="595" y="80" width="190" height="150" class="accent"/>
  <text x="625" y="120" class="med">192 flags</text>
  <text x="625" y="155" class="small">64 slots × 3 channels</text>
  <text x="625" y="180" class="small">R,C,S colored links</text>
  <text x="625" y="205" class="small">tomotope flag lift</text>
  <line x1="790" y1="155" x2="870" y2="155" class="arrow"/>
  <rect x="875" y="80" width="250" height="150" class="warn"/>
  <text x="905" y="120" class="med">self-frame puncture</text>
  <text x="905" y="155" class="small">remove 1 object-point</text>
  <text x="905" y="180" class="small">remove 1 object-line</text>
  <text x="905" y="205" class="small">remove 3 R,C,S self-links</text>
  <text x="110" y="285" class="big">16×3 = 48</text>
  <text x="365" y="285" class="big">16×4 = 64</text>
  <text x="635" y="285" class="big">64×3 = 192</text>
  <text x="885" y="285" class="big">192−3 = 189</text>
  <text x="375" y="330" class="med">Framed carrier law: 64/64/192 − one 3-channel self-frame = 63/63/189</text>
</svg>
