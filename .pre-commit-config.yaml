repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-yaml
    - id: check-added-large-files
      args: ['--maxkb=2048']
- repo: https://github.com/psf/black
  rev: 24.1.0
  hooks:
    - id: black
- repo: https://github.com/PyCQA/isort
  rev: 5.12.0
  hooks:
    - id: isort
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
    - id: detect-secrets
- repo: local
  hooks:
    - id: rediscovery-guard
      name: rediscovery guard (results already in the corpus)
      entry: python scripts/check_rediscovery.py
      language: system
      files: ^(analysis|passes|exploration)/.*\.(py|md)$
      pass_filenames: true
    - id: claims-ledger
      name: claims ledger is green (paper claims have PASS certificates)
      entry: python scripts/check_claims_ledger.py
      language: system
      files: ^(w33_paper\.tex|data/w33_pass.*\.json)$
      pass_filenames: false
    - id: refuted-claims
      name: text does not restate an already-refuted claim
      entry: python scripts/check_refuted_claims.py
      language: system
      files: ^(analysis|passes|exploration|papers)/.*\.(py|md|tex)$|^(BREAKTHROUGH_)?PASS.*\.(md|py)$|^README\.md$
      pass_filenames: true
    - id: sigma-gate
      name: experiment comparisons report sigma, not just percent
      entry: python scripts/check_sigma_gate.py
      language: system
      files: ^(analysis|passes|exploration|papers)/.*\.(py|md|tex)$|^(BREAKTHROUGH_)?PASS.*\.(md|py)$
      pass_filenames: true
    - id: remotes-sync
      name: remotes for one repository have not diverged
      entry: python scripts/check_remotes_sync.py
      language: system
      always_run: true
      pass_filenames: false
