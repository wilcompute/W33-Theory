# W33-Theory local integrity hooks
repos:
  - repo: local
    hooks:
      - id: stale-boundaries
        name: Check stale boundary sections
        entry: python scripts/check_stale_boundaries.py
        language: python
        pass_filenames: false
        files: '^(analysis/.*\.md|BT[0-9]+.*\.(md|tex|py)|RESULTS_VOCABULARY\.md)$'
        stages: [pre-commit]
        verbose: true

      - id: shifted-adjacency-descendants
        name: Reject unregistered descendants of the false D=A-I cubic
        entry: python scripts/check_shifted_adjacency_descendants.py --check-only
        language: python
        pass_filenames: true
        files: '\.(md|tex|py|json|txt|csv|jsonl)$'
        stages: [pre-commit]
        description: >
          Fatal on historical {-7,-1,5}/old-Z signatures unless the file is in the
          explicit retraction ledger or carries a corrected/retracted audit tag.

      - id: tag-540-check
        name: Require unambiguous 540 object tags in changed files
        entry: python scripts/tag_540_disambiguation.py --check-only --strict
        language: python
        pass_filenames: true
        files: '\.(md|tex|py|json|txt|csv|jsonl)$'
        stages: [pre-commit]
        description: >
          Binds each tag to one local occurrence and rejects unresolved uses.
          Canonical species: {540:point-nonedge},
          {540:double-six-nonincident}, {540:gq42-arc}, {540:outer-4c},
          and {540:line-nonedge}; {540:both}/{540:mixed} are compatibility
          tags for a genuinely mixed occurrence.

      - id: pass-namespace-collision-guard
        name: Reject unregistered or colliding parallel pass releases
        entry: python analysis/w33_pass1197_parallel_collision_guard.py --check-only
        language: python
        pass_filenames: false
        stages: [pre-commit]
        description: >
          Fail closed unless modern pass-numbered artifacts have one registered owner,
          the current exact certificates pass, prior synthesis remains clean, and
          obsolete transport scaffolds are absent.

      # Moved out of an inline `entry:` at Pass 4692.  The inline form opened a
      # double-quoted YAML scalar whose continuation lines started at column 0, which ends
      # the scalar -- so this FILE did not parse, and every hook in it was dead. The guard
      # was present, documented, and had never run once.  Scripts, not inline entries.
        # No files: pattern meant pre-commit passed it nothing. Two namespace
        # collisions happened in one day with this guard registered and disconnected.
        files: ^(analysis|data)/.*$
      - id: s-min-formula-guard
        name: Guard S_min formula correctness
        entry: py -3 scripts/check_smin_formula.py
        language: system
        pass_filenames: true
        files: '\.(tex|md|py)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: topical-aliases
        name: topical alias index is current
        entry: py -3 scripts/build_topical_aliases.py --check
        language: system
        pass_filenames: false
        files: ^(analysis|docs|manuscripts)/.*\.(md|tex|html)$
      # Added Pass 2478.  Warns when a frozen certificate no longer reproduces its
      # own digest, or when a frozen `checks` block contains a false.  Calibrated
      # to the three canonical self-digest key names -- matching "sha256" anywhere
      # in a key flags 50% of files and is pure noise.  Warns, never blocks.
      - id: certificate-digests
        name: frozen certificates reproduce their own digests
        entry: py -3 scripts/check_certificates.py --quiet
        language: system
        pass_filenames: true
        files: ^data/.*\.json$
      # Added Pass 2752.  Built on a MEASURED failure rate: six claims in one session
      # were overturned by docs/index.html or the two manuscripts -- files the repo's
      # own notes say to read first.  When a file asserts novelty ("appears to be
      # absent", "no prior art", "nobody has stated"), this greps the distinctive
      # tokens around that assertion against the encyclopedia.  Warns, never blocks.
      # Known limitation: it catches EXPLICIT novelty assertions only; four of the six
      # failures were implicit framing, which no regex sees.
      - id: novelty-claims
        name: novelty claims are checked against the encyclopedia
        entry: py -3 scripts/check_novelty_claims.py
        language: system
        pass_filenames: true
        files: ^analysis/.*\.md$
      # Added Pass 2772, after both tracks independently shipped a Pauli-frame tracker
      # with no load port.  Such a module synthesizes to the identity -- yosys deletes
      # 6 of its 8 state flops -- and simulation cannot see it, because a module that
      # folds to a constant still simulates correctly, it just does nothing.  Only a
      # synthesis frontend asks whether the state can move.  Scoped to rtl/ so the
      # yosys cost is paid only when RTL changes.  Warns, never blocks.
      - id: rtl-folds
        name: RTL modules do not synthesize away
        entry: py -3 scripts/check_rtl_folds.py --quiet
        language: system
        pass_filenames: true
        files: ^rtl/.*\.sv$
      # Added Pass 4689, after Pass 4680 found a null reported as evidence that covered
      # 0.0008% of its space -- and Pass 4691 then found that pass's own denominator was
      # 12.2x too small, so the real power was 0.078%, not 0.95%.  A sample size without a
      # denominator is not a hedge; it is an omission that reads as one.  Warns, never blocks.
      # Registered Pass 4692.  CLAUDE.md describes this as the core artifact of the
      # two-agent protocol -- "pre-commit hook; warns when a staged file asserts a code
      # parameter that exists elsewhere uncited" -- and it was never in the config. The
      # script existed, executable, documented, and wired to nothing. Warns, never blocks:
      # collisions are candidates, and blocking trains --no-verify.
      - id: rediscovery
        name: staged results are checked against the corpus index
        entry: py -3 scripts/check_rediscovery.py
        language: system
        pass_filenames: true
        files: ^(analysis|passes|pillars)/.*\.(py|md)$
      - id: search-power
        name: null results from sampling state their denominator
        entry: py -3 scripts/check_search_power.py
        language: system
        pass_filenames: true
        files: ^(analysis|passes|pillars)/.*\.(py|md)$
      # Added Pass 4690.  Part 0 of the blueprint ends with a table saying what each layer
      # may and may not claim, and asserts most withdrawn claims were violations of it.
      # That makes it a decision procedure, and one that ran only in a reader's head.
      # Scoped to the blueprint and manuscripts.  Known limit: detection is sentence-local,
      # and the two examples Part 0 itself gives are both cross-sentence.  Warns, never blocks.
      - id: layer-conformance
        name: claims stay inside their layer's may-claim row
        entry: py -3 scripts/check_layer_conformance.py
        language: system
        pass_filenames: true
        files: ^(.*\.tex)$
      # Added Pass 4726. Pass 4708 found 9 of 12 guards have no self-test, and Pass 4692
      # found one that had never executed at all because the config it lived in did not
      # parse. A self-test that runs only when someone types --selftest is the next thing
      # to rot. Non-strict on purpose: failing on the 9 missing ones would block every
      # commit until they are retrofitted, which trains --no-verify.
      - id: guard-selftests
        name: every guard's own self-test still passes
        entry: py -3 scripts/check_guard_selftests.py
        language: system
        pass_filenames: false
        always_run: true
      # Added Pass 4742. A regex alternative that can never match fails SILENTLY -- the
      # pattern compiles, runs, and returns fewer results. Nothing distinguishes "no
      # matches because the corpus is clean" from "no matches because the pattern is
      # impossible". Found in three of this repo's own checkers, one of which reported a
      # statistic of 12.5% whose true value was 44%.
      - id: regex-deadends
        name: no regex alternative is unmatchable
        entry: py -3 scripts/check_regex_deadends.py
        language: system
        pass_filenames: true
        files: ^(scripts|analysis)/.*\.py$
      # Added Pass 4770. Every other guard here checks a NEW file against prior art; none
      # checked OLD files against a new correction. Pass 4563 withdrew "W(3,3) is
      # self-dual" and Pass 4761 found 20 files still asserting it, one load-bearing. A
      # retraction is written in one file on one day, in a corpus indexed by date, and
      # nothing carried it backwards. Registry at data/w33_retractions.json is hand-written
      # because deciding a sentence withdraws a claim is a reading task. Warns, never blocks.
      - id: retraction-propagation
        name: retracted claims are not reasserted
        entry: py -3 scripts/check_retraction_propagation.py
        language: system
        pass_filenames: true
        files: ^(analysis|passes|pillars)/.*\.(py|md)$|^.*\.tex$
      # Added Pass 4792. Twice now a file has taken a stdlib name and broken imports
      # somewhere unrelated: scripts/inspect.py (renamed), and a scratch bisect.py that
      # made igraph unimportable because random imports bisect, tempfile imports random,
      # igraph imports tempfile. The traceback names the victim, never the cause.
      - id: stdlib-shadow
        name: no file shadows a standard-library module
        entry: py -3 scripts/check_stdlib_shadow.py
        language: system
        pass_filenames: true
        files: \.py$
