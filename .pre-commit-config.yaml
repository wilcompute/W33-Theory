repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-yaml
    - id: check-added-large-files
      args: ['--maxkb=2048']
- repo: https://github.com/psf/black
  rev: 24.1.0
  hooks:
    - id: black
- repo: https://github.com/PyCQA/isort
  rev: 5.12.0
  hooks:
    - id: isort
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
    - id: detect-secrets
- repo: local
  hooks:
    # `.g` was added at Pass 1073.  The filter had been `(py|md)` since the guard
    # was written, so no GAP source in this repository had EVER been guarded --
    # including every pass in the 1020-1072 arc, which is almost entirely GAP, and
    # including w33_pass1043, the pass that had to be retracted.  The first run
    # against a .g file immediately flagged a real collision (Pass 1072's
    # [1,15,20] against BT813's double-six ranks).  A guard is only as wide as its
    # file filter, and this one was silently narrower than the corpus.
    - id: rediscovery-guard
      name: rediscovery guard (results already in the corpus)
      entry: python scripts/check_rediscovery.py
      language: system
      files: ^(analysis|passes|exploration)/.*\.(py|md|g)$
      pass_filenames: true
    - id: invariant-kind-guard
      name: invariant KIND guard (orbits vs suborbits, order vs index)
      entry: python scripts/check_invariant_kind.py
      language: system
      files: ^(analysis|passes|exploration)/.*\.(py|g)$
      pass_filenames: true
    - id: pdf-staleness
      name: README-linked PDFs are not older than their sources
      entry: python scripts/check_pdf_staleness.py --linked
      language: system
      files: ^(.*\.tex|.*\.pdf|README\.md)$
      pass_filenames: false
    - id: claims-ledger
      name: claims ledger is green (paper claims have PASS certificates)
      entry: python scripts/check_claims_ledger.py
      language: system
      files: ^(w33_paper\.tex|data/w33_pass.*\.json)$
      pass_filenames: false
    - id: refuted-claims
      name: text does not restate an already-refuted claim
      entry: python scripts/check_refuted_claims.py
      language: system
      files: ^(analysis|passes|exploration|papers)/.*\.(py|md|tex)$|^(BREAKTHROUGH_)?PASS.*\.(md|py)$|^README\.md$
      pass_filenames: true
    - id: sample-degeneracy
      name: sampling-based claims are not built on degenerate samples
      entry: python scripts/check_sample_degeneracy.py
      language: system
      files: ^(analysis|passes|exploration)/.*\.py$
      pass_filenames: true
    - id: sigma-gate
      name: experiment comparisons report sigma, not just percent
      entry: python scripts/check_sigma_gate.py
      language: system
      files: ^(analysis|passes|exploration|papers)/.*\.(py|md|tex)$|^(BREAKTHROUGH_)?PASS.*\.(md|py)$
      pass_filenames: true
    - id: remotes-sync
      name: remotes for one repository have not diverged
      entry: python scripts/check_remotes_sync.py
      language: system
      always_run: true
      pass_filenames: false
